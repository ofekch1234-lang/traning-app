<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הוזמנת ל-NextRep · 14 ימים חינם</title>
<meta name="description" content="חבר הזמין אותך ל-NextRep: תוכנית אימונים אישית, ראפי המאמן וניתוח ארוחות מצילום. 14 ימים חינם דרך ההזמנה.">
<meta name="robots" content="noindex">
<meta property="og:title" content="הוזמנת ל-NextRep · 14 ימים חינם">
<meta property="og:description" content="תוכנית אימונים אישית, ראפי המאמן וניתוח ארוחות מצילום. בלי כרטיס אשראי.">
<meta property="og:image" content="https://www.nextrep.co.il/icon-512.png?v=3">
<meta name="theme-color" content="#0A0B0A">
<link rel="icon" type="image/png" href="/icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
:root{--bg:#0A0B0A;--s:#141715;--line:#232825;--ink:#F2F5F2;--mu:#A3ADA6;--ac:#BFFF2F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif}
main{min-height:100svh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
.glow{position:absolute;top:30px;left:0;right:0;height:440px;background:radial-gradient(circle at 50% 45%,rgba(191,255,47,.2) 0%,rgba(191,255,47,.05) 35%,rgba(10,11,10,0) 62%);pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800;font-size:18px;direction:ltr;position:relative}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--ac);display:flex}.brand .mark svg{width:100%;height:100%;fill:#0B0C0B}.brand b{color:var(--ac)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding-top:22px}
.who{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;background:var(--s);border:1px solid var(--line);font-size:15px;font-weight:700}
.who i{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#0B0C0B;font-weight:800;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
.rafi{width:150px;height:150px;margin-top:18px}
h1{margin:12px 0 0;font-size:34px;line-height:1.12;font-weight:900}h1 em{font-style:normal;color:var(--ac)}
p{margin:12px 0 0;color:var(--mu);font-size:16px;line-height:1.5;max-width:330px}
.code{margin-top:20px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:var(--s);border:1px solid var(--line)}
.code span{color:var(--mu);font-size:14px}.code b{font-size:22px;letter-spacing:.14em;direction:ltr}
.code button{height:38px;padding:0 14px;border-radius:12px;background:#1E2220;border:0;color:var(--ink);font:700 14px Heebo,sans-serif;cursor:pointer}
.foot{display:flex;flex-direction:column;gap:10px;position:relative;margin-top:20px}
.btn{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:var(--ac);color:#0A0B0A;box-shadow:0 8px 30px rgba(191,255,47,.18);font:800 17px Heebo,sans-serif;text-decoration:none}
.note{color:var(--mu);font-size:13px;line-height:1.5;text-align:center}
.bad{display:none}
.nocode .code,.nocode .who{display:none}
</style>
</head>
<body>
<main id="m">
  <div class="glow" aria-hidden="true"></div>
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="-5.56 -5.56 111.11 111.11"><rect x="12" y="48.5" width="15" height="3"/><rect x="73" y="48.5" width="15" height="3"/><rect x="17.6" y="34" width="7.4" height="32" rx="3.7"/><rect x="75" y="34" width="7.4" height="32" rx="3.7"/><rect x="9.3" y="40.5" width="6.6" height="19" rx="3.3"/><rect x="84.1" y="40.5" width="6.6" height="19" rx="3.3"/><path d="M27.5,30.5 A5.5,5.5 0 0 1 33,25 H42.1 L58.3,41.2 V56.2 L38.5,36.4 V68.5 L27.5,75 Z"/><path d="M72.5,69.5 A5.5,5.5 0 0 1 67,75 H57.9 L41.7,58.8 V43.8 L61.5,63.6 V31.5 L72.5,25 Z"/></svg></span><span>Next<b>Rep</b></span></div>
  <div class="mid">
    <div class="who"><i id="ini">?</i><span id="who">חבר הזמין אותך</span></div>
    <img class="rafi" src="/img/kobi-happy.svg?v=3" alt="ראפי, המאמן של NextRep">
    <h1><span id="days">14</span> ימים חינם,<br><em>רק דרך ההזמנה</em></h1>
    <p>תוכנית אימונים אישית, ראפי המאמן שזוכר כל סט, וניתוח ארוחות מצילום. בלי כרטיס אשראי.</p>
    <div class="code"><span>קוד ההזמנה</span><b id="code">—</b><button id="cp" type="button">העתקה</button></div>
  </div>
  <div class="foot">
    <a class="btn" id="ios" href="https://apps.apple.com/app/id6826127248"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.5-1-2.5-3.8zM14.2 5.7c.6-.8 1.1-1.8 1-2.9-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>הורדה מה-App Store</a>
    <div class="note" id="note">ההטבה תזוהה אוטומטית כשתפתחו את האפליקציה. אם לא, מקלידים את הקוד בשאלון הפתיחה.</div>
  </div>
</main>
<script>
(function(){
  var URL='https://dmeougthlruspxwyvrnc.supabase.co', KEY='sb_publishable_EdUIMvKC_VPWbiytXoSWXw_DZ-FsEtc';
  var code=(location.pathname.split('/i/')[1]||new URLSearchParams(location.search).get('c')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,12);
  var ua=navigator.userAgent||'', android=/android/i.test(ua), ios=/iphone|ipad|ipod/i.test(ua);
  if(android){ document.getElementById('ios').style.display='none'; document.getElementById('note').textContent='האפליקציה לאנדרואיד בדרך. שמרו את הקוד, ותקבלו את ההטבה כשהיא תצא.'; }
  else if(!ios){ document.getElementById('note').textContent='פתחו את הקישור הזה בטלפון כדי להוריד את האפליקציה. ההטבה תזוהה אוטומטית.'; }
  if(!code){ document.getElementById('m').classList.add('nocode'); return; }
  document.getElementById('code').textContent=code;
  try{ localStorage.setItem('nr-refcode',code); }catch(e){}
  document.getElementById('cp').onclick=function(){ var b=this; try{ navigator.clipboard.writeText(code).then(function(){ b.textContent='הועתק ✓'; }); }catch(e){} };
  fetch(URL+'/rest/v1/rpc/ref_click',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})})
    .then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){ document.querySelector('.who').style.display='none'; return; }
      var n=String(d.name||'').trim(); if(n){ document.getElementById('who').textContent=n+' הזמין/ה אותך'; document.getElementById('ini').textContent=n[0]; document.title=n+' הזמין/ה אותך ל-NextRep · 14 ימים חינם'; }
      if(d.days)document.getElementById('days').textContent=d.days;
    }).catch(function(){});
})();
</script>
</body>
</html>
