# Builds the iOS / Android apps from the `native` branch.
# Android: a debug APK you can install directly on a phone (Actions → run → Artifacts).
# iOS: an unsigned simulator build to prove the project compiles. Signed App Store builds are added once
#      the Apple certificates exist (see app/README.md).
name: native
on:
  workflow_dispatch:
  push:
    branches: [native]
    paths: ['app/**', 'index.html', 'i18n/**', 'img/**', 'menu-foods.js', '.github/workflows/native.yml']
concurrency: { group: native-${{ github.ref }}, cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync -- android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: nextrep-android-debug, path: app/android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run sync -- ios
      - name: Build for simulator (unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
