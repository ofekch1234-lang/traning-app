# Builds the iOS / Android apps from the `native` branch.
# Android: a debug APK you can install directly on a phone (Actions → run → Artifacts).
# iOS: an unsigned simulator build to prove the project compiles. Signed App Store builds are added once
#      the Apple certificates exist (see app/README.md).
name: native
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Build a signed iOS app and upload it to TestFlight'
        type: boolean
        default: false
      playstore:
        description: 'Build a signed Android App Bundle (.aab) for Google Play'
        type: boolean
        default: false
  push:
    branches: [native]
    paths: ['app/**', 'index.html', 'i18n/**', 'img/**', 'menu-foods.js', '.github/workflows/native.yml']
concurrency:
  # pushes cancel older push builds; manual store builds (TestFlight / Play) are never cancelled
  group: ${{ github.event_name == 'push' && format('native-push-{0}', github.ref) || format('native-manual-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run sync -- android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: nextrep-android-debug, path: app/android/app/build/outputs/apk/debug/app-debug.apk, retention-days: 14 }
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run sync -- ios
      - name: Build for simulator (unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
  # Signed App Store build → TestFlight. Manual only (Actions → native → Run workflow → tick "testflight").
  # The archive is built unsigned (a development profile would need a registered device); the export step signs it
  # for the App Store automatically through an App Store Connect API key (Admin role): Xcode creates/uses a
  # cloud-managed distribution certificate and the App Store profile, so no certificates live in the repo.
  # Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8 file), APPLE_TEAM_ID.
  ios-testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    defaults: { run: { working-directory: app } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Use Xcode 26 (App Store requires the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1); [ -n "$X" ] || X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm ci
      - run: npm run sync -- ios
      - name: App Store Connect API key
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$TEAM" -a -n "$ASC_KEY_P8" || { echo "::error::Missing ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID secrets"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"; printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: App ID capabilities (Sign in with Apple) + widget App ID
        run: node scripts/asc-capability.js
      - name: Archive (Release)
        working-directory: app/ios/App
        # built unsigned; the app's entitlements (Sign in with Apple) are then stamped on with an ad-hoc codesign
        # so the export step, which re-signs for the store, carries them into the distribution profile
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:|error -|No profiles|No signing|requires a provisioning|Provisioning|certificate" "$RUNNER_TEMP/archive.log" | sort -u | head -15 | sed 's/^/::error::/'; tail -40 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          # $(AppIdentifierPrefix) is only expanded by a signed build; stamp the real prefix (the team ID) ourselves
          sed "s/\$(AppIdentifierPrefix)/$TEAM./g" App/App.entitlements > "$RUNNER_TEMP/app.entitlements"
          sed "s/\$(AppIdentifierPrefix)/$TEAM./g" NextRepWidget/NextRepWidget.entitlements > "$RUNNER_TEMP/widget.entitlements"
          APPX="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$APPX/PlugIns/NextRepWidget.appex" || { echo "::error::Widget extension missing from the archive"; exit 1; }
          codesign --force --sign - --entitlements "$RUNNER_TEMP/widget.entitlements" --timestamp=none "$APPX/PlugIns/NextRepWidget.appex"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/app.entitlements" --timestamp=none "$APPX"
          codesign -d --entitlements - "$APPX" 2>/dev/null | grep -q applesignin \
            && echo "Entitlements in archive: Sign in with Apple ✓" || { echo "::error::Sign in with Apple entitlement missing from the archive"; exit 1; }
          codesign -d --entitlements - "$APPX/PlugIns/NextRepWidget.appex" 2>/dev/null | grep -q "il.co.nextrep.shared" \
            && echo "Widget: keychain sharing ✓" || { echo "::error::Widget keychain group missing"; exit 1; }
      - name: Sign for the App Store and upload to TestFlight
        working-directory: app/ios/App
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -iE "error|fail|denied|invalid" "$RUNNER_TEMP/export.log" | sort -u | head -15 | sed 's/^/::error::/'; tail -40 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/export.log"
          echo "### Uploaded build $BUILD to App Store Connect. It shows up in TestFlight after Apple finishes processing (~10–30 min)." >> "$GITHUB_STEP_SUMMARY"
  # Signed Android App Bundle for Google Play. Manual only (tick "playstore"). Download it from the run's
  # Artifacts and upload it in Play Console (Testing → release). Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASS.
  android-release:
    if: github.event_name == 'workflow_dispatch' && inputs.playstore
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Upload key
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          test -n "$KS" -a -n "$ANDROID_KEYSTORE_PASS" || { echo "::error::Missing ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS secrets"; exit 1; }
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run sync -- android
      - name: Build signed App Bundle
        working-directory: app/android
        run: |
          ./gradlew bundleRelease --no-daemon > "$RUNNER_TEMP/gradle.log" 2>&1 \
            || { sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | grep -v '^\s*$' | head -12 | sed 's/^/::error::/'; tail -60 "$RUNNER_TEMP/gradle.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/gradle.log"
      - name: Check signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          OUT=$(jarsigner -verify "$AAB" 2>&1); echo "$OUT" | head -5
          echo "$OUT" | grep -q "jar verified" || { echo "::error::App bundle is not signed: $(echo "$OUT" | head -2 | tr '\n' ' ')"; exit 1; }
          echo "### Signed app-release.aab (version code $ANDROID_VERSION_CODE) is in this run's Artifacts" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nextrep-play-aab-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
