name: food-integrity
on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/tests/**', 'supabase/migrations/**', '.github/workflows/food-integrity.yml']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/tests/food-integrity.mjs
