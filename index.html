const CHM={
  workouts:['🏋️','אימונים','אימונים',4], days:['📅','ימי אימון','ימים',12], sets:['🔁','סטים','סטים',100], volume:['🏗️','נפח','טון',20000],
  minutes:['⏱️','דקות אימון','דק׳',300], cardio:['🏃','דקות קרדיו','דק׳',120], ex_reps:['💪','חזרות בתרגיל','חזרות',300], ex_max:['🏆','משקל מקסימלי','ק״ג',100]};
const CH_MODES={goal:['🎯','כל אחד ליעד','כל מי שמגיע ליעד מנצח'],race:['🏁','תחרות','מי שמוביל בסוף מנצח'],team:['🤝','יעד קבוצתי','כולם יחד מול יעד אחד']};
const CH_PRESETS=[
  ['🔥 4 אימונים השבוע','workouts',4,7,'goal'],['📅 12 ימי אימון בחודש','days',12,30,'goal'],['🏁 מי יתאמן הכי הרבה החודש','workouts',1,30,'race'],
  ['🤝 50 אימונים לכל הקבוצה','workouts',50,30,'team'],['🏗️ 20 טון בחודש','volume',20000,30,'goal'],['🏃 120 דקות קרדיו בשבוע','cardio',120,7,'goal'],
  ['💪 300 שכיבות סמיכה בשבוע','ex_reps',300,7,'goal','שכיבות סמיכה'],['🏆 מי ירים הכי כבד בסקוואט','ex_max',1,14,'race','סקוואט']];
const chVal=(m,v)=>m==='volume'?fmtVol(v):m==='ex_max'?`${wL(+v||0)}`:`${Math.round((+v||0)*10)/10}`;
const chUnit=m=>m==='volume'?'':' '+(m==='ex_max'?LU():CHM[m][2]);
function vSocChall(){
  const C=SOC.chall;
  const btn=`<button class="btn primary" style="width:100%;margin:4px 0 10px" data-act="soc-chall-new">🏆 אתגר חדש</button>`;
  if(!C)return btn+`<div class="empty"><div class="big">טוען…</div></div>`;
  if(!C.length)return btn+`<div class="card stack" style="text-align:center;padding:20px;gap:8px"><div style="font-size:38px">🏆</div><b>עוד אין אתגרים</b><div class="muted">פתחו אתגר אישי, תחרות או יעד קבוצתי, ותראו מי מגיע ראשון</div></div>`;
  const today=ymd(), me=S.user?.id;
  return btn+`<div class="stack" style="gap:12px">${C.map(c=>{
    const M=CHM[c.metric]||CHM.workouts, mode=c.mode||'goal', md=CH_MODES[mode];
    const ended=c.end_d<today, total=Math.round((new Date(c.end_d)-new Date(c.start_d))/864e5)+1, left=Math.round((new Date(c.end_d)-new Date(today))/864e5)+1;
    const rows=[...(c.board||[])].map(r=>({...r,v:+(r.value??r[c.metric])||0})).sort((a,b)=>b.v-a.v);
    const tgt=+c.target||1, lead=Math.max(1,rows[0]?.v||0), sum=rows.reduce((a,r)=>a+r.v,0);
    const myI=rows.findIndex(r=>r.user_id===me), mine=rows[myI];
    const exN=c.ex?` · ${esc(c.ex)}`:'';
    const desc=mode==='race'?`תחרות: מי מוביל ב${M[1]}${exN}`:mode==='team'?`יעד קבוצתי: ${chVal(c.metric,tgt)}${chUnit(c.metric)}${exN}`:`יעד: ${chVal(c.metric,tgt)}${chUnit(c.metric)} לכל אחד${exN}`;
    const elapsed=Math.min(100,Math.round((total-Math.max(0,left-1))/total*100));
    let you='';
    if(mine&&!ended){
      if(mode==='goal')you=mine.v>=tgt?`✅ השלמת את האתגר!`:`חסרים לך ${chVal(c.metric,tgt-mine.v)}${chUnit(c.metric)}`;
      else if(mode==='race')you=myI===0&&mine.v>0?`👑 אתה מוביל!`:`אתה במקום ${myI+1} מתוך ${rows.length}${rows[0]?.v>0?` · ${chVal(c.metric,rows[0].v-mine.v)}${chUnit(c.metric)} מהמקום הראשון`:''}`;
      else you=`תרמת ${chVal(c.metric,mine.v)}${chUnit(c.metric)} (${sum?Math.round(mine.v/sum*100):0}%)`;
    }
    const medal=i=>['🥇','🥈','🥉'][i]||`<span class="num muted" style="display:inline-block;width:18px;text-align:center">${i+1}</span>`;
    const rowHTML=(r,i)=>{ const done=mode==='goal'&&r.v>=tgt; const pct=mode==='goal'?Math.min(100,r.v/tgt*100):mode==='race'?r.v/lead*100:(sum?r.v/sum*100:0);
      return `<div class="ch-mem ${r.user_id===me?'me':''}"><span>${r.v>0||mode==='goal'?medal(i):medal(i)} <span data-notr>${esc(r.user_id===me?tt('אתה'):r.name)}</span></span><span class="small num" style="${done?'color:var(--accent);font-weight:700':''}">${done?'✅ ':''}${chVal(c.metric,r.v)}${chUnit(c.metric)}</span>
        <div class="ch-bar"><i style="width:${Math.round(pct)}%"></i></div></div>`; };
    let res='';
    if(ended){
      const top=rows.filter(r=>r.v>0).slice(0,3);
      const doneN=rows.filter(r=>r.v>=tgt).length;
      const iWon=mode==='race'?(myI===0&&mine?.v>0):mode==='team'?sum>=tgt:(mine&&mine.v>=tgt);
      res=`<div class="ch-res">${top.length?`<div class="ch-podium">${top.map((r,i)=>`<div class="p${i}"><span class="m">${['🥇','🥈','🥉'][i]}</span><b data-notr>${esc(r.user_id===me?tt('אתה'):r.name)}</b><span class="small num">${chVal(c.metric,r.v)}${chUnit(c.metric)}</span></div>`).join('')}</div>`:''}
        <div class="small muted" style="text-align:center">${mode==='goal'?`${doneN} מתוך ${rows.length} השלימו את היעד`:mode==='team'?(sum>=tgt?`🎉 הקבוצה הגיעה ליעד!`:`הקבוצה הגיעה ל-${Math.round(sum/tgt*100)}% מהיעד`):''}</div>
        ${iWon?`<button class="btn primary" data-act="soc-chall-share" data-id="${c.id}">📤 שתף את ההישג</button>`:''}</div>`;
    }
    return `<div class="ch-card ${ended?'ended':''}">
      <div class="spread" style="align-items:flex-start"><div style="display:flex;gap:10px;align-items:center"><span class="ch-emo">${M[0]}</span><div><b style="font-size:17px" data-notr>${esc(c.title)}</b><div class="small muted">${desc}</div></div></div>
        <span class="pill" style="white-space:nowrap;${!ended&&left<=1?'background:var(--gold-soft);color:var(--gold);border-color:transparent':''}">${ended?'🏁 הסתיים':left===1?'יום אחרון!':`עוד ${left} ימים`}</span></div>
      <div class="row small muted" style="gap:6px;align-items:center"><span>${md[0]} ${md[1]}</span><div class="ch-bar" style="flex:1;height:4px"><i style="width:${elapsed}%;background:var(--muted);opacity:.5"></i></div></div>
      ${you?`<div class="ch-you">${you}</div>`:''}
      ${mode==='team'&&!ended?`<div><div class="spread small"><b>הקבוצה</b><span class="num">${chVal(c.metric,sum)} מתוך ${chVal(c.metric,tgt)}${chUnit(c.metric)}</span></div><div class="ch-bar" style="height:12px;margin-top:4px"><i style="width:${Math.min(100,Math.round(sum/tgt*100))}%"></i></div></div>`:''}
      ${res}
      ${ended?'':rows.map(rowHTML).join('')}
      ${c.created_by===me?`<button class="linkbtn" data-act="soc-chall-del" data-id="${c.id}" style="align-self:flex-start;color:var(--muted);font-size:13px">מחיקת האתגר</button>`:''}
    </div>`;}).join('')}</div>`;
}

   מעדכנת את store_subs, ו-my_plan סופר אותה, כך שהפרימיום פתוח גם באתר וגם באפליקציה. */
const RC_KEYS={ios:'appl_RBaKXhhHoExvFEMispkHjWwEwyu',android:''}; // מפתחות SDK ציבוריים מ-RevenueCat (מיועדים לקוד האפליקציה, לא סודיים)

/* Intro offer (decided 2026-10-23, timing updated 2026-10-25): during the free premium week the store shows the
   `lock_offer` offering (first month ₪9.90 / first year ₪149.90). It ends with the trial; the last 24 h show a live
   countdown. Once, 7 days after the lock, the offer comes back for 24 h. Both windows come from the server's
   `until`, so they can't be reset on the device. Users who ever paid (store or web) never get it. */
const OFFER_DAY=864e5;
function offerSecond(u){ const s=new Date(u+7*OFFER_DAY); s.setHours(12,0,0,0); return +s<u+7*OFFER_DAY?+s+OFFER_DAY:+s; }
function offerWin(){ const p=S.plan; if(!IS_NATIVE||!p||p.admin||!p.lock||!RC_KEYS[NATIVE_OS])return null;
  if(p.store_until||p.plan_months||(p.paid&&!p.gift))return null;
  const u=p.until?+new Date(p.until):0, now=Date.now(); if(!u)return null;
  if(p.premium&&u>now)return {end:u,second:false};
  const s=offerSecond(u); if(!p.premium&&now>=s&&now<s+OFFER_DAY)return {end:s+OFFER_DAY,second:true};
  return null; }
function rcCheck(){ if(RC.ready&&RC.uid&&RC.offer!==!!offerWin())rcLoad(); }
const ocdFmt=ms=>{ ms=Math.max(0,ms); const h=Math.floor(ms/36e5), m=Math.floor(ms/6e4)%60, x=Math.floor(ms/1e3)%60, z=n=>String(n).padStart(2,'0');
  return `<span>${z(h)}</span><i>:</i><span>${z(m)}</span><i>:</i><span>${z(x)}</span>`; };
function offerTimerHTML(w,inline){ if(!w)return '';
  const left=w.end-Date.now();
  if(left>OFFER_DAY)return inline?'':`<div class="ofr-t"><span class="l">${tt('ההצעה בתוקף עד')} <b class="num">${offerDay(w.end)}</b></span></div>`;
  return `<div class="ofr-t ${inline?'in':''}"><span class="l">${tt(w.second?'ההצעה חזרה ל-24 שעות בלבד':'ההצעה נגמרת בעוד')}</span><span class="t ocd" data-end="${w.end}">${ocdFmt(left)}</span></div>`; }
const offerDay=t=>new Date(t).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'numeric'})+', '+new Date(t).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'});

  els.forEach(e=>{ const l=+e.dataset.end-Date.now(); if(l<=0)done=true; e.innerHTML=ocdFmt(l); });
  if(done&&!ocdFmt._busy){ ocdFmt._busy=true; setTimeout(()=>{ ocdFmt._busy=false; if(S.user)enterApp(S.user); },1500); } },1000);

/* --- barcode scanner --- */
const SCAN={stream:null,timer:null,reader:null,busy:false,zx:null};
function stopScan(){ clearInterval(SCAN.timer); SCAN.timer=null; try{SCAN.reader?.reset?.();}catch(_){} SCAN.reader=null; SCAN.stream?.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
function loadZXing(){ return window.ZXing?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function zxReader(){
  if(SCAN.zx)return SCAN.zx;
  const hints=new Map(), F=ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const r=new ZXing.MultiFormatReader(); r.setHints(hints); SCAN.zx=r; return r;
}
// פענוח מתוך canvas. מנסה גם בניגודיות רגילה וגם הפוכה
function zxDecodeCanvas(c){
  try{ const res=zxReader().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))); return res&&res.getText(); }catch(_){ return null; }
}
async function openScanner(){
  SCAN.busy=false;
  openSheet(`<h3>סריקת ברקוד</h3>
    <div class="scanwrap"><video id="scanv" playsinline muted autoplay></video><div class="frame"></div></div>
    <div class="small muted" id="scanmsg" style="text-align:center;margin:8px 0">כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ</div>
    <div class="row" style="flex-wrap:nowrap"><input id="scan-code" type="text" inputmode="numeric" dir="ltr" placeholder="או הקלד את המספר" style="flex:1;text-align:center">
      <button class="btn primary" data-act="scan-go">חפש</button></div>
    <button class="btn big" style="margin-top:10px" data-act="scan-close">סגור</button>`);
  const msg=t=>{const m=$('#scanmsg'); if(m)m.textContent=t;};
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#scanv'); if(!v){stopScan();return;}
    v.setAttribute('playsinline',''); v.muted=true; v.srcObject=SCAN.stream; await v.play().catch(()=>{});
    try{ const tr=SCAN.stream.getVideoTracks()[0], cap=tr.getCapabilities?.(); if(cap?.focusMode?.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(_){}
    let native=null;
    if('BarcodeDetector' in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('ean_13'))native=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>f.includes(x))}); }catch(_){} }
    if(!native){ msg('טוען סורק…'); try{ await loadZXing(); }catch(_){ msg('הסורק לא נטען (אין רשת?). אפשר להקליד את המספר שמתחת לברקוד.'); return; } msg('כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ'); }
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    let tick=0;
    SCAN.timer=setInterval(async()=>{
      if(SCAN.busy||!v.videoWidth)return; tick++;
      if(native){ try{ const r=await native.detect(v); if(r[0]?.rawValue)onBarcode(r[0].rawValue); }catch(_){} return; }
      // חותכים את אזור המסגרת ומקטינים לרוחב סביר — מהיר ומדויק יותר בטלפון
      const vw=v.videoWidth, vh=v.videoHeight, cw=Math.round(vw*(tick%2?0.8:0.6)), ch=Math.round(vh*0.5), sx=(vw-cw)/2, sy=(vh-ch)/2;
      const sc=Math.min(1,1000/cw); c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
      ctx.drawImage(v,sx,sy,cw,ch,0,0,c.width,c.height);
      const t=zxDecodeCanvas(c); if(t)onBarcode(t);
      if(tick===40)msg('לא מזהה? נסה עם יותר אור, או הקלד את המספר שמתחת לברקוד');
    },180);
  }catch(e){ msg('אין גישה למצלמה. אפשר להקליד את המספר שמתחת לברקוד, או לאשר מצלמה בהגדרות.'); }
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(code.length<6||SCAN.busy)return;
  SCAN.busy=true; SCAN.prod=null; try{navigator.vibrate?.(40);}catch(_){}
  const m=$('#scanmsg'); if(m)m.textContent=`מחפש ${code}…`;
  stopScan();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/food-barcode?code=${code}`,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});
    if(r.status===404){ openLabelPrompt(code); return; }
    const j=await r.json(); if(!j.product)throw new Error('x');
    openProduct(j.product);
  }catch(e){ toast('החיפוש נכשל, נסה שוב'); closeSheet(); }
}

function tourPlace(st,tries=0){

  if(/גוף מלא/.test(t))(/ישבן/.test(t)?['גב','רגליים']:['חזה','גב','רגליים']).forEach(g=>r.add(g));

    // התאמה לזמן: 45 שניות עבודה לסט + מנוחה + 8 דקות חימום

    const pickRemove=()=>{ for(let i=ex.length-1;i>=0;i--)if(ex[i].t==='s'&&!req.has(ex[i].m))return i;
      for(let i=ex.length-1;i>=0;i--)if(ex[i].t==='s'&&cnt(ex[i].m)>1)return i; return -1; };

    // עדיין ארוך? מורידים סטים (לא פחות מ-2) ומקצרים מעט את המנוחה בתרגילי הבידוד
    for(let g=0;g<40&&mins(ex)>A.time+3;g++){ const cand=ex.filter(x=>x.t==='s'&&x.s>2).sort((p,q)=>q.s-p.s)[0];
      if(cand)cand.s--; else { const iso=ex.find(x=>x.t==='s'&&x.rest>60); if(iso)iso.rest-=15; else { const c=ex.find(x=>x.t==='c'); if(c&&c.min>5)c.min-=5; else { const i=ex.length>3?pickRemove():-1; if(i<0)break; ex.splice(i,1); } } } }
    const letter='ABCDEF'[si];
    // אם לשריר שבשם האימון לא נשאר תרגיל (למשל בלי ציוד אין תרגיל ליד קדמית), השם מתעדכן לפי מה שבאמת יש

    return {name:`${letter} — ${ttl}`,ex,min:Math.round(mins(ex))};
  });

}

function monthKeyOf(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }
function monthStats(y,m){
  const s=+new Date(y,m,1), e=+new Date(y,m+1,1);
  const W=S.workouts.filter(w=>w.start>=s&&w.start<e).sort((a,b)=>a.start-b.start);
  const before={}; for(const w of S.workouts)if(w.start<s)for(const ex of w.ex||[])if(ex.t==='s'){ const t=Math.max(0,...(ex.sets||[]).filter(z=>+z.r>0).map(z=>+z.w||0)); if(t>(before[ex.n]||0))before[ex.n]=t; }
  const setsBy={}, bestIn={}; let vol=0, sets=0, ms=0;
  for(const w of W){ vol+=workoutVol(w); sets+=workoutSets(w); ms+=Math.max(0,(w.end||w.start)-w.start);
    for(const ex of w.ex||[])if(ex.t==='s'){ const ss=(ex.sets||[]).filter(z=>+z.r>0); setsBy[ex.n]=(setsBy[ex.n]||0)+ss.length; const t=Math.max(0,...ss.map(z=>+z.w||0)); if(t>(bestIn[ex.n]||0))bestIn[ex.n]=t; } }
  const topEx=Object.entries(setsBy).sort((a,b)=>b[1]-a[1])[0]||null;
  let pr=null; for(const [n,t] of Object.entries(bestIn)){ const b=before[n]; if(b&&t>b&&(!pr||t-b>pr.to-pr.from))pr={n,from:b,to:t}; }
  const wk={}; for(const w of W){ const k=weekKeyOf(w.start); wk[k]=(wk[k]||0)+1; }
  const days=new Set(W.map(w=>ymd(new Date(w.start)))).size;
  const mealDays=[...new Set(S.meals.filter(x=>{const t=+new Date(x.d+'T12:00:00');return t>=s&&t<e;}).map(x=>x.d))];
  const prot=mealDays.length?Math.round(mealDays.reduce((a,d)=>a+dayTotals(d).protein,0)/mealDays.length):0;
  return {y,m,n:W.length,vol,sets,hours:Math.round(ms/36e5*10)/10,topEx,pr,bestWeek:Math.max(0,...Object.values(wk)),days,mealDays:mealDays.length,prot,
    name:new Date(y,m,15).toLocaleDateString(LOC,{month:'long'})};
}
function wrapTarget(){ // החודש הקודם אם היו בו אימונים, אחרת החודש הנוכחי

}

/* הדגמות בתשובות של ראפי: כשהשאלה היא "איך עושים X" — מזהים את התרגיל (גם בשם המתורגם) ומצרפים כרטיס הדגמה */
let _coNames=null;
function coachDemos(q,reply,prevReply){
  q=String(q||''); if(!q||!/(איך|כיצד|טכניק|לבצע|מבצעים|עושים|ביצוע|תנוחה|הדגמ|דוגמ|תראה|להראות|הראה|סרטון|how|technique|form|perform|demo|show|example|video|كيف|طريقة|أداء|تقنية|أرني|مثال|فيديو)/i.test(q))return [];
  const found=coachFind(q); if(found.length)return found.slice(0,3);
  // "תראה לי דוגמאות לתרגילים האלו" — התרגילים מוזכרים בתשובה (הנוכחית או הקודמת)
  const r1=coachFind(reply); if(r1.length)return r1.slice(0,3);
  return coachFind(prevReply).slice(0,3);
}
/* תגית ההדגמות שראפי מוסיף בסוף תשובה: [[demo: שם | שם]] — שמות מדויקים מהמאגר */
let _libSet=null;
function coachParse(body){
  body=String(body||''); if(!_libSet)_libSet=new Set(Object.values(LIB).flat());
  let demos=[]; const re=/\[\[\s*demo\s*:([^\]]*)\]\]/gi; let m;
  while((m=re.exec(body)))demos.push(...m[1].split('|').map(x=>x.trim()).filter(x=>_libSet.has(x)));
  return {text:body.replace(re,'').replace(/\n{3,}/g,'\n\n').trim(), demos:[...new Set(demos)].slice(0,3)};
}
function coachFind(q){
  q=String(q||''); if(!q)return [];
  const nz=x=>String(x).toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/(^|\s)ال/g,'$1').replace(/[-–]/g,' ').replace(/\s+/g,' ');
  if(!_coNames)_coNames=[...new Set(Object.values(LIB).flat())].filter(n=>exHas(n)||INFO[n]).map(n=>[n,nz(n),I18?nz(tt(n)):'']);
  const t=nz(q);
  const B=/[\s.,:;!?()"'\-–״׳/]/, P=/[והבלמשכ]/;
  const has=(w)=>{ if(!w)return false; let i=t.indexOf(w); while(i>=0){ const pre=i===0||B.test(t[i-1])||(P.test(t[i-1])&&(i===1||B.test(t[i-2])||(P.test(t[i-2])&&(i===2||B.test(t[i-3]))))), post=i+w.length>=t.length||B.test(t[i+w.length]); if(pre&&post)return true; i=t.indexOf(w,i+1);} return false; };
  let hits=_coNames.filter(([n,h,x])=>has(h)||(x&&x.length>2&&has(x)));
  hits=hits.filter(a=>!hits.some(b=>b!==a&&((b[1].includes(a[1])&&b[1].length>a[1].length)||(a[2]&&b[2].includes(a[2])&&b[2].length>a[2].length))));
  const pos=x=>{ const i=t.indexOf(x[1]); return i>=0?i:(x[2]?t.indexOf(x[2]):1e9); };
  return hits.sort((a,b)=>pos(a)-pos(b)).map(x=>x[0]);
}

async function coachSend(text){
  text=String(text||'').trim(); if(!text||CO.busy)return;
  if(!coachCanChat()){ render(); return; }
  CO.draft=''; const ci=$('#chat-in'); if(ci)ci.value='';
  (CO.msgs=CO.msgs||[]).push({id:'tmp'+Date.now(),role:'user',body:text,created_at:new Date().toISOString()});
  CO.busy=true; CO.toBottom=true; render();
  try{
    const {data,error}=await sb.functions.invoke('coach',{body:{mode:'chat',text,lang:LANG}});
    let code=data?.error; if(error){ try{ code=(await error.context?.json?.())?.error||code; }catch(_){} }
    if(code==='quota'){ toast('הגעת ל-20 שאלות היום. נמשיך מחר 💪'); CO.msgs.pop(); CO.draft=text; }
    else if(code==='premium'||code==='paid_only'){ toast('השיחה עם ראפי זמינה בפרימיום'); CO.msgs.pop(); if(S.plan)S.plan.premium=false; }
    else if(error||!data?.reply)throw error||new Error('empty');
    else{ CO.msgs.push({id:'r'+Date.now(),role:'assistant',body:data.reply,created_at:new Date().toISOString()}); CO.left=data.left; }
  }catch(e){ console.error(e); CO.msgs.pop(); CO.draft=text; toast('ראפי לא זמין כרגע. נסה שוב בעוד רגע'); }
  CO.busy=false; CO.toBottom=true; render(); setTimeout(()=>$('#chat-in')?.focus(),50);
}
function coachAct(act,b){
  switch(act){
    case 'coach-card-tog': { CO.cardOpen=!CO.cardOpen; try{localStorage.setItem('nr-co-card',CO.cardOpen?'1':'0');}catch(_){}
      const el=document.querySelector('.coach-card'); if(el){ const t=document.createElement('div'); t.innerHTML=coachCardHTML(); const n=t.firstElementChild; if(n){n.classList.add('co-swap'); el.replaceWith(n);} else render(); } else render(); return true; }
    case 'coach-open': CO.open=true; CO.toBottom=true; render(); coachLoadMsgs(); return true;
    case 'coach-back': CO.open=false; render(); window.scrollTo(0,0); return true;
    case 'coach-chip': coachSend(tt(b.dataset.q)); return true;
    case 'coach-demo': openExSheet(b.dataset.n,{}); return true;
    case 'coach-send': coachSend($('#chat-in')?.value); return true;
  }
  return false;
}

async function shareText(text){
  try{ if(navigator.share){ await navigator.share({text}); return; } }
  catch(e){ if(e&&e.name==='AbortError')return; }
  try{ await navigator.clipboard.writeText(text); toast('הסיכום הועתק — אפשר להדביק בוואטסאפ'); }
  catch(e){ toast('השיתוף לא נתמך בדפדפן הזה'); }
}

    if(n>=24)break; if(!el.offsetParent)continue;

function renderFinish(){
  const a=S.active; if(!a)return;
  const w={...a,end:Date.now()};
  const vol=workoutVol(w), sets=workoutSets(w);
  const best=bestMap(); const prs=[];
  for(const e of w.ex)if(e.t==='s'){
    const top=Math.max(0,...(e.sets||[]).filter(s=>+s.r>0).map(s=>+s.w||0));
    if(top>0&&top>(best[e.n]?.w||0))prs.push({n:e.n,w:top});
  }
  openSheet(`
    <div class="fin-hero"><span>${prs.length?'🏆':'💪'}</span><b>${prs.length?tt('אימון עם שיא!'):tt('עבודה טובה!')}</b></div>

      <div class="tile"><div class="v num">${sets}</div><div class="k">סטים</div></div>
      <div class="tile"><div class="v num">${fmtNum(wL(vol))}</div><div class="k"><span>${uL()==='lb'?'נפח (lb)':'נפח (ק״ג)'}</span>${infoI('vol')}</div></div>
    </div>
    ${prs.length?`<div class="row" style="margin-bottom:10px">${prs.map(p=>`<span class="pill pr num">🏅 שיא חדש · ${esc(p.n)} ${wL(p.w)} ${LU()}</span>`).join('')}</div>`:''}
    <div>${w.ex.map(e=>`<div class="fin-ex"><span>${esc(e.n)}</span><span class="num muted">${
      e.t==='c'?`${e.c?.min||0} דק׳`:(e.sets||[]).filter(s=>+s.r>0).map(wLs).join(' · ')||'—'

/* ---------- actions ---------- */
function startWorkout(name,tid,asked){
  const tpl=S.templates.find(t=>t.id===tid);
  if(!asked&&coachOn()&&tpl){ const c=coachCfg(), lw=lastWorkout(), gap=lw?(Date.now()-lw.start)/DAY:0;
    if(lw&&gap>=21&&c.backAns?.for!==lw.start&&(!c.ret||c.ret.at<=lw.start)){ askBreak(name,tid,gap); return; } }
  const co=coachOn()&&tpl?coachCtx():null;
  const ex=(tpl?.ex||[]).map(e=>{
    if(e.t==='c')return {n:e.n,m:e.m,t:'c',rest:e.rest||0,c:{min:'',km:'',inc:'',done:false}};
    const prev=lastSetsOf(e.n)||[], rc=co?coachRec(e,co):null;
    const nSets=rc?rc.sets:Math.max(1,+e.s||3);
    const sets=Array.from({length:nSets},(_,i)=>rc?{w:'',r:'',pw:rc.w??prev[i]?.w??'',pr:rc.ps?rc.ps(i):rc.r,done:false,sug:1}
      :{w:'',r:'',pw:prev[i]?.w??prev[prev.length-1]?.w??'',pr:prev[i]?.r??prev[prev.length-1]?.r??'',done:false});
    return {n:e.n,m:e.m,t:'s',reps:e.reps||'',rest:+e.rest||0,how:e.how||'',sets,...(rc?{co:{k:rc.k,why:rc.why,...(rc.ovr?{ovr:rc.ovr}:{})}}:{}),...(co?.deload?{dl:1}:{})};
  });
  S.active={start:Date.now(),name,tid:tid||null,ex,...(co?.deload?{dl:1}:{})};
  persistActive(); S.tab='train'; location.hash='train'; render();
  startClock(); keepAwake(true);
}
/* a long break: one question decides how gently to start again (trained elsewhere → almost no drop) */
function askBreak(name,tid,gap){ window.__brkGo={name,tid}; const wk=Math.round(gap/7), f=Math.round(retF(gap,null)*100);
  openSheet(`<div class="brkq"><div class="brkq-k">ברוך השב</div><h3>עברו ${wk<=1?'שבועיים':wk+' שבועות'} מהאימון האחרון</h3>
    <p class="small muted">שאלה אחת, כדי לחזור בקצב הנכון:</p><b>התאמנת בתקופה הזאת?</b>
    <div class="card list" style="margin-top:8px">
      <button class="li" data-act="co-brkq" data-v="no"><span class="lt"><b>לא בכלל</b><small>מתחילים מ-${f}%, חוזרים תוך 3 אימונים</small></span></button>
      <button class="li" data-act="co-brkq" data-v="some"><span class="lt"><b>קצת</b><small>מתחילים מ-90%, חוזרים תוך 3 אימונים</small></span></button>
      <button class="li" data-act="co-brkq" data-v="yes"><span class="lt"><b>כן, כרגיל</b><small>ממשיכים מאיפה שהפסקת</small></span></button>
    </div></div>`); }
function startClock(){ // live workout stopwatch — updates the clock element only, never re-renders
  if(startClock._i)return;
  startClock._i=setInterval(()=>{
    if(!S.active){clearInterval(startClock._i);startClock._i=null;return;}
    const el=document.getElementById('wclock'); if(el)el.textContent=clockText();
  },1000);
}
async function doSaveWorkout(){
  const a=S.active; if(!a)return;
  const w=clone(a); w.end=Date.now(); w.id='w'+a.start;
  w.ex=w.ex.map(e=>{ // strip placeholders, normalize numbers
    if(e.t==='c'){const c=e.c||{};return {n:e.n,m:e.m,t:'c',c:{min:+c.min||0,km:+c.km||0,inc:+c.inc||0}};}
    return {n:e.n,m:e.m,t:'s',sets:(e.sets||[]).map(s=>({w:+s.w||0,r:+s.r||0})).filter(s=>s.r>0)};
  }).filter(e=>e.t==='c'?(e.c.min>0||e.c.km>0):e.sets.length>0);
  if(!w.ex.length){toast('אין סטים מלאים לשמירה');return;}
  const bm=bestMap(); const newPRs=[];
  for(const e of w.ex)if(e.t==='s'){ const top=Math.max(0,...e.sets.map(s=>s.w));
    if(top>0&&top>(bm[e.n]?.w||0))newPRs.push(`${e.n}: ${wL(top)} ${LU()}`); }
  try{await saveWorkout(w);}catch(e){return;}
  if(newPRs.length&&S.settings.notif?.pr!==false)notify('שיא חדש! 🏅',newPRs.join(' · '),'pr');
  if(newPRs.length)sb.rpc('post_pr',{p_text:newPRs.join(', ')}).then(()=>{},()=>{});
  S.active=null;
  saveLocalActive(); clearTimeout(_aT); flushActive();
  S._justTrained=Date.now(); stopRest(); keepAwake(false); closeSheet(); render(); toast('האימון נשמר 💪'); if(!newPRs.length)confetti(60); vibrate([20,50,20]);
  setTimeout(checkNewBadges,700);
  { const n=(S.workouts||[]).length; const r=newPRs.length&&n>=3?'pr':n===4?'w4':n===10?'w10':n===20?'w20':null; if(r)setTimeout(()=>maybeInvitePrompt(r),2500);
    if(n===1)setTimeout(()=>notifAsk('first','אימון ראשון נשמר 💪','רוצה שאזכיר לך בבוקר של יום האימון הבא, ואודיע כשתשבור שיא? רק עם התראות.'),1800); }
}

/* אבחון מרחוק: שגיאות JS ותקיעות של המסך נרשמות (עד 6 בפתיחה), כדי שנוכל לראות מה קרה אצל משתמש */
(function diag(){ let n=0, last=Date.now(), vis=Date.now();
  const send=(k,m)=>{ try{ if(!S.user||n>=6)return; n++; logEv(k,{...m,v:APP_VERSION,tab:S.tab,sheet:!$('#sheet').hidden,act:!!S.active,g:window.NR_G||null,lang:LANG,ua:navigator.userAgent.slice(0,140)}); }catch(_){} };
  window.addEventListener('error',e=>send('js_err',{m:String(e?.message||'').slice(0,200),f:String(e?.filename||'').split('/').pop(),l:e?.lineno||0,c:e?.colno||0}));
  window.addEventListener('unhandledrejection',e=>{ const m=String(e?.reason?.message||e?.reason||''); if(/fetch|network|Load failed|abort/i.test(m))return; send('js_rej',{m:m.slice(0,200)}); });
  document.addEventListener('visibilitychange',()=>{ vis=Date.now(); last=Date.now(); });
  setInterval(()=>{ const now=Date.now(), gap=now-last; last=now; if(gap>3500&&gap<60000&&document.visibilityState==='visible'&&now-vis>gap+1000)send('stall',{ms:gap}); },1000);
})();
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return;
  try{ handleAct(b,ev); }catch(err){ console.error(err); toast('שגיאה: '+(err?.message||err)); }
});
function handleAct(b,ev){
  const act=b.dataset.act;
  if(act==='lock-view'){ enterApp._ro=true; S.trackView='history'; S.tab='track'; enterApp(S.user); return; }
  if(act==='lock-pay'){ S.mode='paywall'; render(); window.scrollTo(0,0); return; }
  if(S.locked&&S.mode==='app'&&!LOCK_OK.test(act)){ toast(tt('מצב צפייה בלבד. בוחרים מסלול, והכל נפתח מיד.')); return; }
  if(act==='info'){ ev.stopPropagation(); showInfo(b); return; }
  if(act.startsWith('soc-')&&socAct(act,b))return;
  if(act.startsWith('rc-')&&rcAct(act,b))return;
  if(payAct(act,b))return;
  if(act.startsWith('pb-')&&pbAct(act,b))return;
  if(act.startsWith('start-')&&act!=='start-tpl'&&act!=='start-free'&&startAct(act))return;
  if(act.startsWith('coach-')&&coachAct(act,b))return;
  if((act.startsWith('badge-')||act.startsWith('wrap-'))&&retAct(act,b))return;
  if(act.startsWith('st-')&&stAct(act,b))return;
  if(act.startsWith('mn-')&&menuAct(act,b))return;
  if(act.startsWith('mw-')&&mwAct(act,b))return;
  if((act.startsWith('tour-')||act.startsWith('inst-')||act.startsWith('lang-'))&&tourAct(act,b))return;
  if((act.startsWith('adm-')||act.startsWith('ev-')||act==='admin-open')&&admAct(act,b))return;
  if(act==='ct-topic'){S.ctDraft=$('#ct-body')?.value||'';openContact(b.dataset.t);return;}
  if(act==='ct-send'){const t=($('#ct-body')?.value||'').trim(); if(!t){toast('כתוב הודעה');return;} b.disabled=true; sb.rpc('send_support',{p_topic:S.ctTopic||'general',p_body:t}).then(({error})=>{ b.disabled=false; if(error){toast(/too_many/.test(error.message)?'שלחת הרבה הודעות, נסה בעוד שעה':'השליחה נכשלה');return;} S.ctDraft=''; toast('ההודעה נשלחה ✓ נחזור אליך בהקדם'); openContact(); }); return;}
  if(act==='contact-open'){openContact(b.dataset.t);return;}
  switch(act){
    case 'start-free': startWorkout('אימון חופשי'); break;
    case 'start-tpl': { const t=S.templates.find(t=>t.id===b.dataset.id); if(t){closeSheet();startWorkout(t.name,t.id);} break; }
    case 'add-ex': openLibrary('active'); break;
    case 'rm-ex': { if(!b.dataset.sure&&b.closest('#sheet')){ b.dataset.sure='1'; b.querySelector('b').textContent='בטוח? לחץ שוב להסרה'; break; } closeSheet(); S.active.ex.splice(+b.dataset.ei,1); if(S.active.open)S.active.open={}; persistActive(); render(); break; }
    case 'coach-set': openCoachSettings(); break;
    case 'coach-mode': { coachCfg().mode=b.dataset.v; persistSettings(); openCoachSettings(); render(); break; }
    case 'coach-rir': { const c=coachCfg(); c.rir=!c.rir; persistSettings(); openCoachSettings(); break; }
    case 'coach-inc': { coachCfg()[b.dataset.k]=+b.dataset.v; persistSettings(); openCoachSettings(); break; }
    case 'coach-reset': { const c=coachCfg(); c.start=new Date().setHours(0,0,0,0); c.back=null; persistSettings(); closeSheet(); render(); toast('בלוק חדש מתחיל היום'); break; }
    case 'coach-block': openBlockSheet(); break;
    case 'coach-block-go': startNextBlock(true); break;
    case 'coach-block-keep': startNextBlock(false); break;
    case 'low-ack': { S.settings.lowAck=Date.now(); if(b.dataset.v==='eat')S.settings.lowH=[...(S.settings.lowH||[]).filter(t=>Date.now()-t<60*864e5),Date.now()]; persistSettings(); render(); break; }
    case 'hq-open': HQS.ans=[]; HQS.step=1; HQS.ok=false; hqSheet(); break;
    case 'hq-later': S.settings.hqLater=Date.now(); persistSettings(); render(); break;
    case 'hq-a': { HQS.ans[+b.dataset.i]=b.dataset.v==='1'; const g=b.parentElement; g.querySelectorAll('button').forEach(x=>{ const on=x===b; x.classList.toggle('on',on); x.classList.toggle('yes',on&&x.dataset.v==='1'); x.setAttribute('aria-pressed',String(on)); }); break; }
    case 'hq-all': HQS.ans=[]; hqSave(HQS.ans); closeSheet(); toast('תודה. אפשר להתאמן בראש שקט'); render(); break;
    case 'hq-next': if(HQS.ans.some(Boolean)){ HQS.step=2; hqSheet(); } else { hqSave(HQS.ans); closeSheet(); toast('תודה. אפשר להתאמן בראש שקט'); render(); } break;
    case 'hq-ok': HQS.ok=!HQS.ok; hqSheet(); break;
    case 'hq-done': if(hqMust(HQS.ans)&&!HQS.ok)break; hqSave(HQS.ans); closeSheet(); toast('נשמר. ראפי יתקדם איתך בקצב זהיר'); render(); break;
    case 'coach-careful': { const c=coachCfg(); c.careful=!c.careful; persistSettings(); openCoachSettings(); break; }
    case 'co-brkq': { const g=window.__brkGo, lw=lastWorkout(); if(!g)break; const c=coachCfg(); c.backAns={for:lw?.start||0,v:b.dataset.v}; persistSettings(); closeSheet(); window.__brkGo=null; startWorkout(g.name,g.tid,true); break; }
    case 'co-ovr': { const e=S.active?.ex?.[+b.dataset.ei]; if(!e?.co?.ovr)break; const o=e.co.ovr;
      e.sets.forEach(x=>{ if(!x.done){ x.pw=o.w; x.pr=o.r; x.sug=1; } }); e.co={k:'up',why:`לפי הבחירה שלך: עולים ל-${wL(o.w)} ומתחילים מ-${o.r} חזרות. אם הסט הראשון כבד מדי, אפשר לחזור למשקל הקודם.`};
      persistActive(); render(); break; }
    case 'coach-back': { const c=coachCfg(); c.back=Date.now(); persistSettings(); render(); toast('מעולה שחזרת. השבוע מתחילים קצת יותר קל'); break; }
    case 'ex-swap': openExSwap(+b.dataset.ei); break;
    case 'ex-swap-go': doSwap(+b.dataset.ei,b.dataset.n); break;
    case 'ex-lock': { const e=S.active?.ex?.[+b.dataset.ei]; if(!e)break; const L=coachCfg().lock; if(L[e.n])delete L[e.n]; else L[e.n]=1; persistSettings(); closeSheet(); toast(L[e.n]?'התרגיל ננעל':'התרגיל שוחרר'); break; }
    case 'rir': rirSet(+b.dataset.ei,+b.dataset.si,+b.dataset.v); break;

    case 'ex-close': { const o=S.active.open||(S.active.open={}); o[+b.dataset.ei]=false; closeSheet(); persistActive(); render(); break; }
    case 'ex-rest': { const e=S.active?.ex[+b.dataset.ei]; if(!e)break; e.rest=+b.dataset.s; persistActive(); openExMenu(+b.dataset.ei); break; }
    case 'add-set': { const e=S.active.ex[+b.dataset.ei]; const last=e.sets[e.sets.length-1];
      e.sets.push({w:'',r:'',pw:last?(last.w||last.pw||''):'',pr:last?(last.r||last.pr||''):'',done:false});

document.addEventListener('input',ev=>{

  if(k==='w'||k==='r'){ const s=S.active?.ex[+i.dataset.ei]?.sets[+i.dataset.si]; if(s){s[k]=i.value; persistActive();} }
  else if(k==='cmin'||k==='ckm'||k==='cinc'){ const e=S.active?.ex[+i.dataset.ei]; if(e?.c){e.c[{cmin:'min',ckm:'km',cinc:'inc'}[k]]=i.value; persistActive();} }
  else if(k==='libq'){ S.lib.q=i.value; renderLibrary(); }
  else if(k==='askq'){ S.askQ=i.value; const clr=i.closest('.ask')?.querySelector('.clr');
    if(!!i.value!==!!clr){ const bar=i.closest('.ask'); if(i.value&&bar&&!clr){ const c=document.createElement('button'); c.className='sq clr'; c.dataset.act='ask-clear'; c.setAttribute('aria-label','ניקוי'); c.textContent='✕'; bar.insertBefore(c,bar.querySelector('[data-act="scan-open"]')); } else if(!i.value&&clr)clr.remove(); }
    clearTimeout(foodSearch._t); foodSearch._t=setTimeout(()=>foodSearch(i.value,'ask-res'),220); }
  else if(k==='foodq'){ i.style.height='auto'; i.style.height=Math.min(132,i.scrollHeight+2)+'px'; i.closest('.fsearch')?.classList.toggle('has',i.value.trim().length>=2); clearTimeout(foodSearch._t); foodSearch._t=setTimeout(()=>foodSearch(i.value),220); }
  else if(k==='tpln'){ if(_tplDraft)_tplDraft.name=i.value; }
  else if(k==='pqty'&&_portion){ const v=+String(i.value).replace(',','.'); if(v>0){_portion.qty=v; renderPortion();} }
  else if(k==='mif'){ if(!_mealEdit)return;
    if(i.dataset.mf==='mealname'){_mealEdit.name=i.value;return;}

    const f=i.dataset.mf;
    it[f]=f==='name'?i.value:(+String(i.value).replace(',','.')||0);

/* ---------- boot ---------- */
async function enterApp(user){
  S.user=user; S.mode='boot'; render();
  // first real sign-in: the server starts the invite gift week, rewards the inviter and alerts the admin (once per user)
  try{ const k='nr-entered-'+user.id; if(!localStorage.getItem(k)){ const r=await sb.rpc('mark_entered'); if(!r.error)localStorage.setItem(k,'1'); } }catch(e){}
  // home-screen install: reported once per device, so setup emails only ask what's still missing
  try{ if(IS_STANDALONE&&!localStorage.getItem('nr-inst-'+user.id)){ sb.rpc('mark_seen',{p_inst:true}).then(r=>{ if(!r.error)try{localStorage.setItem('nr-inst-'+user.id,'1');}catch(_){} },()=>{}); } }catch(e){}
  // בקרת גישה: משתמש חדש ממתין לאישור האדמין (נאכף גם בשרת ב-RLS). שגיאת רשת → ממשיכים (אופליין)
  if(PAID_RETURN||enterApp._claim){ enterApp._claim=false; try{ const c=await sb.rpc('claim_payment'); if(c.data?.ok&&!c.data.duplicate)toast('התשלום אומת, הגישה נפתחה 🎉'); }catch(_){} }
  await refApplyPending();
  rcInit();
  try{ const pl=await sb.rpc('my_plan'); if(!pl.error&&pl.data){ S.plan=pl.data; const st=pl.data.status; rcCheck();
    if(st==='expired'){
      if(!PAID_RETURN&&!enterApp._grace){ enterApp._grace=true; try{ const g=await sb.rpc('grace_finish'); if(g.data?.ok){ toast('אפשר לסיים את האימון שהתחלת 💪'); return enterApp(user); } }catch(_){} }
      if(enterApp._ro){ S.locked=true; } else {
      S.mode='paywall'; render();
      if(!S.recap)sb.rpc('trial_recap').then(({data})=>{ if(data){ S.recap=data; if(S.mode==='paywall')render(); } },()=>{});
      if(PAID_RETURN&&!(enterApp._poll>=8)){ enterApp._poll=(enterApp._poll||0)+1; toast('מאשר את התשלום…'); setTimeout(()=>enterApp(user),4000); }
      return; } }
    else S.locked=false;
    if(st!=='approved'&&st!=='expired'){ S.access=st; S.mode='pending'; render(); return; } } }catch(_){}
  try{
    const [tpl,wo,st,bw,ml]=await Promise.all([
      sb.from('templates').select('id,name,ord,ex').order('ord'),
      sb.from('workouts').select('id,name,start_ts,end_ts,ex'),
      sb.from('settings').select('rest,active,prefs').maybeSingle(),
      sb.from('bodyweight').select('d,kg').order('d'),
      sb.from('meals').select('id,d,ts,name,kcal,protein,carbs,fat,items').gte('d',ymd(new Date(Date.now()-60*864e5))),
    ]);
    if(tpl.error||wo.error)throw tpl.error||wo.error;
    S.templates=(tpl.data||[]).map(r=>({id:r.id,name:r.name,order:r.ord||0,ex:r.ex||[]}));
    S.workouts=(wo.data||[]).map(r=>({id:r.id,name:r.name,start:+r.start_ts,end:+r.end_ts,ex:r.ex||[]}));
    S.weights=(bw.data||[]).map(r=>({d:r.d,kg:+r.kg}));
    S.meals=ml.data||[];
    if(st.data){ S.settings.rest=st.data.rest??90; S.active=st.data.active||null;
      S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},st.data.prefs?.notif);
      S.settings.schedule=st.data.prefs?.schedule||{};
      S.settings.kcalT=st.data.prefs?.kcalT||null; S.settings.protT=st.data.prefs?.protT||null; S.settings.goalKg=st.data.prefs?.goalKg||null; S.settings.menu=st.data.prefs?.menu||null; S.settings.photoDay=st.data.prefs?.photoDay??null; S.settings.tourDone=st.data.prefs?.tourDone||null; if(st.data.prefs?.toursSeen)S.settings.toursSeen=Object.assign({},st.data.prefs.toursSeen,S.settings.toursSeen||{});
      S.settings.badgesSeen=st.data.prefs?.badgesSeen||null; S.settings.body=st.data.prefs?.body||null; S.settings.wrapSeen=st.data.prefs?.wrapSeen||null;
      S.settings.g=st.data.prefs?.g||null; S.settings.accent=st.data.prefs?.accent||null; S.settings.uL=st.data.prefs?.uL||null; S.settings.uB=st.data.prefs?.uB||null; S.settings.start=st.data.prefs?.start||null; S.settings.coach=st.data.prefs?.coach||null; S.settings.nc=st.data.prefs?.nc||null; S.settings.gear=st.data.prefs?.gear||null; S.settings.saved=st.data.prefs?.saved||null;
      try{ const src=JSON.parse(localStorage.getItem('nr-src')||'null'); if(src&&!localStorage.getItem('nr-src-logged')){ localStorage.setItem('nr-src-logged','1');
        if(!(src.t>new Date(S.user.created_at).getTime()+36e5))logEv('src',src); } }catch(_){}
      if(!S.settings.g&&window.NR_G){ S.settings.g=window.NR_G; setTimeout(()=>persistSettings(),800); }
      if(S.settings.g&&applyLook(S.settings.g,S.settings.accent))return;
      // שפה שנבחרה במכשיר אחר — מסנכרנים; משתמש ותיק בלי שפה שמורה — שומרים את הנוכחית
      const pl=st.data.prefs?.lang; let lsl=null; try{lsl=localStorage.getItem('nr_lang');}catch(e){}
      if(pl&&pl!==LANG&&!lsl){ try{localStorage.setItem('nr_lang',pl);}catch(e){} location.reload(); return; }
      if(pl!==LANG)setTimeout(()=>flushActive(),1500); }
    saveSnapshot();
  }catch(e){ // אופליין — ממשיכים מתמונת המצב המקומית
    const snap=loadSnapshot();
    if(snap){ S.templates=snap.templates||[]; S.workouts=snap.workouts||[]; S.settings=Object.assign({rest:90},snap.settings); S.weights=snap.weights||[]; S.meals=snap.meals||[]; toast('מצב אופליין — עובדים מהנתונים השמורים'); }
    else toast('טעינת הנתונים נכשלה — בדוק חיבור');
  }
  const localA=loadLocalActive();
  if(localA&&(!S.active||((localA.start===S.active.start)&&JSON.stringify(localA).length>=JSON.stringify(S.active).length)))S.active=localA;
  S.mode='app'; render(); updateSyncBadge(); trySync(); loadPhotos(); restoreRest(); setTimeout(syncPush,1500);
  sb.rpc('is_admin').then(({data})=>{S.isAdmin=data===true;}).catch(()=>{});
  socLoad(); socSubscribe(); socPendingJoin();
  setTimeout(()=>{ if(onbApplyPending())return; if(iconAskPending())return; if(!checkInstallGate()){ if(!S.settings.g)openGenderSheet(true); else onboardNext(); } },700);
  socialProfileFix();
  if(PAID_RETURN&&!enterApp._paid){ enterApp._paid=true; toast('תודה! התשלום התקבל 🎉'); }
  if(S.active){startClock();keepAwake(true);}
}

function hideSplash(){
  const sp=$('#splash'); if(!sp)return;
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches, wait=rm?300:Math.max(300,1750-(Date.now()-(window.NR_SPLASH_T0||0)));
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); },wait);
}
(async function boot(){
  render();
  // a password-reset link: getSession() consumes the link before the listener below exists, so PASSWORD_RECOVERY is never heard. Detect it from the URL instead.
  const recov=/(^|[#&?])type=recovery(&|$)/.test(location.hash.slice(1))||/(^|[?&])type=recovery(&|$)/.test(location.search.slice(1));
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){ await enterApp(session.user);
      if(recov){ setTimeout(openNewPassword,900); try{ history.replaceState(null,'',location.pathname); }catch(_){} } }
    else{ S.mode='auth'; render(); }
  }catch(e){ S.mode='auth'; render(); }
  hideSplash();
  sb.auth.onAuthStateChange((ev,sess)=>{
    window._tok=sess?.access_token||null; // for keepalive requests (rest timer) when the app goes to the background
    if(ev==='PASSWORD_RECOVERY'){ setTimeout(openNewPassword,600); }
    if(sess&&!S.user)enterApp(sess.user);
    if(ev==='SIGNED_OUT'){try{closeSheet();}catch(_){} try{CO.open=false;}catch(_){} document.getElementById('wrap')?.setAttribute('hidden',''); try{S.showAuth=false;window.scrollTo(0,0);}catch(_){} PH.sets=[];PH.urls={};PH.loaded=false;S.user=null;S.workouts=[];S.templates=[];S.active=null;stopRest();S.mode='auth';
      // another account may sign in next on this device: nothing from this one may stay in memory (Rafi's weekly summary, chat, groups, admin data…). A fresh start is the only complete reset.
      try{ Object.assign(CO,{sum:undefined,msgs:null,empty:false,err:false,left:null,loading:false,open:false}); S.meals=[]; S.weights=[]; S.plan=null; S.isAdmin=false; }catch(_){}
      try{ sessionStorage.removeItem('nr-live'); history.replaceState(null,'',location.pathname); }catch(_){} S.tab='home';
      render(); setTimeout(()=>{ try{ location.reload(); }catch(_){} },80);}
  });
})();
