  openSheet(`<h3>הזמנת חברים</h3><div class="muted" style="margin:-4px 0 12px">שלח את הקישור. מי שאין לו חשבון יירשם ויצטרף אחרי אישור.</div>
    <div class="inv-code">${esc(code)}</div>
    <div class="row" style="margin-top:12px;flex-wrap:nowrap"><button class="btn primary big" style="flex:2" data-act="soc-share" data-code="${esc(code)}">שליחת הזמנה</button>
      <button class="btn big" style="flex:1" data-act="soc-qr" data-code="${esc(code)}">ברקוד</button></div>
    <div class="label" style="margin:16px 0 6px">חברים בקבוצה</div>
    ${(()=>{ const mu=SOC.mutes[SOC.gid]; const all=mu?.has('*');
      return `<button class="card spread" data-act="soc-mute" data-u="*" style="width:100%;text-align:var(--start);padding:11px 14px;margin-bottom:8px"><span><b>${all?'🔕 הקבוצה מושתקת':'🔔 התראות מהקבוצה'}</b><span class="small muted" style="display:block">${all?'לא תקבל התראות מהקבוצה. לחץ כדי להפעיל':'לחץ כדי להשתיק את כל הקבוצה'}</span></span><span class="muted">›</span></button>
      <div class="card" style="padding:4px 14px">${(info.members||[]).map(m=>{ const me=m.user_id===S.user?.id, off=mu?.has(m.user_id);
        return `<div class="spread" style="padding:7px 0;border-top:1px solid var(--line)"><span><span data-notr>${esc(me?tt('אתה'):m.name)}</span> <span class="small muted">${m.role==='owner'?'מנהל':''}</span></span>
          ${me?'':`<button class="mutebtn ${off?'off':''}" data-act="soc-mute" data-u="${m.user_id}" aria-label="${off?'בטל השתקה':'השתק התראות'}">${off?'🔕 מושתק':'🔔'}</button>`}</div>`;}).join('')}</div>
      <div class="small muted" style="margin-top:6px">🔕 השתקה עוצרת רק את ההתראות. ההודעות עדיין יופיעו בצ׳אט.</div>`; })()}
    <button class="btn danger" style="width:100%;margin-top:14px" data-act="soc-leave">יציאה מהקבוצה</button>
    <button class="btn big" style="margin-top:8px" data-act="sheet-close">סגור</button>`);
}
async function socMutesLoad(gid){ if(!gid)return; const {data}=await sb.from('group_mutes').select('muted_id').eq('group_id',gid);
  SOC.mutes[gid]=new Set((data||[]).map(r=>r.muted_id||'*')); if(SOC.gid===gid&&$('#sheet .inv-code'))socInviteSheet(); }
function socChallSheet(){
  const f=SOC.cf=SOC.cf||{title:tt(CH_PRESETS[0][0]).replace(/^\S+\s/,''),metric:'workouts',target:4,days:7,mode:'goal',ex:''};
  const exAll=[...new Set(Object.values(LIB).flat())];
  const isEx=f.metric==='ex_reps'||f.metric==='ex_max';
  openSheet(`<h3>אתגר חדש</h3>
    <div class="label" style="margin-bottom:6px">רעיונות מוכנים</div>
    <div class="ch-presets">${CH_PRESETS.map((p,i)=>`<button class="chip" data-act="soc-cpreset" data-i="${i}">${p[0]}</button>`).join('')}</div>
    <div class="label" style="margin:14px 0 6px">סוג האתגר</div>
    <div class="ch-modes">${Object.entries(CH_MODES).map(([k,m])=>`<button class="${f.mode===k?'on':''}" data-act="soc-cmode" data-m="${k}"><span style="font-size:22px">${m[0]}</span><b>${m[1]}</b><span class="small muted">${m[2]}</span></button>`).join('')}</div>
    <div class="label" style="margin:14px 0 6px">שם האתגר</div>
    <input id="cf-title" type="text" maxlength="60" value="${esc(f.title)}">
    <div class="label" style="margin:14px 0 6px">מה סופרים</div>
    <div class="row" style="gap:6px;flex-wrap:wrap">${Object.entries(CHM).filter(([k])=>!(k==='ex_max'&&f.mode!=='race')).map(([k,m])=>`<button class="chip ${f.metric===k?'on':''}" data-act="soc-cmetric" data-m="${k}">${m[0]} ${m[1]}</button>`).join('')}</div>
    ${isEx?`<div class="label" style="margin:14px 0 6px">התרגיל</div><select id="cf-ex">${exAll.map(n=>`<option value="${esc(n)}" ${f.ex===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
    ${f.mode!=='race'?`<div class="label" style="margin:14px 0 6px">${f.mode==='team'?'יעד לכל הקבוצה':'יעד לכל משתתף'} (${f.metric==='volume'?'טון':CHM[f.metric][2]})</div>
    <input id="cf-target" type="text" inputmode="decimal" dir="ltr" value="${f.metric==='volume'?f.target/1000:f.target}" style="text-align:center;font-size:22px">`:''}
    <div class="label" style="margin:14px 0 6px">משך</div>
    <div class="row" style="gap:6px">${[[3,'3 ימים'],[7,'שבוע'],[14,'שבועיים'],[30,'חודש']].map(([d,t])=>`<button class="chip ${f.days===d?'on':''}" data-act="soc-cdays" data-d="${d}">${t}</button>`).join('')}</div>
    <div class="row" style="margin-top:16px"><button class="btn" style="flex:1" data-act="sheet-close">ביטול</button><button class="btn primary" style="flex:2" data-act="soc-chall-go">פתיחת האתגר</button></div>`);
}
function socReadForm(){ const f=SOC.cf; if(!f)return; const t=$('#cf-title'), g=$('#cf-target'), e=$('#cf-ex'); if(t)f.title=t.value; if(e)f.ex=e.value; if(g){const v=parseFloat(g.value)||0; f.target=f.metric==='volume'?v*1000:v;} }
async function socSend(){
  const ta=$('#chat-in'); const body=(ta?.value||'').trim(); if(!body||!SOC.gid)return;
  ta.value=''; SOC.draft=''; ta.style.height='';
  const {error}=await sb.from('group_messages').insert({group_id:SOC.gid,user_id:S.user.id,kind:'text',body});
  if(error){toast('ההודעה לא נשלחה');ta.value=body;SOC.draft=body;}
}
function socAct(act,b){
  switch(act){
    case 'soc-open': socOpen(b.dataset.id); return true;
    case 'soc-back': SOC.gid=null; render(); socLoad(); window.scrollTo(0,0); return true;
    case 'soc-view': SOC.view=b.dataset.v; render(); window.scrollTo(0,0);
      if(SOC.view==='board')socLoadBoard(); else if(SOC.view==='chall')socLoadChall(); else {SOC.toBottom=true;render();} return true;
    case 'soc-range': SOC.boardRange=b.dataset.r; socLoadBoard(); return true;
    case 'soc-new': socNewSheet(); return true;
    case 'soc-emo': SOC.newEmo=b.dataset.e; const nm=$('#sg-name')?.value||''; socNewSheet(); $('#sg-name').value=nm; return true;
    case 'soc-create': { const name=($('#sg-name')?.value||'').trim(); if(!name){toast('תן שם לקבוצה');return true;} b.disabled=true;
      sb.rpc('create_group',{p_name:name,p_emoji:SOC.newEmo||'💪'}).then(async({data,error})=>{
        if(error){b.disabled=false;toast(/too_many/.test(error.message)?'הגעת למקסימום 10 קבוצות':'יצירת הקבוצה נכשלה');return;}
        closeSheet(); await socLoad(); await socOpen(data.id); socInviteSheet(); }); return true; }
    case 'soc-join': socJoinSheet(); return true;
    case 'soc-join-go': { const code=($('#sg-code')?.value||'').trim().toUpperCase(); if(code.length!==6){toast('הקוד צריך להיות 6 תווים');return true;} b.disabled=true;
      sb.rpc('join_group',{p_code:code}).then(async({data,error})=>{ b.disabled=false;
        if(error){toast(/not_found/.test(error.message)?'לא נמצאה קבוצה עם הקוד הזה':/group_full/.test(error.message)?'הקבוצה מלאה (30 חברים)':'ההצטרפות נכשלה');return;}
        closeSheet(); toast('הצטרפת לקבוצה 🎉'); await socLoad(); socOpen(data); setTimeout(()=>notifAsk('group','ברוך הבא לקבוצה 👥','כדי לראות מתי החברים מסיימים אימון, שוברים שיא או כותבים בצ׳אט, צריך להפעיל התראות.'),1200); }); return true; }
    case 'soc-mute': { const gid=SOC.gid, u=b.dataset.u; const mu=SOC.mutes[gid]||(SOC.mutes[gid]=new Set()); const on=mu.has(u);
      if(on){ mu.delete(u); let q=sb.from('group_mutes').delete().eq('group_id',gid); q=u==='*'?q.is('muted_id',null):q.eq('muted_id',u); q.then(({error})=>{ if(error){mu.add(u);toast('לא הצלחנו לעדכן');socInviteSheet();} }); toast(u==='*'?'ההתראות מהקבוצה הופעלו 🔔':'ההשתקה בוטלה 🔔'); }
      else{ mu.add(u); sb.from('group_mutes').insert({group_id:gid,muted_id:u==='*'?null:u}).then(({error})=>{ if(error&&!/duplicate/.test(error.message)){mu.delete(u);toast('לא הצלחנו לעדכן');socInviteSheet();} }); toast(u==='*'?'הקבוצה הושתקה 🔕':'לא תקבל התראות מההודעות שלו 🔕'); }
      socInviteSheet(); return true; }
    case 'soc-invite': socMutesLoad(SOC.gid); socInviteSheet(); if(!SOC.info[SOC.gid])socLoadInfo(SOC.gid).then(socInviteSheet); return true;
    case 'soc-share': { const code=b.dataset.code, url=`${location.origin}/#join=${code}`;
      const text=`בוא להתאמן איתי ב-NextRep 💪 נעקוב אחד אחרי השני, נפרגן ונתחרה באתגרים. קוד הקבוצה: ${code}`;
      if(navigator.share)navigator.share({title:'NextRep',text:tt(text),url}).catch(()=>{});
      else navigator.clipboard?.writeText(tt(text)+'\n'+url).then(()=>toast('הקישור הועתק'),()=>toast(url)); return true; }
    case 'soc-leave': if(!b.dataset.sure){b.dataset.sure='1';b.textContent='בטוח? לחץ שוב ליציאה';return true;}
      sb.rpc('leave_group',{gid:SOC.gid}).then(()=>{closeSheet();SOC.gid=null;toast('יצאת מהקבוצה');socLoad();render();}); return true;
    case 'soc-send': socSend(); return true;
    case 'soc-qr': { const code=b.dataset.code, url=`${location.origin}/#join=${code}`; openShareSheet('ברקוד לקבוצה','החבר סורק ומצטרף לקבוצה.',url,`בוא להתאמן איתי ב-NextRep 💪 קוד הקבוצה: ${code}`); return true; }
    case 'soc-older': { const gid=SOC.gid, arr=SOC.msgs[gid]||[]; const h0=$('#chatlist')?.scrollHeight||0;
      socLoadMsgs(gid,arr[0]?.id).then(rows=>{SOC.msgs[gid]=rows.concat(arr);render();const l=$('#chatlist');if(l)l.scrollTop=l.scrollHeight-h0;}); return true; }
    case 'soc-react': { const id=+b.dataset.id, e=b.dataset.e, uid=S.user.id; const rs=SOC.reacts[id]||(SOC.reacts[id]=[]);
      const mine=rs.some(r=>r.emoji===e&&r.user_id===uid);
      SOC.reacts[id]=mine?rs.filter(r=>!(r.emoji===e&&r.user_id===uid)):rs.concat([{user_id:uid,emoji:e}]);
      b.closest('[data-reacts]').outerHTML=socReactsHTML(id); try{navigator.vibrate?.(8);}catch(_){}
      (mine?sb.from('message_reactions').delete().match({message_id:id,user_id:uid,emoji:e}):sb.from('message_reactions').insert({message_id:id,user_id:uid,emoji:e})).then(()=>{},()=>{});
      return true; }
    case 'soc-chall-new': SOC.cf=null; socChallSheet(); return true;
    case 'soc-cpreset': { const p=CH_PRESETS[+b.dataset.i]; SOC.cf={title:tt(p[0]).replace(/^\S+\s/,''),metric:p[1],target:p[2],days:p[3],mode:p[4],ex:p[5]||''}; socChallSheet(); return true; }
    case 'soc-cmode': socReadForm(); SOC.cf.mode=b.dataset.m; if(SOC.cf.mode!=='race'&&SOC.cf.metric==='ex_max'){SOC.cf.metric='ex_reps';SOC.cf.target=CHM.ex_reps[3];} socChallSheet(); return true;
    case 'soc-cmetric': socReadForm(); if(SOC.cf.metric!==b.dataset.m){SOC.cf.metric=b.dataset.m;SOC.cf.target=CHM[b.dataset.m][3]*(SOC.cf.mode==='team'?3:1); if(!SOC.cf.ex&&b.dataset.m.startsWith('ex_'))SOC.cf.ex=b.dataset.m==='ex_max'?'סקוואט':'שכיבות סמיכה';} socChallSheet(); return true;
    case 'soc-cdays': socReadForm(); SOC.cf.days=+b.dataset.d; socChallSheet(); return true;
    case 'soc-chall-go': { socReadForm(); const f=SOC.cf; if(f.mode==='race')f.target=1;
      if(!f.title.trim()||!(f.target>0)){toast('מלא שם ויעד');return true;} b.disabled=true;
      sb.rpc('create_challenge2',{gid:SOC.gid,p_title:f.title.trim(),p_metric:f.metric,p_target:f.target,p_days:f.days,p_mode:f.mode,p_ex:f.metric.startsWith('ex_')?f.ex:null}).then(({error})=>{
        if(error){b.disabled=false;toast(/too_many/.test(error.message)?'יש כבר 6 אתגרים פעילים בקבוצה':'פתיחת האתגר נכשלה');return;} closeSheet(); toast('האתגר נפתח 🏆'); SOC.view='chall'; socLoadChall(); }); return true; }
    case 'soc-chall-share': { const c=(SOC.chall||[]).find(x=>x.id===b.dataset.id); if(!c)return true; const M=CHM[c.metric]||CHM.workouts;
      const rows=[...(c.board||[])].map(r=>({...r,v:+(r.value??r[c.metric])||0})).sort((a,b)=>b.v-a.v); const i=rows.findIndex(r=>r.user_id===S.user?.id);
      openShareStudio({emoji:c.mode==='race'?'🥇':c.mode==='team'?'🤝':'🎯',title:c.title,sub:c.mode==='race'?'ניצחתי באתגר':c.mode==='team'?'השלמנו את האתגר':'השלמתי את האתגר',top:'אתגר קבוצתי',
        stats:[[chVal(c.metric,rows[i]?.v||0).replace(' טון',''),c.metric==='volume'?'טון':M[2]],[i+1,'מקום'],[rows.length,'משתתפים']]}); return true; }
    case 'soc-chall-del': if(!b.dataset.sure){b.dataset.sure='1';b.textContent='בטוח? לחץ שוב';return true;}
      sb.from('challenges').delete().eq('id',b.dataset.id).then(()=>socLoadChall()); return true;
  }
  return false;
}
document.addEventListener('input',ev=>{ if(ev.target.id==='chat-in'&&S.tab==='social'){SOC.draft=ev.target.value; const t=ev.target; t.style.height='auto'; t.style.height=Math.min(120,t.scrollHeight)+'px';} });
document.addEventListener('keydown',ev=>{ if(ev.target.id==='food-text'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault(); $('[data-act="food-ai"]')?.click(); return;}
  if(ev.target.id==='chat-in'&&S.tab==='social'&&ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();socSend();}
  if(ev.target.id==='sg-code'&&ev.key==='Enter')$('[data-act="soc-join-go"]')?.click(); if(ev.target.id==='sg-name'&&ev.key==='Enter')$('[data-act="soc-create"]')?.click(); });

/* ===================== מנוי, תשלום, שיתוף וברקוד ===================== */
const PLAN_NAMES={'4m':'4 חודשים','6m':'6 חודשים','12m':'שנה'};
function planLink(p){
  let l=(p&&p.link)||''; if(!l)return '';
  const u=S.user||{}; const r={uid:u.id||'',email:u.email||'',name:u.user_metadata?.full_name||''};
  if(/\{(uid|email|name)\}/.test(l))return l.replace(/\{(uid|email|name)\}/g,(_,k)=>encodeURIComponent(r[k]));
  return l;
}
function plansHTML(){
  const plans=(S.plan?.plans||[]);
  const grow=!!S.plan?.grow;
  return plans.map(p=>{const pm=(p.price/p.months); const link=grow||planLink(p);
    return `<button class="plan ${p.best?'best':''}" data-act="plan-buy" data-id="${esc(p.id)}" ${link?'':'disabled style="opacity:.6"'}>
      ${p.was>p.price?'<span class="tag launch">🚀 מחיר השקה</span>':p.best?'<span class="tag">הכי משתלם</span>':''}
      <span class="pn">${esc(PLAN_NAMES[p.id]||p.months+' חודשים')}</span>
      <span class="pp num">${p.was>p.price?`<s class="was">₪${p.was}</s>`:''}₪${p.price}</span>
      <span class="pm">₪${pm.toFixed(pm<10?2:1).replace(/\.?0+$/,'')} לחודש, תשלום אחד בלי התחייבות</span>
    </button>`;}).join('')+(grow||plans.some(p=>planLink(p))?'':'<div class="small muted" style="text-align:center">התשלום ייפתח בקרוב.</div>');
}
function recapHTML(){
  const r=S.recap; if(!r||!(r.workouts||r.meals||r.weighins))return '';
  const t=[r.workouts?[r.workouts,'אימונים']:null, r.volume?[r.volume>=1000?(Math.round(r.volume/100)/10)+'K':r.volume,'ק״ג נפח']:null, r.meals?[r.meals,'ארוחות']:null, !r.volume&&r.weighins?[r.weighins,'שקילות']:null].filter(Boolean).slice(0,3);
  return `<div class="pw-recap"><div class="small muted">מה עשית בתקופת הניסיון</div><div class="pw-rt">${t.map(([v,l])=>`<div><b class="num">${v}</b><span>${tt(l)}</span></div>`).join('')}</div></div>`;
}
function vPaywall(full){
  const paid=!!S.plan?.access_until;
  const body=`
    ${full?`<div class="pw-kobi"><img src="img/kobi-${S.recap&&(S.recap.workouts||S.recap.meals)?'cheer':'happy'}.svg" alt=""><div class="pw-bub">${paid?'מתגעגע אליך כבר. בוא נמשיך מאיפה שעצרנו 💪':'אל תעצור עכשיו, אני כבר מכיר אותך 💪'}</div></div>${recapHTML()}`:''}

    <div class="muted small">${full?'כל האימונים, השקילות והארוחות שלך שמורים ומחכים לך. בוחרים מסלול, והכל נפתח מיד.':'תשלום אחד, בלי חידוש אוטומטי ובלי התחייבות.'}</div>

    <div class="stack" style="gap:10px">${plansHTML()}</div>
    <div class="small muted" style="text-align:center;font-size:12px">ברכישה אתה מסכים ל<a href="terms.html" target="_blank">תקנון</a>, כולל <a href="terms.html#cancel" target="_blank">מדיניות הביטול</a>.</div>
    <div class="pw-links"><button class="linkbtn" data-act="plan-recheck">כבר שילמתי, בדוק שוב</button><span class="muted">·</span><button class="linkbtn" data-act="contact-open" data-t="payment">בעיה בתשלום?</button></div>
    ${full?`<button class="linkbtn" data-act="access-logout" style="color:var(--muted)">יציאה מהחשבון</button>`:''}`;
  return full?`<div class="pw">${body}</div>`:body;
}
const PLAN_LABEL={4:'מנוי 4 חודשים',6:'מנוי 6 חודשים',12:'מנוי שנתי'};
function planPill(){
  const p=S.plan; if(!p||p.admin||!p.billing||p.days_left==null)return '';
  if(planBanner())return ''; // the urgent banner already says it
  if(p.paid){ const d=p.access_until?new Date(p.access_until).toLocaleDateString(LOC,{day:'numeric',month:'numeric',year:'2-digit'}):'';
    return `<button class="planpill paid" data-act="plans-open">${p.gift?'🎁 חודש מתנה':'⭐ '+(PLAN_LABEL[p.plan_months]||'מנוי פעיל')}${d?` · עד ${d}`:''}</button>`; }
  return `<button class="planpill" data-act="plans-open">🎁 ניסיון חינם · ${p.days_left<=1?'היום האחרון':`עוד ${p.days_left} ימים`}</button>`;
}
function planBanner(){
  const p=S.plan; if(!p||p.admin||!p.billing||p.days_left==null||p.days_left>(p.paid?5:3))return '';
  return `<button class="planbanner" data-act="plans-open"><span style="font-size:22px">⏳</span><span style="flex:1"><b>${p.days_left<=1?'היום היום האחרון':`נשארו ${p.days_left} ימים`} ${p.paid?(p.gift?'לחודש המתנה':'למנוי'):'לתקופת הניסיון'}</b><span class="small muted" style="display:block">בחר מסלול כדי להמשיך בלי הפסקה</span></span><span style="color:var(--accent);font-weight:700">מסלולים</span></button>`;

/* --- barcode scanner --- */
const SCAN={stream:null,timer:null,reader:null,busy:false,zx:null};
function stopScan(){ clearInterval(SCAN.timer); SCAN.timer=null; try{SCAN.reader?.reset?.();}catch(_){} SCAN.reader=null; SCAN.stream?.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
function loadZXing(){ return window.ZXing?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function zxReader(){
  if(SCAN.zx)return SCAN.zx;
  const hints=new Map(), F=ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const r=new ZXing.MultiFormatReader(); r.setHints(hints); SCAN.zx=r; return r;
}
// פענוח מתוך canvas. מנסה גם בניגודיות רגילה וגם הפוכה
function zxDecodeCanvas(c){
  try{ const res=zxReader().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))); return res&&res.getText(); }catch(_){ return null; }
}
async function openScanner(){
  SCAN.busy=false;
  openSheet(`<h3>סריקת ברקוד</h3>
    <div class="scanwrap"><video id="scanv" playsinline muted autoplay></video><div class="frame"></div></div>
    <div class="small muted" id="scanmsg" style="text-align:center;margin:8px 0">כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ</div>
    <div class="row" style="flex-wrap:nowrap"><input id="scan-code" type="text" inputmode="numeric" dir="ltr" placeholder="או הקלד את המספר" style="flex:1;text-align:center">
      <button class="btn primary" data-act="scan-go">חפש</button></div>
    <button class="btn big" style="margin-top:10px" data-act="scan-close">סגור</button>`);
  const msg=t=>{const m=$('#scanmsg'); if(m)m.textContent=t;};
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#scanv'); if(!v){stopScan();return;}
    v.setAttribute('playsinline',''); v.muted=true; v.srcObject=SCAN.stream; await v.play().catch(()=>{});
    try{ const tr=SCAN.stream.getVideoTracks()[0], cap=tr.getCapabilities?.(); if(cap?.focusMode?.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(_){}
    let native=null;
    if('BarcodeDetector' in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('ean_13'))native=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>f.includes(x))}); }catch(_){} }
    if(!native){ msg('טוען סורק…'); try{ await loadZXing(); }catch(_){ msg('הסורק לא נטען (אין רשת?). אפשר להקליד את המספר שמתחת לברקוד.'); return; } msg('כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ'); }
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    let tick=0;
    SCAN.timer=setInterval(async()=>{
      if(SCAN.busy||!v.videoWidth)return; tick++;
      if(native){ try{ const r=await native.detect(v); if(r[0]?.rawValue)onBarcode(r[0].rawValue); }catch(_){} return; }
      // חותכים את אזור המסגרת ומקטינים לרוחב סביר — מהיר ומדויק יותר בטלפון
      const vw=v.videoWidth, vh=v.videoHeight, cw=Math.round(vw*(tick%2?0.8:0.6)), ch=Math.round(vh*0.5), sx=(vw-cw)/2, sy=(vh-ch)/2;
      const sc=Math.min(1,1000/cw); c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
      ctx.drawImage(v,sx,sy,cw,ch,0,0,c.width,c.height);
      const t=zxDecodeCanvas(c); if(t)onBarcode(t);
      if(tick===40)msg('לא מזהה? נסה עם יותר אור, או הקלד את המספר שמתחת לברקוד');
    },180);
  }catch(e){ msg('אין גישה למצלמה. אפשר להקליד את המספר שמתחת לברקוד, או לאשר מצלמה בהגדרות.'); }
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(code.length<6||SCAN.busy)return;

    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/food-barcode?code=${code}`,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});
    if(r.status===404){ openLabelPrompt(code); return; }
    const j=await r.json(); if(!j.product)throw new Error('x');
    openProduct(j.product);
  }catch(e){ toast('החיפוש נכשל, נסה שוב'); closeSheet(); }
}

function maybeStartTour(){
  if(TOUR.on||S.active||S.mode!=='app'||$('#instgate'))return;

  const tab=S.tab; if(toursSeen()[tab])return;

function startTour(tab){ TOUR.on=true; TOUR.i=0; TOUR.grp=tab||S.tab||'home'; tourShow(); }
function tourSteps(){ return TOUR_STEPS.filter(st=>st.tab===TOUR.grp&&(!st.when||st.when())&&(st.kind!=='notif'||(('Notification' in window)&&Notification.permission==='default'&&(!IS_IOS||IS_STANDALONE)))); }
function tourEnd(){

}
function tourShow(){
  const steps=tourSteps(), st=steps[TOUR.i]; if(!st)return tourEnd();
  closeSheet(); if(st.pre){st.pre(); render();} if(TOUR.i===0)window.scrollTo(0,0);
  let el=$('#tour'); if(!el){el=document.createElement('div'); el.id='tour'; document.body.appendChild(el);}
  const isLast=TOUR.i===steps.length-1;
  el.innerHTML=`<div class="tour-spot" hidden></div><div class="tour-card">
    <div class="tour-dots"${steps.length<2?' hidden':''}>${steps.map((_,i)=>`<i class="${i===TOUR.i?'on':''}"></i>`).join('')}</div>
    ${st.img?`<img class="tour-img" src="${st.img}" alt="">`:''}<h3>${st.title}</h3><p>${st.text}</p>
    <div class="row" style="gap:8px;margin-top:12px">
      ${st.kind==='notif'?`<button class="btn" style="flex:1" data-act="tour-next">אחר כך</button><button class="btn primary" style="flex:1.6" data-act="tour-notif">🔔 הפעל התראות</button>`

          <button class="btn primary" style="flex:1.6" data-act="tour-next">${isLast?'הבנתי 💪':TOUR.i===0?'קדימה':'הבא'}</button>`}

function tourPlace(st,tries=0){
  const el=$('#tour'); if(!el||!TOUR.on||tourSteps()[TOUR.i]!==st)return; const spot=el.querySelector('.tour-spot'), card=el.querySelector('.tour-card');
  const t=st.sel&&[...document.querySelectorAll(st.sel)].find(x=>x.offsetParent!==null);
  if(!t){ spot.hidden=true; el.classList.add('dim'); card.style.top=''; card.style.bottom=''; card.classList.add('mid'); return; }
  el.classList.remove('dim'); card.classList.remove('mid');
  const r=t.getBoundingClientRect(), pad=6;
  const fixed=!!t.closest('nav.tabs,header.top');
  if(!fixed&&tries<3&&(r.top<(scrollY>0?70:0)||r.bottom>innerHeight-90)){ t.scrollIntoView({block:'center'}); return setTimeout(()=>tourPlace(st,tries+1),250); }
  Object.assign(spot.style,{top:(r.top-pad)+'px',left:(r.left-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'}); spot.hidden=false;
  const below=r.top<innerHeight/2;
  card.style.top=below?(r.bottom+16)+'px':''; card.style.bottom=below?'':(innerHeight-r.top+16)+'px';

function tourAct(act,b){

    case 'lang-open': openSheet(`<h3>🌐 שפה</h3><div class="langlist" data-notr>${Object.entries(LANG_NAMES).map(([k,v])=>`<button data-act="lang-set" data-l="${k}" lang="${k}" class="${k===LANG?'on':''}"><span>${v}</span>${k===LANG?'<span>✓</span>':''}</button>`).join('')}</div>`); return true;

const PB_SPLIT=(days,level)=>days<=2?['fullA','fullB']:days===3?(level==='beg'?['fullA','fullB','fullC']:['push','pull','legs']):days===4?['upA','loA','upB','loB']:days===5?['push','pull','legs','upA','loB']:['push','pull','legs','push2','pull2','legs2'];

function pbBuild(){
  const A=PB.a, banned=new Set(A.limits.flatMap(l=>PB_BAN[l]||[]));
  const prog=A.goal==='strength'?'כוח':A.goal==='cut'?'חיטוב':A.goal==='fit'?'כושר':'מסה';
  const sessions=PB_SPLIT(A.days,A.level).map((key,si)=>{
    const [title,slots0]=PB_SESS[key]; const slots=[...slots0]; const used=new Set();
    // דגש: תרגיל בידוד נוסף לשריר הנבחר, אם מתאים לאימון
    for(const f of A.focus)for(const sl of PB_FOCUS[f]||[]){ const base=sl; const fits=slots.some(x=>x.split(':')[0]===base)||(['fly','incline'].includes(base)&&/push|up|full/.test(key))||(['bi','tri'].includes(base)&&/pull|push|up|full/.test(key))||(['glute','lpress','lext','lunge'].includes(base)&&/legs|lo|full/.test(key))||(['lat','rear','row'].includes(base)&&/push|pull|up|full/.test(key))||base==='core';
      if(fits){ slots.push(base+':f'); break; } }
    if(A.sex==='f'&&/legs|lo|full/.test(key)&&!slots.some(x=>x.split(':')[0]==='glute'))slots.splice(Math.min(2,slots.length),0,'glute');
    if(A.goal==='cut')slots.push('cardio');
    const ex=[]; let compIdx=0;
    for(const sl of slots){
      const [k,vi]=sl.split(':'), def=PB_SLOTS[k]; if(!def)continue;
      let pool=(def[A.equip]||[]).filter(n=>!banned.has(n)&&!used.has(n));
      if(!pool.length&&PB_ALT[k])pool=PB_ALT[k].filter(n=>!banned.has(n)&&!used.has(n)&&(A.equip==='gym'||!['לחיצת רגליים','לחיצה במכונת חזה','חתירה בכבל','כפיפת ברכיים'].includes(n)));
      if(!pool.length)continue;
      const idx=vi==='f'?pool.length-1:(+vi||0)+(key.endsWith('2')?1:0);
      const n=pool[idx%pool.length]; used.add(n);
      if(def.cardio){ ex.push({n,m:'אירובי',t:'c',min:A.goal==='cut'?20:10}); continue; }
      const comp=!!def.c&&vi!=='f'; const first=comp&&compIdx===0; if(comp)compIdx++;
      let sets,reps,rest;
      if(A.goal==='strength'){ if(first){sets=5;reps='3–5';rest=180;} else if(comp){sets=4;reps='5–8';rest=150;} else {sets=3;reps='8–12';rest=90;} }
      else if(A.goal==='cut'){ if(comp){sets=3;reps='8–12';rest=90;} else {sets=3;reps='12–15';rest=50;} }
      else if(A.goal==='fit'){ if(comp){sets=3;reps='8–12';rest=90;} else {sets=2;reps='12–15';rest=60;} }
      else { if(comp){sets=first?4:3;reps=first?'6–10':'8–12';rest=first?150:120;} else {sets=3;reps='10–15';rest=75;} }
      if(A.level==='beg')sets=Math.max(2,sets-1);
      // נשים מתאוששות מהר יותר בין סטים: מנוחה קצרה יותר ומעט יותר חזרות בבידוד
      if(A.sex==='f'){ rest=Math.max(45,rest-(comp?30:15)); if(!comp&&A.goal!=='strength')reps='12–15'; }
      if(A.level==='adv'&&compIdx<=2&&comp)sets+=1;
      const g=pbMuscle(n);
      if(A.focus.some(f=>({chest:'חזה',back:'גב',legs:'רגליים',glutes:'רגליים',shoulders:'כתפיים',arms:g==='יד קדמית'?'יד קדמית':'יד אחורית',core:'בטן וליבה'}[f]===g)))sets+=vi==='f'?0:1;
      if(['פלאנק'].includes(n))reps='30–60 שנ׳';
      ex.push({n,m:g,t:'s',s:sets,reps,rest});
    }
    // אם מגבלות/ציוד השאירו מעט תרגילים — משלימים מתרגילים בטוחים שמתאימים לציוד
    const FILL={gym:['חתירה בכבל','לחיצה במכונת חזה','הרחקות צד','פייס פול','כפיפת ברכיים','היפ תראסט','פלאנק','דד באג','הרמות עקבים'],home:['חתירה במשקולת','לחיצת חזה במשקולות','הרחקות צד','הרחקות אחוריות','היפ תראסט','פלאנק','דד באג','הרמות עקבים','פטישים'],bw:['שכיבות סמיכה','חתירה הפוכה (משקל גוף)','גשר ישבן','פלאנק','דד באג','הרמות רגליים בשכיבה','הרמות עקבים','סופרמן']}[A.equip];
    for(const n of FILL){ if(ex.filter(e=>e.t==='s').length>=4)break; if(banned.has(n)||used.has(n))continue; used.add(n);
      ex.splice(ex.findIndex(e=>e.t==='c')<0?ex.length:ex.findIndex(e=>e.t==='c'),0,{n,m:pbMuscle(n),t:'s',s:A.level==='beg'?2:3,reps:n==='פלאנק'?'30–60 שנ׳':'10–15',rest:60}); }
    // התאמה לזמן: 45 שניות עבודה לסט + מנוחה + 8 דקות חימום
    const mins=e=>e.reduce((a,x)=>a+(x.t==='c'?x.min:x.s*(45+x.rest)/60),8);
    while(ex.length>4&&mins(ex)>A.time+3){ const i=ex.map(x=>x.t).lastIndexOf('s'); const cardio=ex.find(x=>x.t==='c'); if(cardio&&cardio.min>10){cardio.min-=5;continue;} ex.splice(i,1); }
    // עדיין ארוך? מורידים סטים (לא פחות מ-2) ומקצרים מעט את המנוחה בתרגילי הבידוד
    for(let g=0;g<40&&mins(ex)>A.time+3;g++){ const cand=ex.filter(x=>x.t==='s'&&x.s>2).sort((p,q)=>q.s-p.s)[0];
      if(cand)cand.s--; else { const iso=ex.find(x=>x.t==='s'&&x.rest>60); if(iso)iso.rest-=15; else { const c=ex.find(x=>x.t==='c'); if(c&&c.min>5)c.min-=5; else if(ex.length>3)ex.pop(); else break; } } }
    const letter='ABCDEF'[si];
    return {name:`${letter} — ${title.replace(/ ?[AB]$/,'')}`,ex,min:Math.round(mins(ex))};
  });
  PB.plan={prog,split:PB_SPLIT_NAME(A.days,A.level),sessions};
}

      if(Q.multi){ const arr=PB.a[Q.k]; const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); if(v==='glutes')PB._gTouched=true; pbSheet(); }

function weekKeyOf(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return +d; }
function badgeStats(){
  const W=S.workouts; const weeks=[...new Set(W.map(w=>weekKeyOf(w.start)))].sort((a,b)=>a-b);
  let best=0,cur=0,prev=null; for(const t of weeks){ cur=prev!=null&&Math.round((t-prev)/(7*864e5))===1?cur+1:1; best=Math.max(best,cur); prev=t; }
  const months={}; for(const w of W){ const d=new Date(w.start); const k=d.getFullYear()*12+d.getMonth(); months[k]=(months[k]||0)+1; }
  return { n:W.length, streak:best, prs:Object.values(histPRs(W)).reduce((a,b)=>a+b,0), vol:W.reduce((a,w)=>a+workoutVol(w),0),
    month:Math.max(0,...Object.values(months)), early:W.some(w=>new Date(w.start).getHours()<7)?1:0, night:W.some(w=>new Date(w.start).getHours()>=22)?1:0 };
}

function monthKeyOf(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }
function monthStats(y,m){
  const s=+new Date(y,m,1), e=+new Date(y,m+1,1);
  const W=S.workouts.filter(w=>w.start>=s&&w.start<e).sort((a,b)=>a.start-b.start);
  const before={}; for(const w of S.workouts)if(w.start<s)for(const ex of w.ex||[])if(ex.t==='s'){ const t=Math.max(0,...(ex.sets||[]).filter(z=>+z.r>0).map(z=>+z.w||0)); if(t>(before[ex.n]||0))before[ex.n]=t; }
  const setsBy={}, bestIn={}; let vol=0, sets=0, ms=0;
  for(const w of W){ vol+=workoutVol(w); sets+=workoutSets(w); ms+=Math.max(0,(w.end||w.start)-w.start);
    for(const ex of w.ex||[])if(ex.t==='s'){ const ss=(ex.sets||[]).filter(z=>+z.r>0); setsBy[ex.n]=(setsBy[ex.n]||0)+ss.length; const t=Math.max(0,...ss.map(z=>+z.w||0)); if(t>(bestIn[ex.n]||0))bestIn[ex.n]=t; } }
  const topEx=Object.entries(setsBy).sort((a,b)=>b[1]-a[1])[0]||null;
  let pr=null; for(const [n,t] of Object.entries(bestIn)){ const b=before[n]; if(b&&t>b&&(!pr||t-b>pr.to-pr.from))pr={n,from:b,to:t}; }
  const wk={}; for(const w of W){ const k=weekKeyOf(w.start); wk[k]=(wk[k]||0)+1; }
  const days=new Set(W.map(w=>ymd(new Date(w.start)))).size;
  const mealDays=[...new Set(S.meals.filter(x=>{const t=+new Date(x.d+'T12:00:00');return t>=s&&t<e;}).map(x=>x.d))];
  const prot=mealDays.length?Math.round(mealDays.reduce((a,d)=>a+dayTotals(d).protein,0)/mealDays.length):0;
  return {y,m,n:W.length,vol,sets,hours:Math.round(ms/36e5*10)/10,topEx,pr,bestWeek:Math.max(0,...Object.values(wk)),days,mealDays:mealDays.length,prot,
    name:new Date(y,m,15).toLocaleDateString(LOC,{month:'long'})};
}

/* הדגמות בתשובות של קובי: כשהשאלה היא "איך עושים X" — מזהים את התרגיל (גם בשם המתורגם) ומצרפים כרטיס הדגמה */
let _coNames=null;
function coachDemos(q,reply,prevReply){
  q=String(q||''); if(!q||!/(איך|כיצד|טכניק|לבצע|מבצעים|עושים|ביצוע|תנוחה|הדגמ|דוגמ|תראה|להראות|הראה|סרטון|how|technique|form|perform|demo|show|example|video|كيف|طريقة|أداء|تقنية|أرني|مثال|فيديو)/i.test(q))return [];
  const found=coachFind(q); if(found.length)return found.slice(0,3);
  // "תראה לי דוגמאות לתרגילים האלו" — התרגילים מוזכרים בתשובה (הנוכחית או הקודמת)
  const r1=coachFind(reply); if(r1.length)return r1.slice(0,3);
  return coachFind(prevReply).slice(0,3);
}
/* תגית ההדגמות שקובי מוסיף בסוף תשובה: [[demo: שם | שם]] — שמות מדויקים מהמאגר */
let _libSet=null;
function coachParse(body){
  body=String(body||''); if(!_libSet)_libSet=new Set(Object.values(LIB).flat());
  let demos=[]; const re=/\[\[\s*demo\s*:([^\]]*)\]\]/gi; let m;
  while((m=re.exec(body)))demos.push(...m[1].split('|').map(x=>x.trim()).filter(x=>_libSet.has(x)));
  return {text:body.replace(re,'').replace(/\n{3,}/g,'\n\n').trim(), demos:[...new Set(demos)].slice(0,3)};
}
function coachFind(q){
  q=String(q||''); if(!q)return [];
  const nz=x=>String(x).toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/(^|\s)ال/g,'$1').replace(/[-–]/g,' ').replace(/\s+/g,' ');
  if(!_coNames)_coNames=[...new Set(Object.values(LIB).flat())].filter(n=>EXDB[n]||INFO[n]).map(n=>[n,nz(n),I18?nz(tt(n)):'']);
  const t=nz(q);
  const B=/[\s.,:;!?()"'\-–״׳/]/, P=/[והבלמשכ]/;
  const has=(w)=>{ if(!w)return false; let i=t.indexOf(w); while(i>=0){ const pre=i===0||B.test(t[i-1])||(P.test(t[i-1])&&(i===1||B.test(t[i-2])||(P.test(t[i-2])&&(i===2||B.test(t[i-3]))))), post=i+w.length>=t.length||B.test(t[i+w.length]); if(pre&&post)return true; i=t.indexOf(w,i+1);} return false; };
  let hits=_coNames.filter(([n,h,x])=>has(h)||(x&&x.length>2&&has(x)));
  hits=hits.filter(a=>!hits.some(b=>b!==a&&((b[1].includes(a[1])&&b[1].length>a[1].length)||(a[2]&&b[2].includes(a[2])&&b[2].length>a[2].length))));
  const pos=x=>{ const i=t.indexOf(x[1]); return i>=0?i:(x[2]?t.indexOf(x[2]):1e9); };
  return hits.sort((a,b)=>pos(a)-pos(b)).map(x=>x[0]);
}

}
function startClock(){ // live workout stopwatch — updates the clock element only, never re-renders

async function doSaveWorkout(){

    return {n:e.n,m:e.m,t:'s',sets:(e.sets||[]).map(s=>({w:+s.w||0,r:+s.r||0})).filter(s=>s.r>0)};

    case 'hist-open': openWorkoutSheet(b.dataset.id); break;
    case 'hist-tpl': HIST.tpl=b.dataset.t; render(); break;
    case 'hist-month': { const k=b.dataset.k; HIST.open[k]=b.getAttribute('aria-expanded')!=='true'; render(); break; }
    case 'hist-del': if(!b.dataset.sure){b.dataset.sure='1';b.textContent='בטוח? מחק';break;} deleteWorkout(b.dataset.id); closeSheet(); toast('האימון נמחק'); break;
    case 'bw-save': saveBodyweight(); break;
    case 'bw-quick': openWeighIn(); break;
    case 'goal-kg': { const g=+S.settings.goalKg||0; openNumpad({title:g?`משקל יעד · עכשיו ${g} ק״ג`:'משקל יעד',unit:'ק״ג',mode:'num',value:g||0,
      apply(v){ S.settings.goalKg=v?Math.round(v*10)/10:null; persistSettings(); toast(v?'משקל היעד נשמר 🎯':'משקל היעד הוסר'); render(); },
      extra:g?{label:'הסר יעד',fn(){ S.settings.goalKg=null; persistSettings(); render(); }}:null}); break; }
    case 'cal-day': openPhotoSet(b.dataset.d,true); break;
    case 'photo-pick': PH.sel=PH.sel===b.dataset.a?null:b.dataset.a; openPhotoSet(PH.day.d); break;
    case 'photo-view': openPhotoView(b.dataset.d,b.dataset.a); break;
    case 'day-weigh': { const d=b.dataset.d; openWeighIn(d,()=>setTimeout(()=>openPhotoSet(d,true),60)); break; }
    case 'cal-nav': { const n=new Date(); const [yy,mm]=(S.calMonth||`${n.getFullYear()}-${n.getMonth()+1}`).split('-').map(Number);
      const t=new Date(yy,mm-1+(+b.dataset.dir),1);
      if(t>new Date(n.getFullYear(),n.getMonth(),1))break;
      S.calMonth=`${t.getFullYear()}-${t.getMonth()+1}`; render(); break; }
    case 'photo-open': openPhotoSet(b.dataset.d); break;
    case 'photo-day-change': S.settings.photoDay=null; render(); break;
    case 'photo-del': deletePhoto(b.dataset.d,b.dataset.a); break;
    case 'photo-cmp': openPhotoCompare(b.dataset.a); break;
    case 'photo-more': PH.show+=12; render(); break;
    case 'photo-day': { const d=+b.dataset.d; S.settings.photoDay=(S.settings.photoDay!=null&&+S.settings.photoDay===d)?null:d;
      persistSettings(); render();
      if(S.settings.photoDay!=null)toast(`יום צילום: ${DAY_NAMES[d]} — נזכיר לך בבוקר אם התזכורות פעילות`); break; }
    case 'share-w': { const w=S.workouts.find(x=>x.id===b.dataset.id); if(w)shareText(workoutShareText(w)); break; }
    case 'share-active': { if(S.active)shareText(workoutShareText({...clone(S.active),end:Date.now()})); break; }
    case 'auth-go': doAuth(); break;
    case 'auth-google': b.disabled=true;
      sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/',queryParams:{prompt:'select_account'}}}).then(({error})=>{ if(error){b.disabled=false;toast('ההתחברות עם Google נכשלה');} }); break;
    case 'auth-forgot': { const em=($('#au-email')?.value||'').trim(), err=$('#autherr');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ if(err)err.textContent='הקלד את האימייל שלך למעלה, ואז לחץ שוב על "שכחתי סיסמה"'; $('#au-email')?.focus(); break; }
      b.disabled=true; sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/'}).then(({error})=>{ b.disabled=false;
        if(error){ if(err)err.textContent='השליחה נכשלה, נסה שוב בעוד דקה'; return; }
        if(err){err.style.color='var(--accent)'; err.textContent='שלחנו אליך מייל עם קישור לבחירת סיסמה חדשה ✉️';} }); break; }
    case 'pw-save': { const a=$('#pw1')?.value||'', c=$('#pw2')?.value||'';
      if(a.length<6){toast('לפחות 6 תווים');break;} if(a!==c){toast('הסיסמאות לא זהות');break;}
      b.disabled=true; sb.auth.updateUser({password:a}).then(({error})=>{ b.disabled=false; if(error){toast('העדכון נכשל: '+error.message);return;} closeSheet(); toast('הסיסמה עודכנה ✓'); }); break; }
    case 'otp-open': OTP.step='email'; OTP.err=''; render(); setTimeout(()=>$('#otp-email')?.focus(),60); break;
    case 'otp-send': otpSend(); break;
    case 'otp-verify': otpVerify(); break;
    case 'otp-change': OTP.step='email'; OTP.err=''; render(); break;
    case 'otp-back': OTP.step=''; OTP.err=''; S.authEmailOpen=false; render(); break;
    case 'auth-g': { const v=b.dataset.v; try{ localStorage.setItem('nr-g',v); localStorage.removeItem('nr-acc'); sessionStorage.setItem('nr-auth-open',JSON.stringify({m:S.authMode||'login',e:''})); }catch(_){}
      if(v==='f'){ location.reload(); return; } window.NR_G=v; render(); setTimeout(()=>$('#otp-email')?.focus(),60); break; }
    case 'auth-g-reset': { const wasF=window.NR_G==='f'; try{ localStorage.removeItem('nr-g'); localStorage.removeItem('nr-acc'); sessionStorage.setItem('nr-auth-open',JSON.stringify({m:S.authMode||'login',e:''})); }catch(_){}
      if(wasF){ location.reload(); return; } window.NR_G=null; render(); break; }
    case 'auth-email-open': S.authEmailOpen=true; render(); setTimeout(()=>($('#au-name')||$('#au-email'))?.focus(),50); break;
    case 'auth-toggle': S.authEmail=$('#au-email')?.value||S.authEmail; S.authMode=S.authMode==='signup'?'login':'signup'; render(); break;
    case 'logout':
      if(b.dataset.sure){sb.auth.signOut();}
      else{b.dataset.sure='1';b.textContent='בטוח? יציאה';setTimeout(()=>{delete b.dataset.sure;if(b.isConnected)b.textContent='יציאה';},2500);}
      break;
  }
}
document.addEventListener('input',ev=>{
  const i=ev.target.closest('[data-bind]'); if(!i)return;
  const k=i.dataset.bind;
  if(k==='w'||k==='r'){ const s=S.active?.ex[+i.dataset.ei]?.sets[+i.dataset.si]; if(s){s[k]=i.value; persistActive();} }
  else if(k==='cmin'||k==='ckm'||k==='cinc'){ const e=S.active?.ex[+i.dataset.ei]; if(e?.c){e.c[{cmin:'min',ckm:'km',cinc:'inc'}[k]]=i.value; persistActive();} }
  else if(k==='libq'){ S.lib.q=i.value; renderLibrary(); }
  else if(k==='foodq'){ i.style.height='auto'; i.style.height=Math.min(132,i.scrollHeight+2)+'px'; i.closest('.fsearch')?.classList.toggle('has',i.value.trim().length>=2); clearTimeout(foodSearch._t); foodSearch._t=setTimeout(()=>foodSearch(i.value),220); }
  else if(k==='tpln'){ if(_tplDraft)_tplDraft.name=i.value; }
  else if(k==='pqty'&&_portion){ const v=+String(i.value).replace(',','.'); if(v>0){_portion.qty=v; renderPortion();} }
  else if(k==='mif'){ if(!_mealEdit)return;
    if(i.dataset.mf==='mealname'){_mealEdit.name=i.value;return;}
    const it=_mealEdit.items[+i.dataset.mi]; if(!it)return;
    const f=i.dataset.mf;
    it[f]=f==='name'?i.value:(+String(i.value).replace(',','.')||0);
  }
  else if(k==='tplf'){ const e=_tplDraft?.ex[+i.dataset.i]; if(e){const f=i.dataset.f; e[f]=f==='reps'?i.value:(+i.value||0);} }
});
document.addEventListener('toggle',ev=>{ const d=ev.target; if(d?.dataset?.det)S.settings[d.dataset.det]=d.open; },true);
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&ev.target.dataset.cmp&&PH.cmp){ const c=PH.cmp; c[ev.target.dataset.cmp]=ev.target.value; openPhotoCompare(c.angle,c.a,c.b); return; }
  if(ev.target.dataset&&ev.target.dataset.photoAngle&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0], a=ev.target.dataset.photoAngle, d=ev.target.dataset.photoDate; ev.target.value='';
    uploadPhoto(f,d,a); return;
  }
  if(ev.target.id==='label-photo'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value=''; readLabel(f); return;
  }
  if(ev.target.id==='food-photo'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value='';
    toast('מעבד תמונה…');
    const hint=($('#food-text')?.value||'').trim().slice(0,200);
    shrinkImage(f).then(b64=>foodAI(hint?{image:b64,media:'image/jpeg',hint}:{image:b64,media:'image/jpeg'})).catch(()=>toast('קריאת התמונה נכשלה'));
    return;
  }
  const i=ev.target.closest('[data-bind]'); if(!i)return;
  if(i.dataset.bind==='progex'){S.progressEx=i.value; render();}
  else if(i.dataset.bind==='notif'){
    S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},S.settings.notif);
    const k=i.dataset.k;
    S.settings.notif[k]=i.checked;
    if(k==='remind'){
      if(i.checked){
        subscribePush().then(r=>{
          if(!r.ok){ S.settings.notif.remind=false; if(i.isConnected)i.checked=false;
            toast(r.why==='perm'?'צריך לאשר התראות בדפדפן':'המכשיר לא תומך — באייפון: הוסף קודם למסך הבית ופתח משם');
          }else toast('תזכורות הופעלו — נתראה בבוקר אימון 🗓️');
          persistSettings();
        });
        return;
      }else unsubscribePush();
    }
    else if(i.checked&&(k==='rest'||k==='pr'))ensureNotifPerm();
    persistSettings();
  }
});
document.getElementById('tabs').addEventListener('click',ev=>{

/* ---------- boot ---------- */
async function enterApp(user){
  S.user=user; S.mode='boot'; render();
  // בקרת גישה: משתמש חדש ממתין לאישור האדמין (נאכף גם בשרת ב-RLS). שגיאת רשת → ממשיכים (אופליין)
  if(PAID_RETURN||enterApp._claim){ enterApp._claim=false; try{ const c=await sb.rpc('claim_payment'); if(c.data?.ok&&!c.data.duplicate)toast('התשלום אומת, הגישה נפתחה 🎉'); }catch(_){} }
  try{ const pl=await sb.rpc('my_plan'); if(!pl.error&&pl.data){ S.plan=pl.data; const st=pl.data.status;
    if(st==='expired'){
      if(!PAID_RETURN&&!enterApp._grace){ enterApp._grace=true; try{ const g=await sb.rpc('grace_finish'); if(g.data?.ok){ toast('הניסיון הסתיים, אבל אפשר לסיים את האימון שהתחלת 💪'); return enterApp(user); } }catch(_){} }
      S.mode='paywall'; render();
      if(!S.recap)sb.rpc('trial_recap').then(({data})=>{ if(data){ S.recap=data; if(S.mode==='paywall')render(); } },()=>{});
      if(PAID_RETURN&&!(enterApp._poll>=8)){ enterApp._poll=(enterApp._poll||0)+1; toast('מאשר את התשלום…'); setTimeout(()=>enterApp(user),4000); }
      return; }
    if(st!=='approved'){ S.access=st; S.mode='pending'; render(); return; } } }catch(_){}
  try{
    const [tpl,wo,st,bw,ml]=await Promise.all([
      sb.from('templates').select('id,name,ord,ex').order('ord'),
      sb.from('workouts').select('id,name,start_ts,end_ts,ex'),
      sb.from('settings').select('rest,active,prefs').maybeSingle(),
      sb.from('bodyweight').select('d,kg').order('d'),
      sb.from('meals').select('id,d,ts,name,kcal,protein,carbs,fat,items').gte('d',ymd(new Date(Date.now()-60*864e5))),
    ]);
    if(tpl.error||wo.error)throw tpl.error||wo.error;
    S.templates=(tpl.data||[]).map(r=>({id:r.id,name:r.name,order:r.ord||0,ex:r.ex||[]}));
    S.workouts=(wo.data||[]).map(r=>({id:r.id,name:r.name,start:+r.start_ts,end:+r.end_ts,ex:r.ex||[]}));
    S.weights=(bw.data||[]).map(r=>({d:r.d,kg:+r.kg}));
    S.meals=ml.data||[];
    if(st.data){ S.settings.rest=st.data.rest??90; S.active=st.data.active||null;
      S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},st.data.prefs?.notif);
      S.settings.schedule=st.data.prefs?.schedule||{};
      S.settings.kcalT=st.data.prefs?.kcalT||null; S.settings.protT=st.data.prefs?.protT||null; S.settings.goalKg=st.data.prefs?.goalKg||null; S.settings.menu=st.data.prefs?.menu||null; S.settings.photoDay=st.data.prefs?.photoDay??null; S.settings.tourDone=st.data.prefs?.tourDone||null; if(st.data.prefs?.toursSeen)S.settings.toursSeen=Object.assign({},st.data.prefs.toursSeen,S.settings.toursSeen||{});
      S.settings.badgesSeen=st.data.prefs?.badgesSeen||null; S.settings.body=st.data.prefs?.body||null; S.settings.wrapSeen=st.data.prefs?.wrapSeen||null;
      S.settings.g=st.data.prefs?.g||null; S.settings.accent=st.data.prefs?.accent||null;
      try{ const src=JSON.parse(localStorage.getItem('nr-src')||'null'); if(src&&!localStorage.getItem('nr-src-logged')){ localStorage.setItem('nr-src-logged','1'); logEv('src',src); } }catch(_){}
      if(!S.settings.g&&window.NR_G){ S.settings.g=window.NR_G; setTimeout(()=>persistSettings(),800); }
      if(S.settings.g&&applyLook(S.settings.g,S.settings.accent))return;
      // שפה שנבחרה במכשיר אחר — מסנכרנים; משתמש ותיק בלי שפה שמורה — שומרים את הנוכחית
      const pl=st.data.prefs?.lang; let lsl=null; try{lsl=localStorage.getItem('nr_lang');}catch(e){}
      if(pl&&pl!==LANG&&!lsl){ try{localStorage.setItem('nr_lang',pl);}catch(e){} location.reload(); return; }
      if(pl!==LANG)setTimeout(()=>flushActive(),1500); }
    if(!S.templates.length){ // משתמש חדש — טעינת תוכניות ברירת המחדל
      S.templates=clone(DEFAULT_TEMPLATES);
      sb.from('templates').upsert(DEFAULT_TEMPLATES.map(t=>({id:t.id,user_id:user.id,name:t.name,ord:t.order,ex:t.ex}))).then(()=>{});
      toast('טענו לך 3 תוכניות מוכנות — אפשר לערוך בלשונית ״תוכניות״');
    }
    saveSnapshot();
  }catch(e){ // אופליין — ממשיכים מתמונת המצב המקומית
    const snap=loadSnapshot();
    if(snap){ S.templates=snap.templates||[]; S.workouts=snap.workouts||[]; S.settings=Object.assign({rest:90},snap.settings); S.weights=snap.weights||[]; S.meals=snap.meals||[]; toast('מצב אופליין — עובדים מהנתונים השמורים'); }
    else toast('טעינת הנתונים נכשלה — בדוק חיבור');
  }
  const localA=loadLocalActive();
  if(localA&&(!S.active||((localA.start===S.active.start)&&JSON.stringify(localA).length>=JSON.stringify(S.active).length)))S.active=localA;
  S.mode='app'; render(); updateSyncBadge(); trySync(); loadPhotos(); restoreRest(); setTimeout(syncPush,1500);
  sb.rpc('is_admin').then(({data})=>{S.isAdmin=data===true;}).catch(()=>{});
  socLoad(); socSubscribe(); socPendingJoin();
  setTimeout(()=>{ if(!checkInstallGate()){ if(!S.settings.g)openGenderSheet(true); else maybeStartTour(); } },700);
  socialProfileFix();
  if(PAID_RETURN&&!enterApp._paid){ enterApp._paid=true; toast('תודה! התשלום התקבל 🎉'); }
  if(S.active){startClock();keepAwake(true);}
}
function hideSplash(){
  const sp=$('#splash'); if(!sp)return;
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); },450);
}
(async function boot(){
  render();
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await enterApp(session.user);
    else{ S.mode='auth'; render(); }
  }catch(e){ S.mode='auth'; render(); }
  hideSplash();
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='PASSWORD_RECOVERY'){ setTimeout(openNewPassword,600); }
    if(sess&&!S.user)enterApp(sess.user);
    if(ev==='SIGNED_OUT'){try{closeSheet();}catch(_){} try{CO.open=false;}catch(_){} document.getElementById('wrap')?.setAttribute('hidden',''); try{S.showAuth=false;window.scrollTo(0,0);}catch(_){} PH.sets=[];PH.urls={};PH.loaded=false;S.user=null;S.workouts=[];S.templates=[];S.active=null;stopRest();S.mode='auth';render();}
  });
})();
</script>
