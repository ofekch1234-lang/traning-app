/* Layout: app-shell — sticky header, scrolling content, fixed bottom tab bar + rest-timer bar; everything derives from the tokens below. */
:root{
  --bg:#F3F5F2;
  --surface:#FFFFFF;
  --surface2:#EAEEE9;
  --ink:#1A201C;
  --muted:#5D675F;
  --line:#DFE4DE;
  --accent:#16A34A;
  --accent-soft:#DCFCE7;
  --accent-ink:#FFFFFF;
  --gold:#B45309;
  --gold-soft:#FEF3C7;
  --danger:#B3362B;
  --shadow:none;
  --overlay-shadow:0 -8px 30px rgba(10,20,14,.18);
  --disp:'Rubik',system-ui,-apple-system,sans-serif;--brand:'Karantina',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,sans-serif;
  --dir:rtl; --start:right; --end:left;
}
:root[dir="ltr"]{--dir:ltr;--start:left;--end:right}
:root[lang="ar"]{--body:'Rubik','IBM Plex Sans Arabic',system-ui,sans-serif;--disp:'Rubik','IBM Plex Sans Arabic',system-ui,sans-serif}
:root[dir="ltr"] .flipx{transform:none!important}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131619; --surface:#1B2024; --surface2:#242A2E; --ink:#EDF1EE; --muted:#9AA5A0;
    --line:#2B3237; --accent:#22C55E; --accent-soft:#17351F; --accent-ink:#06130A;
    --gold:#F59E0B; --gold-soft:#3A2A0E66; --danger:#E0695C;
    --shadow:none;
    --overlay-shadow:0 -8px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131619; --surface:#1B2024; --surface2:#242A2E; --ink:#EDF1EE; --muted:#9AA5A0;
  --line:#2B3237; --accent:#22C55E; --accent-soft:#17351F; --accent-ink:#06130A;
  --gold:#F59E0B; --gold-soft:#3A2A0E66; --danger:#E0695C;
  --shadow:none;
    --overlay-shadow:0 -8px 30px rgba(0,0,0,.5);

}

html{height:100%}
body{

.ld-badges{display:flex;gap:8px;flex-wrap:wrap}.ld-badges span{width:44px;height:44px;border-radius:50%;background:var(--accent-soft,#e8f6ed);display:grid;place-items:center;font-size:21px;border:1px solid var(--line)}

.ld-photo span{font-size:34px}.ld-photo b{font-size:14px}

.ch-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ch-modes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:center;cursor:pointer}
.ch-modes button.on{border-color:var(--accent);background:var(--accent-soft)}
.ch-modes .small{font-size:11px;line-height:1.25}
.emo-pick{display:flex;gap:6px;flex-wrap:wrap}
.emo-pick button{width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:22px;border:2px solid transparent}
.emo-pick button.on{border-color:var(--accent)}
.inv-code{font-family:var(--disp);font-weight:800;font-size:40px;letter-spacing:6px;text-align:center;direction:ltr;line-height:1.12;padding:10px;background:var(--surface2);border-radius:14px}
/* auth screen */
#authwrap{max-width:440px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 0 24px;display:flex;flex-direction:column;gap:12px}
#authwrap .card{padding:20px 18px}
#authwrap input:not([type=checkbox]){height:52px;font-size:17px}
#authwrap .otp-in{height:68px;font-size:34px}
#authwrap .logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px}
#authwrap .logo img{width:72px;height:72px;border-radius:18px;box-shadow:var(--shadow)}
@media (max-height:760px){#authwrap .logo img{width:56px;height:56px;border-radius:14px}#authwrap .logo{gap:6px;margin-bottom:4px}#authwrap .logo .brand{font-size:26px}}
#authwrap .logo .brand{font-size:30px}
.autherr{color:var(--danger);font-size:14px;min-height:20px;text-align:center}
.authnote{color:var(--muted);font-size:13px;text-align:center}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;padding:4px}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:140px;min-height:60vh}
button{font-family:var(--body);font-size:15px;border:none;cursor:pointer;color:var(--ink);background:none;border-radius:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding:14px 0 10px; margin:0;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.brand{font-family:var(--brand);font-size:32px;letter-spacing:.4px;line-height:1}
.brand b{color:var(--accent);font-weight:400}
.date-chip{color:var(--muted);font-size:13px}

/* cards & general */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.hot{border-inline-start:4px solid var(--accent);padding-inline-start:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.sect{font-family:var(--disp);font-weight:800;font-size:18px;margin:22px 0 10px;}
.btn{background:var(--surface2);border:1px solid var(--line);padding:10px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.ghost{border:1px dashed var(--line);color:var(--muted);width:100%;padding:12px}
.btn.danger{color:var(--danger)}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.bdg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.bdg .e{font-size:28px;line-height:1}
.bdg .t{font-size:11px;font-weight:600;line-height:1.2}
.bdg.off .e{filter:grayscale(1);opacity:.35}
.bdg.off .t{color:var(--muted);font-weight:500}
.bdg .pg{font-size:10px;color:var(--muted)}
.bdg.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bdg-big{font-size:84px;text-align:center;line-height:1.1;margin:6px 0}
.bdg-pop{animation:bdgPop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes bdgPop{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.bdg-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 4px;display:flex;direction:var(--dir)}
.bdg-bar i{background:var(--accent);border-radius:99px}
#wrap{position:fixed;inset:0;z-index:80;background:linear-gradient(160deg,#14532d,#16A34A 55%,#0f766e);color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);user-select:none}
#wrap .wbars{display:flex;gap:4px;direction:var(--dir)}
#wrap .wbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
#wrap .wbars i.on{background:#fff}
#wrap .wtop{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
#wrap .wtop button{background:rgba(255,255,255,.15);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px}
#wrap .wbody{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;animation:rise .45s ease both}
#wrap .wbig{font-family:var(--disp);font-weight:800;font-size:79px;line-height:1.12}
#wrap .wmid{font-size:26px;font-weight:700;line-height:1.25}
#wrap .wsub{font-size:17px;opacity:.85;line-height:1.45;max-width:320px}
#wrap .wemo{font-size:64px}
#wrap .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px}
#wrap .wgrid div{background:rgba(255,255,255,.14);border-radius:16px;padding:12px}
#wrap .wgrid b{display:block;font-family:var(--disp);font-weight:800;font-size:29px;line-height:1.12}
#wrap .wbtn{background:#fff;color:#14532d;border:none;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;font-size:17px}
#wrap .whint{font-size:13px;opacity:.7;text-align:center}
.wrap-card{background:linear-gradient(135deg,#14532d,#16A34A);color:#fff;border:none}
.wrap-card .muted,.wrap-card .small{color:rgba(255,255,255,.85)}
#stcam{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#stcam .stc-frame{position:relative;height:min(100dvh - 120px,(100vw)*16/9);aspect-ratio:9/16;max-width:100vw;overflow:hidden;border-radius:14px}
#stcam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stcam #stc-st{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#stcam .stc-bar{display:flex;align-items:center;justify-content:space-around;width:100%;max-width:420px;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
#stcam .stc-bar button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:20px}
#stcam .stc-bar .stc-shot{width:72px;height:72px;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box}
#stcam .stc-tools{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-end:14px;display:flex;flex-direction:column;gap:10px}
#stcam .stc-tools button{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;font-size:20px}
.tour-img{width:76px;height:76px;display:block;margin:2px auto 6px}
.co-demos{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.co-demos button{display:flex;align-items:center;gap:10px;text-align:var(--start);padding:6px 10px 6px 6px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft);color:var(--ink);font:inherit;cursor:pointer}
.co-demos img{width:56px;height:42px;border-radius:9px;object-fit:cover;background:#fff;flex-shrink:0}
.co-demos b{display:block;color:var(--accent);font-size:13.5px}.co-demos small{display:block;font-size:12.5px;color:var(--muted)}
.co-row{display:flex;gap:6px;align-items:flex-end;align-self:flex-start;max-width:88%}
.co-row img{width:28px;height:28px;flex-shrink:0;margin-bottom:16px}
.co-row .cm{max-width:100%}
.co-intro{align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 18px 6px;max-width:320px}
.co-intro img{width:84px;height:84px;margin-bottom:4px}
.co-intro span{font-size:13.5px;color:var(--muted);line-height:1.45}
.co-cheer{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--accent)}
.co-cheer img{width:44px;height:44px}
.coach-card{position:relative;overflow:hidden}
.coach-card .co-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.co-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:block}
.coach-card .co-txt{white-space:pre-wrap;line-height:1.55;font-size:15px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.coach-card .co-acts{display:flex;gap:8px;margin-top:12px}
.coach-card.co-swap{animation:none!important}
.coach-card .co-tog{width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.coach-card.mini{padding-top:12px;padding-bottom:12px}
.coach-card.mini .co-h{margin-bottom:0}.coach-card.mini .co-av{width:38px;height:38px}
.coach-card .co-chev{color:var(--muted);font-size:16px;padding:4px}
.coach-card .co-peek{-webkit-line-clamp:1;font-size:14px;color:var(--muted);margin-top:6px;cursor:pointer;white-space:normal}
.co-skel{height:12px;border-radius:6px;background:var(--surface2);margin:8px 0;animation:coPulse 1.2s ease-in-out infinite}
@keyframes coPulse{50%{opacity:.45}}
.co-sum{align-self:stretch;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;padding:12px 14px;margin:6px 0;white-space:pre-wrap;line-height:1.55}
.co-sum .lbl{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;display:block}
.co-chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.co-chips::-webkit-scrollbar{display:none}
.co-chips button{flex-shrink:0;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.co-typing .bub{display:flex;gap:4px;align-items:center;min-height:36px}
.co-typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:coDot 1s infinite}
.co-typing i:nth-child(2){animation-delay:.15s}.co-typing i:nth-child(3){animation-delay:.3s}
@keyframes coDot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.co-lock{border-top:1px solid var(--line);padding:12px 0 6px;text-align:center}
.langpills{display:flex;gap:6px;justify-content:center;margin-top:12px}
.langpills button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.langpills button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.langlist{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.langlist button{font:inherit;font-size:17px;text-align:var(--start);padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.langlist button.on{border-color:var(--accent);background:var(--accent-soft)}
.demo-btn{display:inline-flex;align-items:center;gap:7px;margin:5px 0 3px;padding:5px 12px 5px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft);color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.demo-btn .pl{width:18px;height:18px;border-radius:50%;background:var(--accent);position:relative;flex-shrink:0}
.demo-btn .pl::after{content:'';position:absolute;top:50%;left:54%;transform:translate(-50%,-50%);border-style:solid;border-width:4.5px 0 4.5px 7px;border-color:transparent transparent transparent #fff}
.demo-btn:active{transform:scale(.97)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.pr{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:700}

/* tab bar */
nav.tabs{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-around;
}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;color:var(--muted);font-size:11.5px;border-radius:0;position:relative}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{content:'';position:absolute;top:-7px;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.fab{color:var(--ink);font-weight:700;overflow:visible}
nav.tabs button.fab .fabc{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:4px solid var(--bg);box-shadow:0 10px 22px -8px rgba(22,163,74,.65);box-sizing:border-box}
nav.tabs button.fab svg{width:27px;height:27px}
nav.tabs button.fab .ic{stroke-width:2.2}
nav.tabs button.fab.on{color:var(--accent)}
nav.tabs button.fab.on::before{display:none}
nav.tabs button.fab:active .fabc{transform:scale(.94)}
/* in a chat (group / Kobi) the workout button lies flat so it never covers the message box */
body.chatting nav.tabs button.fab{color:var(--muted);font-weight:400}
body.chatting nav.tabs button.fab .fabc{width:auto;height:auto;margin-top:0;background:none;color:inherit;border:0;box-shadow:none}
body.chatting nav.tabs button.fab svg{width:23px;height:23px}
body.chatting nav.tabs button.fab .ic{stroke-width:1.9}

nav.tabs .ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* rest timer bar */
#restbar{
  position:fixed;inset-inline:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:29;
  display:flex;justify-content:center;padding:0 16px;
}
#restbar .inner{
  width:100%;max-width:528px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
}
#restbar .t{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.12;min-width:64px}
#restbar .bar{flex:1;height:5px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
#restbar .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
#restbar button{color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);padding:6px 11px;font-size:13px}

/* active workout */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex-name{font-weight:700;font-size:16px}
.prev{font-size:12.5px;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center}
.setgrid .h{font-size:11px;color:var(--muted);text-align:center}
.setidx{text-align:center;color:var(--muted);font-size:13px}
.setgrid input{text-align:center;padding:9px 4px}
.done-btn{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.done-btn svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set-done input{background:var(--accent-soft);border-color:var(--accent)}
.set-done .done-btn{background:var(--accent);border-color:var(--accent)}
.set-done .done-btn svg{stroke:var(--accent-ink)}
.addset{margin-top:8px;width:100%;padding:9px;border:1px dashed var(--line);color:var(--muted);font-size:14px}

/* history */
.h-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.h-stats{display:flex;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.h-detail{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.h-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.h-ex .sets{color:var(--muted);text-align:var(--end);direction:ltr}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{padding:14px 8px;text-align:center}
.tile+.tile{border-inline-start:1px solid var(--line)}
.tile .v{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.12;color:var(--accent)}
.tile .k{font-size:11.5px;color:var(--muted);margin-top:2px}
.chartwrap{position:relative}
#tip{position:absolute;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-115%)}
svg text{font-family:var(--body)}
.prlist{display:flex;flex-direction:column}
.prlist .pr-row{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.prlist .pr-row:last-child{border-bottom:none}

/* modal sheet */
#sheet-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
#sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;
  box-shadow:var(--overlay-shadow);
  background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow-y:auto;
}
#sheet h3{font-family:var(--disp);font-weight:800;font-size:17px;margin-bottom:12px}
.libgroups{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.libgroups .chip{flex-shrink:0}
.liblist{display:flex;flex-direction:column}
#sheet.libmode{display:flex;flex-direction:column;height:82vh;overflow:hidden;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
#sheet.libmode .lib-head{flex-shrink:0}
#sheet.libmode .libgroups{margin-bottom:4px}
#sheet.libmode .liblist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
#sheet.libmode .lib-foot{flex-shrink:0;padding-top:10px}
.liblist button{display:flex;justify-content:space-between;gap:10px;text-align:var(--start);padding:12px 4px;border-bottom:1px solid var(--line);border-radius:0;font-size:15px}
.liblist button:last-child{border-bottom:none}
.liblist .in{color:var(--accent);font-size:13px;font-weight:500}

/* numpad — מקלדת מובנית בסגנון פלטות */
#np-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:58}
#np{position:fixed;inset-inline:0;bottom:0;z-index:59;max-width:560px;margin:0 auto;
  box-shadow:var(--overlay-shadow);
  background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));}
#np .npdisp{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:2px 0 10px}
#np .npval{font-family:var(--disp);font-weight:800;font-size:43px;line-height:1.12;min-width:110px;text-align:center;letter-spacing:1px}
#np .npunit{color:var(--muted);font-size:15px}
#np .nptitle{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:2px}
.plates{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.plate{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
  color:#fff;position:relative;border:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),inset 0 0 0 11px rgba(0,0,0,.14),var(--shadow);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.plate:active{transform:scale(.92)}
.plate::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.plate span{position:absolute;top:18%;font-size:12.5px}
.p20{width:66px;height:66px;background:#1d4ed8}
.p10{width:58px;height:58px;background:#15803d}
.p5{width:50px;height:50px;background:#64748b}
.p25{width:44px;height:44px;background:#111827}
.p125{width:38px;height:38px;background:#9ca3af}
.p125 span{font-size:10.5px;top:14%}
.npstep{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.npstep button{width:58px;height:46px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:700}
.npgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.npgrid button{padding:12px 0;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:17px;font-weight:500}
.npgrid button.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.npdigits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;direction:ltr}
.npgrid,.npstep,.npdisp{direction:ltr}
.npdigits button{padding:14px 0;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:600}
.npdigits button:active{background:var(--accent-soft)}
.npchips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
/* מתלה משקולות נגלל */
.rack{display:flex;align-items:flex-end;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:12px calc(50% - 26px) 6px;scrollbar-width:none;direction:ltr}
.rack::-webkit-scrollbar{display:none}
.dbitem{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:none;border:none;padding:0;transition:transform .15s}
.dbitem .shape{display:flex;align-items:center}
.dbitem .pl{width:13px;height:var(--h,40px);border-radius:5px;background:linear-gradient(145deg,#4b5563,#1f2937);box-shadow:inset 0 1px 1px rgba(255,255,255,.25)}
.dbitem .hd{width:26px;height:9px;background:linear-gradient(#b7bec7,#6b7280);border-radius:4px}
.dbitem b{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dbitem.sel{transform:scale(1.18)}
.dbitem.sel .pl{background:linear-gradient(145deg,var(--accent),#0c4f30)}
.dbitem.sel b{color:var(--accent);font-size:15px}
.rackhint{text-align:center;color:var(--muted);font-size:11.5px;margin-bottom:2px}
/* מגדל פין של מכונה */
.pinstack{display:flex;flex-direction:column;gap:2px;max-width:210px;margin:6px auto;position:relative}
.pinstack::before{content:'';position:absolute;top:-6px;bottom:0;left:50%;width:7px;transform:translateX(-50%);
  background:linear-gradient(#9aa3ad,#6b7280);border-radius:4px;z-index:0}
.splate{position:relative;z-index:1;height:14px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);
  padding:0;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.splate span{font-size:10px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.splate.on{background:linear-gradient(#3b4453,#1b212b);border-color:#141922}
.splate.on span{color:#d7dde5}
.splate.pin::after{content:'';position:absolute;inset-inline-end:-20px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.npact{display:flex;gap:8px;margin-top:10px}
input[data-np]{caret-color:transparent;cursor:pointer}
/* nutrition composer & meal rows */
.acttile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 6px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.acttile svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actmain{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700}
#food-text{padding:13px 12px;font-size:16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-family:var(--body);box-sizing:border-box}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mavatar{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.mkcal{text-align:center;flex-shrink:0;min-width:46px}
.mkcal b{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.12;display:block}
.mkcal span{font-size:10px;color:var(--muted)}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}

/* exercise demo (free-exercise-db frames) */
.demo{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);margin-bottom:12px}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo .fb{opacity:0}
.demo .tag{position:absolute;top:8px;inset-inline-start:8px;background:rgba(10,20,14,.7);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
@media (prefers-reduced-motion:no-preference){ .demo .fb{animation:demoflip 2.4s ease-in-out infinite} }
@keyframes demoflip{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
.libthumb{width:42px;height:32px;border-radius:6px;object-fit:cover;background:#fff;border:1px solid var(--line);flex-shrink:0}
/* food database search */
.fsugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.fs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border-bottom:1px solid var(--line);border-radius:0;text-align:var(--start)}
.fs-name{flex:1;min-width:0;font-size:14.5px}
.fs-val{flex-shrink:0;font-weight:600;font-size:14px}
.fs-val small{font-weight:400;color:var(--muted);font-size:10.5px}
.fs-foot{padding:8px 12px;background:var(--surface2)}
.basket{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.bitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bitem>span:first-child{flex:1;min-width:0}
/* reorder mode */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.rrow .rname{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rarrow{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--ink);flex-shrink:0}
.rarrow:disabled{opacity:.3}
.drag-drag{opacity:.95!important;box-shadow:0 14px 34px rgba(10,20,14,.28);transform:scale(1.02)}
/* drag to reorder */
.drag-h{cursor:grab;touch-action:none;padding:6px 8px;color:var(--muted);font-size:18px;line-height:1;user-select:none;-webkit-user-select:none}
.drag-ghost{opacity:.35}
.drag-chosen{box-shadow:0 8px 24px rgba(10,20,14,.22)}
/* weight calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:var(--dir)}
.calhd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.calday{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-height:44px;padding:4px 0;
  border-radius:8px;background:var(--surface2);border:1px solid transparent}
.calday i{font-style:normal;font-size:10.5px;color:var(--muted);line-height:1.2}
.calday b{font-family:var(--disp);font-weight:800;font-size:14px;line-height:1.1;color:var(--ink)}
.calday.has{background:var(--accent-soft)}
.calday.tdy{border-color:var(--accent)}
.calday.tdy i{color:var(--ink);font-weight:700}
/* progress photos */
.phslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phslot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;cursor:pointer;font-size:12.5px;color:var(--muted)}
.phslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phslot.has{border-style:solid;border-color:var(--accent)}
.ph-hit{position:absolute;inset:0;background:none;border:0;cursor:pointer}
.ph-acts{position:absolute;inset:0;background:rgba(10,14,12,.62);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px}
.ph-acts button,.ph-acts label{background:#fff;color:#141a16;border:0;border-radius:10px;padding:8px 4px;font:inherit;font-size:12.5px;font-weight:700;text-align:center;cursor:pointer}
.ph-acts .del{background:rgba(255,255,255,.18);color:#fff}
.ph-pd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface2);margin-bottom:12px}
.ph-pd>span{font-size:26px}.ph-pd b{display:block}.ph-pd div span{font-size:12.5px;color:var(--muted)}
.ph-pd.now{background:var(--accent);color:var(--accent-ink)}.ph-pd.now div span{color:inherit;opacity:.85}
.ph-pd.now{animation:pdPulse 1.6s ease 2}@keyframes pdPulse{50%{transform:scale(1.02)}}
.ph-wt{width:100%;text-align:var(--start);padding:12px 14px;margin:0}
#phview{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:center;justify-content:center}
#phview[hidden]{display:none}
#phview>img{max-width:100%;max-height:100%;object-fit:contain}
#phview .pv-top{position:absolute;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#phview .pv-top button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:18px}
#phview .pv-tabs{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:8px}
#phview .pv-tabs button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit}
#phview .pv-tabs button.on{background:#fff;color:#000}
.phslot .lbl{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:3px 0}
.phrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:var(--start)}
.phrow:last-child{border-bottom:none}
.phthumbs{display:flex;gap:4px;flex-shrink:0;direction:ltr}
.phthumbs span{width:38px;height:50px;border-radius:6px;background:var(--surface2);overflow:hidden;display:block}
.phthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmpgrid figure{margin:0}
.cmpgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--surface2)}
.cmpgrid figcaption{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.cmpgrid label select{margin-top:3px;padding:7px 8px;font-size:14px}
.cmpph{width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.phmon{font-weight:700;font-size:13px;padding:10px 0 4px;border-bottom:1px solid var(--line);margin-top:4px}

/* settings switches */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:none}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(-19px)}
:root[dir="ltr"] .sw:checked::after{transform:translateX(19px)}

/* toast */
#toast{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;justify-content:center;z-index:50;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}

/* home dashboard */
.greet-wrap{margin:4px 0 2px}
.greet{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.12}
.planpill{margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-size:13px;font-weight:600;border:0}
.planpill.paid{background:var(--accent-soft);color:var(--accent)}
.dots{display:flex;justify-content:space-between;margin-top:10px;padding:0 2px;direction:var(--dir)}
.day.miss i{background:transparent;border:2px dashed var(--line)}
.day{text-align:center;font-size:11.5px;color:var(--muted)}
.day i{display:block;width:13px;height:13px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);margin:5px auto 0}
.day.on i{background:var(--accent);border-color:var(--accent)}
.day.today span{color:var(--ink);font-weight:700}
.linkbtn.small{font-size:12.5px;padding:2px}
/* weekly schedule grid */
.schedgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:var(--dir)}
.schedday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.schedday .dl{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.12;color:var(--muted)}
.schedday .dn{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schedday.has{background:var(--accent-soft);border-color:var(--accent)}
.schedday.has .dl,.schedday.has .dn{color:var(--ink)}
.schedday .dd{font-size:9.5px;color:var(--muted);line-height:1}
.schedday.tdy{outline:2px solid var(--accent);outline-offset:-2px}
.day .dt{display:block;font-size:10px;color:var(--muted);font-weight:400;line-height:1;margin-top:1px}
.day.today .dt{color:var(--ink);font-weight:700}
.day.sched i{background:transparent;border:2px solid var(--accent)}

/* empty states */
.empty{border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--ink);margin-bottom:4px}

.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.fin-ex{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}

/* splash — מסך כניסה ממותג */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(135deg,#2FD16B,#17A34A 55%,#0A6630);
  transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:98px;height:98px;border-radius:26px;box-shadow:0 18px 44px rgba(5,42,16,.45)}
#splash .sb{font-family:var(--brand);font-size:32px;color:#fff;letter-spacing:.5px}
#splash .sb b{font-weight:400;color:#073018}
#splash .st{color:rgba(255,255,255,.75);font-size:13.5px}
:root[data-g="f"] #splash{background:linear-gradient(135deg,#F472B6,#DB2777 55%,#831843)}
:root[data-g="f"] #splash img{box-shadow:0 18px 44px rgba(80,7,36,.45)}
:root[data-g="f"] #splash .sb b{color:#500724}
.auth-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-g button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:16px;background:var(--surface2);border:2px solid transparent;color:inherit;font:inherit}
.auth-g button span{font-size:30px}.auth-g button b{font-size:15px}
.auth-g button[data-v="f"]{border-color:#F9A8D4}.auth-g button[data-v="m"]{border-color:#86EFAC}

@media (prefers-reduced-motion:no-preference){
  .card,.ex-card,.h-card{transition:border-color .15s}
  .btn,.chip,.done-btn,.plate,nav.tabs button{transition:transform .12s ease}
  .btn:active,.chip:active,.done-btn:active,nav.tabs button:active{transform:scale(.95)}
  #sheet{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  #np{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  #np-bg,#sheet-bg{animation:fadein .2s ease-out}
  #restbar .inner{animation:up .25s cubic-bezier(.2,.8,.3,1)}
  #toast span{animation:rise .25s ease-out}
  .set-done .done-btn{animation:pop .34s cubic-bezier(.3,1.6,.4,1)}
  .dbitem.sel .pl{transition:background .15s}
  /* כניסת תוכן במעבר לשונית */
  #view.anim>*{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
  #view.anim>*:nth-child(2){animation-delay:.05s}
  #view.anim>*:nth-child(3){animation-delay:.09s}
  #view.anim>*:nth-child(4){animation-delay:.13s}
  #view.anim>*:nth-child(5){animation-delay:.16s}
  #view.anim>*:nth-child(n+6){animation-delay:.19s}
  /* ספלאש */
  #splash img{animation:spLogo .7s cubic-bezier(.3,1.4,.4,1) both}
  #splash .sb{animation:rise .5s .25s ease-out both}
  #splash .st{animation:rise .5s .4s ease-out both}
  @keyframes spLogo{from{transform:scale(.55) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
}
.mc-list{display:grid;gap:8px;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}
.mc-it{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--surface)}
.mc-top{display:flex;gap:6px;align-items:center}
.mc-name{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:600;font-size:16px;padding:4px 2px;color:inherit;-webkit-appearance:none;appearance:none;border-bottom:1px dashed var(--line);border-radius:0}
.mc-name:focus{outline:none;border-bottom-color:var(--accent)}
.mc-x{width:30px;height:30px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:13px;flex-shrink:0}
.mc-bot{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.mc-q{min-width:34px;height:30px;padding:0 8px;border-radius:9px;background:var(--surface2);font-weight:700;font-size:13.5px;color:var(--ink)}
.mc-r{margin-inline-start:auto;font-size:13px}
.mc-sugg{display:grid;gap:2px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.mc-sugg button{display:flex;justify-content:space-between;gap:8px;padding:7px 6px;border-radius:8px;text-align:start;font-size:14px;color:inherit}

/* best historical weight per exercise (finished workouts only) */
function bestMap(){
  const m={};
  for(const w of S.workouts)for(const e of w.ex||[]){if(e.t!=='s')continue;
    for(const s of e.sets||[]){const wt=+s.w||0,r=+s.r||0;if(r>0&&wt>(m[e.n]?.w||0))m[e.n]={w:wt,r,ts:w.start};}}
  return m;
}
/* last performance per exercise */
function lastPerf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name);
    if(e){ if(e.t==='c') return e.c?`קודם: ${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`:null;
      const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
      return 'קודם: '+ss.map(s=>`${+s.w||0}×${+s.r||0}`).join(' · ');}}
  return null;
}
function lastSetsOf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name&&e.t==='s');
    if(e&&(e.sets||[]).some(s=>+s.r>0))return e.sets.filter(s=>+s.r>0);}
  return null;
}
/* מאמן חכם: אם בפעם הקודמת כל הסטים סגרו את קצה הטווח — הצעה לעלות משקל */
const e1rm=(w,r)=>r>0?w*(1+r/30):0;
function coachTip(name,repsRange,nSets){
  const last=lastSetsOf(name); if(!last||!last.length)return null;
  const nums=String(repsRange||'').match(/\d+/g); if(!nums)return null;
  const top=+nums[nums.length-1]; if(!top||top>30)return null; // טווחי שניות (פלאנק) לא רלוונטיים
  const maxW=Math.max(...last.map(s=>+s.w||0)); if(maxW<=0)return null;
  const enough=last.length>=Math.min(nSets||last.length,last.length);
  const allTop=last.every(s=>(+s.r||0)>=top);
  if(allTop&&enough){
    const inc=maxW>=40?2.5:(maxW>=15?2:1); // קפיצה קטנה יותר במשקלים קלים
    return {w:Math.round((maxW+inc)*10)/10, from:maxW};
  }
  return null;
}
/* היסטוריית ביצועים לתרגיל */
function historyOf(name){
  const out=[];
  for(const w of [...S.workouts].sort((a,b)=>b.start-a.start)){
    const e=(w.ex||[]).find(e=>e.n===name); if(!e)continue;
    if(e.t==='c'){ if(e.c&&(e.c.min||e.c.km))out.push({ts:w.start,txt:`${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`}); continue; }
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const best=Math.max(...ss.map(s=>e1rm(+s.w||0,+s.r||0)));
    out.push({ts:w.start,txt:ss.map(s=>`${+s.w||0}×${+s.r||0}`).join(' · '),e1:Math.round(best)});
  }
  return out;
}

async function otpSend(){

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){OTP.err='הקלד אימייל תקין';render();return;}
  OTP.email=em; OTP.busy=true; OTP.err=''; render();
  let ref=null; try{ref=localStorage.getItem('nr-ref');}catch(_){}
  const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true,data:Object.assign({lang:LANG,g:window.NR_G||null,terms_accepted:new Date().toISOString(),terms_v:'2026-10-20'},ref?{ref}:{})}});
  OTP.busy=false;

  OTP.step='code'; OTP.until=Date.now()+60000; render(); setTimeout(()=>$('#otp-code')?.focus(),60);
  setTimeout(()=>{ if(OTP.step==='code')render(); },61000);
}
async function otpVerify(){

  if(t.length<6){OTP.err='הקוד צריך להיות 6 ספרות';render();return;}
  OTP.busy=true; OTP.err=''; render();

  OTP.busy=false;

  OTP.step=''; // onAuthStateChange takes it from here
}

      ...(redir?{ux_mode:'redirect',login_uri:location.origin+'/api/gsi'}:{}),

function startLandTimer(){
  clearInterval(startLandTimer._i); let left=63; const total=90, c=2*Math.PI*20;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  startLandTimer._i=setInterval(()=>{
    const t=$('#ld-t'), r=$('#ld-ring'); if(!t){clearInterval(startLandTimer._i);return;}
    left=left<=0?total:left-1;
    t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    r.setAttribute('stroke-dashoffset',(c*(1-left/total)).toFixed(1));
  },1000);
}

async function doAuth(){
  const email=($('#au-email')?.value||'').trim(), pass=$('#au-pass')?.value||'';
  const name=($('#au-name')?.value||'').trim(); S.authName=name;
  const err=$('#autherr'); if(err)err.textContent='';
  if(!email||!pass){if(err)err.textContent='מלא אימייל וסיסמה';return;}
  if(S.authMode==='signup'&&!name){if(err)err.textContent='מלא שם — ככה נדע איך לקרוא לך';return;}
  if(S.authMode==='signup'&&!$('#au-terms')?.checked){if(err)err.textContent='כדי להירשם יש לאשר את התקנון ומדיניות הפרטיות';return;}
  const btn=$('#authgo'); if(btn){btn.disabled=true;btn.textContent='רק רגע…';}
  try{
    if(S.authMode==='signup'){
      let ref=null; try{ref=localStorage.getItem('nr-ref');}catch(_){}
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:Object.assign({full_name:name,terms_accepted:new Date().toISOString(),terms_v:'2026-10-20',lang:LANG},ref?{ref}:{})}});
      if(error)throw error;
      if(!data.session){
        $('#view').innerHTML=`<div class="empty" style="margin-top:48px"><div class="big">כמעט שם ✉️</div>שלחנו קישור אישור אל<br><b dir="ltr">${esc(email)}</b><br>פתח את המייל, לחץ על הקישור — וחזור לכאן להתחבר.</div>`;
        return;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){
    const m=String(e?.message||'');
    if(err)err.textContent=
      /already registered/i.test(m)?'האימייל כבר רשום — נסה להתחבר':
      /invalid login/i.test(m)?'אימייל או סיסמה שגויים':
      /at least 6|too short/i.test(m)?'הסיסמה צריכה להיות באורך 6 תווים לפחות':
      /not confirmed/i.test(m)?'צריך לאשר קודם את המייל — בדוק את תיבת הדואר':
      /valid email/i.test(m)?'כתובת האימייל לא תקינה':
      'שגיאה: '+m;
  }finally{
    const b2=$('#authgo'); if(b2){b2.disabled=false;b2.textContent=S.authMode==='signup'?'הרשמה':'התחברות';}
  }
}

function nextTpl(){
  const ts=[...S.templates].sort((a,b)=>(a.order||0)-(b.order||0));
  if(!ts.length)return null;
  const lastT=[...S.workouts].sort((a,b)=>b.start-a.start).find(w=>w.tid);
  if(!lastT)return ts[0];
  const i=ts.findIndex(t=>t.id===lastT.tid);
  return ts[(i+1)%ts.length]||ts[0];
}
function tplMinutes(t){
  let m=0;
  for(const e of t.ex||[]){ if(e.t==='c'){m+=15;continue;} const n=+e.s||3; m+=n*((+e.rest||90)+45)/60; }
  return Math.max(10,Math.round(m/5)*5);
}
function weekDots(){
  /* השבוע הקלנדרי הנוכחי: ראשון מימין (RTL), כמו לוח עברי */
  const trained=new Set(S.workouts.map(w=>new Date(w.start).toDateString()));
  const today=new Date(); today.setHours(0,0,0,0);
  const sun=new Date(today); sun.setDate(today.getDate()-today.getDay());
  let out='';
  for(let d=0;d<7;d++){
    const dt=new Date(sun); dt.setDate(sun.getDate()+d);
    const on=trained.has(dt.toDateString());
    const isToday=dt.getTime()===today.getTime();
    const hasSched=!!schedOf(d);
    const sched=!on&&hasSched&&dt>=today;
    const missed=!on&&hasSched&&dt<today;
    out+=`<div class="day ${on?'on':''} ${sched?'sched':''} ${missed?'miss':''} ${isToday?'today':''}"><span>${DAY_LETTERS[d]}</span><b class="dt num">${dt.getDate()}</b><i></i></div>`;
  }
  return out;
}
function weekStreak(){
  let streak=0;
  const ws=S.workouts.map(w=>w.start);
  for(let k=0;;k++){
    const end=new Date(); end.setHours(23,59,59,999); end.setDate(end.getDate()-end.getDay()-7*k+6);
    const start=new Date(end); start.setDate(end.getDate()-6); start.setHours(0,0,0,0);
    const has=ws.some(t=>t>=+start&&t<=+end);
    if(has)streak++;
    else{ if(k===0)continue; break; } // השבוע הנוכחי עוד לא נספר נגד הרצף
    if(k>260)break;
  }
  return streak;
}

function tgCalc(t){
  const w=+t.w, h=+t.h, a=+t.age; if(!(w>30&&w<300&&h>120&&h<230&&a>=13&&a<100)||!t.sex||!t.act||!t.goal)return null;
  const bmr=10*w+6.25*h-5*a+(t.sex==='f'?-161:5), tdee=bmr*t.act;
  const adj=t.goal==='cut'?(t.pace==='slow'?-0.12:-0.2):t.goal==='bulk'?(t.pace==='slow'?0.07:0.12):0;
  let kcal=tdee*(1+adj); const floor=t.sex==='f'?1300:1600; kcal=Math.max(kcal,Math.min(floor,tdee*0.9));
  kcal=Math.round(kcal/50)*50;

  const prot=Math.round(leanW*(t.goal==='cut'?2.0:t.goal==='bulk'?1.8:1.7)/5)*5;
  const fat=Math.round(Math.max(0.8*leanW,kcal*0.25/9)), carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const wk=Math.round((tdee*adj*7/7700)*10)/10; // kg per week
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carbs,wk};
}

function buildMeal(kind,rnd,used,p,ctx){

    else if(pr>pT+25){ const c=all().filter(i=>i.f.r==='P'&&i.g>i.f.mn).sort((a,b)=>b.g*b.f.p-a.g*a.f.p)[0]; if(c)moved=step(c,-1)||moved; }
    if(fp<.2&&k<kT+60){ const c=all().filter(i=>i.f.r==='F'&&i.g<i.f.mx).sort((a,b)=>a.g*a.f.k-b.g*b.f.k)[0]; if(c)moved=step(c,1)||moved; }
    else if(fp>.36){ const c=all().filter(i=>i.f.r==='F'&&i.g>i.f.mn).sort((a,b)=>b.g*b.f.k-a.g*a.f.k)[0]; if(c)moved=step(c,-1)||moved; }
    if(k>kT+60){ const c=all().filter(i=>(i.f.r==='C'||(i.f.r==='F'&&fp>.25)||i.f.r==='X')&&i.g>i.f.mn).sort((a,b)=>b.g*b.f.k-a.g*a.f.k)[0]; if(c)moved=step(c,-1)||moved; }
    else if(k<kT-60){ let c=null; for(const r of ['C','X','L','F']){ c=all().filter(i=>i.f.r===r&&i.g<i.f.mx).sort((a,b)=>a.g*a.f.k-b.g*b.f.k)[0]; if(c)break; } if(c)moved=step(c,1)||moved; }
    if(!moved)break;
  }
  // ירקות: לפחות ~350 גרם ביום
  let vg=all().filter(i=>i.f.r==='V').reduce((a,i)=>a+i.g,0);
  for(const i of all().filter(i=>i.f.r==='V').sort((a,b)=>a.g-b.g)){ if(vg>=300)break; const g=Math.min(i.f.mx,i.g+100); vg+=g-i.g; i.g=g; }
}
/* חלוקת חלבון: ארוחות עיקריות מקבלות 25-45 גרם, ביניים פחות */
function menuGenerate(seed){
  const M=menuS(), p=M.p||{}, kT=mnKT(), pT=+S.settings.protT||Math.round((+S.settings.kcalT||2000)*0.25/4);
  seed=seed||((Date.now()%1e9)|0); const rnd=mRand(seed), used=[];
  const sl=menuSlots(p), pw=sl.map(x=>({b:.85,l:1.15,d:1,s:.45}[x.k]||1)+(x.pw?.2:0)), pws=pw.reduce((a,b)=>a+b,0);
  const meals=sl.map((x,i)=>{ const kind=mealKind(x.k,p,x.pw), K=kT*x.share, Pt=pT*pw[i]/pws;
    const it=solveMeal(buildMeal(kind,rnd,used,p,{Pt,K,pw:x.pw}),K,Pt);
    return {k:x.k,pw:x.pw,_it:it}; });
  menuBalance(meals,kT,pT);
  // עדיין חסרות קלוריות? מוסיפים כמו תזונאי: פרי לביניים/בוקר, כפית שמן זית לסלט, חופן אגוזים לביניים
  const usedAll=()=>meals.flatMap(m=>m._it.map(i=>i.f.id));
  for(let n=0;n<4;n++){
    const k=meals.flatMap(m=>m._it).reduce((a,i)=>a+i.f.k*i.g/100,0); if(k>=kT-120)break;
    const hasR=(m,r)=>m._it.some(i=>i.f.r===r);
    let tgt=meals.find(m=>m.k==='s'&&m._it.some(i=>['ygp','cot','why','tun'].includes(i.f.id))&&!hasR(m,'X'))||meals.find(m=>m.k==='b'&&!hasR(m,'X')&&m._it.length<5), f=null;
    if(tgt)f=mfPick(mfPool('X',tgt.k==='b'?'w':'s',p).filter(x=>!usedAll().includes(x.id)),rnd);
    if(!f){ tgt=meals.find(m=>m._it.some(i=>i.f.id==='sld')&&!hasR(m,'F')); const o=MFI('oil'); if(tgt&&o&&mfAllowed(o,p))f=o; }
    if(!f){ tgt=meals.find(m=>m.k==='s'&&m._it.length<3&&!hasR(m,'F')); if(tgt)f=mfPick(mfPool('F','s',p),rnd); }
    if(!f||!tgt)break; tgt._it.push({f,g:f.df}); menuBalance(meals,kT,pT);
  }
  M.day={seed,auto:true,meals:meals.map(m=>({k:m.k,pw:m.pw,items:m._it.map(i=>({id:i.f.id,g:i.g}))}))};
  persistSettings();
}
function menuEmpty(){ const M=menuS(), p=M.p||{meals:3,bf:'salty'};

function mwAct(act,b){
  const t=MW; if(!t)return true;
  if(act==='mw-back'){ t.step=Math.max(0,t.step-1); return mwRender(),true; }
  if(act==='mw-next'){ t.step++; if(t.step>=MW_STEPS.length)return mwFinish(),true; return mwRender(),true; }
  if(act==='mw-tog'){ const k=b.dataset.k, v=b.dataset.v, a=t.p[k]; const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v); b.classList.toggle('on',i<0);
    if(k==='avoid'){ const nb=document.querySelector('[data-act="mw-next"]'); if(nb)nb.textContent=tt(a.length?'המשך':'אין, אני אוכל הכל'); } return true; }
  if(act==='mw-pick'){ const k=b.dataset.k; t.p[k]=k==='meals'||k==='free'?+b.dataset.v:b.dataset.v;
    document.querySelectorAll('[data-act="mw-pick"]').forEach(x=>x.classList.toggle('on',x===b));
    if(k==='style'){ if(t.p.style==='vegan')t.p.avoid=t.p.avoid.filter(x=>!'efl'.includes(x)); if(t.p.style==='veg')t.p.avoid=t.p.avoid.filter(x=>x!=='f'); }
    setTimeout(()=>{ t.step++; if(t.step>=MW_STEPS.length)mwFinish(); else mwRender(); },220); return true; }
  return false;
}

  } else if(t.goal==='bulk'){

function tgAct(act,b){

  if(act==='tg-sug'){ t.gw=+b.dataset.v; const v=$('#tgw-v'), r=$('#tgw-r'); if(v)v.textContent=t.gw; if(r)r.value=t.gw; const n=$('#gw-note'); if(n)n.innerHTML=tgGoalNote(t); b.classList.add('on'); return; }
  if(act==='tg-pick'){ const k=b.dataset.k; t[k]=k==='act'?+b.dataset.v:b.dataset.v;

}

const AIQ={photo:null,loaded:0,LIM:300};
function aiQuotaLoad(){ if(!S.user||S.plan?.admin||Date.now()-AIQ.loaded<60000)return; AIQ.loaded=Date.now();
  const ms=new Date(); ms.setDate(1); ms.setHours(0,0,0,0);

    .then(({count,error})=>{ if(error)return; AIQ.photo=Math.max(0,AIQ.LIM-(count||0)); if(S.tab==='food'){ const el=$('#aiq'); if(el)el.outerHTML=aiQuotaLine(); } }); }
function aiQuotaLine(){ if(S.plan?.admin)return ''; aiQuotaLoad(); if(AIQ.photo==null)return '<div id="aiq"></div>';
  return `<div id="aiq" class="small muted" style="text-align:center;margin-top:6px">${AIQ.photo>0?`📸 נותרו ${AIQ.photo} ניתוחי תמונה החודש`:'📸 ניצלת את ניתוחי התמונה לחודש הזה. אפשר להקליד או לחפש במאגר'}</div>`; }
async function foodAI(payload){
  if(S.ai.busy)return;
  S.ai.busy=true; S.ai.q=payload.text||''; S.ai.img=payload.image?'data:image/jpeg;base64,'+payload.image:null; render(); aiTicker(true);
  try{
    const {data,error}=await Promise.race([sb.functions.invoke('nutrition',{body:{...payload,lang:LANG}}),
      new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{slow:true})),125000))]);
    if(error)throw error;
    if(!data||!Array.isArray(data.items)||!data.items.length)throw new Error('empty');
    if(data._left&&data._left.kind==='photo'){AIQ.photo=data._left.n; AIQ.loaded=Date.now();}
    S.ai.keep=false; openMealConfirm(data);
  }catch(e){
    console.error(e);
    S.ai.keep=true; const st=e?.context?.status;
    let qd=null; if(st===429){ try{qd=await e.context.json();}catch(_){} if(payload.image&&qd?.period==='month')AIQ.photo=0; }
    toast(st===429?(qd?.period==='day'?'הגעת לתקרה היומית. נמשיך מחר 💪':payload.image?'ניצלת את ניתוחי התמונה לחודש הזה. אפשר להקליד מה אכלת או לחפש במאגר':'הגעת למכסת ניתוחי ה-AI החודשית. אפשר לחפש במאגר או להוסיף ידנית')
      :(e?.slow||st===502||st===503||st===504)?'הניתוח לקח יותר מדי זמן. נסה שוב, או כתוב בקצרה מה בצלחת'
      :navigator.onLine?'הניתוח נכשל — נסה לנסח אחרת או הוסף ידנית':'אין רשת — ניתוח AI דורש חיבור');
  }
  S.ai.busy=false; S.ai.img=null; aiTicker(false); render();
  if(S.ai.keep){ const t=$('#food-text'); if(t){t.value=S.ai.q; t.closest('.fsearch')?.classList.add('has'); t.style.height=Math.min(132,t.scrollHeight+2)+'px';} }
}

function openPortion(f){
  const units=(f.units||[]).map(u=>({u:u.u,g:+u.g,d:!!u.d})).filter(u=>u.g>0);
  const pref=['יחידה בינונית','מנה בינונית','יחידה','מנה','פרוסה בינונית','פרוסה','גביע','כוס','ספל','כף'];

function portionCalc(){

  const d=v=>{const x=(+v||0)*grams/100; return x<10?Math.round(x*10)/10:Math.round(x);}; // תצוגה: עשרוני מתחת ל-10 גרם
  return {grams:Math.round(grams),kcal:k(p.f.kcal),protein:k(p.f.protein),carbs:k(p.f.carbs),fat:k(p.f.fat),
    show:{protein:d(p.f.protein),carbs:d(p.f.carbs),fat:d(p.f.fat)}};
}

function shrinkImage(file,MAXPX=1280,Q=0.85){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const MAX=MAXPX, sc=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',Q).split(',')[1]);
    }catch(e){rej(e);} };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

/* ----- היסטוריה: בנויה למשתמש עם מאות אימונים ----- */
const HIST={q:'',tpl:'all',open:{}};
function histPRs(ws){ // אימונים שבהם נשבר שיא משקל בתרגיל
  const best={}, pr={};
  for(const w of [...ws].sort((a,b)=>a.start-b.start)){
    let n=0;
    for(const e of w.ex||[])if(e.t==='s'){ const top=Math.max(0,...(e.sets||[]).filter(x=>+x.r>0).map(x=>+x.w||0));
      if(top>0){ if(best[e.n]!=null&&top>best[e.n])n++; if(best[e.n]==null||top>best[e.n])best[e.n]=top; } }
    if(n)pr[w.id]=n;
  }
  return pr;
}
function histHeatmap(ws){
  const W=16, d0=new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate()-d0.getDay()-(W-1)*7);
  const vol={}; for(const w of ws){ const k=ymd(new Date(w.start)); vol[k]=(vol[k]||0)+Math.max(1,workoutVol(w)); }
  const vals=Object.values(vol).sort((a,b)=>a-b), q=p=>vals.length?vals[Math.floor((vals.length-1)*p)]:0;
  const lvl=v=>!v?0:v<=q(.33)?1:v<=q(.66)?2:3;
  const today=ymd(); let cols='', n=0;
  for(let c=0;c<W;c++){ let cells='';
    for(let r=0;r<7;r++){ const d=new Date(d0); d.setDate(d0.getDate()+c*7+r); const k=ymd(d); const v=vol[k]; if(v)n++;
      cells+=k>today?'<i class="hm f"></i>':`<i class="hm l${lvl(v)}${k===today?' t':''}" title="${k}"></i>`; }
    cols+=`<span class="hmc">${cells}</span>`; }
  return {html:`<div class="hmgrid">${cols}</div>`,days:n};
}
function vHistory(){
  const all=[...S.workouts].sort((a,b)=>b.start-a.start);
  if(!all.length)return `<div class="empty"><div class="big">עוד אין אימונים שמורים</div>האימון הראשון שתסיים יופיע כאן, עם כל הסטים והמשקלים.</div>`;
  const pr=histPRs(all);
  const since=Date.now()-84*864e5, recent=all.filter(w=>w.start>=since).length;
  const m0=new Date(); m0.setDate(1); m0.setHours(0,0,0,0); const thisMonth=all.filter(w=>w.start>=+m0).length;
  // 8 שבועות אחרונים: כמה אימונים בכל שבוע (ראשון עד שבת)
  const wk0=new Date(); wk0.setHours(0,0,0,0); wk0.setDate(wk0.getDate()-wk0.getDay());
  const weeks=[...Array(8)].map((_,i)=>{ const a=new Date(wk0); a.setDate(a.getDate()-(7-i)*7); const b=new Date(a); b.setDate(b.getDate()+7);
    return {a, n:all.filter(w=>w.start>=+a&&w.start<+b).length}; });
  const wmax=Math.max(3,...weeks.map(x=>x.n));
  // סינון: שם אימון / תרגיל
  const tplCount={}; for(const w of all)tplCount[w.name]=(tplCount[w.name]||0)+1;
  const tpls=Object.entries(tplCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const q=HIST.q.trim();
  const exHit=q?exerciseOptions().filter(n=>hasQ(n,q)).slice(0,3):[];
  const ws=all.filter(w=>(HIST.tpl==='all'||w.name===HIST.tpl)&&(!q||hasQ(w.name,q)||(w.ex||[]).some(e=>hasQ(e.n,q))));
  // קיבוץ לפי חודש
  const groups=[]; let cur=null;
  for(const w of ws){ const d=new Date(w.start), k=d.getFullYear()+'-'+(d.getMonth()+1);
    if(!cur||cur.k!==k){ cur={k,label:d.toLocaleDateString(LOC,{month:'long',year:'numeric'}),items:[],vol:0,ms:0}; groups.push(cur); }
    cur.items.push(w); cur.vol+=workoutVol(w); cur.ms+=Math.max(0,(w.end||w.start)-w.start); }
  const filtering=q||HIST.tpl!=='all';
  return `
    <div class="tiles"><div class="tile"><div class="v num">${thisMonth}</div><div class="k">אימונים החודש</div></div><div class="tile"><div class="v num">${(recent/12).toFixed(1).replace('.0','')}</div><div class="k">בממוצע לשבוע</div></div><div class="tile"><div class="v num">${all.length}</div><div class="k">סה״כ אימונים</div></div></div>
    <div class="card" style="padding:14px;margin-top:10px">
      <div class="spread" style="margin-bottom:10px"><b>אימונים בכל שבוע</b><span class="small muted">8 שבועות אחרונים</span></div>
      <div class="wkbars">${weeks.map((x,i)=>`<div class="wkb ${i===7?'cur':''}"><span class="num">${x.n||''}</span><i style="height:${Math.round(x.n/wmax*100)}%"></i><small>${i===7?'השבוע':x.a.getDate()+'.'+(x.a.getMonth()+1)}</small></div>`).join('')}</div>
    </div>
    <div class="sect" style="margin-top:16px">כל האימונים</div>
    <input id="hist-q" type="search" class="adm-in" placeholder="🔍 חיפוש אימון או תרגיל, למשל: סקוואט" value="${esc(HIST.q)}">
    ${exHit.length?`<div class="row" style="gap:6px;margin-top:8px">${exHit.map(n=>`<button class="chip on" data-act="hist-ex" data-n="${esc(n)}">📈 ההתקדמות ב${esc(n)}</button>`).join('')}</div>`:''}
    ${tpls.length>1?`<div class="row" style="gap:6px;margin-top:8px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px">
      <button class="chip ${HIST.tpl==='all'?'on':''}" data-act="hist-tpl" data-t="all" style="flex-shrink:0">הכל</button>
      ${tpls.map(t=>`<button class="chip ${HIST.tpl===t?'on':''}" data-act="hist-tpl" data-t="${esc(t)}" style="flex-shrink:0">${esc(t)} <span class="muted">${tplCount[t]}</span></button>`).join('')}</div>`:''}
    ${!ws.length?`<div class="empty" style="margin-top:12px">לא נמצאו אימונים${q?` עם ״${esc(q)}״`:''}</div>`:''}
    ${groups.map((g,gi)=>{ const open=filtering||HIST.open[g.k]!=null?(filtering||HIST.open[g.k]):gi<2;
      return `<button class="hmonth" data-act="hist-month" data-k="${g.k}" aria-expanded="${open}">
        <span><b>${g.label}</b><span class="small muted" style="display:block">${g.items.length} אימונים · ${fmtNum(g.vol)} ק״ג · ${Math.round(g.ms/36e5)} שעות</span></span>

      ${open?`<div class="card" style="padding:0 12px">${g.items.map(w=>hRow(w,pr[w.id])).join('')}</div>`:''}`;}).join('')}`;

      const sets=(e.sets||[]).filter(x=>+x.r>0), top=Math.max(0,...sets.map(x=>+x.w||0)), pv=prevTop(e.n), diff=pv!=null?Math.round((top-pv)*10)/10:null;

/* נפח שבועי לקבוצת שריר מול היעד המחקרי (10–20 סטים) */
function weeklyVolHTML(){
  const wk=Date.now()-7*864e5, per={};
  for(const w of S.workouts){ if(w.start<wk)continue;
    for(const e of w.ex||[]){ if(e.t!=='s')continue;
      const n=(e.sets||[]).filter(s=>+s.r>0).length; if(n)per[e.m||'אחר']=(per[e.m||'אחר']||0)+n; } }
  const rows=Object.entries(per).sort((a,b)=>b[1]-a[1]).filter(([g])=>g!=='אירובי');

  return `<div class="sect">נפח 7 ימים אחרונים <span class="muted small" style="font-family:var(--body);font-weight:400">· יעד: 10–20 סטים לשריר</span></div>

    ${rows.map(([g,n])=>{

      const col=n>=10&&n<=20?'var(--accent)':n<10?'var(--muted)':'var(--gold)';

        </div>
      </div>`;}).join('')}
  </div>`;
}
/* ----- תצוגת גוף: משקל, יעדים ותזונה שבועית ----- */
function bwChange(days){
  const ws=S.weights||[]; if(ws.length<2)return null;
  const last=ws[ws.length-1];
  const cutoff=new Date(last.d); cutoff.setDate(cutoff.getDate()-days);
  const cs=ymd(cutoff);
  let base=null; for(const p of ws){ if(p.d<=cs)base=p; }
  if(!base)base=ws[0]; if(base===last)return null;
  return Math.round((last.kg-base.kg)*10)/10;
}
function deltaChip(v,label){
  if(v===null)return '';
  const col=v===0?'var(--muted)':v<0?'var(--accent)':'var(--gold)';
  return `<span class="pill num" style="color:${col};border-color:currentColor">${v>0?'▲':v<0?'▼':'·'} ${Math.abs(v)} ק״ג · ${label}</span>`;
}

function bwChartHTML(goal){
  const ws=(S.weights||[]).slice(-90);
  if(ws.length<2)return `<div class="empty" style="margin-top:12px"><div class="big">הגרף יופיע אחרי שתי שקילות</div>מומלץ להישקל בבוקר, אחרי שירותים ולפני אוכל — כך הנתון הכי עקבי.</div>`;
  const W=520,H=170,L=40,R=14,Tp=14,B=24;
  const xs=ws.map(p=>+new Date(p.d)), ys=ws.map(p=>p.kg).concat(goal?[goal]:[]);
  const x0=Math.min(...xs),x1=Math.max(...xs);

  const mid=Math.round((lo+hi)/2);

    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף משקל גוף" style="direction:ltr;display:block">
      ${[lo,mid,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`).join('')}
      ${goal?`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-R}" y="${Y(goal)-5}" font-size="11" text-anchor="end" fill="var(--gold)">יעד ${goal}</text>`:''}
      <path d="${area}" fill="var(--accent)" opacity="0.1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${ws.map((p,i)=>`<circle cx="${X(+new Date(p.d)).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="${i===ws.length-1?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtDate(x0)}</text>
      <text x="${W-R}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtDate(x1)}</text>
    </svg>
  </div>`;
}

/* תמונות התקדמות: מוקטנות (1600px, בלי מטא-דאטה/מיקום) ומוצפנות במכשיר (AES-256-GCM) לפני ההעלאה.

const PHK={p:null};
function photoKey(){
  if(!PHK.p)PHK.p=(async()=>{ const {data,error}=await sb.rpc('my_photo_key'); if(error||!data)throw error||new Error('key');
    const raw=Uint8Array.from(atob(data),c=>c.charCodeAt(0)); return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']); })().catch(e=>{PHK.p=null;throw e;});

const PH_MAGIC=[78,82,69,49]; // "NRE1"
async function encPhoto(blob){
  const key=await photoKey(), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,await blob.arrayBuffer()));
  const out=new Uint8Array(4+12+ct.length); out.set(PH_MAGIC,0); out.set(iv,4); out.set(ct,16);

async function decPhoto(buf){

async function fetchPhoto(path){
  const {data,error}=await sb.storage.from('progress').download(path); if(error||!data)throw error||new Error('dl');

function shrinkBlob(file,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82); // ציור מחדש על canvas מוחק EXIF (כולל מיקום GPS)
    }catch(e){rej(e);} };
    img.onerror=rej; img.src=URL.createObjectURL(file);
  });
}

function chartData(){
  const pts=[];
  for(const w of [...S.workouts].sort((a,b)=>a.start-b.start)){
    const e=(w.ex||[]).find(e=>e.n===S.progressEx&&e.t==='s'); if(!e)continue;
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const top=Math.max(...ss.map(s=>+s.w||0));
    const vol=ss.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);
    pts.push({ts:w.start, v:S.progressMetric==='top'?top:vol});
  }
  return pts;
}
function niceTicks(max){
  if(max<=0)return [0,5,10];
  const raw=max/3, pow=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=pow; for(const m of [1,2,2.5,5,10]){if(raw<=m*pow){step=m*pow;break;}}
  const top=Math.ceil(max/step)*step, t=[];
  for(let v=0;v<=top+1e-9;v+=step)t.push(Math.round(v*100)/100);
  return t;
}
function chartSVG(){
  const pts=chartData();
  if(pts.length<2)return `<div class="muted small" style="padding:18px 4px;text-align:center">צריך לפחות שני אימונים עם ״${esc(S.progressEx||'')}״ בשביל קו — בינתיים: ${pts.length?`<b class="num">${fmtNum(pts[0].v)}</b> ${S.progressMetric==='top'?'ק״ג':'ק״ג נפח'}`:'אין נתונים'}</div>`;
  const W=520,H=230,L=44,R=14,Tp=16,B=30;
  const xs=pts.map(p=>p.ts), ys=pts.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const ticks=niceTicks(Math.max(...ys)); const y1=ticks[ticks.length-1]||1;
  const X=t=>L+(W-L-R)*((t-x0)/Math.max(1,(x1-x0)));
  const Y=v=>Tp+(H-Tp-B)*(1-v/y1);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area=`${path} L${X(x1).toFixed(1)},${Y(0)} L${X(x0).toFixed(1)},${Y(0)} Z`;
  const iMax=ys.indexOf(Math.max(...ys));
  const lbl=(i)=>`<text x="${X(pts[i].ts)}" y="${Y(pts[i].v)-9}" font-size="11.5" text-anchor="middle" fill="var(--ink)" font-weight="600">${fmtNum(pts[i].v)}</text>`;
  const labelIdx=new Set([0,pts.length-1,iMax]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף התקדמות" style="direction:ltr;display:block">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtNum(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle data-pt="${i}" cx="${X(p.ts).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===iMax?5.5:4}" fill="${i===iMax?'var(--gold)':'var(--accent)'}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`).join('')}
    ${[...labelIdx].map(lbl).join('')}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="start">${fmtDate(x0)}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function wireChart(){
  const wrap=$('#chartwrap'); if(!wrap)return;
  wrap.addEventListener('click',ev=>{
    const c=ev.target.closest('[data-pt]');
    let tip=$('#tip'); if(tip)tip.remove();
    if(!c)return;
    const i=+c.dataset.pt, pts=chartData(), p=pts[i]; if(!p)return;
    tip=document.createElement('div');tip.id='tip';
    tip.textContent=`${fmtDate(p.ts)} · ${fmtNum(p.v)} ק״ג`;
    wrap.appendChild(tip);
    const cr=c.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
    tip.style.left=(cr.left-wr.left+cr.width/2)+'px';
    tip.style.top=(cr.top-wr.top)+'px';
    setTimeout(()=>tip&&tip.remove(),2600);
  });
}

function centerRack(smooth){
  const rack=$('#rack'); if(!rack)return;
  NP._lock=Date.now()+600; // גלילה תכנותית — לא בחירה של המשתמש

  let best=items[0],bd=1e9;
  for(const it of items){ const d=Math.abs(+it.dataset.rackv-(NP.val||10)); if(d<bd){bd=d;best=it;} }
  items.forEach(it=>it.classList.toggle('sel',+it.dataset.rackv===NP.val||it===best&&bd===0));
  const left=best.offsetLeft-(rack.clientWidth-best.offsetWidth)/2;
  rack.scrollTo({left,behavior:smooth?'smooth':'instant'});
}
function rackPick(){
  if(Date.now()<(NP._lock||0))return;
  const rack=$('#rack'); if(!rack)return;
  const mid=rack.scrollLeft+rack.clientWidth/2;
  const items=[...rack.querySelectorAll('.dbitem')];
  let best=null,bd=1e9;
  for(const it of items){ const c=it.offsetLeft+it.offsetWidth/2, d=Math.abs(c-mid); if(d<bd){bd=d;best=it;} }
  if(!best)return;
  const v=+best.dataset.rackv;
  if(v!==NP.val){ NP.val=v; vibrate(8); const el=$('#npval'); if(el)el.textContent=npFmt(v); }
  items.forEach(it=>it.classList.toggle('sel',it===best));
}
function npUpdate(){ const el=$('#npval'); if(el)el.textContent=NP.cfg.mode==='num'?(NP.str||'0'):npFmt(NP.val);

  else if(NP.cfg.mode==='weight'&&NP.sub==='db'){ // כוונון ידני: עדכון הדגשה בלי לגעת בגלילה
    document.querySelectorAll('.dbitem').forEach(it=>it.classList.toggle('sel',+it.dataset.rackv===NP.val)); }
  else if(NP.cfg.mode==='weight'&&NP.sub==='stack'){
    document.querySelectorAll('.splate').forEach(p=>{ const v=+p.dataset.stackv;
      p.classList.toggle('on',v<=NP.val); p.classList.toggle('pin',v===NP.val); }); } }
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-npadd],[data-npset],[data-npd],[data-npc],[data-npsub],[data-rackv],[data-stackv]'); if(!t||!NP.cfg)return;

    if(NP.cfg.mode==='reps'&&NP.cfg.chain){ // בזרימה: בחירת חזרות = שמירת הסט
      const c=NP.cfg,v=NP.val; closeNumpad(); c.apply(v); c.applyDone&&c.applyDone(); return; } }
  else if(t.dataset.npd!==undefined){ const d=t.dataset.npd;

  else if(t.dataset.npc==='back'){ NP.str=NP.str.slice(0,-1); NP.val=parseFloat(NP.str)||0; }

function addExercise(n,g){

    e.sets=base.map(s=>({w:'',r:'',pw:s.w||'',pr:s.r||'',done:false}));

/* מצב סידור מחדש: שורות קומפקטיות — גרירה בכל השורה + חיצים ▲▼ */
function renderTplReorder(){
  const t=_tplDraft;
  openSheet(`
    <h3>סדר התרגילים</h3>
    <div class="small muted" style="margin-bottom:10px">החזק שורה וגרור למקום החדש, או השתמש בחיצים.</div>
    <div id="tpl-rlist" class="rlist">
      ${t.ex.map((e,i)=>`<div class="rrow" data-i="${i}">
        <span class="drag-h" aria-hidden="true">⠿</span>
        ${EXDB[e.n]?`<img class="libthumb" ${exImg(EXDB[e.n],0)} alt="" loading="lazy">`:''}
        <span class="rname"><b class="num">${i+1}.</b> ${esc(e.n)}</span>
        <button class="rarrow" data-act="tpl-move" data-i="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="הזז למעלה">▲</button>
        <button class="rarrow" data-act="tpl-move" data-i="${i}" data-dir="1" ${i===t.ex.length-1?'disabled':''} aria-label="הזז למטה">▼</button>
      </div>`).join('')}
    </div>
    <button class="btn primary big" style="margin-top:14px" data-act="tpl-reorder-done">סיום ✓</button>
  `);
  loadSortable().then(()=>{
    const el=document.getElementById('tpl-rlist'); if(!el||!window.Sortable)return;
    Sortable.create(el,{
      draggable:'.rrow', filter:'.rarrow', preventOnFilter:false,
      forceFallback:true, fallbackOnBody:true, fallbackTolerance:4,
      animation:200, easing:'cubic-bezier(.2,.8,.3,1)',
      ghostClass:'drag-ghost', chosenClass:'drag-chosen', dragClass:'drag-drag',
      scroll:document.getElementById('sheet'), scrollSensitivity:80, scrollSpeed:14, bubbleScroll:true,
      onChoose(){ vibrate(8); },
      onEnd(ev){ if(ev.oldIndex===ev.newIndex||!_tplDraft)return;
        const [m]=_tplDraft.ex.splice(ev.oldIndex,1); _tplDraft.ex.splice(ev.newIndex,0,m); vibrate(12);
        requestAnimationFrame(renderTplReorder); }
    });
  }).catch(()=>{});
}

function agoHe(d){
  if(!d)return '—';
  const days=Math.round((new Date(ymd())-new Date(ymd(new Date(d))))/864e5);
  return days<=0?'היום':days===1?'אתמול':days<7?`לפני ${days} ימים`:days<30?`לפני ${Math.round(days/7)} שב׳`:`לפני ${Math.round(days/30)} חוד׳`;
}
const money=u=>{u=+u||0;const ils=u*USD_ILS;return ils<1?`${(ils*100).toFixed(ils*100<1?2:1)} אג׳`:`₪${ils.toFixed(2)}`;};
const dShort=d=>d?new Date(d).toLocaleDateString(LOC,{day:'numeric',month:'numeric',year:'2-digit'}):'—';
function userState(u){
  if(u.access==='admin')return ['אדמין','var(--ink)'];
  if(u.access==='pending')return ['ממתין לאישור','#D97706'];

  if(!until||until<=new Date())return ['פג תוקף','#DC2626'];

function adminChart(daily){
  const W=340,H=120,pb=18,n=daily.length,bw=W/n;
  const mx=Math.max(1,...daily.map(x=>x.active));
  const bars=daily.map((x,i)=>{const h=(x.active/mx)*(H-pb-14);const xx=W-(i+1)*bw;
    return `<rect x="${(xx+1.5).toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${Math.max(h,x.active?2:0).toFixed(1)}" rx="2" fill="var(--accent)" opacity="${i===n-1?1:.75}"><title>${x.d}: ${x.active} פעילים${x.signups?`, ${x.signups} נרשמו`:''}${+x.rev?`, ₪${x.rev}`:''}</title></rect>`+
      (x.signups?`<circle cx="${(xx+bw/2).toFixed(1)}" cy="${(H-pb-h-6).toFixed(1)}" r="3" fill="var(--ink)"/>`:'')+
      (+x.rev?`<text x="${(xx+bw/2).toFixed(1)}" y="${(H-pb-h-(x.signups?12:5)).toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--gold)">₪</text>`:'');}).join('');
  const lbl=[[0,W-1,'end'],[Math.floor(n/2),W-(Math.floor(n/2)+.5)*bw,'middle'],[n-1,1,'start']].map(([i,x,an])=>{const d=new Date(daily[i].d);return `<text x="${x.toFixed(1)}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="${an}">${i===n-1?'היום':d.getDate()+'.'+(d.getMonth()+1)}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;direction:ltr"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${bars}${lbl}
    <text x="${W-2}" y="10" font-size="10" fill="var(--muted)" text-anchor="end">מקס׳ ${mx}</text></svg>`;
}
