/* --- barcode scanner --- */
const SCAN={stream:null,timer:null,reader:null,busy:false};
function stopScan(){ clearInterval(SCAN.timer); SCAN.timer=null; try{SCAN.reader?.reset?.();}catch(_){} SCAN.reader=null; SCAN.stream?.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
async function openScanner(){
  SCAN.busy=false;
  openSheet(`<h3>סריקת ברקוד</h3>
    <div class="scanwrap"><video id="scanv" playsinline muted autoplay></video><div class="frame"></div></div>
    <div class="small muted" id="scanmsg" style="text-align:center;margin:8px 0">כוון את הברקוד של המוצר למסגרת</div>
    <div class="row" style="flex-wrap:nowrap"><input id="scan-code" type="text" inputmode="numeric" dir="ltr" placeholder="או הקלד את המספר" style="flex:1;text-align:center">
      <button class="btn primary" data-act="scan-go">חפש</button></div>
    <button class="btn big" style="margin-top:10px" data-act="scan-close">סגור</button>`);
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    const v=$('#scanv'); if(!v){stopScan();return;} v.srcObject=SCAN.stream; await v.play().catch(()=>{});
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      SCAN.timer=setInterval(async()=>{ if(SCAN.busy||!v.videoWidth)return; try{const r=await det.detect(v); if(r[0]?.rawValue)onBarcode(r[0].rawValue);}catch(_){} },300);
    }else{
      await new Promise((res,rej)=>{ if(window.ZXing)return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
      const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
      const reader=new ZXing.BrowserMultiFormatReader(hints); SCAN.reader=reader;
      reader.decodeFromVideoElementContinuously(v,(res)=>{ if(res&&!SCAN.busy)onBarcode(res.getText()); });
    }
  }catch(e){ const m=$('#scanmsg'); if(m)m.textContent='אין גישה למצלמה. אפשר להקליד את המספר שמתחת לברקוד.'; }
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(code.length<6||SCAN.busy)return;
  SCAN.busy=true; try{navigator.vibrate?.(40);}catch(_){}
  const m=$('#scanmsg'); if(m)m.textContent=`מחפש ${code}…`;
  stopScan();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/food-barcode?code=${code}`,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});
    if(r.status===404){ openLabelPrompt(code); return; }
    const j=await r.json(); if(!j.product)throw new Error('x');
    openProduct(j.product);
  }catch(e){ toast('החיפוש נכשל, נסה שוב'); closeSheet(); }
}
function openProduct(p){
  const units=[]; if(+p.serving_g>0)units.push({u:'מנה (לפי האריזה)',g:+p.serving_g});
  closeSheet();
  openPortion({code:'b'+p.barcode,name:(p.brand&&!String(p.name).includes(p.brand)?p.name+', '+p.brand:p.name),kcal:+p.kcal||0,protein:+p.protein||0,fat:+p.fat||0,carbs:+p.carbs||0,units});

/* ---------- actions ---------- */
function startWorkout(name,tid){
  const tpl=S.templates.find(t=>t.id===tid);
  const ex=(tpl?.ex||[]).map(e=>{
    if(e.t==='c')return {n:e.n,m:e.m,t:'c',rest:e.rest||0,c:{min:'',km:'',inc:'',done:false}};
    const nSets=Math.max(1,+e.s||3);
    const prev=lastSetsOf(e.n)||[];
    const sets=Array.from({length:nSets},(_,i)=>({w:'',r:'',pw:prev[i]?.w??prev[prev.length-1]?.w??'',pr:prev[i]?.r??prev[prev.length-1]?.r??'',done:false}));
    return {n:e.n,m:e.m,t:'s',reps:e.reps||'',rest:+e.rest||0,how:e.how||'',sets};
  });
  S.active={start:Date.now(),name,tid:tid||null,ex};
  persistActive(); S.tab='train'; location.hash='train'; render();
  startClock(); keepAwake(true);
}
function startClock(){ // live workout stopwatch — updates the clock element only, never re-renders
  if(startClock._i)return;
  startClock._i=setInterval(()=>{
    if(!S.active){clearInterval(startClock._i);startClock._i=null;return;}
    const el=document.getElementById('wclock'); if(el)el.textContent=clockText();
  },1000);
}
async function doSaveWorkout(){
  const a=S.active; if(!a)return;
  const w=clone(a); w.end=Date.now(); w.id='w'+a.start;
  w.ex=w.ex.map(e=>{ // strip placeholders, normalize numbers
    if(e.t==='c'){const c=e.c||{};return {n:e.n,m:e.m,t:'c',c:{min:+c.min||0,km:+c.km||0,inc:+c.inc||0}};}
    return {n:e.n,m:e.m,t:'s',sets:(e.sets||[]).map(s=>({w:+s.w||0,r:+s.r||0})).filter(s=>s.r>0)};
  }).filter(e=>e.t==='c'?(e.c.min>0||e.c.km>0):e.sets.length>0);
  if(!w.ex.length){toast('אין סטים מלאים לשמירה');return;}
  const bm=bestMap(); const newPRs=[];
  for(const e of w.ex)if(e.t==='s'){ const top=Math.max(0,...e.sets.map(s=>s.w));
    if(top>0&&top>(bm[e.n]?.w||0))newPRs.push(`${e.n}: ${top} ק״ג`); }
  try{await saveWorkout(w);}catch(e){return;}
  if(newPRs.length&&S.settings.notif?.pr!==false)notify('שיא חדש! 🏅',newPRs.join(' · '));
  if(newPRs.length)sb.rpc('post_pr',{p_text:newPRs.join(', ')}).then(()=>{},()=>{});
  S.active=null;
  saveLocalActive(); clearTimeout(_aT); flushActive();
  stopRest(); keepAwake(false); closeSheet(); render(); toast('האימון נשמר 💪');
}

/* ---------- event delegation ---------- */
window.addEventListener('error',e=>{ try{toast('שגיאה: '+(e?.message||'לא ידועה'));}catch(_){} });
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return;
  try{ handleAct(b,ev); }catch(err){ console.error(err); toast('שגיאה: '+(err?.message||err)); }

function handleAct(b,ev){
  const act=b.dataset.act;
  if(act.startsWith('soc-')&&socAct(act,b))return;
  if(payAct(act,b))return;
  switch(act){
    case 'start-free': startWorkout('אימון חופשי'); break;
    case 'start-tpl': { const t=S.templates.find(t=>t.id===b.dataset.id); if(t)startWorkout(t.name,t.id); break; }
    case 'add-ex': openLibrary('active'); break;
    case 'rm-ex': { S.active.ex.splice(+b.dataset.ei,1); persistActive(); render(); break; }
    case 'add-set': { const e=S.active.ex[+b.dataset.ei]; const last=e.sets[e.sets.length-1];
      e.sets.push({w:'',r:'',pw:last?(last.w||last.pw||''):'',pr:last?(last.r||last.pr||''):'',done:false});
      persistActive(); render(); break; }
    case 'set-done': { const e=S.active?.ex?.[+b.dataset.ei], s=e?.sets?.[+b.dataset.si]; if(!s)break;
      if(!s.w&&s.pw)s.w=s.pw; if(!s.r&&s.pr)s.r=s.pr;
      s.done=!s.done;
      const ei2=+b.dataset.ei, si2=+b.dataset.si;
      // סט שהושלם מציע את המשקל והחזרות שלו לסט הבא
      if(s.done){ const nx=e.sets[si2+1];
        if(nx&&!nx.done){ if(s.w)nx.pw=s.w; if(s.r)nx.pr=s.r;
          const nw=document.getElementById(`w-${ei2}-${si2+1}`), nr=document.getElementById(`r-${ei2}-${si2+1}`);
          if(nw&&!nw.value)nw.placeholder=nx.pw||''; if(nr&&!nr.value)nr.placeholder=nx.pr||''; } }
      persistActive();
      // עדכון נקודתי של השורה — בלי רינדור מלא, כדי שסימון סט יעבוד גם כשהמקלדת פתוחה
      document.querySelectorAll(`[data-cell="${ei2}-${si2}"]`).forEach(el=>el.classList.toggle('set-done',s.done));
      const wi=document.getElementById(`w-${ei2}-${si2}`), ri=document.getElementById(`r-${ei2}-${si2}`);
      if(wi)wi.value=s.w??''; if(ri)ri.value=s.r??'';
      updateLive();
      if(s.done){ const nx=e.sets[si2+1]&&!e.sets[si2+1].done?`${e.n} · סט ${si2+2}`:(S.active.ex[ei2+1]?S.active.ex[ei2+1].n:'');
        startRest(e.rest||S.settings.rest,nx); } break; }
    case 'done-all': { const e=S.active?.ex[+b.dataset.ei]; if(!e||e.t!=='s')break;
      if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='בטוח?';
        setTimeout(()=>{delete b.dataset.sure; if(b.isConnected)b.textContent='✓✓';},2200); break; }
      for(const s of e.sets){ if(s.done)continue;
        if(!s.w&&s.pw)s.w=s.pw; if(!s.r&&s.pr)s.r=s.pr;
        if(+s.r>0)s.done=true; }
      persistActive(); render(); startRest(e.rest||S.settings.rest,S.active.ex[+b.dataset.ei+1]?.n||''); break; }
    case 'ex-info': { const e=S.active?.ex[+b.dataset.ei]; if(!e)break;
      openExSheet(e.n,{reps:e.reps,sets:e.sets?.length,rest:e.rest,how:e.how}); break; }
    case 'hist-ex': openExSheet(b.dataset.n,{}); break;
    case 'lib-info': { const n=b.dataset.n;
      openSheet(`<h3>${esc(n)}</h3>${demoHTML(n)}<p style="margin:0 0 8px;line-height:1.6">${esc(INFO[n]||'')}</p>
        <div style="margin-bottom:14px">${ytLink(n)}</div>
        <button class="btn big" data-act="lib-back">חזרה למאגר</button>`); break; }
    case 'lib-back': renderLibrary(); break;
    case 'lib-info-tpl': { const n=b.dataset.n;

document.addEventListener('input',ev=>{
  const i=ev.target.closest('[data-bind]'); if(!i)return;
  const k=i.dataset.bind;
  if(k==='w'||k==='r'){ const s=S.active?.ex[+i.dataset.ei]?.sets[+i.dataset.si]; if(s){s[k]=i.value; persistActive();} }
  else if(k==='cmin'||k==='ckm'||k==='cinc'){ const e=S.active?.ex[+i.dataset.ei]; if(e?.c){e.c[{cmin:'min',ckm:'km',cinc:'inc'}[k]]=i.value; persistActive();} }
  else if(k==='libq'){ S.lib.q=i.value; renderLibrary(); }
  else if(k==='foodq'){ clearTimeout(foodSearch._t); foodSearch._t=setTimeout(()=>foodSearch(i.value),220); }
  else if(k==='tpln'){ if(_tplDraft)_tplDraft.name=i.value; }
  else if(k==='pqty'&&_portion){ const v=+String(i.value).replace(',','.'); if(v>0){_portion.qty=v; renderPortion();} }
  else if(k==='mif'){ if(!_mealEdit)return;
    if(i.dataset.mf==='mealname'){_mealEdit.name=i.value;return;}
    const it=_mealEdit.items[+i.dataset.mi]; if(!it)return;
    const f=i.dataset.mf;
    it[f]=f==='name'?i.value:(+String(i.value).replace(',','.')||0);
  }
  else if(k==='tplf'){ const e=_tplDraft?.ex[+i.dataset.i]; if(e){const f=i.dataset.f; e[f]=f==='reps'?i.value:(+i.value||0);} }
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&ev.target.dataset.photoAngle&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0], a=ev.target.dataset.photoAngle, d=ev.target.dataset.photoDate; ev.target.value='';
    uploadPhoto(f,d,a); return;
  }
  if(ev.target.id==='label-photo'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value=''; readLabel(f); return;
  }
  if(ev.target.id==='food-photo'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value='';
    toast('מעבד תמונה…');
    shrinkImage(f).then(b64=>foodAI({image:b64,media:'image/jpeg'})).catch(()=>toast('קריאת התמונה נכשלה'));
    return;
  }
  const i=ev.target.closest('[data-bind]'); if(!i)return;
  if(i.dataset.bind==='progex'){S.progressEx=i.value; render();}
  else if(i.dataset.bind==='notif'){
    S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},S.settings.notif);
    const k=i.dataset.k;
    S.settings.notif[k]=i.checked;
    if(k==='remind'){
      if(i.checked){
        subscribePush().then(r=>{
          if(!r.ok){ S.settings.notif.remind=false; if(i.isConnected)i.checked=false;
            toast(r.why==='perm'?'צריך לאשר התראות בדפדפן':'המכשיר לא תומך — באייפון: הוסף קודם למסך הבית ופתח משם');
          }else toast('תזכורות הופעלו — נתראה בבוקר אימון 🗓️');
          persistSettings();
        });
        return;
      }else unsubscribePush();
    }
    else if(i.checked&&(k==='rest'||k==='pr'))ensureNotifPerm();

  }
});

async function enterApp(user){
  S.user=user; S.mode='boot'; render();
  // בקרת גישה: משתמש חדש ממתין לאישור האדמין (נאכף גם בשרת ב-RLS). שגיאת רשת → ממשיכים (אופליין)
  if(PAID_RETURN||enterApp._claim){ enterApp._claim=false; try{ const c=await sb.rpc('claim_payment'); if(c.data?.ok&&!c.data.duplicate)toast('התשלום אומת, הגישה נפתחה 🎉'); }catch(_){} }
  try{ const pl=await sb.rpc('my_plan'); if(!pl.error&&pl.data){ S.plan=pl.data; const st=pl.data.status;
    if(st==='expired'){ S.mode='paywall'; render();
      if(PAID_RETURN&&!(enterApp._poll>=8)){ enterApp._poll=(enterApp._poll||0)+1; toast('מאשר את התשלום…'); setTimeout(()=>enterApp(user),4000); }
      return; }
    if(st!=='approved'){ S.access=st; S.mode='pending'; render(); return; } } }catch(_){}
  try{
    const [tpl,wo,st,bw,ml]=await Promise.all([
      sb.from('templates').select('id,name,ord,ex').order('ord'),
      sb.from('workouts').select('id,name,start_ts,end_ts,ex'),
      sb.from('settings').select('rest,active,prefs').maybeSingle(),
      sb.from('bodyweight').select('d,kg').order('d'),
      sb.from('meals').select('id,d,ts,name,kcal,protein,carbs,fat,items').gte('d',ymd(new Date(Date.now()-60*864e5))),
    ]);
    if(tpl.error||wo.error)throw tpl.error||wo.error;
    S.templates=(tpl.data||[]).map(r=>({id:r.id,name:r.name,order:r.ord||0,ex:r.ex||[]}));
    S.workouts=(wo.data||[]).map(r=>({id:r.id,name:r.name,start:+r.start_ts,end:+r.end_ts,ex:r.ex||[]}));
    S.weights=(bw.data||[]).map(r=>({d:r.d,kg:+r.kg}));
    S.meals=ml.data||[];
    if(st.data){ S.settings.rest=st.data.rest??90; S.active=st.data.active||null;
      S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},st.data.prefs?.notif);
      S.settings.schedule=st.data.prefs?.schedule||{};
      S.settings.kcalT=st.data.prefs?.kcalT||null; S.settings.protT=st.data.prefs?.protT||null; S.settings.goalKg=st.data.prefs?.goalKg||null; S.settings.photoDay=st.data.prefs?.photoDay??null; }
    if(!S.templates.length){ // משתמש חדש — טעינת תוכניות ברירת המחדל
      S.templates=clone(DEFAULT_TEMPLATES);
      sb.from('templates').upsert(DEFAULT_TEMPLATES.map(t=>({id:t.id,user_id:user.id,name:t.name,ord:t.order,ex:t.ex}))).then(()=>{});
      toast('טענו לך 3 תוכניות מוכנות — אפשר לערוך בלשונית ״תוכניות״');
    }
    saveSnapshot();
  }catch(e){ // אופליין — ממשיכים מתמונת המצב המקומית
    const snap=loadSnapshot();
    if(snap){ S.templates=snap.templates||[]; S.workouts=snap.workouts||[]; S.settings=Object.assign({rest:90},snap.settings); S.weights=snap.weights||[]; S.meals=snap.meals||[]; toast('מצב אופליין — עובדים מהנתונים השמורים'); }
    else toast('טעינת הנתונים נכשלה — בדוק חיבור');
  }
  const localA=loadLocalActive();
  if(localA&&(!S.active||((localA.start===S.active.start)&&JSON.stringify(localA).length>=JSON.stringify(S.active).length)))S.active=localA;
  S.mode='app'; render(); updateSyncBadge(); trySync(); loadPhotos(); restoreRest();
  sb.rpc('is_admin').then(({data})=>{S.isAdmin=data===true;}).catch(()=>{});
  socLoad(); socSubscribe(); socPendingJoin();
  if(PAID_RETURN&&!enterApp._paid){ enterApp._paid=true; toast('תודה! התשלום התקבל 🎉'); }
  if(S.active){startClock();keepAwake(true);}
}
function hideSplash(){
  const sp=$('#splash'); if(!sp)return;
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); },450);
}
(async function boot(){
  render();
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await enterApp(session.user);
    else{ S.mode='auth'; render(); }
  }catch(e){ S.mode='auth'; render(); }
  hideSplash();
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(sess&&!S.user)enterApp(sess.user);
    if(ev==='SIGNED_OUT'){PH.sets=[];PH.urls={};PH.loaded=false;S.user=null;S.workouts=[];S.templates=[];S.active=null;stopRest();S.mode='auth';render();}
  });
})();
</script>
</body>
