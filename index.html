<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NextRep</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NextRep">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Karantina:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Layout: app-shell — sticky header, scrolling content, fixed bottom tab bar + rest-timer bar; everything derives from the tokens below. */
:root{
  --bg:#F3F5F2;
  --surface:#FFFFFF;
  --surface2:#EAEEE9;
  --ink:#1A201C;
  --muted:#5D675F;
  --line:#DFE4DE;
  --accent:#16A34A;
  --accent-soft:#DCFCE7;
  --accent-ink:#FFFFFF;
  --gold:#B45309;
  --gold-soft:#FEF3C7;
  --danger:#B3362B;
  --shadow:none;
  --overlay-shadow:0 -8px 30px rgba(10,20,14,.18);
  --disp:'Karantina',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131619; --surface:#1B2024; --surface2:#242A2E; --ink:#EDF1EE; --muted:#9AA5A0;
    --line:#2B3237; --accent:#22C55E; --accent-soft:#17351F; --accent-ink:#06130A;
    --gold:#F59E0B; --gold-soft:#3A2A0E66; --danger:#E0695C;
    --shadow:none;
    --overlay-shadow:0 -8px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131619; --surface:#1B2024; --surface2:#242A2E; --ink:#EDF1EE; --muted:#9AA5A0;
  --line:#2B3237; --accent:#22C55E; --accent-soft:#17351F; --accent-ink:#06130A;
  --gold:#F59E0B; --gold-soft:#3A2A0E66; --danger:#E0695C;
  --shadow:none;
    --overlay-shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  direction:rtl;
  padding-top:env(safe-area-inset-top,0px);
}
[hidden]{display:none!important}
img{max-width:100%}

/* ===== landing (לא מחוברים) ===== */
body.landing #app{max-width:1120px}
.ld{--r25:#D8473E;--r20:#2F6FD6;--r15:#E5B42A;--r10:#16A34A;padding-bottom:20px}
.ld h1,.ld h2{font-family:var(--disp);font-weight:400;letter-spacing:.2px;margin:0;line-height:.92}
.ld h1{font-size:clamp(64px,17vw,132px)}
.ld h2{font-size:clamp(44px,10vw,72px)}
.ld p{margin:0;color:var(--muted);font-size:17px;line-height:1.6;max-width:34em}
.ld-hero{display:grid;gap:28px;padding:18px 0 8px}
.ld-hero .lead{font-size:18px;color:var(--ink);opacity:.82}
.ld-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ld-cta .btn{padding:14px 22px;font-size:17px;font-weight:700;border-radius:14px}
.ld-note{font-size:13.5px;color:var(--muted)}
.ld-bar{width:100%;max-width:520px;height:auto;display:block;margin:6px 0 0}
.ld-bar .pl{transform-box:fill-box}
@media (prefers-reduced-motion:no-preference){
  .ld-bar .pl{animation:ldload .7s cubic-bezier(.2,.9,.25,1.15) both}
  .ld-bar .pl.r{--from:60px}.ld-bar .pl.l{--from:-60px}
  @keyframes ldload{from{transform:translateX(var(--from));opacity:0}to{transform:none;opacity:1}}
}
.ld-phone{justify-self:center;width:min(330px,100%);background:var(--ink);border-radius:42px;padding:12px;box-shadow:0 30px 60px -30px rgba(10,30,15,.45)}
.ld-screen{background:var(--bg);border-radius:31px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:10px;min-height:520px;color:var(--ink)}
.ld-screen .sh{display:flex;justify-content:space-between;align-items:baseline}
.ld-screen .sh b{font-family:var(--disp);font-size:34px;font-weight:400;line-height:1}
.ld-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.ld-set{display:grid;grid-template-columns:22px 1fr 1fr 34px;align-items:center;gap:8px;padding:7px 4px;border-radius:9px;font-size:15px}
.ld-set .n{color:var(--muted);font-size:13px;text-align:center}
.ld-set .v{font-weight:700;font-variant-numeric:tabular-nums}
.ld-set .v small{font-weight:400;color:var(--muted);font-size:12px}
.ld-set .ck{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px}
.ld-set.done .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.ld-set.now{background:var(--accent-soft,#E3F5E8);outline:1.5px solid var(--accent)}
.ld-rest{margin-top:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px}
.ld-rest svg{flex-shrink:0}
.ld-rest .t{font-family:var(--disp);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.ld-rest .k{font-size:12.5px;opacity:.75}
.ld-sec{display:grid;gap:22px;padding:56px 0 8px;border-top:1px solid var(--line);margin-top:48px}
.ld-sec:first-of-type{border-top:0}
.ld-feats{display:grid;gap:14px}
.ld-feat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ld-feat h3{margin:0;font-size:19px}
.ld-feat p{font-size:15.5px}
.ld-feat .ui{margin-top:auto}
.ld-plates{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.ld-plates span{min-width:46px;padding:8px 6px;border-radius:9px;text-align:center;font-weight:700;color:#fff;font-size:14px}
.ld-read{display:flex;justify-content:space-between;align-items:baseline;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.ld-read b{font-family:var(--disp);font-size:44px;font-weight:400;line-height:1}
.ld-lock{background:linear-gradient(160deg,#2b3a31,#121814);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
.ld-lock .clk{color:#fff;text-align:center;font-family:var(--disp);font-size:48px;line-height:1;opacity:.92}
.ld-notif{background:rgba(255,255,255,.88);color:#111;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13.5px;direction:rtl}
.ld-notif img{width:30px;height:30px;border-radius:8px}
.ld-notif b{display:block;font-size:14px}
.ld-sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.ld-sugg div{display:flex;justify-content:space-between;padding:9px 12px;font-size:14px;border-top:1px solid var(--line)}
.ld-sugg div:first-child{border-top:0}
.ld-sugg .q{background:var(--surface);color:var(--muted)}
.ld-sugg span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.ld-chart{width:100%;height:auto;display:block}
.ld-pr{display:inline-flex;gap:6px;align-items:center;background:#FFF6DB;color:#7A5A00;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.ld-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:rtl;max-width:340px}
.ld-cal i{aspect-ratio:1;border-radius:7px;background:var(--bg);font-style:normal;font-size:10.5px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.ld-cal i.w{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.ld-steps{display:grid;gap:12px;counter-reset:st;padding:0;margin:0;list-style:none}
.ld-steps li{counter-increment:st;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.ld-steps li::before{content:counter(st);font-family:var(--disp);font-size:40px;line-height:.9;color:var(--accent);text-align:center}
.ld-steps b{display:block}
.ld-steps span{color:var(--muted);font-size:15px}
.ld-end{background:var(--ink);color:var(--bg);border-radius:24px;padding:34px 22px;display:grid;gap:14px;margin-top:56px}
.ld-end p{color:var(--bg);opacity:.75}
.ld-end .btn.primary{justify-self:start}
.ld-foot{text-align:center;color:var(--muted);font-size:13px;padding:22px 0 0}
#landlogin{font-weight:600}
.ld-prev{font-size:12px;color:var(--accent);font-weight:600;padding:2px 34px 4px 0}
.ld-pains{display:grid;gap:10px}
.ld-pain{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ld-pain .was{color:var(--muted);font-size:16px;line-height:1.5}
.ld-pain .now{display:flex;gap:10px;align-items:flex-start;font-weight:600;line-height:1.5}
.ld-pain .ok{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;margin-top:2px}
.ld-fit{border-radius:18px;padding:20px;border:1px solid var(--line)}
.ld-fit h3{margin:0 0 10px;font-size:20px}
.ld-fit ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.ld-fit li{display:flex;gap:10px;line-height:1.5}
.ld-fit.yes{background:var(--surface);border-color:var(--accent)}
.ld-fit.yes li::before{content:'✓';color:var(--accent);font-weight:700}
.ld-fit.no li{color:var(--muted)}
.ld-fit.no li::before{content:'–';color:var(--muted);font-weight:700}
.ld-faq{display:grid;gap:8px}
.ld-faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.ld-faq summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.ld-faq summary::-webkit-details-marker{display:none}
.ld-faq summary::after{content:'+';color:var(--accent);font-size:20px;line-height:1}
.ld-faq details[open] summary::after{content:'−'}
.ld-faq p{padding-bottom:14px;font-size:15.5px}
@media (min-width:900px){ .ld-pains{grid-template-columns:repeat(2,1fr)} .ld-pain{grid-template-columns:1fr 1fr;align-items:start} .ld-pains .ld-pain{grid-column:span 2} }

@media (min-width:900px){
  .ld-hero{grid-template-columns:1.15fr .85fr;align-items:center;padding-top:40px}
  .ld-hero .ld-phone{grid-row:1/3;grid-column:2}
  .ld-feats{grid-template-columns:repeat(3,1fr)}
  .ld-sec.two{grid-template-columns:.9fr 1.1fr;align-items:start}
  .ld-end{grid-template-columns:1fr auto;align-items:center;padding:44px}
}
@media (min-width:600px) and (max-width:899px){ .ld-feats{grid-template-columns:repeat(2,1fr)} }

.goalbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);text-align:right;color:var(--ink);font-size:14.5px}
.goalbar .gi{font-size:20px}.goalbar .gt{flex:1}.goalbar .ge{color:var(--accent);font-weight:700;font-size:14px}
.goalcta{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:16px;background:var(--surface);border:2px solid var(--accent);text-align:right;box-shadow:0 6px 18px -10px rgba(22,163,74,.6)}
.goalcta .gi{font-size:34px;line-height:1}.goalcta .gt{flex:1;display:flex;flex-direction:column;gap:2px}.goalcta .gt b{font-size:17px}.goalcta .gt span{font-size:13.5px;color:var(--muted)}
.tseg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.tseg button{flex:1;padding:9px;border-radius:9px;font-size:14.5px;color:var(--muted)}
.tseg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ===== plans / paywall / share / scanner ===== */
.pw{max-width:440px;margin:0 auto;padding:28px 0 20px;display:flex;flex-direction:column;gap:14px}
.pw h2{font-family:var(--disp);font-weight:400;font-size:46px;line-height:.95;margin:0}
.pw ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.pw li{display:flex;gap:9px}.pw li::before{content:'✓';color:var(--accent);font-weight:700}
.plan{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;width:100%;text-align:right;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.plan.best{border:2px solid var(--accent);box-shadow:0 10px 24px -14px rgba(22,163,74,.7)}
.plan .pn{font-weight:700;font-size:17px}
.plan .pp{font-family:var(--disp);font-size:40px;line-height:1;grid-row:1/3;grid-column:2}
.plan .pm{font-size:13px;color:var(--muted)}
.plan .tag{position:absolute;top:-11px;inset-inline-start:14px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.planbanner{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:11px 14px;margin-bottom:12px;color:var(--ink)}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:grid;place-items:center;margin:4px auto;width:min(260px,100%)}
.qrbox svg,.qrbox img{width:100%;height:auto;display:block}
.scanwrap{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanwrap .frame{position:absolute;inset:28% 12%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.adm-in{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.hp.due{border:2px solid var(--accent);box-shadow:0 8px 22px -14px rgba(22,163,74,.7)}
.hp-row{display:flex;gap:8px;margin-top:10px;direction:ltr;justify-content:flex-end}
.hp-th{width:62px;display:flex;flex-direction:column;gap:3px;align-items:center}
.hp-th img,.hp-th:not(:has(img))::before{width:62px;height:82px;border-radius:9px;object-fit:cover;background:var(--surface2);display:block;content:''}
.hp-th small{font-size:10.5px;color:var(--muted)}
.adm-n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:99px;background:var(--danger,#DC2626);color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-inline-start:3px}
.adm-alert{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;padding:12px 14px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold);font-weight:600;color:var(--ink)}
.adm-ok{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-weight:600;margin-bottom:12px}
.adm-row{display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:10px 0;border-bottom:1px solid var(--line)}
.adm-row:last-child{border-bottom:0}
.adm-av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.adm-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm-acts .btn{text-align:center;text-decoration:none}
.adm-det{padding:12px 14px}
.adm-det summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
.adm-det summary::-webkit-details-marker{display:none}
.weighrow{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);font-weight:600;text-align:right}
.weighrow .wr-plus{color:var(--accent);font-weight:700}
.weighrow.done{background:var(--surface2);border-color:var(--line);font-weight:500}
.calhd.phd{color:var(--accent);font-weight:700}
.calday.phd{box-shadow:inset 0 -2px 0 var(--accent)}
.calday em{font-style:normal;font-size:10px;line-height:1}
.phdays{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phdays button{padding:10px 4px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.phset{border:2px solid var(--accent)}
.tiles.sm .v{font-size:28px;white-space:nowrap}
.wkbars{display:flex;gap:6px;align-items:flex-end;height:120px;direction:rtl}
.wkb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.wkb i{display:block;width:100%;max-width:28px;min-height:3px;border-radius:6px 6px 3px 3px;background:var(--accent);opacity:.55}
.wkb.cur i{opacity:1}
.wkb span{font-size:12px;font-weight:700;color:var(--ink)}
.wkb small{font-size:10px;color:var(--muted);white-space:nowrap}
.hmgrid{display:flex;gap:3px;direction:rtl;justify-content:space-between}
.hmc{display:flex;flex-direction:column;gap:3px;flex:1}
.hm{display:block;aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.hm.l1{background:var(--accent);opacity:.35}.hm.l2{background:var(--accent);opacity:.65}.hm.l3{background:var(--accent)}
.hm.f{background:transparent}.hm.t{outline:1.5px solid var(--ink);outline-offset:-1px}
.hmleg{display:inline-flex;gap:3px;align-items:center}.hmleg .hm{width:10px;height:10px}
.hmonth{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;padding:14px 2px 8px}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:11px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hdate{width:40px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;background:var(--surface2);border-radius:10px;padding:4px 0}
.hdate b{font-family:var(--disp);font-size:24px;line-height:1;font-weight:400}.hdate small{font-size:10.5px;color:var(--muted)}
.hname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpr{font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:2px 8px;white-space:nowrap}
.wx{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wsets{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;direction:ltr;justify-content:flex-end}
.wsets span{background:var(--surface2);border-radius:7px;padding:2px 7px;font-size:13px}
/* חצי ניווט: בלי היפוך אוטומטי של התו בעברית, כדי שהחץ יצביע לכיוון הנכון */
[data-act="food-nav"],[data-act="cal-nav"]{direction:ltr;unicode-bidi:isolate}
#tour{position:fixed;inset:0;z-index:90}
#tour.dim{background:rgba(8,12,10,.62)}
.tour-spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,12,10,.62);transition:all .25s ease;pointer-events:none;outline:2px solid var(--accent)}
.tour-card{position:fixed;inset-inline:16px;max-width:420px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 18px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.tour-card.mid{top:50%;transform:translateY(-50%)}
.tour-card h3{margin:6px 0 4px;font-size:19px}.tour-card p{margin:0;color:var(--muted);line-height:1.55}
.tour-dots{display:flex;gap:5px}.tour-dots i{width:6px;height:6px;border-radius:99px;background:var(--line)}.tour-dots i.on{width:18px;background:var(--accent)}
#instgate{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.ig-body{max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.ig-body h2{margin:0;font-size:24px;line-height:1.25}.ig-body p{margin:0;color:var(--muted);line-height:1.55}
.ig-icon{width:76px;height:76px;border-radius:18px;margin:0 auto;box-shadow:0 10px 24px -10px rgba(22,163,74,.7)}
.ig-steps{text-align:right;margin:0;padding:0;list-style:none;counter-reset:ig;display:grid;gap:10px}
.ig-steps li{counter-increment:ig;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 14px;display:flex;gap:12px;align-items:center;line-height:1.45}
.ig-steps li::before{content:counter(ig);flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.ig-skip{color:var(--muted);font-size:13px;text-decoration:underline;margin-top:6px}
.fi-title{display:flex;flex-direction:column;gap:1px}.fi-title b{font-size:17px}
.fsearch{position:relative}
.fsearch #food-text{width:100%;padding-inline-end:12px;padding-inline-start:96px;resize:none;min-height:50px;max-height:132px;line-height:1.45;font:inherit;font-size:16px;display:block}
.fs-go{position:absolute;inset-inline-start:6px;bottom:7px;padding:8px 12px;border-radius:9px;background:var(--surface2);color:var(--muted);font-weight:700;font-size:14px;transition:background .15s,color .15s}
.fsearch.has .fs-go,.fsearch.busy .fs-go{background:var(--accent);color:#fff}
.fs-ai{display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:11px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.fs-ai .fs-ai-ic{font-size:20px}.fs-ai b{display:block;font-size:14.5px}.fs-ai small{color:var(--muted);font-size:12px}
.fsugg .fs-ai:last-child{border-bottom:0;border-top:1px solid var(--line)}
.fs-head{padding:6px 12px;background:var(--surface2)}
.fi-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.fi-or::before,.fi-or::after{content:'';flex:1;height:1px;background:var(--line)}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts3 .acttile{padding:12px 4px;gap:2px;text-align:center}
.acts3 .acttile b{font-size:13.5px}.acts3 .acttile small{font-size:11px;color:var(--muted)}
.aiload{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent)}
.aiload img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0}
.ai-spark{font-size:26px;width:44px;text-align:center;flex-shrink:0}
@media (prefers-reduced-motion:no-preference){ .ai-spark{animation:aipulse 1.1s ease-in-out infinite} }
@keyframes aipulse{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(1.25) rotate(15deg);opacity:.7}}
.aiload .ai-q{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;font-size:14.5px}
.aiload{align-items:flex-start}.aiload .ai-spark{margin-top:4px}
.ai-track{height:5px;border-radius:99px;background:rgba(22,163,74,.18);margin-top:7px;overflow:hidden;display:flex;direction:rtl}
.ai-track i{display:block;height:100%;width:8%;border-radius:99px;background:var(--accent);transition:width .3s linear}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--muted);cursor:pointer}
.consent input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--accent)}
.consent a{color:var(--accent)}
.ld-legal{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.ld-legal a{color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:16px;color:var(--ink)}
.pb-cta{display:flex;gap:12px;align-items:center;width:100%;text-align:right;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--accent);margin-top:10px;box-shadow:0 8px 22px -14px rgba(22,163,74,.7)}
.pb-cta .pb-ic{font-size:28px}.pb-cta b{display:block;font-size:17px}.pb-cta small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.pb-top{display:flex;flex-direction:column;gap:6px}
.pb-prog{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.pb-prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.pb-list{display:flex;flex-direction:column;gap:8px}.pb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb-opt{display:flex;flex-direction:column;gap:2px;text-align:right;padding:13px 14px;border-radius:14px;background:var(--surface2);border:2px solid transparent;color:var(--ink)}
.pb-opt b{font-size:16px}.pb-opt small{color:var(--muted);font-size:13px}
.pb-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.pb-sess{background:var(--surface2);border-radius:14px;padding:12px 14px}
.pb-ex{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:5px 0;border-top:1px solid var(--line)}
.pb-ex:first-of-type{margin-top:6px}
/* ===== social ===== */
.tbadge{position:absolute;top:2px;inset-inline-end:22%;min-width:17px;height:17px;border-radius:99px;background:var(--danger,#DC2626);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.ld-invite{background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600}
.sg-card{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.sg-emo{width:48px;height:48px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;font-size:26px;flex-shrink:0}
.sg-mid{flex:1;min-width:0}
.sg-mid b{display:block}
.sg-last{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sg-card{overflow:hidden}
.sg-mid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .bub{overflow-wrap:anywhere}
.sg-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted)}
.sg-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.sg-head{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:5;padding:8px 0}
.sg-head .t{flex:1;min-width:0}
.sg-head .t b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;margin-bottom:6px}
.sg-seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;color:var(--muted)}
.sg-seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
body.chatting header.top{display:none}
body.chatting.kbopen nav.tabs{display:none}
body.chatting{overflow:hidden}
#chatroot{position:fixed;inset-inline:0;top:0;height:calc(100dvh - var(--tabsh,64px));max-width:560px;margin:0 auto;z-index:35;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 12px 0}
#chatroot .sg-head{position:static;padding-top:10px}
#chatlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:3px;padding:4px 2px 10px}
#chatroot .chatbar{position:static;margin:0 -12px;padding:8px 12px}
.cm{max-width:80%;align-self:flex-start;display:flex;flex-direction:column}
.cm.me{align-self:flex-end}
.cm .who{font-size:12px;color:var(--accent);font-weight:600;margin:8px 10px 2px}
.cm .bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:8px 12px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
.cm.me .bub{background:var(--accent);color:#fff;border-color:transparent;border-radius:16px 16px 5px 16px}
.cm .tm{font-size:10.5px;color:var(--muted);margin:2px 8px 0;align-self:flex-end}
.cm.me .tm{align-self:flex-start}
.c-sys{align-self:center;font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:99px;padding:4px 12px;margin:8px 0}
.c-day{align-self:center;font-size:12px;color:var(--muted);margin:12px 0 4px}
.c-card{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:6px 0;display:flex;flex-direction:column;gap:8px}
.c-card.pr{background:var(--gold-soft);border-color:var(--gold)}
.c-card .h{display:flex;gap:10px;align-items:center}
.c-card .h .ic2{font-size:24px}
.c-stats{display:flex;gap:16px}
.c-stats div{display:flex;flex-direction:column}
.c-stats b{font-family:var(--disp);font-size:28px;line-height:1;font-weight:400}
.c-stats span{font-size:11.5px;color:var(--muted)}
.c-reacts{display:flex;gap:6px}
.c-reacts button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:14px;display:flex;gap:4px;align-items:center}
.c-reacts button.on{border-color:var(--accent);background:var(--accent-soft)}
.c-reacts button small{font-size:12px;font-weight:600}
.chatbar{background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{flex:1;resize:none;max-height:120px;min-height:42px;border-radius:21px;padding:10px 14px;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chatbar button{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0}
.lb-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0}
.lb-rank{font-family:var(--disp);font-size:28px;line-height:1;text-align:center;color:var(--muted)}
.lb-row.top .lb-rank{color:var(--gold)}
.lb-big{font-family:var(--disp);font-size:32px;line-height:1;text-align:left}
.ch-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ch-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.ch-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.ch-mem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:14px}
.ch-mem .ch-bar{grid-column:1/-1}
.emo-pick{display:flex;gap:6px;flex-wrap:wrap}
.emo-pick button{width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:22px;border:2px solid transparent}
.emo-pick button.on{border-color:var(--accent)}
.inv-code{font-family:var(--disp);font-size:56px;letter-spacing:6px;text-align:center;direction:ltr;line-height:1;padding:10px;background:var(--surface2);border-radius:14px}
/* auth screen */
#authwrap{max-width:400px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:14px}
#authwrap .logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px}
#authwrap .logo img{width:84px;height:84px;border-radius:20px;box-shadow:var(--shadow)}
#authwrap .logo .brand{font-size:30px}
.autherr{color:var(--danger);font-size:14px;min-height:20px;text-align:center}
.authnote{color:var(--muted);font-size:13px;text-align:center}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;padding:4px}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:140px;min-height:60vh}
button{font-family:var(--body);font-size:15px;border:none;cursor:pointer;color:var(--ink);background:none;border-radius:12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible, input:focus-visible, a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font-family:var(--body);font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding:14px 0 10px; margin:0;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
}
.brand{font-family:var(--disp);font-size:32px;letter-spacing:.4px;line-height:1}
.brand b{color:var(--accent);font-weight:400}
.date-chip{color:var(--muted);font-size:13px}

/* cards & general */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.hot{border-inline-start:4px solid var(--accent);padding-inline-start:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.sect{font-family:var(--disp);font-size:23px;margin:22px 0 10px;letter-spacing:.3px}
.btn{background:var(--surface2);border:1px solid var(--line);padding:10px 14px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.big{width:100%;padding:15px;font-size:17px;border-radius:14px}
.btn.ghost{border:1px dashed var(--line);color:var(--muted);width:100%;padding:12px}
.btn.danger{color:var(--danger)}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.pr{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:700}

/* tab bar */
nav.tabs{
  position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:space-around;
}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;color:var(--muted);font-size:11.5px;border-radius:0;position:relative}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on::before{content:'';position:absolute;top:-7px;inset-inline:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs svg{width:23px;height:23px}
nav.tabs .ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* rest timer bar */
#restbar{
  position:fixed;inset-inline:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:29;
  display:flex;justify-content:center;padding:0 16px;
}
#restbar .inner{
  width:100%;max-width:528px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
}
#restbar .t{font-family:var(--disp);font-size:30px;line-height:1;min-width:64px}
#restbar .bar{flex:1;height:5px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
#restbar .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
#restbar button{color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);padding:6px 11px;font-size:13px}

/* active workout */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex-name{font-weight:700;font-size:16px}
.prev{font-size:12.5px;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center}
.setgrid .h{font-size:11px;color:var(--muted);text-align:center}
.setidx{text-align:center;color:var(--muted);font-size:13px}
.setgrid input{text-align:center;padding:9px 4px}
.done-btn{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.done-btn svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set-done input{background:var(--accent-soft);border-color:var(--accent)}
.set-done .done-btn{background:var(--accent);border-color:var(--accent)}
.set-done .done-btn svg{stroke:var(--accent-ink)}
.addset{margin-top:8px;width:100%;padding:9px;border:1px dashed var(--line);color:var(--muted);font-size:14px}

/* history */
.h-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.h-stats{display:flex;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.h-detail{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.h-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.h-ex .sets{color:var(--muted);text-align:left;direction:ltr}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{padding:14px 8px;text-align:center}
.tile+.tile{border-inline-start:1px solid var(--line)}
.tile .v{font-family:var(--disp);font-size:36px;line-height:1;color:var(--accent)}
.tile .k{font-size:11.5px;color:var(--muted);margin-top:2px}
.chartwrap{position:relative}
#tip{position:absolute;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-115%)}
svg text{font-family:var(--body)}
.prlist{display:flex;flex-direction:column}
.prlist .pr-row{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.prlist .pr-row:last-child{border-bottom:none}

/* modal sheet */
#sheet-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
#sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;
  box-shadow:var(--overlay-shadow);
  background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;

}
#sheet h3{font-family:var(--disp);font-size:19px;margin-bottom:12px}
.libgroups{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.libgroups .chip{flex-shrink:0}
.liblist{display:flex;flex-direction:column}
.liblist button{display:flex;justify-content:space-between;gap:10px;text-align:right;padding:12px 4px;border-bottom:1px solid var(--line);border-radius:0;font-size:15px}
.liblist button:last-child{border-bottom:none}
.liblist .in{color:var(--accent);font-size:13px;font-weight:500}

/* numpad — מקלדת מובנית בסגנון פלטות */
#np-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:58}
#np{position:fixed;inset-inline:0;bottom:0;z-index:59;max-width:560px;margin:0 auto;
  box-shadow:var(--overlay-shadow);
  background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));}
#np .npdisp{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:2px 0 10px}
#np .npval{font-family:var(--disp);font-size:60px;line-height:1;min-width:110px;text-align:center;letter-spacing:1px}
#np .npunit{color:var(--muted);font-size:15px}
#np .nptitle{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:2px}
.plates{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.plate{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
  color:#fff;position:relative;border:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),inset 0 0 0 11px rgba(0,0,0,.14),var(--shadow);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.plate:active{transform:scale(.92)}
.plate::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:var(--surface);box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.plate span{position:absolute;top:18%;font-size:12.5px}
.p20{width:66px;height:66px;background:#1d4ed8}

/* best historical weight per exercise (finished workouts only) */
function bestMap(){
  const m={};
  for(const w of S.workouts)for(const e of w.ex||[]){if(e.t!=='s')continue;
    for(const s of e.sets||[]){const wt=+s.w||0,r=+s.r||0;if(r>0&&wt>(m[e.n]?.w||0))m[e.n]={w:wt,r,ts:w.start};}}
  return m;
}
/* last performance per exercise */
function lastPerf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name);
    if(e){ if(e.t==='c') return e.c?`קודם: ${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`:null;
      const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
      return 'קודם: '+ss.map(s=>`${+s.w||0}×${+s.r||0}`).join(' · ');}}
  return null;
}
function lastSetsOf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name&&e.t==='s');
    if(e&&(e.sets||[]).some(s=>+s.r>0))return e.sets.filter(s=>+s.r>0);}
  return null;
}
/* מאמן חכם: אם בפעם הקודמת כל הסטים סגרו את קצה הטווח — הצעה לעלות משקל */
const e1rm=(w,r)=>r>0?w*(1+r/30):0;
function coachTip(name,repsRange,nSets){
  const last=lastSetsOf(name); if(!last||!last.length)return null;
  const nums=String(repsRange||'').match(/\d+/g); if(!nums)return null;
  const top=+nums[nums.length-1]; if(!top||top>30)return null; // טווחי שניות (פלאנק) לא רלוונטיים
  const maxW=Math.max(...last.map(s=>+s.w||0)); if(maxW<=0)return null;
  const enough=last.length>=Math.min(nSets||last.length,last.length);
  const allTop=last.every(s=>(+s.r||0)>=top);
  if(allTop&&enough){
    const inc=maxW>=40?2.5:(maxW>=15?2:1); // קפיצה קטנה יותר במשקלים קלים
    return {w:Math.round((maxW+inc)*10)/10, from:maxW};
  }
  return null;
}
/* היסטוריית ביצועים לתרגיל */
function historyOf(name){
  const out=[];
  for(const w of [...S.workouts].sort((a,b)=>b.start-a.start)){
    const e=(w.ex||[]).find(e=>e.n===name); if(!e)continue;
    if(e.t==='c'){ if(e.c&&(e.c.min||e.c.km))out.push({ts:w.start,txt:`${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`}); continue; }
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const best=Math.max(...ss.map(s=>e1rm(+s.w||0,+s.r||0)));
    out.push({ts:w.start,txt:ss.map(s=>`${+s.w||0}×${+s.r||0}`).join(' · '),e1:Math.round(best)});
  }
  return out;
}

const T={end:0,total:0,int:null};
let audioCtx=null;
function beep(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.12;
    o.start();o.stop(audioCtx.currentTime+.18);
    const o2=audioCtx.createOscillator();o2.connect(g);o2.frequency.value=1175;
    o2.start(audioCtx.currentTime+.22);o2.stop(audioCtx.currentTime+.42);
  }catch(e){}
}

  try{
    if(!('Notification' in window)||!('PushManager' in window))return;
    if(Notification.permission==='default'){
      let asked=false; try{asked=!!localStorage.getItem('np-rest-asked');}catch(e){}
      if(asked)return;
      try{localStorage.setItem('np-rest-asked','1');}catch(e){}
    }
    if(Notification.permission==='denied')return;
    const r=await subscribePush(); _pushOk=!!r.ok;
  }catch(e){}
}

function restoreRest(){

    if(r.end>Date.now()+500){ T.end=r.end;T.total=r.total;T.label=r.label;T.armed=r.armed;
      $('#restbar').hidden=false; clearInterval(T.int);T.int=setInterval(tickRest,250);tickRest(); }

function armServerRest(label){

  T.armed=true; saveRestState();
  const row={user_id:S.user.id,fire_at:new Date(T.end).toISOString(),title:'המנוחה נגמרה 💪',body:label?`הבא: ${label}`:'הסט הבא מחכה לך'};
  sb.from('rest_timers').upsert(row).then(({error})=>{ if(error){ console.error('rest arm',error); toast('לא הצלחנו לתזמן את התראת המנוחה — בדוק חיבור'); } },()=>{});
}
function disarmServerRest(){
  if(!T.armed||!S.user)return; T.armed=false; saveRestState();
  sb.from('rest_timers').delete().eq('user_id',S.user.id).then(()=>{},()=>{});
}
function startRest(sec,label){
  T.total=sec;T.end=Date.now()+sec*1000;T.label=label||'';
  $('#restbar').hidden=false;
  clearInterval(T.int);T.int=setInterval(tickRest,250);tickRest();
  ensureRestPush(); armServerRest(T.label); saveRestState();
}
function tickRest(){
  const left=Math.max(0,T.end-Date.now());
  const s=Math.ceil(left/1000);
  $('#rest-t').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('#rest-fill').style.width=(100*left/(T.total*1000))+'%';
  // האפליקציה פתוחה ממש בסוף המנוחה → מבטלים את הפוש מהשרת כדי שלא תהיה התראה כפולה
  if(left<=2000&&T.armed&&document.visibilityState==='visible')disarmServerRest();
  if(left<=0){stopRest();
    if(S.settings.notif?.sound!==false)beep();
    vibrate([200,100,200,100,400]);
    toast('המנוחה נגמרה — סט הבא!');

}

function startLandTimer(){

}

async function doAuth(){
  const email=($('#au-email')?.value||'').trim(), pass=$('#au-pass')?.value||'';
  const name=($('#au-name')?.value||'').trim(); S.authName=name;
  const err=$('#autherr'); if(err)err.textContent='';
  if(!email||!pass){if(err)err.textContent='מלא אימייל וסיסמה';return;}
  if(S.authMode==='signup'&&!name){if(err)err.textContent='מלא שם — ככה נדע איך לקרוא לך';return;}
  if(S.authMode==='signup'&&!$('#au-terms')?.checked){if(err)err.textContent='כדי להירשם יש לאשר את התקנון ומדיניות הפרטיות';return;}
  const btn=$('#authgo'); if(btn){btn.disabled=true;btn.textContent='רק רגע…';}
  try{
    if(S.authMode==='signup'){
      let ref=null; try{ref=localStorage.getItem('nr-ref');}catch(_){}
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:Object.assign({full_name:name,terms_accepted:new Date().toISOString(),terms_v:'2026-10-20'},ref?{ref}:{})}});
      if(error)throw error;
      if(!data.session){
        $('#view').innerHTML=`<div class="empty" style="margin-top:48px"><div class="big">כמעט שם ✉️</div>שלחנו קישור אישור אל<br><b dir="ltr">${esc(email)}</b><br>פתח את המייל, לחץ על הקישור — וחזור לכאן להתחבר.</div>`;
        return;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){
    const m=String(e?.message||'');
    if(err)err.textContent=
      /already registered/i.test(m)?'האימייל כבר רשום — נסה להתחבר':
      /invalid login/i.test(m)?'אימייל או סיסמה שגויים':
      /at least 6|too short/i.test(m)?'הסיסמה צריכה להיות באורך 6 תווים לפחות':
      /not confirmed/i.test(m)?'צריך לאשר קודם את המייל — בדוק את תיבת הדואר':
      /valid email/i.test(m)?'כתובת האימייל לא תקינה':
      'שגיאה: '+m;
  }finally{
    const b2=$('#authgo'); if(b2){b2.disabled=false;b2.textContent=S.authMode==='signup'?'הרשמה':'התחברות';}
  }
}

function greet(){
  const h=new Date().getHours();
  return h<5?'לילה טוב':h<12?'בוקר טוב':h<17?'צהריים טובים':h<22?'ערב טוב':'לילה טוב';
}
function firstName(){
  return String(S.user?.user_metadata?.full_name||'').trim().split(/\s+/)[0]||'';
}
function nextTpl(){
  const ts=[...S.templates].sort((a,b)=>(a.order||0)-(b.order||0));
  if(!ts.length)return null;
  const lastT=[...S.workouts].sort((a,b)=>b.start-a.start).find(w=>w.tid);
  if(!lastT)return ts[0];
  const i=ts.findIndex(t=>t.id===lastT.tid);
  return ts[(i+1)%ts.length]||ts[0];
}
function tplMinutes(t){
  let m=0;
  for(const e of t.ex||[]){ if(e.t==='c'){m+=15;continue;} const n=+e.s||3; m+=n*((+e.rest||90)+45)/60; }
  return Math.max(10,Math.round(m/5)*5);
}
function weekDots(){
  /* השבוע הקלנדרי הנוכחי: ראשון מימין (RTL), כמו לוח עברי */
  const trained=new Set(S.workouts.map(w=>new Date(w.start).toDateString()));
  const today=new Date(); today.setHours(0,0,0,0);
  const sun=new Date(today); sun.setDate(today.getDate()-today.getDay());
  let out='';
  for(let d=0;d<7;d++){
    const dt=new Date(sun); dt.setDate(sun.getDate()+d);
    const on=trained.has(dt.toDateString());
    const isToday=dt.getTime()===today.getTime();
    const hasSched=!!schedOf(d);
    const sched=!on&&hasSched&&dt>=today;
    const missed=!on&&hasSched&&dt<today;
    out+=`<div class="day ${on?'on':''} ${sched?'sched':''} ${missed?'miss':''} ${isToday?'today':''}"><span>${DAY_LETTERS[d]}</span><b class="dt num">${dt.getDate()}</b><i></i></div>`;
  }
  return out;
}
function weekStreak(){
  let streak=0;
  const ws=S.workouts.map(w=>w.start);
  for(let k=0;;k++){
    const end=new Date(); end.setHours(23,59,59,999); end.setDate(end.getDate()-end.getDay()-7*k+6);
    const start=new Date(end); start.setDate(end.getDate()-6); start.setHours(0,0,0,0);
    const has=ws.some(t=>t>=+start&&t<=+end);
    if(has)streak++;
    else{ if(k===0)continue; break; } // השבוע הנוכחי עוד לא נספר נגד הרצף
    if(k>260)break;
  }
  return streak;
}

function mealsOf(d){ return S.meals.filter(m=>m.d===d).sort((a,b)=>a.ts-b.ts); }
function dayTotals(d){
  const t={kcal:0,protein:0,carbs:0,fat:0};
  for(const m of mealsOf(d)){t.kcal+=+m.kcal||0;t.protein+=+m.protein||0;t.carbs+=+m.carbs||0;t.fat+=+m.fat||0;}
  for(const k in t)t[k]=Math.round(t[k]);
  return t;
}
function kcalRing(v,target){
  const pct=target?Math.min(1,v/target):0, R=52, C=2*Math.PI*R;
  const over=target&&v>target;
  return `<svg viewBox="0 0 130 130" width="128" role="img" aria-label="קלוריות היום" style="display:block">
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="11"/>
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="${over?'var(--gold)':'var(--accent)'}" stroke-width="11"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"
      transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .5s"/>
    <text x="65" y="60" text-anchor="middle" font-family="var(--disp)" font-size="30" fill="var(--ink)">${fmtNum(v)}</text>
    <text x="65" y="80" text-anchor="middle" font-size="11" fill="var(--muted)">${target?'מתוך '+fmtNum(target):'קק״ל'}</text>
  </svg>`;
}
function macroBar(label,v,target,col){

  return `<div>
    <div class="spread small"><span><span class="mdot" style="background:${col}"></span>${label}</span><span class="num muted">${v}${target?` / ${target}`:''} גר׳</span></div>
    <div style="height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:3px">
      <div style="width:${pct}%;height:100%;border-radius:99px;background:${col}"></div>
    </div>

}

}

function openPortion(f){

function portionCalc(){

  return {grams:Math.round(grams),kcal:k(p.f.kcal),protein:k(p.f.protein),carbs:k(p.f.carbs),fat:k(p.f.fat),
    show:{protein:d(p.f.protein),carbs:d(p.f.carbs),fat:d(p.f.fat)}};

function shrinkImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const MAX=768, sc=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.8).split(',')[1]);
    }catch(e){rej(e);} };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

/* ----- היסטוריה: בנויה למשתמש עם מאות אימונים ----- */
const HIST={q:'',tpl:'all',open:{}};
function histPRs(ws){ // אימונים שבהם נשבר שיא משקל בתרגיל
  const best={}, pr={};
  for(const w of [...ws].sort((a,b)=>a.start-b.start)){
    let n=0;
    for(const e of w.ex||[])if(e.t==='s'){ const top=Math.max(0,...(e.sets||[]).filter(x=>+x.r>0).map(x=>+x.w||0));
      if(top>0){ if(best[e.n]!=null&&top>best[e.n])n++; if(best[e.n]==null||top>best[e.n])best[e.n]=top; } }
    if(n)pr[w.id]=n;
  }
  return pr;
}
function histHeatmap(ws){
  const W=16, d0=new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate()-d0.getDay()-(W-1)*7);
  const vol={}; for(const w of ws){ const k=ymd(new Date(w.start)); vol[k]=(vol[k]||0)+Math.max(1,workoutVol(w)); }
  const vals=Object.values(vol).sort((a,b)=>a-b), q=p=>vals.length?vals[Math.floor((vals.length-1)*p)]:0;
  const lvl=v=>!v?0:v<=q(.33)?1:v<=q(.66)?2:3;
  const today=ymd(); let cols='', n=0;
  for(let c=0;c<W;c++){ let cells='';
    for(let r=0;r<7;r++){ const d=new Date(d0); d.setDate(d0.getDate()+c*7+r); const k=ymd(d); const v=vol[k]; if(v)n++;
      cells+=k>today?'<i class="hm f"></i>':`<i class="hm l${lvl(v)}${k===today?' t':''}" title="${k}"></i>`; }
    cols+=`<span class="hmc">${cells}</span>`; }
  return {html:`<div class="hmgrid">${cols}</div>`,days:n};
}
function vHistory(){
  const all=[...S.workouts].sort((a,b)=>b.start-a.start);
  if(!all.length)return `<div class="empty"><div class="big">עוד אין אימונים שמורים</div>האימון הראשון שתסיים יופיע כאן, עם כל הסטים והמשקלים.</div>`;
  const pr=histPRs(all);
  const since=Date.now()-84*864e5, recent=all.filter(w=>w.start>=since).length;
  const m0=new Date(); m0.setDate(1); m0.setHours(0,0,0,0); const thisMonth=all.filter(w=>w.start>=+m0).length;
  // 8 שבועות אחרונים: כמה אימונים בכל שבוע (ראשון עד שבת)
  const wk0=new Date(); wk0.setHours(0,0,0,0); wk0.setDate(wk0.getDate()-wk0.getDay());
  const weeks=[...Array(8)].map((_,i)=>{ const a=new Date(wk0); a.setDate(a.getDate()-(7-i)*7); const b=new Date(a); b.setDate(b.getDate()+7);
    return {a, n:all.filter(w=>w.start>=+a&&w.start<+b).length}; });
  const wmax=Math.max(3,...weeks.map(x=>x.n));
  // סינון: שם אימון / תרגיל
  const tplCount={}; for(const w of all)tplCount[w.name]=(tplCount[w.name]||0)+1;
  const tpls=Object.entries(tplCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const q=HIST.q.trim();
  const exHit=q?exerciseOptions().filter(n=>n.includes(q)).slice(0,3):[];
  const ws=all.filter(w=>(HIST.tpl==='all'||w.name===HIST.tpl)&&(!q||w.name.includes(q)||(w.ex||[]).some(e=>e.n.includes(q))));
  // קיבוץ לפי חודש
  const groups=[]; let cur=null;
  for(const w of ws){ const d=new Date(w.start), k=d.getFullYear()+'-'+(d.getMonth()+1);
    if(!cur||cur.k!==k){ cur={k,label:d.toLocaleDateString('he-IL',{month:'long',year:'numeric'}),items:[],vol:0,ms:0}; groups.push(cur); }
    cur.items.push(w); cur.vol+=workoutVol(w); cur.ms+=Math.max(0,(w.end||w.start)-w.start); }
  const filtering=q||HIST.tpl!=='all';
  return `
    <div class="tiles"><div class="tile"><div class="v num">${thisMonth}</div><div class="k">אימונים החודש</div></div><div class="tile"><div class="v num">${(recent/12).toFixed(1).replace('.0','')}</div><div class="k">בממוצע לשבוע</div></div><div class="tile"><div class="v num">${all.length}</div><div class="k">סה״כ אימונים</div></div></div>
    <div class="card" style="padding:14px;margin-top:10px">
      <div class="spread" style="margin-bottom:10px"><b>אימונים בכל שבוע</b><span class="small muted">8 שבועות אחרונים</span></div>
      <div class="wkbars">${weeks.map((x,i)=>`<div class="wkb ${i===7?'cur':''}"><span class="num">${x.n||''}</span><i style="height:${Math.round(x.n/wmax*100)}%"></i><small>${i===7?'השבוע':x.a.getDate()+'.'+(x.a.getMonth()+1)}</small></div>`).join('')}</div>
    </div>
    <div class="sect" style="margin-top:16px">כל האימונים</div>
    <input id="hist-q" type="search" class="adm-in" placeholder="🔍 חיפוש אימון או תרגיל, למשל: סקוואט" value="${esc(HIST.q)}">
    ${exHit.length?`<div class="row" style="gap:6px;margin-top:8px">${exHit.map(n=>`<button class="chip on" data-act="hist-ex" data-n="${esc(n)}">📈 ההתקדמות ב${esc(n)}</button>`).join('')}</div>`:''}
    ${tpls.length>1?`<div class="row" style="gap:6px;margin-top:8px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px">
      <button class="chip ${HIST.tpl==='all'?'on':''}" data-act="hist-tpl" data-t="all" style="flex-shrink:0">הכל</button>
      ${tpls.map(t=>`<button class="chip ${HIST.tpl===t?'on':''}" data-act="hist-tpl" data-t="${esc(t)}" style="flex-shrink:0">${esc(t)} <span class="muted">${tplCount[t]}</span></button>`).join('')}</div>`:''}
    ${!ws.length?`<div class="empty" style="margin-top:12px">לא נמצאו אימונים${q?` עם ״${esc(q)}״`:''}</div>`:''}
    ${groups.map((g,gi)=>{ const open=filtering||HIST.open[g.k]!=null?(filtering||HIST.open[g.k]):gi<2;
      return `<button class="hmonth" data-act="hist-month" data-k="${g.k}" aria-expanded="${open}">
        <span><b>${g.label}</b><span class="small muted" style="display:block">${g.items.length} אימונים · ${fmtNum(g.vol)} ק״ג · ${Math.round(g.ms/36e5)} שעות</span></span>
        <span class="muted">${open?'▾':'◂'}</span></button>
      ${open?`<div class="card" style="padding:0 12px">${g.items.map(w=>hRow(w,pr[w.id])).join('')}</div>`:''}`;}).join('')}`;
}
function hRow(w,prs){

        <div class="wsets">${sets.map(x=>`<span class="num">${+x.w||0}×${+x.r||0}</span>`).join('')}</div></button>`;}).join('')}</div>

function bwChange(days){
  const ws=S.weights||[]; if(ws.length<2)return null;
  const last=ws[ws.length-1];
  const cutoff=new Date(last.d); cutoff.setDate(cutoff.getDate()-days);
  const cs=ymd(cutoff);
  let base=null; for(const p of ws){ if(p.d<=cs)base=p; }
  if(!base)base=ws[0]; if(base===last)return null;
  return Math.round((last.kg-base.kg)*10)/10;
}
function deltaChip(v,label){

}

function bwChartHTML(goal){
  const ws=(S.weights||[]).slice(-90);
  if(ws.length<2)return `<div class="empty" style="margin-top:12px"><div class="big">הגרף יופיע אחרי שתי שקילות</div>מומלץ להישקל בבוקר, אחרי שירותים ולפני אוכל — כך הנתון הכי עקבי.</div>`;
  const W=520,H=170,L=40,R=14,Tp=14,B=24;
  const xs=ws.map(p=>+new Date(p.d)), ys=ws.map(p=>p.kg).concat(goal?[goal]:[]);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const lo=Math.floor(Math.min(...ys)-1), hi=Math.ceil(Math.max(...ys)+1);
  const X=t=>L+(W-L-R)*((t-x0)/Math.max(1,(x1-x0)));
  const Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/Math.max(1,hi-lo));
  const path=ws.map((p,i)=>`${i?'L':'M'}${X(+new Date(p.d)).toFixed(1)},${Y(p.kg).toFixed(1)}`).join('');
  const area=`${path} L${X(x1).toFixed(1)},${H-B} L${X(x0).toFixed(1)},${H-B} Z`;
  const mid=Math.round((lo+hi)/2);
  return `<div class="card" style="margin-top:12px">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף משקל גוף" style="direction:ltr;display:block">
      ${[lo,mid,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`).join('')}
      ${goal?`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-R}" y="${Y(goal)-5}" font-size="11" text-anchor="end" fill="var(--gold)">יעד ${goal}</text>`:''}
      <path d="${area}" fill="var(--accent)" opacity="0.1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${ws.map((p,i)=>`<circle cx="${X(+new Date(p.d)).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="${i===ws.length-1?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtDate(x0)}</text>
      <text x="${W-R}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtDate(x1)}</text>
    </svg>
  </div>`;
}

const ANGLES=[['front','חזית'],['back','גב'],['side','צד']];
const PH={sets:[],urls:{},loaded:false,loading:false,busy:null};
async function loadPhotos(force){
  if(!S.user||PH.loading||(PH.loaded&&!force))return;
  PH.loading=true;
  try{
    const {data,error}=await sb.storage.from('progress').list(S.user.id,{limit:1000,sortBy:{column:'name',order:'desc'}});
    if(error)throw error;
    const by={};
    for(const f of data||[]){ const m=/^(\d{4}-\d{2}-\d{2})_(front|back|side)\.jpg$/.exec(f.name); if(!m)continue;
      (by[m[1]]=by[m[1]]||{d:m[1]})[m[2]]=`${S.user.id}/${f.name}`; }
    PH.sets=Object.values(by).sort((a,b)=>a.d<b.d?1:-1);
    const paths=PH.sets.flatMap(s=>ANGLES.map(([k])=>s[k]).filter(Boolean)).filter(p=>!PH.urls[p]);
    if(paths.length){
      const {data:signed}=await sb.storage.from('progress').createSignedUrls(paths,3600);
      for(const x of signed||[])if(x.signedUrl)PH.urls[x.path]=x.signedUrl;
    }
    PH.loaded=true;
  }catch(e){ console.error(e); }
  PH.loading=false;
  if((S.tab==='home'||(S.tab==='track'&&S.trackView==='body'))&&$('#sheet').hidden&&$('#np').hidden)render();
}
function shrinkBlob(file,max=1280){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82);
    }catch(e){rej(e);} };
    img.onerror=rej; img.src=URL.createObjectURL(file);
  });
}
async function uploadPhoto(file,date,angle){
  if(!navigator.onLine){toast('העלאת תמונות דורשת חיבור לרשת');return;}
  PH.busy=angle; openPhotoSet(date);
  try{
    const blob=await shrinkBlob(file);
    const path=`${S.user.id}/${date}_${angle}.jpg`;
    const {error}=await sb.storage.from('progress').upload(path,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});
    if(error)throw error;
    const {data:s}=await sb.storage.from('progress').createSignedUrl(path,3600);
    if(s?.signedUrl)PH.urls[path]=s.signedUrl;
    let set=PH.sets.find(x=>x.d===date); if(!set){set={d:date};PH.sets.unshift(set);PH.sets.sort((a,b)=>a.d<b.d?1:-1);}
    set[angle]=path;
    toast('התמונה נשמרה 📸');
  }catch(e){ console.error(e); toast('ההעלאה נכשלה — נסה שוב'); }
  PH.busy=null; openPhotoSet(date);
}
async function deletePhoto(date,angle){

function bwCalendarHTML(){
  const now=new Date();
  const [yy,mm]=(S.calMonth||`${now.getFullYear()}-${now.getMonth()+1}`).split('-').map(Number);
  const first=new Date(yy,mm-1,1), daysIn=new Date(yy,mm,0).getDate();
  const today=ymd();
  const byDay={}; for(const p of S.weights||[])byDay[p.d]=p.kg;
  const phDays=new Set((PH.sets||[]).map(x=>x.d)); const pdw=S.settings.photoDay!=null?+S.settings.photoDay:null;
  const sorted=(S.weights||[]).map(p=>p.d).sort();
  const prevOf=d=>{ let pv=null; for(const x of sorted){ if(x>=d)break; pv=x; } return pv?byDay[pv]:null; };
  const monthVals=[]; for(let i=1;i<=daysIn;i++){ const k=ymd(new Date(yy,mm-1,i)); if(byDay[k]!=null)monthVals.push(byDay[k]); }

async function deleteBodyweight(d){
  S.weights=(S.weights||[]).filter(x=>x.d!==d); saveSnapshot(); render();
  try{ const {error}=await sb.from('bodyweight').delete().eq('d',d); if(error)throw error; toast('השקילה נמחקה'); }
  catch(e){ toast('המחיקה נכשלה — בדוק חיבור'); }
}
async function saveBodyweight(val,date){
  const v=val!=null?+val:parseFloat(($('#bw-input')?.value||'').replace(',','.'));
  if(!v||v<25||v>400){toast('הקלד משקל תקין בק״ג');return;}
  const d=date||ymd();
  S.weights=(S.weights||[]).filter(x=>x.d!==d); S.weights.push({d,kg:v}); S.weights.sort((a,b)=>a.d<b.d?-1:1);
  saveSnapshot(); render();
  const row={user_id:S.user.id,d,kg:v};
  try{ const {error}=await sb.from('bodyweight').upsert(row); if(error)throw error; toast('נשמר 💪'); }
  catch(e){ qPush('bodyweight',row); toast('נשמר מקומית — יסונכרן כשתחזור רשת'); }
}
function chartData(){
  const pts=[];
  for(const w of [...S.workouts].sort((a,b)=>a.start-b.start)){
    const e=(w.ex||[]).find(e=>e.n===S.progressEx&&e.t==='s'); if(!e)continue;
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const top=Math.max(...ss.map(s=>+s.w||0));
    const vol=ss.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);
    pts.push({ts:w.start, v:S.progressMetric==='top'?top:vol});
  }
  return pts;
}
function niceTicks(max){
  if(max<=0)return [0,5,10];
  const raw=max/3, pow=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=pow; for(const m of [1,2,2.5,5,10]){if(raw<=m*pow){step=m*pow;break;}}
  const top=Math.ceil(max/step)*step, t=[];
  for(let v=0;v<=top+1e-9;v+=step)t.push(Math.round(v*100)/100);
  return t;
}
function chartSVG(){
  const pts=chartData();
  if(pts.length<2)return `<div class="muted small" style="padding:18px 4px;text-align:center">צריך לפחות שני אימונים עם ״${esc(S.progressEx||'')}״ בשביל קו — בינתיים: ${pts.length?`<b class="num">${fmtNum(pts[0].v)}</b> ${S.progressMetric==='top'?'ק״ג':'ק״ג נפח'}`:'אין נתונים'}</div>`;
  const W=520,H=230,L=44,R=14,Tp=16,B=30;
  const xs=pts.map(p=>p.ts), ys=pts.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const ticks=niceTicks(Math.max(...ys)); const y1=ticks[ticks.length-1]||1;
  const X=t=>L+(W-L-R)*((t-x0)/Math.max(1,(x1-x0)));
  const Y=v=>Tp+(H-Tp-B)*(1-v/y1);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area=`${path} L${X(x1).toFixed(1)},${Y(0)} L${X(x0).toFixed(1)},${Y(0)} Z`;
  const iMax=ys.indexOf(Math.max(...ys));
  const lbl=(i)=>`<text x="${X(pts[i].ts)}" y="${Y(pts[i].v)-9}" font-size="11.5" text-anchor="middle" fill="var(--ink)" font-weight="600">${fmtNum(pts[i].v)}</text>`;
  const labelIdx=new Set([0,pts.length-1,iMax]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף התקדמות" style="direction:ltr;display:block">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtNum(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle data-pt="${i}" cx="${X(p.ts).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===iMax?5.5:4}" fill="${i===iMax?'var(--gold)':'var(--accent)'}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`).join('')}
    ${[...labelIdx].map(lbl).join('')}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="start">${fmtDate(x0)}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function wireChart(){
  const wrap=$('#chartwrap'); if(!wrap)return;
  wrap.addEventListener('click',ev=>{
    const c=ev.target.closest('[data-pt]');
    let tip=$('#tip'); if(tip)tip.remove();
    if(!c)return;
    const i=+c.dataset.pt, pts=chartData(), p=pts[i]; if(!p)return;
    tip=document.createElement('div');tip.id='tip';
    tip.textContent=`${fmtDate(p.ts)} · ${fmtNum(p.v)} ק״ג`;
    wrap.appendChild(tip);
    const cr=c.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
    tip.style.left=(cr.left-wr.left+cr.width/2)+'px';
    tip.style.top=(cr.top-wr.top)+'px';
    setTimeout(()=>tip&&tip.remove(),2600);
  });
}

       :c.applyDone?`<button class="btn primary big" style="flex:2" data-npc="savedone">שמור סט ✓</button><button class="btn big" style="flex:1" data-npc="save">שמור</button>`
       :`${c.extra?`<button class="btn danger big" style="flex:1" data-npc="extra">${esc(c.extra.label)}</button>`:''}<button class="btn primary big" style="flex:2" data-npc="save">שמור</button>`}
    </div>`;
  const rack=$('#rack');
  if(rack){
    rack.addEventListener('scroll',()=>{ clearTimeout(NP._rt); NP._rt=setTimeout(rackPick,90); });
    requestAnimationFrame(()=>centerRack(false));
  }
}
function centerRack(smooth){
  const rack=$('#rack'); if(!rack)return;
  NP._lock=Date.now()+600; // גלילה תכנותית — לא בחירה של המשתמש
  const items=[...rack.querySelectorAll('.dbitem')];
  let best=items[0],bd=1e9;
  for(const it of items){ const d=Math.abs(+it.dataset.rackv-(NP.val||10)); if(d<bd){bd=d;best=it;} }
  items.forEach(it=>it.classList.toggle('sel',+it.dataset.rackv===NP.val||it===best&&bd===0));
  const left=best.offsetLeft-(rack.clientWidth-best.offsetWidth)/2;
  rack.scrollTo({left,behavior:smooth?'smooth':'instant'});
}
function rackPick(){
  if(Date.now()<(NP._lock||0))return;
  const rack=$('#rack'); if(!rack)return;
  const mid=rack.scrollLeft+rack.clientWidth/2;
  const items=[...rack.querySelectorAll('.dbitem')];
  let best=null,bd=1e9;
  for(const it of items){ const c=it.offsetLeft+it.offsetWidth/2, d=Math.abs(c-mid); if(d<bd){bd=d;best=it;} }
  if(!best)return;
  const v=+best.dataset.rackv;
  if(v!==NP.val){ NP.val=v; vibrate(8); const el=$('#npval'); if(el)el.textContent=npFmt(v); }
  items.forEach(it=>it.classList.toggle('sel',it===best));
}
function npUpdate(){ const el=$('#npval'); if(el)el.textContent=NP.cfg.mode==='num'?(NP.str||'0'):npFmt(NP.val);
  if(NP.cfg.mode==='reps'||NP.cfg.mode==='count'||NP.cfg.mode==='secs')renderNumpad();
  else if(NP.cfg.mode==='weight'&&NP.sub==='db'){ // כוונון ידני: עדכון הדגשה בלי לגעת בגלילה
    document.querySelectorAll('.dbitem').forEach(it=>it.classList.toggle('sel',+it.dataset.rackv===NP.val)); }
  else if(NP.cfg.mode==='weight'&&NP.sub==='stack'){
    document.querySelectorAll('.splate').forEach(p=>{ const v=+p.dataset.stackv;
      p.classList.toggle('on',v<=NP.val); p.classList.toggle('pin',v===NP.val); }); } }
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-npadd],[data-npset],[data-npd],[data-npc],[data-npsub],[data-rackv],[data-stackv]'); if(!t||!NP.cfg)return;
  vibrate(10);
  if(t.dataset.npsub!==undefined){ NP.sub=t.dataset.npsub;
    if(NP.cfg.exName){ try{const m=padModes();m[NP.cfg.exName]=NP.sub;localStorage.setItem(PAD_KEY,JSON.stringify(m));}catch(e){} }
    renderNumpad(); return; }
  if(t.dataset.rackv!==undefined){ NP.val=+t.dataset.rackv; centerRack(true); const el=$('#npval'); if(el)el.textContent=npFmt(NP.val); return; }
  if(t.dataset.stackv!==undefined){ NP.val=+t.dataset.stackv;
    const el=$('#npval'); if(el)el.textContent=npFmt(NP.val);
    document.querySelectorAll('.splate').forEach(p=>{ const v=+p.dataset.stackv;
      p.classList.toggle('on',v<=NP.val); p.classList.toggle('pin',v===NP.val); });
    return; }
  if(t.dataset.npadd!==undefined){ NP.val=Math.max(0,Math.round((NP.val+ +t.dataset.npadd)*100)/100); }
  else if(t.dataset.npset!==undefined){ NP.val=+t.dataset.npset;
    if(NP.cfg.mode==='reps'&&NP.cfg.chain){ // בזרימה: בחירת חזרות = שמירת הסט
      const c=NP.cfg,v=NP.val; closeNumpad(); c.apply(v); c.applyDone&&c.applyDone(); return; } }
  else if(t.dataset.npd!==undefined){ const d=t.dataset.npd;
    if(d==='.'&&NP.str.includes('.'))return;
    if(NP.str.replace('.','').length>=5)return;
    NP.str=(NP.str==='0'&&d!=='.'?'':NP.str)+d; NP.val=parseFloat(NP.str)||0; }
  else if(t.dataset.npc==='back'){ NP.str=NP.str.slice(0,-1); NP.val=parseFloat(NP.str)||0; }
  else if(t.dataset.npc==='clear'){ NP.val=0; NP.str=''; }
  else if(t.dataset.npc==='save'){ const c=NP.cfg, v=c.mode==='num'?(parseFloat(NP.str)||0):NP.val; closeNumpad(); c.apply(v); return; }
  else if(t.dataset.npc==='savedone'){ const c=NP.cfg, v=c.mode==='num'?(parseFloat(NP.str)||0):NP.val; closeNumpad(); c.apply(v); c.applyDone&&c.applyDone(); return; }
  else if(t.dataset.npc==='extra'){ const c=NP.cfg; closeNumpad(); c.extra&&c.extra.fn(); return; }
  else if(t.dataset.npc==='next'){ const c=NP.cfg, v=NP.val; closeNumpad(); c.apply(v); c.next&&c.next(); return; }
  npUpdate();
});
/* מקלדת לסט באימון פעיל: משקל ← חזרות ← הסט נשמר */
function openSetPad(ei,si,kind,chain){
  const e=S.active?.ex[ei], s=e?.sets?.[si]; if(!s)return;
  const isW=kind==='w';
  const tip=isW?coachTip(e.n,e.reps,e.sets.length):null;
  const markDone=()=>{ if(!s.done){ const btn=document.querySelector(`[data-act="set-done"][data-ei="${ei}"][data-si="${si}"]`); if(btn)btn.click(); } };
  openNumpad({
    title:`${e.n} · סט ${si+1} · ${isW?'משקל':'חזרות'}`,
    unit:isW?'ק״ג':'חזרות', mode:isW?'weight':'reps', exName:e.n, chain:!!chain,
    value:+(s[kind]||s[isW?'pw':'pr']||0), prev:+(s[isW?'pw':'pr'])||null, tip:tip?tip.w:null,
    apply(v){ s[kind]=v||''; const inp=document.getElementById(`${kind}-${ei}-${si}`); if(inp)inp.value=v||''; persistActive(); },
    next:isW?()=>openSetPad(ei,si,'r',true):null,
    applyDone:isW?null:markDone,
  });
}
/* פתיחת המקלדת מכל שדה עם data-np */
document.addEventListener('click',ev=>{

const USD_ILS=3.7;
const A={tab:'overview',ov:null,users:{q:'',filter:'all',rows:[],total:0,loading:false},cfg:null,events:null,msgs:null,msgFilter:'open',err:null};
const ADM_FILTERS=[['all','הכל'],['pending','ממתינים'],['trial','בניסיון'],['paying','משלמים'],['expiring','מסתיימים בשבוע'],['expired','פג תוקף'],['blocked','חסומים']];
const ACC={approved:['פעיל','var(--accent)'],pending:['ממתין','#D97706'],rejected:['חסום','#DC2626'],admin:['אדמין','var(--ink)']};
function agoHe(d){
  if(!d)return '—';
  const days=Math.round((new Date(ymd())-new Date(ymd(new Date(d))))/864e5);
  return days<=0?'היום':days===1?'אתמול':days<7?`לפני ${days} ימים`:days<30?`לפני ${Math.round(days/7)} שב׳`:`לפני ${Math.round(days/30)} חוד׳`;
}
const money=u=>{u=+u||0;const ils=u*USD_ILS;return ils<1?`${(ils*100).toFixed(ils*100<1?2:1)} אג׳`:`₪${ils.toFixed(2)}`;};
const dShort=d=>d?new Date(d).toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'}):'—';
function userState(u){
  if(u.access==='admin')return ['אדמין','var(--ink)'];
  if(u.access==='pending')return ['ממתין לאישור','#D97706'];
  if(u.access==='rejected')return ['חסום','#DC2626'];
  const until=u.until?new Date(u.until):null, paid=u.access_until&&new Date(u.access_until)>new Date();
  if(!until||until<=new Date())return ['פג תוקף','#DC2626'];
  return paid?['משלם','var(--accent)']:['בניסיון','#2F6FD6'];
}
const badgeHTML=([t,c])=>`<span style="border:1px solid ${c};color:${c};border-radius:99px;padding:1px 8px;font-size:11px;white-space:nowrap">${t}</span>`;

function adminChart(daily){
  const W=340,H=120,pb=18,n=daily.length,bw=W/n;
  const mx=Math.max(1,...daily.map(x=>x.active));
  const bars=daily.map((x,i)=>{const h=(x.active/mx)*(H-pb-14);const xx=W-(i+1)*bw;
    return `<rect x="${(xx+1.5).toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(bw-3).toFixed(1)}" height="${Math.max(h,x.active?2:0).toFixed(1)}" rx="2" fill="var(--accent)" opacity="${i===n-1?1:.75}"><title>${x.d}: ${x.active} פעילים${x.signups?`, ${x.signups} נרשמו`:''}${+x.rev?`, ₪${x.rev}`:''}</title></rect>`+
      (x.signups?`<circle cx="${(xx+bw/2).toFixed(1)}" cy="${(H-pb-h-6).toFixed(1)}" r="3" fill="var(--ink)"/>`:'')+
      (+x.rev?`<text x="${(xx+bw/2).toFixed(1)}" y="${(H-pb-h-(x.signups?12:5)).toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--gold)">₪</text>`:'');}).join('');
  const lbl=[[0,W-1,'end'],[Math.floor(n/2),W-(Math.floor(n/2)+.5)*bw,'middle'],[n-1,1,'start']].map(([i,x,an])=>{const d=new Date(daily[i].d);return `<text x="${x.toFixed(1)}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="${an}">${i===n-1?'היום':d.getDate()+'.'+(d.getMonth()+1)}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;direction:ltr"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${bars}${lbl}
    <text x="${W-2}" y="10" font-size="10" fill="var(--muted)" text-anchor="end">מקס׳ ${mx}</text></svg>`;
}

function qrSVG(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:6,margin:2,scalable:true}); }

/* --- barcode scanner --- */
const SCAN={stream:null,timer:null,reader:null,busy:false,zx:null};
function stopScan(){ clearInterval(SCAN.timer); SCAN.timer=null; try{SCAN.reader?.reset?.();}catch(_){} SCAN.reader=null; SCAN.stream?.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
function loadZXing(){ return window.ZXing?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function zxReader(){
  if(SCAN.zx)return SCAN.zx;
  const hints=new Map(), F=ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const r=new ZXing.MultiFormatReader(); r.setHints(hints); SCAN.zx=r; return r;
}
// פענוח מתוך canvas. מנסה גם בניגודיות רגילה וגם הפוכה
function zxDecodeCanvas(c){
  try{ const res=zxReader().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))); return res&&res.getText(); }catch(_){ return null; }
}
async function openScanner(){
  SCAN.busy=false;
  openSheet(`<h3>סריקת ברקוד</h3>
    <div class="scanwrap"><video id="scanv" playsinline muted autoplay></video><div class="frame"></div></div>
    <div class="small muted" id="scanmsg" style="text-align:center;margin:8px 0">כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ</div>
    <div class="row" style="flex-wrap:nowrap"><input id="scan-code" type="text" inputmode="numeric" dir="ltr" placeholder="או הקלד את המספר" style="flex:1;text-align:center">
      <button class="btn primary" data-act="scan-go">חפש</button></div>
    <button class="btn big" style="margin-top:10px" data-act="scan-close">סגור</button>`);
  const msg=t=>{const m=$('#scanmsg'); if(m)m.textContent=t;};
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#scanv'); if(!v){stopScan();return;}
    v.setAttribute('playsinline',''); v.muted=true; v.srcObject=SCAN.stream; await v.play().catch(()=>{});
    try{ const tr=SCAN.stream.getVideoTracks()[0], cap=tr.getCapabilities?.(); if(cap?.focusMode?.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(_){}
    let native=null;
    if('BarcodeDetector' in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('ean_13'))native=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>f.includes(x))}); }catch(_){} }
    if(!native){ msg('טוען סורק…'); try{ await loadZXing(); }catch(_){ msg('הסורק לא נטען (אין רשת?). אפשר להקליד את המספר שמתחת לברקוד.'); return; } msg('כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ'); }
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    let tick=0;
    SCAN.timer=setInterval(async()=>{
      if(SCAN.busy||!v.videoWidth)return; tick++;
      if(native){ try{ const r=await native.detect(v); if(r[0]?.rawValue)onBarcode(r[0].rawValue); }catch(_){} return; }
      // חותכים את אזור המסגרת ומקטינים לרוחב סביר — מהיר ומדויק יותר בטלפון
      const vw=v.videoWidth, vh=v.videoHeight, cw=Math.round(vw*(tick%2?0.8:0.6)), ch=Math.round(vh*0.5), sx=(vw-cw)/2, sy=(vh-ch)/2;
      const sc=Math.min(1,1000/cw); c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
      ctx.drawImage(v,sx,sy,cw,ch,0,0,c.width,c.height);
      const t=zxDecodeCanvas(c); if(t)onBarcode(t);
      if(tick===40)msg('לא מזהה? נסה עם יותר אור, או הקלד את המספר שמתחת לברקוד');
    },180);
  }catch(e){ msg('אין גישה למצלמה. אפשר להקליד את המספר שמתחת לברקוד, או לאשר מצלמה בהגדרות.'); }
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(code.length<6||SCAN.busy)return;
  SCAN.busy=true; try{navigator.vibrate?.(40);}catch(_){}
  const m=$('#scanmsg'); if(m)m.textContent=`מחפש ${code}…`;
  stopScan();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/food-barcode?code=${code}`,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});
    if(r.status===404){ openLabelPrompt(code); return; }
    const j=await r.json(); if(!j.product)throw new Error('x');
    openProduct(j.product);
  }catch(e){ toast('החיפוש נכשל, נסה שוב'); closeSheet(); }
}

}
