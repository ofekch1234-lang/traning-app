function tourPlace(st,tries=0){
  const el=$('#tour'); if(!el||!TOUR.on||tourSteps()[TOUR.i]!==st)return; const spot=el.querySelector('.tour-spot'), card=el.querySelector('.tour-card');
  const t=st.sel&&[...document.querySelectorAll(st.sel)].find(x=>x.offsetParent!==null);
  if(!t){ spot.hidden=true; el.classList.add('dim'); card.style.top=''; card.style.bottom=''; card.classList.add('mid'); return; }
  el.classList.remove('dim'); card.classList.remove('mid');
  const r=t.getBoundingClientRect(), pad=6;
  const fixed=!!t.closest('nav.tabs,header.top');
  if(!fixed&&tries<3&&(r.top<(scrollY>0?70:0)||r.bottom>innerHeight-90)){ t.scrollIntoView({block:'center'}); return setTimeout(()=>tourPlace(st,tries+1),250); }
  Object.assign(spot.style,{top:(r.top-pad)+'px',left:(r.left-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'}); spot.hidden=false;

function tourAct(act,b){

    case 'tour-back': TOUR.i=Math.max(0,TOUR.i-1); tourShow(); return true;

      if(cand)cand.s--; else { const iso=ex.find(x=>x.t==='s'&&x.rest>60); if(iso)iso.rest-=15; else { const c=ex.find(x=>x.t==='c'); if(c&&c.min>5)c.min-=5; else { const i=ex.length>3?pickRemove():-1; if(i<0)break; ex.splice(i,1); } } } }
    const letter='ABCDEF'[si];
    // אם לשריר שבשם האימון לא נשאר תרגיל (למשל בלי ציוד אין תרגיל ליד קדמית), השם מתעדכן לפי מה שבאמת יש

}

function badgeStats(){

  return { n:W.length, streak:best, prs:Object.values(histPRs(W)).reduce((a,b)=>a+b,0), vol:W.reduce((a,w)=>a+workoutVol(w),0),
    month:Math.max(0,...Object.values(months)), early:W.some(w=>new Date(w.start).getHours()<7)?1:0, night:W.some(w=>new Date(w.start).getHours()>=22)?1:0 };

function drawGreen(x,W,H,o){
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#14532d'); g.addColorStop(.55,'#16A34A'); g.addColorStop(1,'#0f766e'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.globalAlpha=.08; x.fillStyle='#fff'; x.beginPath(); x.arc(W*.85,H*.12,300,0,7); x.fill(); x.beginPath(); x.arc(W*.1,H*.92,260,0,7); x.fill(); x.globalAlpha=1;
  x.textAlign='center'; x.fillStyle='#fff'; stDir(x);
  stLtr(x,()=>{ x.font=stF(400,96,'Karantina'); x.fillText('NextRep',W/2,140); });
  if(o.top){ x.font=stF(500,40); x.globalAlpha=.85; x.fillText(tt(o.top),W/2,215); x.globalAlpha=1; }
  x.font=`260px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; x.fillText(o.emoji,W/2,560);
  x.font=stF(700,84); x.fillText(tt(o.title),W/2,720,W-120);
  if(o.sub){ x.font=stF(400,42); x.globalAlpha=.88; x.fillText(tt(o.sub),W/2,790,W-140); x.globalAlpha=1; }
  if(o.stats?.length){ const n=o.stats.length, bw=(W-120-(n-1)*24)/n;
    o.stats.forEach(([v,k],i)=>{ const bx=LANG==='en'?60+i*(bw+24):W-60-bw-i*(bw+24);
      x.globalAlpha=.16; x.fillStyle='#fff'; x.beginPath(); if(x.roundRect)x.roundRect(bx,900,bw,210,28); else x.rect(bx,900,bw,210); x.fill(); x.globalAlpha=1;
      stLtr(x,()=>{ x.font=stF(400,104,'Karantina'); x.fillText(String(v),bx+bw/2,1010,bw-20); });
      x.font=stF(500,34); x.globalAlpha=.9; x.fillText(tt(k),bx+bw/2,1070,bw-20); x.globalAlpha=1; }); }
  x.font=stF(500,34); x.globalAlpha=.75; x.fillText(location.host,W/2,H-60); x.globalAlpha=1;
}
function drawCover(x,img,W,H,mirror){
  const iw=img.videoWidth||img.width, ih=img.videoHeight||img.height; const sc=Math.max(W/iw,H/ih); const dw=iw*sc, dh=ih*sc;
  x.save(); if(mirror){ x.translate(W,0); x.scale(-1,1); } x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh); x.restore();
}
async function composeShare(){
  await stFonts(); const o=STD.opts;
  if(!STD.bg){ const c=document.createElement('canvas'); c.width=1080; c.height=1350; drawGreen(c.getContext('2d'),1080,1350,o); return c; }
  const W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  drawCover(x,STD.bg,W,H,false);
  const cy=[H*.2,H*.5,H*.78][STD.pos]; const gr=x.createLinearGradient(0,cy-520,0,cy+420); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.5,'rgba(0,0,0,.38)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr; x.fillRect(0,cy-520,W,940);
  drawSticker(x,W,H,o,STD.style,STD.pos); return c;
}
async function stickerOnlyURL(){ await stFonts(); const W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; drawSticker(c.getContext('2d'),W,H,STD.opts,STD.style,STD.pos); return c.toDataURL('image/png'); }
async function stPreview(){

  const el=$('#st-prev'); if(el){ el.src=STD.url; el.style.opacity=1; el.style.aspectRatio=STD.bg?'9/16':'4/5'; }

async function stShare(){
  if(STD.busy)return; STD.busy=true;
  try{ const c=await composeShare(); const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
    const file=new File([blob],'nextrep.jpg',{type:'image/jpeg'});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:tt('💪 נרשם ב-NextRep')}); STD.busy=false; return; } }catch(e){ if(e&&e.name==='AbortError'){STD.busy=false;return;} }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nextrep.jpg'; document.body.appendChild(a); a.click(); a.remove(); toast('התמונה נשמרה');
  }finally{ STD.busy=false; }
}
/* מצלמה חיה עם המדבקה מעל */
async function stCamOpen(){
  stCamStop();
  let el=$('#stcam'); if(!el){ el=document.createElement('div'); el.id='stcam'; document.body.appendChild(el); }
  el.innerHTML=`<div class="stc-frame"><video id="stc-v" playsinline muted autoplay></video><img id="stc-st" alt=""></div>
    <div class="stc-bar"><button data-act="st-cam-close" aria-label="סגירה">✕</button><button class="stc-shot" data-act="st-shot" aria-label="צלם"></button><button data-act="st-flip" aria-label="החלף מצלמה">🔄</button></div>
    <div class="stc-tools"><button data-act="st-style">🔀</button><button data-act="st-pos">↕️</button></div>`;
  $('#stc-st').src=await stickerOnlyURL();
  try{
    STD.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:STD.face},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#stc-v'); v.srcObject=STD.stream; v.style.transform=STD.face==='user'?'scaleX(-1)':''; await v.play().catch(()=>{});
  }catch(e){ stCamClose(); toast('אין גישה למצלמה. אפשר לבחור תמונה מהגלריה'); }
}
function stCamStop(){ try{ STD.stream?.getTracks().forEach(t=>t.stop()); }catch(e){} STD.stream=null; }
function stCamClose(){ stCamStop(); $('#stcam')?.remove(); }
async function stShot(){
  const v=$('#stc-v'); if(!v||!v.videoWidth)return;
  const c=document.createElement('canvas'); c.width=1080; c.height=1920; drawCover(c.getContext('2d'),v,1080,1920,STD.face==='user');
  STD.bg=c; stCamClose(); vibrate(20); renderStudio(); stPreview();
}
function stAct(act,b){
  switch(act){
    case 'st-green': STD.bg=null; renderStudio(); stPreview(); return true;
    case 'st-cam': stCamOpen(); return true;
    case 'st-pick': { const f=$('#st-file'); if(f){ f.onchange=async()=>{ const file=f.files?.[0]; if(!file)return; try{ STD.bg=await createImageBitmap(file); }catch(e){ const im=new Image(); im.src=URL.createObjectURL(file); await im.decode(); STD.bg=im; } renderStudio(); stPreview(); }; f.click(); } return true; }
    case 'st-style': STD.style=STD.style?0:1; if($('#stcam'))stickerOnlyURL().then(u=>{const i=$('#stc-st');if(i)i.src=u;}); else { renderStudio(); stPreview(); } return true;
    case 'st-pos': STD.pos=(STD.pos+1)%3; if($('#stcam'))stickerOnlyURL().then(u=>{const i=$('#stc-st');if(i)i.src=u;}); else { renderStudio(); stPreview(); } return true;
    case 'st-share': stShare(); return true;
    case 'st-shot': stShot(); return true;
    case 'st-flip': STD.face=STD.face==='user'?'environment':'user'; stCamOpen(); return true;
    case 'st-cam-close': stCamClose(); return true;
  }
  return false;
}
/* ----- הסיכום החודשי ----- */
function monthKeyOf(y,m){ return `${y}-${String(m+1).padStart(2,'0')}`; }
function monthStats(y,m){
  const s=+new Date(y,m,1), e=+new Date(y,m+1,1);
  const W=S.workouts.filter(w=>w.start>=s&&w.start<e).sort((a,b)=>a.start-b.start);
  const before={}; for(const w of S.workouts)if(w.start<s)for(const ex of w.ex||[])if(ex.t==='s'){ const t=Math.max(0,...(ex.sets||[]).filter(z=>+z.r>0).map(z=>+z.w||0)); if(t>(before[ex.n]||0))before[ex.n]=t; }
  const setsBy={}, bestIn={}; let vol=0, sets=0, ms=0;
  for(const w of W){ vol+=workoutVol(w); sets+=workoutSets(w); ms+=Math.max(0,(w.end||w.start)-w.start);
    for(const ex of w.ex||[])if(ex.t==='s'){ const ss=(ex.sets||[]).filter(z=>+z.r>0); setsBy[ex.n]=(setsBy[ex.n]||0)+ss.length; const t=Math.max(0,...ss.map(z=>+z.w||0)); if(t>(bestIn[ex.n]||0))bestIn[ex.n]=t; } }
  const topEx=Object.entries(setsBy).sort((a,b)=>b[1]-a[1])[0]||null;
  let pr=null; for(const [n,t] of Object.entries(bestIn)){ const b=before[n]; if(b&&t>b&&(!pr||t-b>pr.to-pr.from))pr={n,from:b,to:t}; }
  const wk={}; for(const w of W){ const k=weekKeyOf(w.start); wk[k]=(wk[k]||0)+1; }
  const days=new Set(W.map(w=>ymd(new Date(w.start)))).size;
  const mealDays=[...new Set(S.meals.filter(x=>{const t=+new Date(x.d+'T12:00:00');return t>=s&&t<e;}).map(x=>x.d))];
  const prot=mealDays.length?Math.round(mealDays.reduce((a,d)=>a+dayTotals(d).protein,0)/mealDays.length):0;
  return {y,m,n:W.length,vol,sets,hours:Math.round(ms/36e5*10)/10,topEx,pr,bestWeek:Math.max(0,...Object.values(wk)),days,mealDays:mealDays.length,prot,
    name:new Date(y,m,15).toLocaleDateString(LOC,{month:'long'})};
}
function wrapTarget(){ // החודש הקודם אם היו בו אימונים, אחרת החודש הנוכחי
  const d=new Date(); let y=d.getFullYear(), m=d.getMonth()-1; if(m<0){m=11;y--;}
  if(monthStats(y,m).n)return [y,m]; return [d.getFullYear(),d.getMonth()];
}
function wrapCardHTML(){
  const d=new Date(); if(d.getDate()>10||!S.workouts.length)return '';
  let y=d.getFullYear(), m=d.getMonth()-1; if(m<0){m=11;y--;}
  const k=monthKeyOf(y,m); if(S.settings.wrapSeen===k)return '';
  const st=monthStats(y,m); if(!st.n)return '';
  return `<div class="card wrap-card spread"><div><b style="font-size:17px">📊 הסיכום של ${esc(st.name)} מוכן</b><div class="small">${st.n} אימונים · ${fmtNum(Math.round(st.vol/100)/10)} טון. בוא נראה מה עשית</div></div>
    <div class="row" style="gap:6px"><button class="btn" style="background:#fff;color:#14532d;border:none" data-act="wrap-open" data-y="${y}" data-m="${m}">צפה</button><button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:none" data-act="wrap-dismiss" data-k="${k}" aria-label="סגירה">✕</button></div></div>`;
}
const WR={on:false,i:0,st:null};
function wrapSlides(st){
  const tons=Math.round(st.vol/100)/10, cars=Math.round(st.vol/1500), pianos=Math.round(st.vol/250);
  const S1=[];
  S1.push(`<div class="wemo">📊</div><div class="wbig">${esc(st.name)}</div><div class="wmid">החודש שלך ב-NextRep</div><div class="wsub">בוא נראה מה עשית 👀</div>`);
  S1.push(`<div class="wsub">החודש התאמנת</div><div class="wbig num">${st.n}</div><div class="wmid">אימונים</div><div class="wsub">${st.hours} שעות בחדר הכושר · ${st.sets} סטים</div>`);
  if(st.vol)S1.push(`<div class="wsub">בסך הכל הרמת</div><div class="wbig num">${fmtNum(tons)}</div><div class="wmid">טון</div><div class="wsub">${cars>=1?`כמו להרים ${cars} מכוניות 🚗`:`כמו להרים ${pianos} פסנתרים 🎹`}</div>`);
  if(st.topEx)S1.push(`<div class="wsub">התרגיל שלך החודש</div><div class="wmid" style="font-size:34px">${esc(st.topEx[0])}</div><div class="wsub num">${st.topEx[1]} סטים</div>${st.pr?`<div style="height:18px"></div><div class="wsub">השיא הכי גדול</div><div class="wmid">${esc(st.pr.n)}</div><div class="wbig num" style="font-size:72px"><span dir="ltr">${LANG==='en'?`${st.pr.from} → ${st.pr.to}`:`${st.pr.to} ← ${st.pr.from}`}</span></div><div class="wsub">ק״ג</div>`:''}`);
  S1.push(`<div class="wemo">🔥</div><div class="wbig num">${st.days}</div><div class="wmid">ימי אימון</div><div class="wsub">השבוע הכי חזק שלך: ${st.bestWeek} אימונים${weekStreak()>1?` · רצף של ${weekStreak()} שבועות`:''}</div>`);
  if(st.mealDays)S1.push(`<div class="wemo">🍽️</div><div class="wbig num">${st.mealDays}</div><div class="wmid">ימים עם תיעוד תזונה</div><div class="wsub">ממוצע ${st.prot} גר׳ חלבון ביום</div>`);
  S1.push(`<div class="wmid">${esc(st.name)} במספרים</div><div class="wgrid num"><div><b>${st.n}</b>אימונים</div><div><b>${fmtNum(tons)}</b>טון</div><div><b>${st.days}</b>ימי אימון</div><div><b>${st.sets}</b>סטים</div></div>
    <button class="wbtn" data-act="wrap-share">📤 שתף את הסיכום</button><div class="whint">החודש הבא מתחיל עכשיו 💪</div>`);
  return S1;
}
function renderWrap(){
  let el=$('#wrap'); if(!WR.on){ el?.remove(); return; }
  const sl=wrapSlides(WR.st); WR.i=Math.max(0,Math.min(WR.i,sl.length-1));
  if(!el){ el=document.createElement('div'); el.id='wrap'; document.body.appendChild(el); }
  el.innerHTML=`<div class="wbars">${sl.map((_,i)=>`<i class="${i<=WR.i?'on':''}"></i>`).join('')}</div>
    <div class="wtop"><button data-act="wrap-close" aria-label="סגירה">✕</button><span class="brand" dir="ltr" style="font-size:26px">Next<b style="color:#bbf7d0">Rep</b></span><span style="width:36px"></span></div>
    <div class="wbody" data-act="wrap-next">${sl[WR.i]}</div>
    ${WR.i<sl.length-1?`<div class="whint">הקש כדי להמשיך</div>`:''}`;
}
function retAct(act,b){
  switch(act){
    case 'badge-open': openBadgeSheet(b.dataset.id,false); return true;
    case 'badge-share': { const x=BADGES.find(z=>z[0]===b.dataset.id); const st=badgeStats(); if(x)openShareStudio({emoji:x[1],title:x[2],sub:x[3],top:'הישג חדש',stats:[[st.n,'אימונים'],[st.streak,'שבועות ברצף'],[st.prs,'שיאים']]}); return true; }
    case 'wrap-open': { const [y,m]=b.dataset.y!=null?[+b.dataset.y,+b.dataset.m]:wrapTarget(); WR.st=monthStats(y,m); WR.on=true; WR.i=0;
      S.settings.wrapSeen=monthKeyOf(y,m); persistSettings(); closeSheet(); renderWrap(); return true; }
    case 'wrap-next': WR.i++; renderWrap(); return true;
    case 'wrap-close': WR.on=false; renderWrap(); render(); return true;
    case 'wrap-dismiss': S.settings.wrapSeen=b.dataset.k; persistSettings(); render(); return true;
    case 'wrap-share': { const st=WR.st; WR.on=false; renderWrap(); openShareStudio({emoji:'📊',title:st.name,sub:'החודש שלי ב-NextRep',stats:[[st.n,'אימונים'],[fmtNum(Math.round(st.vol/100)/10),'טון'],[st.days,'ימי אימון']]}); return true; }
  }
  return false;
}

/* הדגמות בתשובות של קובי: כשהשאלה היא "איך עושים X" — מזהים את התרגיל (גם בשם המתורגם) ומצרפים כרטיס הדגמה */
let _coNames=null;
function coachDemos(q,reply,prevReply){
  q=String(q||''); if(!q||!/(איך|כיצד|טכניק|לבצע|מבצעים|עושים|ביצוע|תנוחה|הדגמ|דוגמ|תראה|להראות|הראה|סרטון|how|technique|form|perform|demo|show|example|video|كيف|طريقة|أداء|تقنية|أرني|مثال|فيديو)/i.test(q))return [];
  const found=coachFind(q); if(found.length)return found.slice(0,3);
  // "תראה לי דוגמאות לתרגילים האלו" — התרגילים מוזכרים בתשובה (הנוכחית או הקודמת)
  const r1=coachFind(reply); if(r1.length)return r1.slice(0,3);
  return coachFind(prevReply).slice(0,3);
}
/* תגית ההדגמות שקובי מוסיף בסוף תשובה: [[demo: שם | שם]] — שמות מדויקים מהמאגר */
let _libSet=null;
function coachParse(body){
  body=String(body||''); if(!_libSet)_libSet=new Set(Object.values(LIB).flat());
  let demos=[]; const re=/\[\[\s*demo\s*:([^\]]*)\]\]/gi; let m;
  while((m=re.exec(body)))demos.push(...m[1].split('|').map(x=>x.trim()).filter(x=>_libSet.has(x)));
  return {text:body.replace(re,'').replace(/\n{3,}/g,'\n\n').trim(), demos:[...new Set(demos)].slice(0,3)};
}
function coachFind(q){
  q=String(q||''); if(!q)return [];
  const nz=x=>String(x).toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/(^|\s)ال/g,'$1').replace(/[-–]/g,' ').replace(/\s+/g,' ');
  if(!_coNames)_coNames=[...new Set(Object.values(LIB).flat())].filter(n=>EXDB[n]||INFO[n]).map(n=>[n,nz(n),I18?nz(tt(n)):'']);
  const t=nz(q);
  const B=/[\s.,:;!?()"'\-–״׳/]/, P=/[והבלמשכ]/;
  const has=(w)=>{ if(!w)return false; let i=t.indexOf(w); while(i>=0){ const pre=i===0||B.test(t[i-1])||(P.test(t[i-1])&&(i===1||B.test(t[i-2])||(P.test(t[i-2])&&(i===2||B.test(t[i-3]))))), post=i+w.length>=t.length||B.test(t[i+w.length]); if(pre&&post)return true; i=t.indexOf(w,i+1);} return false; };
  let hits=_coNames.filter(([n,h,x])=>has(h)||(x&&x.length>2&&has(x)));
  hits=hits.filter(a=>!hits.some(b=>b!==a&&((b[1].includes(a[1])&&b[1].length>a[1].length)||(a[2]&&b[2].includes(a[2])&&b[2].length>a[2].length))));
  const pos=x=>{ const i=t.indexOf(x[1]); return i>=0?i:(x[2]?t.indexOf(x[2]):1e9); };
  return hits.sort((a,b)=>pos(a)-pos(b)).map(x=>x[0]);
}

const RM=()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){ return false; } };
const TAB_ORD=['home','train','food','track','social','me','admin','plans'];
function liven(root){
  if(!root||RM())return;
  let n=0;
  for(const el of root.querySelectorAll('b,strong,span,div')){
    if(n>=24)break; if(!el.offsetParent)continue;
    const tn=el.firstChild; if(!tn||tn.nodeType!==3||[...el.children].some(c=>c.tagName!=='SMALL'))continue;
    const tx=tn.nodeValue.trim(); if(!/^-?[\d,]+(\.\d+)?%?$/.test(tx))continue;
    if(el.closest('input,#np,.dots,.cal,svg,.mn-qty'))continue;
    const cs=getComputedStyle(el); if(parseFloat(cs.fontSize)<17||(parseInt(cs.fontWeight)||400)<600)continue;
    const pct=tx.endsWith('%'), raw=tx.replace(/[,%]/g,''), v=parseFloat(raw); if(!isFinite(v)||Math.abs(v)<2)continue;
    const dec=(raw.split('.')[1]||'').length, comma=tx.includes(','), D=700, t0=performance.now();
    const fmt=x=>{ let s=Math.abs(x).toFixed(dec); if(comma)s=s.replace(/\B(?=(\d{3})+(?!\d))/g,','); return (x<0?'-':'')+s+(pct?'%':''); };
    n++; const orig=tn.nodeValue; tn.nodeValue=fmt(0);
    const tick=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); if(!tn.isConnected)return; tn.nodeValue=k<1?fmt(v*e):orig; if(k<1)requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  for(const el of root.querySelectorAll('i[style*="width"]')){
    const m=/width:\s*([\d.]+)%/.exec(el.getAttribute('style')||''); if(!m||el.offsetHeight>16)continue;
    try{ el.animate([{width:'0%'},{width:m[1]+'%'}],{duration:800,easing:'cubic-bezier(.2,.7,.3,1)'}); }catch(_){}
  }
  for(const c of root.querySelectorAll('circle[stroke-dashoffset][stroke-dasharray]')){
    const da=parseFloat(c.getAttribute('stroke-dasharray')), off=parseFloat(c.getAttribute('stroke-dashoffset')); if(!(da>0)||!isFinite(off))continue;
    try{ c.animate([{strokeDashoffset:da},{strokeDashoffset:off}],{duration:950,easing:'cubic-bezier(.2,.7,.3,1)'}); }catch(_){}
  }
}
function burst(el,color){ if(!el||RM())return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let i=0;i<10;i++){ const d=document.createElement('i'); d.className='fx-dot'; d.style.cssText=`left:${cx}px;top:${cy}px;background:${color||'#22c55e'}`; document.body.appendChild(d);
    const a=i/10*Math.PI*2+Math.random()*.4, dist=24+Math.random()*18;
    const an=d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${(Math.cos(a)*dist).toFixed(1)}px),calc(-50% + ${(Math.sin(a)*dist).toFixed(1)}px)) scale(.3)`,opacity:0}],{duration:540,easing:'cubic-bezier(.2,.7,.3,1)'});
    an.onfinish=()=>d.remove(); setTimeout(()=>d.remove(),900); } }
function confetti(n){ if(RM())return; n=n||110;
  const c=document.createElement('canvas'); c.className='fx-cf'; const dpr=Math.min(2,devicePixelRatio||1), W=innerWidth, H=innerHeight;
  c.width=W*dpr; c.height=H*dpr; document.body.appendChild(c); const x=c.getContext('2d'); if(!x){ c.remove(); return; } x.scale(dpr,dpr);
  const COLS=['#16a34a','#2fd16b','#e2b01c','#2453d6','#d0303a','#ffffff','#f59e0b'];
  const P=[...Array(n)].map(()=>({x:W/2+(Math.random()-.5)*90,y:H*.32,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,w:5+Math.random()*5,h:8+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:COLS[Math.random()*COLS.length|0]}));
  const t0=performance.now();
  const f=t=>{ const k=t-t0; x.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=.3; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-k/2300); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.max(.2,Math.abs(Math.cos(p.r*1.3)))); x.restore(); }
    if(k<2300)requestAnimationFrame(f); else c.remove(); };
  requestAnimationFrame(f); }
function cheer(icon,title,sub,gold){

  const el=document.createElement('div'); el.className='fx-cheer'+(gold?' gold':'');
  el.innerHTML=`<span class="i">${icon}</span><span><b>${esc(tt(title))}</b>${sub?`<small class="num">${esc(sub)}</small>`:''}</span>`;
  document.body.appendChild(el); setTimeout(()=>el.classList.add('out'),2700); setTimeout(()=>el.remove(),3100); }

function renderFinish(){

/* ---------- actions ---------- */
function startWorkout(name,tid){
  const tpl=S.templates.find(t=>t.id===tid);
  const ex=(tpl?.ex||[]).map(e=>{
    if(e.t==='c')return {n:e.n,m:e.m,t:'c',rest:e.rest||0,c:{min:'',km:'',inc:'',done:false}};
    const nSets=Math.max(1,+e.s||3);
    const prev=lastSetsOf(e.n)||[];
    const sets=Array.from({length:nSets},(_,i)=>({w:'',r:'',pw:prev[i]?.w??prev[prev.length-1]?.w??'',pr:prev[i]?.r??prev[prev.length-1]?.r??'',done:false}));
    return {n:e.n,m:e.m,t:'s',reps:e.reps||'',rest:+e.rest||0,how:e.how||'',sets};
  });
  S.active={start:Date.now(),name,tid:tid||null,ex};
  persistActive(); S.tab='train'; location.hash='train'; render();
  startClock(); keepAwake(true);
}
function startClock(){ // live workout stopwatch — updates the clock element only, never re-renders
  if(startClock._i)return;
  startClock._i=setInterval(()=>{
    if(!S.active){clearInterval(startClock._i);startClock._i=null;return;}
    const el=document.getElementById('wclock'); if(el)el.textContent=clockText();
  },1000);
}
async function doSaveWorkout(){
  const a=S.active; if(!a)return;
  const w=clone(a); w.end=Date.now(); w.id='w'+a.start;
  w.ex=w.ex.map(e=>{ // strip placeholders, normalize numbers
    if(e.t==='c'){const c=e.c||{};return {n:e.n,m:e.m,t:'c',c:{min:+c.min||0,km:+c.km||0,inc:+c.inc||0}};}
    return {n:e.n,m:e.m,t:'s',sets:(e.sets||[]).map(s=>({w:+s.w||0,r:+s.r||0})).filter(s=>s.r>0)};
  }).filter(e=>e.t==='c'?(e.c.min>0||e.c.km>0):e.sets.length>0);
  if(!w.ex.length){toast('אין סטים מלאים לשמירה');return;}
  const bm=bestMap(); const newPRs=[];
  for(const e of w.ex)if(e.t==='s'){ const top=Math.max(0,...e.sets.map(s=>s.w));
    if(top>0&&top>(bm[e.n]?.w||0))newPRs.push(`${e.n}: ${top} ק״ג`); }
  try{await saveWorkout(w);}catch(e){return;}
  if(newPRs.length&&S.settings.notif?.pr!==false)notify('שיא חדש! 🏅',newPRs.join(' · '));
  if(newPRs.length)sb.rpc('post_pr',{p_text:newPRs.join(', ')}).then(()=>{},()=>{});
  S.active=null;
  saveLocalActive(); clearTimeout(_aT); flushActive();
  S._justTrained=Date.now(); stopRest(); keepAwake(false); closeSheet(); render(); toast('האימון נשמר 💪'); if(!newPRs.length)confetti(60); vibrate([20,50,20]);
  setTimeout(checkNewBadges,700);
  { const n=(S.workouts||[]).length; const r=newPRs.length&&n>=3?'pr':n===4?'w4':n===10?'w10':n===20?'w20':null; if(r)setTimeout(()=>maybeInvitePrompt(r),2500);
    if(n===1)setTimeout(()=>notifAsk('first','אימון ראשון נשמר 💪','רוצה שאזכיר לך בבוקר של יום האימון הבא, ואודיע כשתשבור שיא? רק עם התראות.'),1800); }
}

function handleAct(b,ev){
  const act=b.dataset.act;
  if(act==='lock-view'){ enterApp._ro=true; S.trackView='history'; S.tab='track'; enterApp(S.user); return; }
  if(act==='lock-pay'){ S.mode='paywall'; render(); window.scrollTo(0,0); return; }
  if(S.locked&&S.mode==='app'&&!LOCK_OK.test(act)){ toast(tt('מצב צפייה בלבד. בוחרים מסלול, והכל נפתח מיד.')); return; }
  if(act==='info'){ ev.stopPropagation(); showInfo(b); return; }
  if(act.startsWith('soc-')&&socAct(act,b))return;
  if(act.startsWith('rc-')&&rcAct(act,b))return;
  if(payAct(act,b))return;
  if(act.startsWith('pb-')&&pbAct(act,b))return;
  if(act.startsWith('start-')&&act!=='start-tpl'&&act!=='start-free'&&startAct(act))return;
  if(act.startsWith('coach-')&&coachAct(act,b))return;

  if(act.startsWith('st-')&&stAct(act,b))return;

  if(act.startsWith('mw-')&&mwAct(act,b))return;
  if((act.startsWith('tour-')||act.startsWith('inst-')||act.startsWith('lang-'))&&tourAct(act,b))return;
  if((act.startsWith('adm-')||act.startsWith('ev-')||act==='admin-open')&&admAct(act,b))return;
  if(act==='ct-topic'){S.ctDraft=$('#ct-body')?.value||'';openContact(b.dataset.t);return;}
  if(act==='ct-send'){const t=($('#ct-body')?.value||'').trim(); if(!t){toast('כתוב הודעה');return;} b.disabled=true; sb.rpc('send_support',{p_topic:S.ctTopic||'general',p_body:t}).then(({error})=>{ b.disabled=false; if(error){toast(/too_many/.test(error.message)?'שלחת הרבה הודעות, נסה בעוד שעה':'השליחה נכשלה');return;} S.ctDraft=''; toast('ההודעה נשלחה ✓ נחזור אליך בהקדם'); openContact(); }); return;}

    case 'auth-toggle': S.authEmail=$('#au-email')?.value||S.authEmail; S.authMode=S.authMode==='signup'?'login':'signup'; render(); break;
    case 'logout':
      if(b.dataset.sure){sb.auth.signOut();}
      else{b.dataset.sure='1';b.textContent='בטוח? יציאה';setTimeout(()=>{delete b.dataset.sure;if(b.isConnected)b.textContent='יציאה';},2500);}
      break;
  }
}

});

/* ---------- boot ---------- */
async function enterApp(user){
  S.user=user; S.mode='boot'; render();
  // first real sign-in: the server starts the invite gift week, rewards the inviter and alerts the admin (once per user)
  try{ const k='nr-entered-'+user.id; if(!localStorage.getItem(k)){ const r=await sb.rpc('mark_entered'); if(!r.error)localStorage.setItem(k,'1'); } }catch(e){}
  // home-screen install: reported once per device, so setup emails only ask what's still missing
  try{ if(IS_STANDALONE&&!localStorage.getItem('nr-inst-'+user.id)){ sb.rpc('mark_seen',{p_inst:true}).then(r=>{ if(!r.error)try{localStorage.setItem('nr-inst-'+user.id,'1');}catch(_){} },()=>{}); } }catch(e){}
  // בקרת גישה: משתמש חדש ממתין לאישור האדמין (נאכף גם בשרת ב-RLS). שגיאת רשת → ממשיכים (אופליין)
  if(PAID_RETURN||enterApp._claim){ enterApp._claim=false; try{ const c=await sb.rpc('claim_payment'); if(c.data?.ok&&!c.data.duplicate)toast('התשלום אומת, הגישה נפתחה 🎉'); }catch(_){} }
  rcInit();
  try{ const pl=await sb.rpc('my_plan'); if(!pl.error&&pl.data){ S.plan=pl.data; const st=pl.data.status;
    if(st==='expired'){
      if(!PAID_RETURN&&!enterApp._grace){ enterApp._grace=true; try{ const g=await sb.rpc('grace_finish'); if(g.data?.ok){ toast('אפשר לסיים את האימון שהתחלת 💪'); return enterApp(user); } }catch(_){} }
      if(enterApp._ro){ S.locked=true; } else {
      S.mode='paywall'; render();
      if(!S.recap)sb.rpc('trial_recap').then(({data})=>{ if(data){ S.recap=data; if(S.mode==='paywall')render(); } },()=>{});
      if(PAID_RETURN&&!(enterApp._poll>=8)){ enterApp._poll=(enterApp._poll||0)+1; toast('מאשר את התשלום…'); setTimeout(()=>enterApp(user),4000); }
      return; } }
    else S.locked=false;
    if(st!=='approved'&&st!=='expired'){ S.access=st; S.mode='pending'; render(); return; } } }catch(_){}
  try{
    const [tpl,wo,st,bw,ml]=await Promise.all([
      sb.from('templates').select('id,name,ord,ex').order('ord'),
      sb.from('workouts').select('id,name,start_ts,end_ts,ex'),
      sb.from('settings').select('rest,active,prefs').maybeSingle(),
      sb.from('bodyweight').select('d,kg').order('d'),
      sb.from('meals').select('id,d,ts,name,kcal,protein,carbs,fat,items').gte('d',ymd(new Date(Date.now()-60*864e5))),
    ]);
    if(tpl.error||wo.error)throw tpl.error||wo.error;
    S.templates=(tpl.data||[]).map(r=>({id:r.id,name:r.name,order:r.ord||0,ex:r.ex||[]}));
    S.workouts=(wo.data||[]).map(r=>({id:r.id,name:r.name,start:+r.start_ts,end:+r.end_ts,ex:r.ex||[]}));
    S.weights=(bw.data||[]).map(r=>({d:r.d,kg:+r.kg}));
    S.meals=ml.data||[];
    if(st.data){ S.settings.rest=st.data.rest??90; S.active=st.data.active||null;
      S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},st.data.prefs?.notif);
      S.settings.schedule=st.data.prefs?.schedule||{};
      S.settings.kcalT=st.data.prefs?.kcalT||null; S.settings.protT=st.data.prefs?.protT||null; S.settings.goalKg=st.data.prefs?.goalKg||null; S.settings.menu=st.data.prefs?.menu||null; S.settings.photoDay=st.data.prefs?.photoDay??null; S.settings.tourDone=st.data.prefs?.tourDone||null; if(st.data.prefs?.toursSeen)S.settings.toursSeen=Object.assign({},st.data.prefs.toursSeen,S.settings.toursSeen||{});
      S.settings.badgesSeen=st.data.prefs?.badgesSeen||null; S.settings.body=st.data.prefs?.body||null; S.settings.wrapSeen=st.data.prefs?.wrapSeen||null;
      S.settings.g=st.data.prefs?.g||null; S.settings.accent=st.data.prefs?.accent||null; S.settings.start=st.data.prefs?.start||null;
      try{ const src=JSON.parse(localStorage.getItem('nr-src')||'null'); if(src&&!localStorage.getItem('nr-src-logged')){ localStorage.setItem('nr-src-logged','1');
        if(!(src.t>new Date(S.user.created_at).getTime()+36e5))logEv('src',src); } }catch(_){}
      if(!S.settings.g&&window.NR_G){ S.settings.g=window.NR_G; setTimeout(()=>persistSettings(),800); }
      if(S.settings.g&&applyLook(S.settings.g,S.settings.accent))return;
      // שפה שנבחרה במכשיר אחר — מסנכרנים; משתמש ותיק בלי שפה שמורה — שומרים את הנוכחית
      const pl=st.data.prefs?.lang; let lsl=null; try{lsl=localStorage.getItem('nr_lang');}catch(e){}
      if(pl&&pl!==LANG&&!lsl){ try{localStorage.setItem('nr_lang',pl);}catch(e){} location.reload(); return; }
      if(pl!==LANG)setTimeout(()=>flushActive(),1500); }
    saveSnapshot();
  }catch(e){ // אופליין — ממשיכים מתמונת המצב המקומית
    const snap=loadSnapshot();
    if(snap){ S.templates=snap.templates||[]; S.workouts=snap.workouts||[]; S.settings=Object.assign({rest:90},snap.settings); S.weights=snap.weights||[]; S.meals=snap.meals||[]; toast('מצב אופליין — עובדים מהנתונים השמורים'); }
    else toast('טעינת הנתונים נכשלה — בדוק חיבור');
  }
  const localA=loadLocalActive();
  if(localA&&(!S.active||((localA.start===S.active.start)&&JSON.stringify(localA).length>=JSON.stringify(S.active).length)))S.active=localA;
  S.mode='app'; render(); updateSyncBadge(); trySync(); loadPhotos(); restoreRest(); setTimeout(syncPush,1500);
  sb.rpc('is_admin').then(({data})=>{S.isAdmin=data===true;}).catch(()=>{});
  socLoad(); socSubscribe(); socPendingJoin();
  setTimeout(()=>{ if(!checkInstallGate()){ if(!S.settings.g)openGenderSheet(true); else onboardNext(); } },700);
  socialProfileFix();
  if(PAID_RETURN&&!enterApp._paid){ enterApp._paid=true; toast('תודה! התשלום התקבל 🎉'); }
  if(S.active){startClock();keepAwake(true);}
}
function hideSplash(){
  const sp=$('#splash'); if(!sp)return;
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); },450);
}
(async function boot(){
  render();
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await enterApp(session.user);
    else{ S.mode='auth'; render(); }
  }catch(e){ S.mode='auth'; render(); }
  hideSplash();
  sb.auth.onAuthStateChange((ev,sess)=>{
    window._tok=sess?.access_token||null; // for keepalive requests (rest timer) when the app goes to the background
    if(ev==='PASSWORD_RECOVERY'){ setTimeout(openNewPassword,600); }
    if(sess&&!S.user)enterApp(sess.user);
    if(ev==='SIGNED_OUT'){try{closeSheet();}catch(_){} try{CO.open=false;}catch(_){} document.getElementById('wrap')?.setAttribute('hidden',''); try{S.showAuth=false;window.scrollTo(0,0);}catch(_){} PH.sets=[];PH.urls={};PH.loaded=false;S.user=null;S.workouts=[];S.templates=[];S.active=null;stopRest();S.mode='auth';render();}
  });
})();
