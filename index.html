function payAct(act,b){
  switch(act){
    case 'plans-open': closeSheet(); openSheet(`<div class="pw" style="padding:0">${vPaywall(false)}</div><button class="btn big" style="margin-top:10px" data-act="sheet-close">סגור</button>`); return true;
    case 'plan-buy': { const p=(S.plan?.plans||[]).find(x=>x.id===b.dataset.id); if(!p)return true;
      if(S.plan?.grow){ b.disabled=true; const pn=b.querySelector('.pn'); const t0=pn?.textContent; if(pn)pn.textContent='פותח תשלום מאובטח…';
        sb.functions.invoke('grow-pay',{body:{plan:p.id,origin:location.origin}}).then(({data,error})=>{
          if(error||!data?.url){ b.disabled=false; if(pn)pn.textContent=t0; toast('פתיחת התשלום נכשלה, נסה שוב'); return; }
          location.href=data.url; });
        return true; }
      const l=planLink(p); if(!l)return true;
      phoneThen(()=>{ b.disabled=true; sb.rpc('start_checkout',{p_plan:p.id}).then(()=>{},()=>{}).finally(()=>{ location.href=l; }); }, p); return true; }
    case 'phone-save': { const v=($('#pay-phone')?.value||'').trim(); const d=v.replace(/\D/g,'');
      if(d.length<9){toast('הקלד מספר טלפון מלא');return true;} b.disabled=true;
      sb.rpc('set_my_phone',{p_phone:v}).then(({data,error})=>{ b.disabled=false; if(error){toast('שמירת הטלפון נכשלה');return;} S.myPhone=data; const f=phoneThen._next; phoneThen._next=null; closeSheet(); f&&f(); }); return true; }
    case 'phone-edit': phoneSheet(null); return true;
    case 'plan-recheck': closeSheet(); enterApp._claim=true; if(S.user)enterApp(S.user); return true;
    case 'share-app': { const url=`${location.origin}/#ref=${S.user?.id||''}`; openShareSheet('שתף את NextRep','חבר סורק את הברקוד או מקבל קישור, ונרשם.',url,'מתאמן? תנסה את NextRep, יומן אימונים שזוכר כל סט, עם טיימר, תזונה וקבוצות 💪'); return true; }
    case 'copy-link': navigator.clipboard?.writeText(b.dataset.url).then(()=>toast('הקישור הועתק ✓'),()=>toast(b.dataset.url)); return true;
    case 'share-native': if(navigator.share)navigator.share({title:'NextRep',text:b.dataset.text,url:b.dataset.url}).catch(()=>{}); else navigator.clipboard?.writeText(b.dataset.text+'\n'+b.dataset.url).then(()=>toast('הקישור הועתק ✓')); return true;
    case 'scan-open': openScanner(); return true;
    case 'scan-close': stopScan(); closeSheet(); return true;
    case 'scan-go': onBarcode($('#scan-code')?.value); return true;
  }
  return false;
}

function maybeStartTour(){
  if(TOUR.on||S.settings.tourDone||S.active||S.mode!=='app')return;
  try{ if(localStorage.getItem('nr-tour'))return; }catch(_){}
  const created=new Date(S.user?.created_at||0).getTime(); if(Date.now()-created>3*864e5)return; // רק למשתמשים חדשים
  startTour();
}
function startTour(){ TOUR.on=true; TOUR.i=0; tourShow(); }
function tourSteps(){ return TOUR_STEPS.filter(st=>st.kind!=='notif'||(('Notification' in window)&&Notification.permission==='default'&&(!IS_IOS||IS_STANDALONE))); }
function tourEnd(){
  TOUR.on=false; $('#tour')?.remove(); S.settings.tourDone=ymd(); persistSettings();
  try{localStorage.setItem('nr-tour','1');}catch(_){}
  S.tab='home'; location.hash='home'; render(); window.scrollTo(0,0);
}
function tourShow(){
  const steps=tourSteps(), st=steps[TOUR.i]; if(!st)return tourEnd();
  closeSheet(); st.pre&&st.pre(); if(S.tab!==st.tab){S.tab=st.tab; location.hash=st.tab;} render(); window.scrollTo(0,0);
  let el=$('#tour'); if(!el){el=document.createElement('div'); el.id='tour'; document.body.appendChild(el);}
  const isLast=TOUR.i===steps.length-1;
  el.innerHTML=`<div class="tour-spot" hidden></div><div class="tour-card">
    <div class="tour-dots">${steps.map((_,i)=>`<i class="${i===TOUR.i?'on':''}"></i>`).join('')}</div>
    <h3>${st.title}</h3><p>${st.text}</p>
    <div class="row" style="gap:8px;margin-top:12px">
      ${st.kind==='notif'?`<button class="btn" style="flex:1" data-act="tour-next">אחר כך</button><button class="btn primary" style="flex:1.6" data-act="tour-notif">🔔 הפעל התראות</button>`
        :`${TOUR.i===0?`<button class="btn" style="flex:1" data-act="tour-skip">דלג</button>`:`<button class="btn" style="flex:1" data-act="tour-back">חזרה</button>`}
          <button class="btn primary" style="flex:1.6" data-act="tour-next">${isLast?'בוא נתחיל 💪':TOUR.i===0?'קדימה':'הבא'}</button>`}
    </div></div>`;
  requestAnimationFrame(()=>tourPlace(st));
}
function tourPlace(st,tries=0){
  const el=$('#tour'); if(!el||!TOUR.on||tourSteps()[TOUR.i]!==st)return; const spot=el.querySelector('.tour-spot'), card=el.querySelector('.tour-card');
  const t=st.sel&&[...document.querySelectorAll(st.sel)].find(x=>x.offsetParent!==null);
  if(!t){ spot.hidden=true; el.classList.add('dim'); card.style.top=''; card.style.bottom=''; card.classList.add('mid'); return; }
  el.classList.remove('dim'); card.classList.remove('mid');
  const r=t.getBoundingClientRect(), pad=6;
  const fixed=!!t.closest('nav.tabs,header.top');
  if(!fixed&&tries<3&&(r.top<70||r.bottom>innerHeight-90)){ t.scrollIntoView({block:'center'}); return setTimeout(()=>tourPlace(st,tries+1),250); }
  Object.assign(spot.style,{top:(r.top-pad)+'px',left:(r.left-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'}); spot.hidden=false;
  const below=r.top<innerHeight/2;
  card.style.top=below?(r.bottom+16)+'px':''; card.style.bottom=below?'':(innerHeight-r.top+16)+'px';
}
window.addEventListener('resize',()=>{ if(TOUR.on){ const st=tourSteps()[TOUR.i]; st&&tourPlace(st); } });
function tourAct(act,b){
  switch(act){
    case 'tour-next': TOUR.i++; if(TOUR.i>=tourSteps().length)tourEnd(); else tourShow(); return true;
    case 'tour-back': TOUR.i=Math.max(0,TOUR.i-1); tourShow(); return true;
    case 'tour-skip': tourEnd(); return true;
    case 'tour-notif': b.disabled=true; subscribePush().then(r=>{ toast(r.ok?'ההתראות הופעלו 🔔':'אפשר להפעיל אחר כך בהגדרות'); TOUR.i++; tourShow(); }); return true;
    case 'tour-restart': closeSheet(); startTour(); return true;
    case 'inst-native': if(_bip){ _bip.prompt(); _bip.userChoice.finally(()=>{_bip=null;}); } return true;
    case 'inst-skip': if(!b.dataset.sure){b.dataset.sure='1';b.textContent='בלי שמירה ההתראות לא יעבדו. להמשיך בכל זאת?';return true;}
      try{localStorage.setItem('nr-inst-skip',String(Date.now()));}catch(_){} $('#instgate')?.remove(); maybeStartTour(); return true;
  }
  return false;
}

      const g=pbMuscle(n);
      if(A.focus.some(f=>({chest:'חזה',back:'גב',legs:'רגליים',glutes:'רגליים',shoulders:'כתפיים',arms:g==='יד קדמית'?'יד קדמית':'יד אחורית',core:'בטן וליבה'}[f]===g)))sets+=vi==='f'?0:1;
      if(['פלאנק'].includes(n))reps='30–60 שנ׳';
      ex.push({n,m:g,t:'s',s:sets,reps,rest});
    }
    // אם מגבלות/ציוד השאירו מעט תרגילים — משלימים מתרגילים בטוחים שמתאימים לציוד
    const FILL={gym:['חתירה בכבל','לחיצה במכונת חזה','הרחקות צד','פייס פול','כפיפת ברכיים','היפ תראסט','פלאנק','דד באג','הרמות עקבים'],home:['חתירה במשקולת','לחיצת חזה במשקולות','הרחקות צד','הרחקות אחוריות','היפ תראסט','פלאנק','דד באג','הרמות עקבים','פטישים'],bw:['שכיבות סמיכה','חתירה הפוכה (משקל גוף)','גשר ישבן','פלאנק','דד באג','הרמות רגליים בשכיבה','הרמות עקבים','סופרמן']}[A.equip];
    for(const n of FILL){ if(ex.filter(e=>e.t==='s').length>=4)break; if(banned.has(n)||used.has(n))continue; used.add(n);
      ex.splice(ex.findIndex(e=>e.t==='c')<0?ex.length:ex.findIndex(e=>e.t==='c'),0,{n,m:pbMuscle(n),t:'s',s:A.level==='beg'?2:3,reps:n==='פלאנק'?'30–60 שנ׳':'10–15',rest:60}); }
    // התאמה לזמן: 45 שניות עבודה לסט + מנוחה + 8 דקות חימום
    const mins=e=>e.reduce((a,x)=>a+(x.t==='c'?x.min:x.s*(45+x.rest)/60),8);
    while(ex.length>4&&mins(ex)>A.time+3){ const i=ex.map(x=>x.t).lastIndexOf('s'); const cardio=ex.find(x=>x.t==='c'); if(cardio&&cardio.min>10){cardio.min-=5;continue;} ex.splice(i,1); }
    // עדיין ארוך? מורידים סטים (לא פחות מ-2) ומקצרים מעט את המנוחה בתרגילי הבידוד
    for(let g=0;g<40&&mins(ex)>A.time+3;g++){ const cand=ex.filter(x=>x.t==='s'&&x.s>2).sort((p,q)=>q.s-p.s)[0];
      if(cand)cand.s--; else { const iso=ex.find(x=>x.t==='s'&&x.rest>60); if(iso)iso.rest-=15; else { const c=ex.find(x=>x.t==='c'); if(c&&c.min>5)c.min-=5; else if(ex.length>3)ex.pop(); else break; } } }
    const letter='ABCDEF'[si];
    return {name:`${letter} — ${title.replace(/ ?[AB]$/,'')}`,ex,min:Math.round(mins(ex))};
  });
  PB.plan={prog,split:PB_SPLIT_NAME(A.days,A.level),sessions};
}

function workoutShareText(w){

    `⏱ ${fmtDur(w.end-w.start)} · ${workoutSets(w)} סטים · ${fmtNum(workoutVol(w))} ק״ג נפח`,''];

/* ---------- actions ---------- */
function startWorkout(name,tid){
  const tpl=S.templates.find(t=>t.id===tid);
  const ex=(tpl?.ex||[]).map(e=>{
    if(e.t==='c')return {n:e.n,m:e.m,t:'c',rest:e.rest||0,c:{min:'',km:'',inc:'',done:false}};
    const nSets=Math.max(1,+e.s||3);
    const prev=lastSetsOf(e.n)||[];
    const sets=Array.from({length:nSets},(_,i)=>({w:'',r:'',pw:prev[i]?.w??prev[prev.length-1]?.w??'',pr:prev[i]?.r??prev[prev.length-1]?.r??'',done:false}));
    return {n:e.n,m:e.m,t:'s',reps:e.reps||'',rest:+e.rest||0,how:e.how||'',sets};
  });
  S.active={start:Date.now(),name,tid:tid||null,ex};
  persistActive(); S.tab='train'; location.hash='train'; render();
  startClock(); keepAwake(true);
}
function startClock(){ // live workout stopwatch — updates the clock element only, never re-renders
  if(startClock._i)return;
  startClock._i=setInterval(()=>{
    if(!S.active){clearInterval(startClock._i);startClock._i=null;return;}
    const el=document.getElementById('wclock'); if(el)el.textContent=clockText();
  },1000);
}
async function doSaveWorkout(){
  const a=S.active; if(!a)return;
  const w=clone(a); w.end=Date.now(); w.id='w'+a.start;
  w.ex=w.ex.map(e=>{ // strip placeholders, normalize numbers
    if(e.t==='c'){const c=e.c||{};return {n:e.n,m:e.m,t:'c',c:{min:+c.min||0,km:+c.km||0,inc:+c.inc||0}};}
    return {n:e.n,m:e.m,t:'s',sets:(e.sets||[]).map(s=>({w:+s.w||0,r:+s.r||0})).filter(s=>s.r>0)};
  }).filter(e=>e.t==='c'?(e.c.min>0||e.c.km>0):e.sets.length>0);
  if(!w.ex.length){toast('אין סטים מלאים לשמירה');return;}
  const bm=bestMap(); const newPRs=[];
  for(const e of w.ex)if(e.t==='s'){ const top=Math.max(0,...e.sets.map(s=>s.w));
    if(top>0&&top>(bm[e.n]?.w||0))newPRs.push(`${e.n}: ${top} ק״ג`); }
  try{await saveWorkout(w);}catch(e){return;}
  if(newPRs.length&&S.settings.notif?.pr!==false)notify('שיא חדש! 🏅',newPRs.join(' · '));
  if(newPRs.length)sb.rpc('post_pr',{p_text:newPRs.join(', ')}).then(()=>{},()=>{});
  S.active=null;
  saveLocalActive(); clearTimeout(_aT); flushActive();
  stopRest(); keepAwake(false); closeSheet(); render(); toast('האימון נשמר 💪');
}

/* ---------- event delegation ---------- */
window.addEventListener('error',e=>{ try{toast('שגיאה: '+(e?.message||'לא ידועה'));}catch(_){} });
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b)return;
  try{ handleAct(b,ev); }catch(err){ console.error(err); toast('שגיאה: '+(err?.message||err)); }
});
function handleAct(b,ev){
  const act=b.dataset.act;
  if(act.startsWith('soc-')&&socAct(act,b))return;
  if(payAct(act,b))return;
  if(act.startsWith('pb-')&&pbAct(act,b))return;
  if((act.startsWith('tour-')||act.startsWith('inst-'))&&tourAct(act,b))return;
  if((act.startsWith('adm-')||act.startsWith('ev-')||act==='admin-open')&&admAct(act,b))return;
  if(act==='ct-topic'){S.ctDraft=$('#ct-body')?.value||'';openContact(b.dataset.t);return;}
  if(act==='ct-send'){const t=($('#ct-body')?.value||'').trim(); if(!t){toast('כתוב הודעה');return;} b.disabled=true; sb.rpc('send_support',{p_topic:S.ctTopic||'general',p_body:t}).then(({error})=>{ b.disabled=false; if(error){toast(/too_many/.test(error.message)?'שלחת הרבה הודעות, נסה בעוד שעה':'השליחה נכשלה');return;} S.ctDraft=''; toast('ההודעה נשלחה ✓ נחזור אליך בהקדם'); openContact(); }); return;}
  if(act==='contact-open'){openContact(b.dataset.t);return;}
  switch(act){
    case 'start-free': startWorkout('אימון חופשי'); break;
    case 'start-tpl': { const t=S.templates.find(t=>t.id===b.dataset.id); if(t){closeSheet();startWorkout(t.name,t.id);} break; }
    case 'add-ex': openLibrary('active'); break;
    case 'rm-ex': { S.active.ex.splice(+b.dataset.ei,1); persistActive(); render(); break; }
    case 'add-set': { const e=S.active.ex[+b.dataset.ei]; const last=e.sets[e.sets.length-1];
      e.sets.push({w:'',r:'',pw:last?(last.w||last.pw||''):'',pr:last?(last.r||last.pr||''):'',done:false});
      persistActive(); render(); break; }
    case 'set-done': { const e=S.active?.ex?.[+b.dataset.ei], s=e?.sets?.[+b.dataset.si]; if(!s)break;
      if(!s.w&&s.pw)s.w=s.pw; if(!s.r&&s.pr)s.r=s.pr;
      s.done=!s.done;
      const ei2=+b.dataset.ei, si2=+b.dataset.si;
      // סט שהושלם מציע את המשקל והחזרות שלו לסט הבא
      if(s.done){ const nx=e.sets[si2+1];
        if(nx&&!nx.done){ if(s.w)nx.pw=s.w; if(s.r)nx.pr=s.r;
          const nw=document.getElementById(`w-${ei2}-${si2+1}`), nr=document.getElementById(`r-${ei2}-${si2+1}`);
          if(nw&&!nw.value)nw.placeholder=nx.pw||''; if(nr&&!nr.value)nr.placeholder=nx.pr||''; } }
      persistActive();
      // עדכון נקודתי של השורה — בלי רינדור מלא, כדי שסימון סט יעבוד גם כשהמקלדת פתוחה
      document.querySelectorAll(`[data-cell="${ei2}-${si2}"]`).forEach(el=>el.classList.toggle('set-done',s.done));
      const wi=document.getElementById(`w-${ei2}-${si2}`), ri=document.getElementById(`r-${ei2}-${si2}`);
      if(wi)wi.value=s.w??''; if(ri)ri.value=s.r??'';
      updateLive();
      if(s.done){ const nx=e.sets[si2+1]&&!e.sets[si2+1].done?`${e.n} · סט ${si2+2}`:(S.active.ex[ei2+1]?S.active.ex[ei2+1].n:'');
        startRest(e.rest||S.settings.rest,nx); } break; }
    case 'done-all': { const e=S.active?.ex[+b.dataset.ei]; if(!e||e.t!=='s')break;
      if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent='בטוח?';
        setTimeout(()=>{delete b.dataset.sure; if(b.isConnected)b.textContent='✓✓';},2200); break; }
      for(const s of e.sets){ if(s.done)continue;
        if(!s.w&&s.pw)s.w=s.pw; if(!s.r&&s.pr)s.r=s.pr;
        if(+s.r>0)s.done=true; }
      persistActive(); render(); startRest(e.rest||S.settings.rest,S.active.ex[+b.dataset.ei+1]?.n||''); break; }
    case 'ex-info': { const e=S.active?.ex[+b.dataset.ei]; if(!e)break;
      openExSheet(e.n,{reps:e.reps,sets:e.sets?.length,rest:e.rest,how:e.how}); break; }
    case 'hist-ex': openExSheet(b.dataset.n,{}); break;

document.addEventListener('input',ev=>{
  const i=ev.target.closest('[data-bind]'); if(!i)return;
  const k=i.dataset.bind;
  if(k==='w'||k==='r'){ const s=S.active?.ex[+i.dataset.ei]?.sets[+i.dataset.si]; if(s){s[k]=i.value; persistActive();} }
  else if(k==='cmin'||k==='ckm'||k==='cinc'){ const e=S.active?.ex[+i.dataset.ei]; if(e?.c){e.c[{cmin:'min',ckm:'km',cinc:'inc'}[k]]=i.value; persistActive();} }
  else if(k==='libq'){ S.lib.q=i.value; renderLibrary(); }
  else if(k==='foodq'){ i.style.height='auto'; i.style.height=Math.min(132,i.scrollHeight+2)+'px'; i.closest('.fsearch')?.classList.toggle('has',i.value.trim().length>=2); clearTimeout(foodSearch._t); foodSearch._t=setTimeout(()=>foodSearch(i.value),220); }
  else if(k==='tpln'){ if(_tplDraft)_tplDraft.name=i.value; }
  else if(k==='pqty'&&_portion){ const v=+String(i.value).replace(',','.'); if(v>0){_portion.qty=v; renderPortion();} }
  else if(k==='mif'){ if(!_mealEdit)return;
    if(i.dataset.mf==='mealname'){_mealEdit.name=i.value;return;}
    const it=_mealEdit.items[+i.dataset.mi]; if(!it)return;
    const f=i.dataset.mf;
    it[f]=f==='name'?i.value:(+String(i.value).replace(',','.')||0);
  }
  else if(k==='tplf'){ const e=_tplDraft?.ex[+i.dataset.i]; if(e){const f=i.dataset.f; e[f]=f==='reps'?i.value:(+i.value||0);} }
});
document.addEventListener('change',ev=>{
  if(ev.target.dataset&&ev.target.dataset.photoAngle&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0], a=ev.target.dataset.photoAngle, d=ev.target.dataset.photoDate; ev.target.value='';
    uploadPhoto(f,d,a); return;
  }
  if(ev.target.id==='label-photo'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value=''; readLabel(f); return;
  }
  if(ev.target.id==='food-photo'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value='';
    toast('מעבד תמונה…');
    shrinkImage(f).then(b64=>foodAI({image:b64,media:'image/jpeg'})).catch(()=>toast('קריאת התמונה נכשלה'));
    return;
  }
  const i=ev.target.closest('[data-bind]'); if(!i)return;
  if(i.dataset.bind==='progex'){S.progressEx=i.value; render();}
  else if(i.dataset.bind==='notif'){
    S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},S.settings.notif);
    const k=i.dataset.k;
    S.settings.notif[k]=i.checked;
    if(k==='remind'){
      if(i.checked){
        subscribePush().then(r=>{
          if(!r.ok){ S.settings.notif.remind=false; if(i.isConnected)i.checked=false;
            toast(r.why==='perm'?'צריך לאשר התראות בדפדפן':'המכשיר לא תומך — באייפון: הוסף קודם למסך הבית ופתח משם');
          }else toast('תזכורות הופעלו — נתראה בבוקר אימון 🗓️');
          persistSettings();
        });
        return;
      }else unsubscribePush();
    }
    else if(i.checked&&(k==='rest'||k==='pr'))ensureNotifPerm();
    persistSettings();
  }
});

  {n:'פשיטת ברכיים',m:'רגליים',t:'s',s:3,reps:'12–15',rest:75},
  {n:'כפיפת ברכיים',m:'רגליים',t:'s',s:3,reps:'10–15',rest:90},
  {n:'הרמות עקבים',m:'רגליים',t:'s',s:4,reps:'12–20',rest:60},
  {n:'הרמות רגליים בתלייה',m:'בטן וליבה',t:'s',s:3,reps:'10–15',rest:60},
  {n:'פלאנק',m:'בטן וליבה',t:'s',s:3,reps:'30–60 שנ׳',rest:60}]},
];

/* ---------- boot ---------- */
async function enterApp(user){
  S.user=user; S.mode='boot'; render();
  // בקרת גישה: משתמש חדש ממתין לאישור האדמין (נאכף גם בשרת ב-RLS). שגיאת רשת → ממשיכים (אופליין)
  if(PAID_RETURN||enterApp._claim){ enterApp._claim=false; try{ const c=await sb.rpc('claim_payment'); if(c.data?.ok&&!c.data.duplicate)toast('התשלום אומת, הגישה נפתחה 🎉'); }catch(_){} }
  try{ const pl=await sb.rpc('my_plan'); if(!pl.error&&pl.data){ S.plan=pl.data; const st=pl.data.status;
    if(st==='expired'){ S.mode='paywall'; render();
      if(PAID_RETURN&&!(enterApp._poll>=8)){ enterApp._poll=(enterApp._poll||0)+1; toast('מאשר את התשלום…'); setTimeout(()=>enterApp(user),4000); }
      return; }
    if(st!=='approved'){ S.access=st; S.mode='pending'; render(); return; } } }catch(_){}
  try{
    const [tpl,wo,st,bw,ml]=await Promise.all([
      sb.from('templates').select('id,name,ord,ex').order('ord'),
      sb.from('workouts').select('id,name,start_ts,end_ts,ex'),
      sb.from('settings').select('rest,active,prefs').maybeSingle(),
      sb.from('bodyweight').select('d,kg').order('d'),
      sb.from('meals').select('id,d,ts,name,kcal,protein,carbs,fat,items').gte('d',ymd(new Date(Date.now()-60*864e5))),
    ]);
    if(tpl.error||wo.error)throw tpl.error||wo.error;
    S.templates=(tpl.data||[]).map(r=>({id:r.id,name:r.name,order:r.ord||0,ex:r.ex||[]}));
    S.workouts=(wo.data||[]).map(r=>({id:r.id,name:r.name,start:+r.start_ts,end:+r.end_ts,ex:r.ex||[]}));
    S.weights=(bw.data||[]).map(r=>({d:r.d,kg:+r.kg}));
    S.meals=ml.data||[];
    if(st.data){ S.settings.rest=st.data.rest??90; S.active=st.data.active||null;
      S.settings.notif=Object.assign({rest:true,pr:true,sound:true,vib:true},st.data.prefs?.notif);
      S.settings.schedule=st.data.prefs?.schedule||{};
      S.settings.kcalT=st.data.prefs?.kcalT||null; S.settings.protT=st.data.prefs?.protT||null; S.settings.goalKg=st.data.prefs?.goalKg||null; S.settings.photoDay=st.data.prefs?.photoDay??null; S.settings.tourDone=st.data.prefs?.tourDone||null; }
    if(!S.templates.length){ // משתמש חדש — טעינת תוכניות ברירת המחדל
      S.templates=clone(DEFAULT_TEMPLATES);
      sb.from('templates').upsert(DEFAULT_TEMPLATES.map(t=>({id:t.id,user_id:user.id,name:t.name,ord:t.order,ex:t.ex}))).then(()=>{});
      toast('טענו לך 3 תוכניות מוכנות — אפשר לערוך בלשונית ״תוכניות״');
    }
    saveSnapshot();
  }catch(e){ // אופליין — ממשיכים מתמונת המצב המקומית
    const snap=loadSnapshot();
    if(snap){ S.templates=snap.templates||[]; S.workouts=snap.workouts||[]; S.settings=Object.assign({rest:90},snap.settings); S.weights=snap.weights||[]; S.meals=snap.meals||[]; toast('מצב אופליין — עובדים מהנתונים השמורים'); }
    else toast('טעינת הנתונים נכשלה — בדוק חיבור');
  }
  const localA=loadLocalActive();
  if(localA&&(!S.active||((localA.start===S.active.start)&&JSON.stringify(localA).length>=JSON.stringify(S.active).length)))S.active=localA;
  S.mode='app'; render(); updateSyncBadge(); trySync(); loadPhotos(); restoreRest();
  sb.rpc('is_admin').then(({data})=>{S.isAdmin=data===true;}).catch(()=>{});
  socLoad(); socSubscribe(); socPendingJoin();
  setTimeout(()=>{ if(!checkInstallGate())maybeStartTour(); },700);
  socialProfileFix();
  if(PAID_RETURN&&!enterApp._paid){ enterApp._paid=true; toast('תודה! התשלום התקבל 🎉'); }
  if(S.active){startClock();keepAwake(true);}
}
function hideSplash(){
  const sp=$('#splash'); if(!sp)return;
  setTimeout(()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); },450);
}
(async function boot(){
  render();
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session)await enterApp(session.user);
    else{ S.mode='auth'; render(); }
  }catch(e){ S.mode='auth'; render(); }
  hideSplash();
  sb.auth.onAuthStateChange((ev,sess)=>{
    if(ev==='PASSWORD_RECOVERY'){ setTimeout(openNewPassword,600); }
    if(sess&&!S.user)enterApp(sess.user);
    if(ev==='SIGNED_OUT'){PH.sets=[];PH.urls={};PH.loaded=false;S.user=null;S.workouts=[];S.templates=[];S.active=null;stopRest();S.mode='auth';render();}
  });
})();
</script>
