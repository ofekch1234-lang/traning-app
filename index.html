/* Layout: app-shell — sticky header, scrolling content, fixed bottom tab bar + rest-timer bar; everything derives from the tokens below. */

  --ink:#1A201C;

}

.ways{display:flex;gap:8px;align-items:stretch}

.stat3{display:grid;grid-template-columns:repeat(3,1fr)}

.stat3 span{font-size:12px;color:var(--muted)}
.bigw{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1}

.prem-card{display:flex;align-items:center;gap:12px;width:100%;text-align:var(--start);border-radius:20px;padding:16px;background:linear-gradient(135deg,#6D28D9,#BE185D);color:#fff}
.prem-card .lt{flex:1;display:flex;flex-direction:column;gap:3px}.prem-card b{font-size:17px}.prem-card span{font-size:13px;color:#F5E8FF}
.prem-card .cta{height:40px;padding:0 14px;border-radius:12px;background:#fff;color:#6D28D9;font-size:15px;font-weight:700;display:flex;align-items:center;flex-shrink:0}
.prem-card.on{background:linear-gradient(135deg,#065F46,#0F766E)}.prem-card.on .cta{color:#0F766E}
.me-head{display:flex;align-items:center;gap:14px;padding:0 4px}
.me-av{width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:26px;font-weight:700;flex-shrink:0}
.wk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;margin-top:10px}
.wk-row>div{display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--muted)}

.wk-row .on i{background:var(--accent)}.wk-row .sched i{border:2px dashed var(--accent);background:transparent}.wk-row .miss i{border:2px dashed var(--line);background:transparent}
.wk-row .today span{color:var(--ink);font-weight:700}
.wk-row .fut i{background:transparent;border:1px solid var(--line)}
/* active workout v13 */
.aw-head{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:19;background:var(--bg);margin:-6px -16px 0;padding:4px 16px 10px;display:flex;flex-direction:column;gap:8px}
.aw-top{display:flex;align-items:center;gap:10px}
.aw-mid{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}

.aw-fin{height:44px;padding:0 16px;border-radius:22px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:700}
.aw-prog{display:flex;align-items:center;gap:10px}
.aw-prog .bar2{flex:1;height:6px}
.ex-card.cur{border:1.5px solid var(--accent)}
.ex-row{display:flex;align-items:center;gap:12px;width:100%;text-align:var(--start);padding:13px 14px;color:inherit;min-height:48px}
.ex-row+.ex-row{border-top:1px solid var(--line)}
.ex-row .lt{flex:1;min-width:0}.ex-row .lt b{display:block;font-size:16px}.ex-row .lt small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-row .ok{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.ex-row .ok svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ex-prev{font-size:13px;color:var(--muted);margin-top:2px}
body.active-w nav.tabs{display:none}
body.active-w #restbar{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
body.active-w #app{padding-bottom:120px}
#restbar .inner{border-radius:20px;padding:12px 12px 12px 16px}
#restbar .t{min-width:58px;font-size:26px}
#restbar .tl{display:flex;flex-direction:column;min-width:60px}
#restbar .tl small{font-size:12px;color:color-mix(in srgb,var(--bg) 70%,transparent)}
#restbar button{border:0;background:color-mix(in srgb,var(--bg) 14%,transparent);border-radius:12px;height:40px;padding:0 12px;font-size:14px;font-weight:600}
#restbar button.go{background:var(--accent);color:var(--accent-ink);font-weight:700}
/* tab bar */
/* סרגל לשוניות צף: אי זכוכית מעוגל מעל התחתית, קפסולה שמחליקה ללשונית הפעילה */
:root{--tbb:max(10px,calc(env(safe-area-inset-bottom,0px) - 12px))}
nav.tabs{
  position:fixed;left:0;right:0;margin-inline:auto;width:calc(100% - 28px);max-width:520px;bottom:var(--tbb);z-index:30;
  background:color-mix(in srgb,var(--surface) 74%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:30px;
  box-shadow:0 10px 30px -6px rgba(10,20,14,.22),0 1px 2px rgba(10,20,14,.06);
  padding:6px;display:flex;justify-content:space-around;
}
nav.tabs .tb-pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:24px;background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none;opacity:0;transition:transform .32s cubic-bezier(.3,1.25,.5,1),width .32s cubic-bezier(.3,1.25,.5,1),opacity .2s}
nav.tabs .tb-pill.ready{opacity:1}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;color:var(--muted);font-size:11.5px;border-radius:24px;position:relative;z-index:1;transition:color .2s}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on .ic{color:var(--accent);stroke-width:2.3}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.fab{color:var(--ink);font-weight:700;overflow:visible}
nav.tabs button.fab .fabc{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:4px solid var(--bg);box-shadow:0 10px 22px -8px rgba(22,163,74,.65);box-sizing:border-box}
nav.tabs button.fab svg{width:27px;height:27px}
nav.tabs button.fab .ic{stroke-width:2.2}
nav.tabs button.fab.on{color:var(--accent)}
nav.tabs button.fab.on::before{display:none}
nav.tabs button.fab:active .fabc{transform:scale(.94)}
/* in a chat (group / Kobi) the workout button lies flat so it never covers the message box */
body.chatting nav.tabs button.fab{color:var(--muted);font-weight:400}
body.chatting nav.tabs button.fab .fabc{width:auto;height:auto;margin-top:0;background:none;color:inherit;border:0;box-shadow:none}
body.chatting nav.tabs button.fab svg{width:23px;height:23px}
body.chatting nav.tabs button.fab .ic{stroke-width:1.9}

nav.tabs .ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* rest timer bar */
#restbar{
  position:fixed;inset-inline:0;bottom:calc(var(--tbb) + 74px);z-index:29;
  display:flex;justify-content:center;padding:0 16px;
}
#restbar .inner{
  width:100%;max-width:528px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
}
#restbar .t{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.12;min-width:64px}
#restbar .bar{flex:1;height:5px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
#restbar .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
#restbar button{color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);padding:6px 11px;font-size:13px}

/* active workout */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex-name{font-weight:700;font-size:16px}
.prev{font-size:12.5px;color:var(--muted)}
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center}
.setgrid .h{font-size:11px;color:var(--muted);text-align:center}
.setidx{text-align:center;color:var(--muted);font-size:13px}
.setgrid input{text-align:center;padding:9px 4px}
.fx-dot{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:9999}
.fx-cf{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9998}
.fx-cheer{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9997;display:flex;align-items:center;gap:11px;
  padding:11px 18px 11px 14px;border-radius:18px;background:rgba(17,22,19,.93);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 12px 32px rgba(0,0,0,.32);animation:cheerIn .5s cubic-bezier(.2,1.4,.4,1) both;max-width:calc(100vw - 32px);pointer-events:none}
.fx-cheer.gold{background:linear-gradient(135deg,#2b2309,#4d3c0d);box-shadow:0 0 0 1px rgba(226,176,28,.55),0 12px 32px rgba(226,176,28,.28)}
.fx-cheer .i{font-size:28px;line-height:1;animation:pop .55s .08s cubic-bezier(.3,1.6,.4,1) both}
.fx-cheer b{display:block;font-size:15.5px}.fx-cheer small{display:block;font-size:12.5px;opacity:.78;margin-top:1px}
.fx-cheer.out{animation:cheerOut .35s ease-in both}
@keyframes cheerIn{from{opacity:0;transform:translate(-50%,-30px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cheerOut{to{opacity:0;transform:translate(-50%,-22px)}}
.fin-hero{text-align:center;margin:0 0 8px}.fin-hero span{font-size:46px;line-height:1.1;display:block;animation:pop .6s cubic-bezier(.3,1.6,.4,1) both}.fin-hero b{font-size:17px}
.done-btn{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.done-btn svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.set-done input{background:var(--accent-soft);border-color:var(--accent)}
.set-done.r-over input{background:var(--gold-soft);border-color:var(--gold);color:var(--gold);font-weight:700}
.set-done.r-under input{background:var(--surface2);border-color:var(--line)}
.setgrid .h .tgt{display:inline-block;margin-inline-start:3px;padding:1px 6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px}
.rtip{margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:1px;font-size:13.5px}

.rtip.up{background:var(--gold-soft)}.rtip.up>b{color:var(--gold)}.rtip.up span b{color:var(--ink)}
.set-done .done-btn{background:var(--accent);border-color:var(--accent)}
.set-done .done-btn svg{stroke:var(--accent-ink)}
.addset{margin-top:8px;width:100%;padding:9px;border:1px dashed var(--line);color:var(--muted);font-size:14px}

/* history */
.h-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.h-stats{display:flex;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}

.h-ex{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.h-ex .sets{color:var(--muted);text-align:var(--end);direction:ltr}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile{padding:14px 8px;text-align:center}
.tile+.tile{border-inline-start:1px solid var(--line)}
.tile .v{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.12;color:var(--accent)}

.chartwrap{position:relative}

/* modal sheet */
#sheet-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
#sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;

  box-shadow:var(--overlay-shadow);

  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));}

.npbar svg{display:block;width:100%;height:auto}
.npbars{position:relative;z-index:1;display:flex;justify-content:center;gap:4px;margin:0 0 2px;flex-wrap:wrap}

.npbars button b{color:#cfd8d3;font-weight:700}
.npbars button.on{background:#f1f4f2;color:#111;border-color:#f1f4f2}.npbars button.on b{color:#111}

.nptot b{color:#fff;font-variant-numeric:tabular-nums}
.pbtns{display:flex;justify-content:center;gap:6px;margin-top:10px;direction:ltr}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;max-width:66px;padding:8px 0 6px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.pbtn:active{transform:scale(.93)}
.pbtn b{font-size:13px;font-variant-numeric:tabular-nums}
.pbtn svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
.pbcap{text-align:center;color:var(--muted);font-size:11.5px;margin-top:5px}
.npstep{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}

.npgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.npgrid button{padding:12px 0;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:17px;font-weight:500}
.npgrid button.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.npdigits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;direction:ltr}
.npgrid,.npstep,.npdisp{direction:ltr}
.npdigits button{padding:14px 0;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:22px;font-weight:600}

.npchips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.fbank{cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);font-size:14.5px;text-align:start;margin-top:-4px}

.fbank.over{background:var(--gold-soft)}.fbank.over>svg:first-child{color:var(--gold)}
.kbank{display:flex;align-items:center;gap:12px;padding:14px}
.kbank .lt{display:flex;flex-direction:column;gap:2px;min-width:0}.kbank b{font-size:15.5px}.kbank small{color:var(--muted);font-size:13px}
.kb-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.kb-ic.over{background:var(--gold-soft);color:var(--gold)}.kb-ic svg{width:22px;height:22px}
.nprange{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.nprange>div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 6px 2px}
.nprange>div>span{font-size:13px;color:var(--muted);font-weight:600}
.nprange .npstep{gap:8px;margin:4px 0 6px}.nprange .npstep button{width:44px;height:40px;background:var(--surface)}
.nprange .npstep b{min-width:34px;text-align:center;font-size:22px;font-weight:800}
/* מתלה משקולות נגלל */
.rack{display:flex;align-items:flex-end;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:12px calc(50% - 26px) 6px;scrollbar-width:none;direction:ltr}
.rack::-webkit-scrollbar{display:none}
.dbitem{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:none;border:none;padding:0;transition:transform .15s}
.dbitem{opacity:.4;transform:scale(.8)}
.dbitem svg{display:block}
.dbitem b{font-size:12.5px;color:#8f9a94;font-variant-numeric:tabular-nums}
.dbitem.sel{transform:scale(1);opacity:1}
.dbitem:not(.sel) .dbsel{display:none}
.dbitem.sel b{color:#2fd16b;font-size:15px;font-weight:800}
.npstage .rack{-webkit-mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);position:relative;z-index:1}
.rackhint{text-align:center;color:var(--muted);font-size:11.5px;margin-bottom:2px}
/* מגדל מכונה: מסגרת, מוטות מנחים, הלוחות הנבחרים מורמים והפין נעוץ */
.mstack{position:relative;width:236px;margin:8px auto 2px;padding:0 20px;direction:ltr}
.mstack .rod{position:absolute;top:-12px;bottom:-2px;width:6px;border-radius:3px;background:linear-gradient(90deg,#6c737b,#f2f4f6 45%,#8a9199)}
.mstack .rod.l{left:4px}.mstack .rod.r{right:4px}
.mstack .cab{position:absolute;left:50%;top:-12px;height:12px;width:3px;transform:translateX(-50%) translateY(-6px);background:#9aa1a9}
.mstack .up{transform:translateY(-6px)}
.mstack .gap{height:6px;display:flex;justify-content:center}.mstack .gap i{width:3px;height:100%;background:linear-gradient(#cfd4d9,#7c838b);margin-top:-6px}
.splate{position:relative;display:flex;width:100%;height:14px;margin-bottom:2px;border-radius:4px;border:none;padding:0 10px;align-items:center;justify-content:space-between;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),linear-gradient(180deg,#2a2f2c,#1c201e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent}
.splate span{font-size:9.5px;line-height:1;font-weight:800;color:#59635e;font-variant-numeric:tabular-nums}
.splate i{font-style:normal;font-size:7px;letter-spacing:1.3px;color:#3f4844}
.splate.on{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(180deg,#4a5059 0%,#2c3036 55%,#1d2024 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.5)}
.splate.on span{color:#f1f4f6}.splate.on i{color:#9aa3ab}
.splate .pin{position:absolute;left:100%;top:50%;transform:translateY(-50%);display:flex;align-items:center;margin-left:-2px;pointer-events:none}
.splate .pin s{width:30px;height:4px;border-radius:2px;background:linear-gradient(#fafbfc,#8a929a)}
.splate .pin u{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5b6168,#1a1c1f 60%,#000);box-shadow:0 0 0 2px #e2b01c,0 3px 8px rgba(0,0,0,.6)}
.splate .pin em{font-style:normal;margin-left:7px;font-size:12px;font-weight:800;color:#e2b01c}
.npact{display:flex;gap:8px;margin-top:10px}
input[data-np]{caret-color:transparent;cursor:pointer}
/* nutrition composer & meal rows */
.acttile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 6px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.acttile svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actmain{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700}
#food-text{padding:13px 12px;font-size:16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-family:var(--body);box-sizing:border-box}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mavatar{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.mkcal{text-align:center;flex-shrink:0;min-width:46px}
.mkcal b{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.12;display:block}
.mkcal span{font-size:10px;color:var(--muted)}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}

/* exercise demo (free-exercise-db frames) */
.demo{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);margin-bottom:12px}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo .fb{opacity:0}
.demo .tag{position:absolute;top:8px;inset-inline-start:8px;background:rgba(10,20,14,.7);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
@media (prefers-reduced-motion:no-preference){ .demo .fb{animation:demoflip 2.4s ease-in-out infinite} }
@keyframes demoflip{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
.libthumb{width:42px;height:32px;border-radius:6px;object-fit:cover;background:#fff;border:1px solid var(--line);flex-shrink:0}
/* food database search */
.fsugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.fs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border-bottom:1px solid var(--line);border-radius:0;text-align:var(--start)}
.fs-name{flex:1;min-width:0;font-size:14.5px}
.fs-val{flex-shrink:0;font-weight:600;font-size:14px}
.fs-val small{font-weight:400;color:var(--muted);font-size:10.5px}
.fs-foot{padding:8px 12px;background:var(--surface2)}
.basket{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.bitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bitem>span:first-child{flex:1;min-width:0}
/* reorder mode */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.rrow .rname{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rarrow{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--ink);flex-shrink:0}
.rarrow:disabled{opacity:.3}
.drag-drag{opacity:.95!important;box-shadow:0 14px 34px rgba(10,20,14,.28);transform:scale(1.02)}
/* drag to reorder */
.drag-h{cursor:grab;touch-action:none;padding:6px 8px;color:var(--muted);font-size:18px;line-height:1;user-select:none;-webkit-user-select:none}
.drag-ghost{opacity:.35}
.drag-chosen{box-shadow:0 8px 24px rgba(10,20,14,.22)}
/* weight calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:var(--dir)}
.calhd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.calday{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-height:44px;padding:4px 0;
  border-radius:8px;background:var(--surface2);border:1px solid transparent}
.calday i{font-style:normal;font-size:10.5px;color:var(--muted);line-height:1.2}
.calday b{font-family:var(--disp);font-weight:800;font-size:14px;line-height:1.1;color:var(--ink)}
.calday.has{background:var(--accent-soft)}
.calday.tdy{border-color:var(--accent)}
.calday.tdy i{color:var(--ink);font-weight:700}
/* progress photos */
.phslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phslot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;cursor:pointer;font-size:12.5px;color:var(--muted)}
.phslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phslot.has{border-style:solid;border-color:var(--accent)}
.ph-hit{position:absolute;inset:0;background:none;border:0;cursor:pointer}
.ph-acts{position:absolute;inset:0;background:rgba(10,14,12,.62);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px}
.ph-acts button,.ph-acts label{background:#fff;color:#141a16;border:0;border-radius:10px;padding:8px 4px;font:inherit;font-size:12.5px;font-weight:700;text-align:center;cursor:pointer}
.ph-acts .del{background:rgba(255,255,255,.18);color:#fff}
.ph-pd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface2);margin-bottom:12px}
.ph-pd>span{font-size:26px}.ph-pd b{display:block}.ph-pd div span{font-size:12.5px;color:var(--muted)}
.ph-pd.now{background:var(--accent);color:var(--accent-ink)}.ph-pd.now div span{color:inherit;opacity:.85}
.ph-pd.now{animation:pdPulse 1.6s ease 2}@keyframes pdPulse{50%{transform:scale(1.02)}}
.ph-wt{width:100%;text-align:var(--start);padding:12px 14px;margin:0}
#phview{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:center;justify-content:center}
#phview[hidden]{display:none}
#phview>img{max-width:100%;max-height:100%;object-fit:contain}
#phview .pv-top{position:absolute;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#phview .pv-top button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:18px}
#phview .pv-tabs{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:8px}
#phview .pv-tabs button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit}
#phview .pv-tabs button.on{background:#fff;color:#000}
.phslot .lbl{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:3px 0}
.phrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:var(--start)}
.phrow:last-child{border-bottom:none}
.phthumbs{display:flex;gap:4px;flex-shrink:0;direction:ltr}
.phthumbs span{width:38px;height:50px;border-radius:6px;background:var(--surface2);overflow:hidden;display:block}
.phthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmpgrid figure{margin:0}
.cmpgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--surface2)}
.cmpgrid figcaption{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.cmpgrid label select{margin-top:3px;padding:7px 8px;font-size:14px}
.cmpph{width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.phmon{font-weight:700;font-size:13px;padding:10px 0 4px;border-bottom:1px solid var(--line);margin-top:4px}

/* settings switches */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:none}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(-19px)}
:root[dir="ltr"] .sw:checked::after{transform:translateX(19px)}

/* toast */
#toast{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;justify-content:center;z-index:50;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}

/* home dashboard */
.greet-wrap{margin:4px 0 2px}
.greet{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.12}
.planpill{margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-size:13px;font-weight:600;border:0}
.planpill.paid{background:var(--accent-soft);color:var(--accent)}
.planpill.free{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(236,72,153,.12));color:#9333EA}
.aiq-free{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.aiq-free .linkbtn{font-size:13px;font-weight:600;color:var(--accent)}
.co-lockcard{position:relative;margin-top:4px}
.co-lockcard .co-blur{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.co-lockcard .co-lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:0 10px}
.pw-prem{background:linear-gradient(135deg,rgba(124,58,237,.10),rgba(236,72,153,.08) 60%,rgba(34,197,94,.08));border-radius:16px;padding:14px}
.pw-prem .pr{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.pw-prem .pr i{font-style:normal;flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;font-size:13px;font-weight:700}
.pw-prem .pr b{display:block;font-size:15px}.pw-prem .pr span{font-size:13px;color:var(--muted)}
.dots{display:flex;justify-content:space-between;margin-top:10px;padding:0 2px;direction:var(--dir)}
.day.miss i{background:transparent;border:2px dashed var(--line)}
.day{text-align:center;font-size:11.5px;color:var(--muted)}
.day i{display:block;width:13px;height:13px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);margin:5px auto 0}
.day.on i{background:var(--accent);border-color:var(--accent)}
.day.today span{color:var(--ink);font-weight:700}
.linkbtn.small{font-size:12.5px;padding:2px}
/* weekly schedule grid */
.schedgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;direction:var(--dir)}
.schedday{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.schedday .dl{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.12;color:var(--muted)}
.schedday .dn{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schedday.has{background:var(--accent-soft);border-color:var(--accent)}
.schedday.has .dl,.schedday.has .dn{color:var(--ink)}
.schedday .dd{font-size:9.5px;color:var(--muted);line-height:1}
.schedday.tdy{outline:2px solid var(--accent);outline-offset:-2px}
.day .dt{display:block;font-size:10px;color:var(--muted);font-weight:400;line-height:1;margin-top:1px}
.day.today .dt{color:var(--ink);font-weight:700}
.day.sched i{background:transparent;border:2px solid var(--accent)}

/* empty states */
.empty{border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--ink);margin-bottom:4px}

.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.fin-ex{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}

/* splash — מסך כניסה ממותג */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(135deg,#2FD16B,#17A34A 55%,#0A6630);
  transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:98px;height:98px;border-radius:26px;box-shadow:0 18px 44px rgba(5,42,16,.45)}
#splash .sb{font-family:var(--brand);font-size:32px;color:#fff;letter-spacing:.5px}
#splash .sb b{font-weight:400;color:#073018}
#splash .st{color:rgba(255,255,255,.75);font-size:13.5px}
:root[data-g="f"] #splash{background:linear-gradient(135deg,#F472B6,#DB2777 55%,#831843)}
:root[data-g="f"] #splash img{box-shadow:0 18px 44px rgba(80,7,36,.45)}
:root[data-g="f"] #splash .sb b{color:#500724}
.auth-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-g button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:16px;background:var(--surface2);border:2px solid transparent;color:inherit;font:inherit}
.auth-g button span{font-size:30px}.auth-g button b{font-size:15px}
.auth-g button[data-v="f"]{border-color:#F9A8D4}.auth-g button[data-v="m"]{border-color:#86EFAC}

@media (prefers-reduced-motion:no-preference){
  .card,.ex-card,.h-card{transition:border-color .15s}
  .btn,.chip,.done-btn,.plate,nav.tabs button{transition:transform .12s ease}
  .btn:active,.chip:active,.done-btn:active,nav.tabs button:active{transform:scale(.95)}
  #sheet{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  #np{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  #np-bg,#sheet-bg{animation:fadein .2s ease-out}
  #restbar .inner{animation:up .25s cubic-bezier(.2,.8,.3,1)}
  #toast span{animation:rise .25s ease-out}
  .set-done .done-btn{animation:pop .34s cubic-bezier(.3,1.6,.4,1)}
  .dbitem.sel .pl{transition:background .15s}
  /* חיות: מעבר בין לשוניות לפי כיוון, לחיצות, רצף, היום */
  #view.anim.tab-l>*{animation-name:slideL}
  #view.anim.tab-r>*{animation-name:slideR}
  .card[data-act],.inv-card,.tile,.mn-g,.mn-ic,.pr-row,.acttile,.pbtn,.mn-meal{transition:scale .14s ease}
  button:active:not(:disabled),.card[data-act]:active,.inv-card:active,.acttile:active{scale:.97}
  .pill.streak{animation:glowP 2.6s ease-in-out infinite}
  .day.today:not(.on) i{animation:todayP 2.2s ease-in-out infinite}
  .day.pop i{animation:pop .55s cubic-bezier(.3,1.6,.4,1) .3s both}
  /* כניסת תוכן במעבר לשונית */
  #view.anim>*{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
  #view.anim>*:nth-child(2){animation-delay:.05s}
  #view.anim>*:nth-child(3){animation-delay:.09s}
  #view.anim>*:nth-child(4){animation-delay:.13s}
  #view.anim>*:nth-child(5){animation-delay:.16s}
  #view.anim>*:nth-child(n+6){animation-delay:.19s}
  /* ספלאש */
  #splash img{animation:spLogo .7s cubic-bezier(.3,1.4,.4,1) both}
  #splash .sb{animation:rise .5s .25s ease-out both}
  #splash .st{animation:rise .5s .4s ease-out both}
  @keyframes spLogo{from{transform:scale(.55) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* מצב ההרשאה להתראות: 'default' | 'granted' | 'denied', או null כשאין תמיכה */
function notifPerm(){ if(IS_NATIVE)return NAT.perm; try{ return 'Notification' in window?Notification.permission:null; }catch(_){ return null; } }
async function ensureNotifPerm(){
  if(IS_NATIVE){ if(NAT.perm==='granted')return true; if(NAT.perm==='denied')return false; return natPermAsk(); }
  try{
    if(!('Notification' in window))return false;
    if(Notification.permission==='granted')return true;
    if(Notification.permission==='denied')return false;
    return (await Notification.requestPermission())==='granted';
  }catch(e){return false;}
}
/* בקשת התראות ברגע הנכון: שאלה אחת לכל הקשר, עם הסבר של קובי לפני החלון של המערכת */
function notifCan(){ if(IS_NATIVE)return NAT.perm==='default'; try{ return ('Notification' in window)&&Notification.permission==='default'&&(!IS_IOS||IS_STANDALONE); }catch(_){ return false; } }
function notifAsk(ctx,title,text){
  if(!notifCan()||!$('#sheet').hidden||!$('#np').hidden)return false;

  if(seen[ctx])return false; seen[ctx]=1; try{localStorage.setItem('np-ctx',JSON.stringify(seen));}catch(_){}

const PUSH_PUBKEY='BEZW8tXMc6pOHrP87-KW8pfmZvr1ueA7S7BqBzUQu-Hp2DC_Yi2B-K_yO7JxWeRClXUDK6K1AsMETaQpvY-hkXw';
function b64uToU8(s){const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0));}
async function subscribePush(){
  if(!(await ensureNotifPerm()))return {ok:false,why:'perm'};
  if(IS_NATIVE)return {ok:true}; // באפליקציה המותקנת: התראות מקומיות, בלי מנוי Push של הדפדפן
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(PUSH_PUBKEY)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subs').upsert({endpoint:j.endpoint,user_id:S.user.id,keys:j.keys});
    if(error)throw error;
    return {ok:true};
  }catch(e){ console.error(e); return {ok:false,why:'sub'}; }
}
/* בכל פתיחה: אם יש הרשאה, מוודאים שהמינוי הנוכחי של המכשיר שמור בשרת (מכשירים מחליפים מינוי מדי פעם) */
async function syncPush(){
  if(IS_NATIVE)return;
  try{
    if(!S.user||!('Notification' in window)||Notification.permission!=='granted'||!('serviceWorker' in navigator))return;
    const reg=await navigator.serviceWorker.ready; if(!reg.pushManager)return;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(PUSH_PUBKEY)});
    const j=sub.toJSON(); if(!j.endpoint)return;
    const last=localStorage.getItem('nr-push-ep');
    if(last===j.endpoint+'|'+S.user.id&&Date.now()-(+localStorage.getItem('nr-push-at')||0)<3*864e5)return;
    const {error}=await sb.from('push_subs').upsert({endpoint:j.endpoint,user_id:S.user.id,keys:j.keys});
    if(!error){ localStorage.setItem('nr-push-ep',j.endpoint+'|'+S.user.id); localStorage.setItem('nr-push-at',String(Date.now())); }
  }catch(e){ console.warn('syncPush',e); }
}
async function unsubscribePush(){
  if(IS_NATIVE)return;
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){ await sb.from('push_subs').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe(); }
  }catch(e){}
}
async function notify(title,body){
  title=tt(title); body=tt(body);
  if(IS_NATIVE){ if(NAT.perm==='granted')natNotify(title,body); return; }
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker?.ready;
    if(reg?.showNotification)reg.showNotification(title,{body,icon:window.NR_G==='f'?'icon-f-192.png':'icon-192.png?v=2',badge:'badge-96.png',vibrate:[200,100,200]});
    else new Notification(title,{body,icon:'icon-192.png?v=2'});
  }catch(e){}
}

/* best historical weight per exercise (finished workouts only) */
function bestMap(){
  const m={};
  for(const w of S.workouts)for(const e of w.ex||[]){if(e.t!=='s')continue;
    for(const s of e.sets||[]){const wt=+s.w||0,r=+s.r||0;if(r>0&&wt>(m[e.n]?.w||0))m[e.n]={w:wt,r,ts:w.start};}}
  return m;
}
/* last performance per exercise */
function lastPerf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name);
    if(e){ if(e.t==='c') return e.c?`קודם: ${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`:null;
      const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
      return 'קודם: '+ss.map(s=>`${+s.w||0}×${+s.r||0}`).join(' · ');}}
  return null;
}
function lastSetsOf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name&&e.t==='s');
    if(e&&(e.sets||[]).some(s=>+s.r>0))return e.sets.filter(s=>+s.r>0);}
  return null;
}
/* מאמן חכם: אם בפעם הקודמת כל הסטים סגרו את קצה הטווח — הצעה לעלות משקל */
const e1rm=(w,r)=>r>0?w*(1+r/30):0;
function coachTip(name,repsRange,nSets){
  const last=lastSetsOf(name); if(!last||!last.length)return null;
  const nums=String(repsRange||'').match(/\d+/g); if(!nums)return null;
  const top=+nums[nums.length-1]; if(!top||top>30)return null; // טווחי שניות (פלאנק) לא רלוונטיים
  const maxW=Math.max(...last.map(s=>+s.w||0)); if(maxW<=0)return null;
  const enough=last.length>=Math.min(nSets||last.length,last.length);
  const allTop=last.every(s=>(+s.r||0)>=top);
  if(allTop&&enough){
    const inc=maxW>=40?2.5:(maxW>=15?2:1); // קפיצה קטנה יותר במשקלים קלים
    return {w:Math.round((maxW+inc)*10)/10, from:maxW};
  }
  return null;
}
/* היסטוריית ביצועים לתרגיל */
function historyOf(name){
  const out=[];
  for(const w of [...S.workouts].sort((a,b)=>b.start-a.start)){
    const e=(w.ex||[]).find(e=>e.n===name); if(!e)continue;
    if(e.t==='c'){ if(e.c&&(e.c.min||e.c.km))out.push({ts:w.start,txt:`${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`}); continue; }
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const best=Math.max(...ss.map(s=>e1rm(+s.w||0,+s.r||0)));
    out.push({ts:w.start,txt:ss.map(s=>`${+s.w||0}×${+s.r||0}`).join(' · '),e1:Math.round(best)});
  }
  return out;
}

const T={end:0,total:0,int:null};
let audioCtx=null;
function beep(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.12;
    o.start();o.stop(audioCtx.currentTime+.18);
    const o2=audioCtx.createOscillator();o2.connect(g);o2.frequency.value=1175;
    o2.start(audioCtx.currentTime+.22);o2.stop(audioCtx.currentTime+.42);

}
/* התראת סוף מנוחה דרך השרת: האפליקציה ברקע מושהית ע"י מערכת ההפעלה,

let _pushOk=false;
async function ensureRestPush(){
  if(_pushOk||!S.user||S.settings.notif?.rest===false)return;
  try{
    const perm=IS_NATIVE?NAT.perm:('Notification' in window)&&('PushManager' in window)?Notification.permission:null;
    if(!perm)return;
    if(perm==='default'){
      let asked=false; try{asked=!!localStorage.getItem('np-rest-asked');}catch(e){}
      if(asked)return;
      try{localStorage.setItem('np-rest-asked','1');}catch(e){}
      setTimeout(()=>notifAsk('rest','המנוחה התחילה ⏱️','רוצה שאודיע לך כשהיא נגמרת, גם כשהמסך כבוי או שהטלפון בכיס? זה מה שההתראות בשביל.'),400);
      return;
    }
    if(perm==='denied'||IS_NATIVE)return;
    const r=await subscribePush(); _pushOk=!!r.ok;
  }catch(e){}

const REST_KEY='nextrep-rest';
function saveRestState(){ try{ if(T.int)localStorage.setItem(REST_KEY,JSON.stringify({end:T.end,total:T.total,label:T.label,armed:!!T.armed,fireAt:T.fireAt||''})); else localStorage.removeItem(REST_KEY); }catch(e){} }
function restoreRest(){
  try{ const r=JSON.parse(localStorage.getItem(REST_KEY)||'null'); if(!r||!S.active)return;
    if(r.end>Date.now()+500){ T.end=r.end;T.total=r.total;T.label=r.label;T.armed=r.armed;T.fireAt=r.fireAt||new Date(r.end).toISOString();T.armOk=!!r.armed;
      $('#restbar').hidden=false; clearInterval(T.int);T.int=setInterval(tickRest,250);tickRest(); }
    else localStorage.removeItem(REST_KEY);
  }catch(e){}
}
function armServerRest(label,tries=0){
  if(!S.user||S.settings.notif?.rest===false)return;
  if(IS_NATIVE){ // האפליקציה המותקנת מתזמנת התראה מקומית במכשיר: מדויקת ועובדת גם בלי קליטה
    T.armed=true; T.armOk=true; T.fireAt=new Date(T.end).toISOString(); saveRestState(); natCancel(NAT.rest);
    if(NAT.perm==='granted')natNotify(tt('המנוחה נגמרה 💪'),tt(label?`הבא: ${label}`:'הסט הבא מחכה לך'),new Date(T.end),NAT.rest);
    return; }
  T.armed=true; T.armOk=false; T.fireAt=new Date(T.end).toISOString(); saveRestState();
  const row={user_id:S.user.id,fire_at:T.fireAt,title:tt('המנוחה נגמרה 💪'),body:tt(label?`הבא: ${label}`:'הסט הבא מחכה לך')}, at=T.fireAt;
  T.row=row;
  sb.from('rest_timers').upsert(row).then(({error})=>{
    if(T.fireAt!==at)return; // a newer arm replaced this one
    if(!error){ T.armOk=true; return; }
    console.error('rest arm',error);
    // weak gym reception: retry quietly a few times before telling the user
    if(tries<3&&T.int&&T.end-Date.now()>4000)setTimeout(()=>{ if(T.int&&T.fireAt===at)armServerRest(label,tries+1); },2000*(tries+1));
    else toast('לא הצלחנו לתזמן את התראת המנוחה — בדוק חיבור');
  },()=>{ if(T.fireAt===at&&tries<3&&T.int)setTimeout(()=>{ if(T.int&&T.fireAt===at)armServerRest(label,tries+1); },2000*(tries+1)); });
}
/* leaving the app right after a set: if the timer hasn't reached the server yet, send it with keepalive
   (iOS freezes the page in the background, so a normal request can die halfway) */
function flushRestArm(){
  try{ if(!T.int||!T.armed||T.armOk||!T.row||!window._tok||T.end-Date.now()<2500)return;
    fetch(SUPABASE_URL+'/rest/v1/rest_timers',{method:'POST',keepalive:true,
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+window._tok,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(T.row)}).then(r=>{ if(r.ok)T.armOk=true; }).catch(()=>{});
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')flushRestArm(); });
window.addEventListener('pagehide',flushRestArm);
function disarmServerRest(){
  if(!T.armed||!S.user)return;
  if(IS_NATIVE){ T.armed=false; T.armOk=false; saveRestState(); natCancel(NAT.rest); return; } T.armed=false; T.armOk=false; saveRestState();
  // delete only THIS timer: a late delete must never wipe a newer rest that was armed right after it
  let q=sb.from('rest_timers').delete().eq('user_id',S.user.id);
  if(T.fireAt)q=q.eq('fire_at',T.fireAt);
  q.then(()=>{},()=>{});
}

const HO={clip:null,ok:false,p:null};
function hoArmClip(){
  if(!IS_IOS||IS_STANDALONE||!window.ClipboardItem||!navigator.clipboard?.write||HO.clip)return;
  let res,rej; const pr=new Promise((a,b)=>{res=a;rej=b;}); HO.clip={res,rej};
  setTimeout(()=>{ if(HO.clip){ HO.clip.rej(new Error('timeout')); HO.clip=null; } },30000);
  try{ navigator.clipboard.write([new ClipboardItem({'text/plain':pr.then(c=>new Blob([c],{type:'text/plain'}))})])
    .then(()=>{ HO.ok=true; logEv('ho_clip',{ok:1}); const el=$('#ig-code'); if(el)hoMarkCopied(el); },()=>{ logEv('ho_clip',{ok:0}); }); }catch(_){}

function hoFetch(){

    const {data}=await sb.functions.invoke('handoff',{body:{action:'create'}});

  })();

function landFx(){
  try{ startLandTimer._io?.disconnect(); startLandTimer._hs?.disconnect(); }catch(_){}
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches, els=[...document.querySelectorAll('.lx .rv')];
  if(rm||!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); }
  else { const io=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting)return; const el=en.target; el.classList.add('in'); io.unobserve(el);
      el.querySelectorAll('[data-cnt]').forEach(b=>{ const to=+b.dataset.cnt, t0=performance.now(); const f=now=>{ const k=Math.min(1,(now-t0)/1100); b.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1)requestAnimationFrame(f); }; requestAnimationFrame(f); }); }),{rootMargin:'0px 0px -8% 0px',threshold:.12});
    els.forEach(e=>io.observe(e)); startLandTimer._io=io; }
  // the sticky CTA lives on <body>: an ancestor with a transform (page transition) would pin it to the page instead of the screen
  document.querySelectorAll('body>#lx-sticky').forEach(o=>o.remove());
  const hero=$('#lx-hero'), st=$('#lx-sticky'); if(st)document.body.appendChild(st);
  if(hero&&st&&'IntersectionObserver' in window){ const hs=new IntersectionObserver(([en])=>{ const end=document.querySelector('.lx-end'); const endIn=end&&end.getBoundingClientRect().top<innerHeight; st.classList.toggle('on',!en.isIntersecting&&!endIn); },{threshold:0}); hs.observe(hero); startLandTimer._hs=hs;
    if(!landFx._sc){ landFx._sc=1; addEventListener('scroll',()=>{ const s2=$('#lx-sticky'), e2=document.querySelector('.lx-end'), h2=$('#lx-hero'); if(!s2||!e2||!h2)return; const r=h2.getBoundingClientRect(); s2.classList.toggle('on',r.bottom<0&&e2.getBoundingClientRect().top>innerHeight*.9); },{passive:true}); } }
}
function startLandTimer(){
  requestAnimationFrame(landFx);
  clearInterval(startLandTimer._i); let left=63; const total=90, c=2*Math.PI*20;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  startLandTimer._i=setInterval(()=>{
    const t=$('#ld-t'), r=$('#ld-ring'); if(!t){clearInterval(startLandTimer._i);return;}
    left=left<=0?total:left-1;
    t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    r.setAttribute('stroke-dashoffset',(c*(1-left/total)).toFixed(1));
  },1000);
}

async function doAuth(){
  const email=($('#au-email')?.value||'').trim(), pass=$('#au-pass')?.value||'';
  const name=($('#au-name')?.value||'').trim(); S.authName=name;
  const err=$('#autherr'); if(err)err.textContent='';
  if(!email||!pass){if(err)err.textContent='מלא אימייל וסיסמה';return;}
  if(S.authMode==='signup'&&!name){if(err)err.textContent='מלא שם — ככה נדע איך לקרוא לך';return;}
  if(S.authMode==='signup'&&!$('#au-terms')?.checked){if(err)err.textContent='כדי להירשם יש לאשר את התקנון ומדיניות הפרטיות';return;}
  const btn=$('#authgo'); if(btn){btn.disabled=true;btn.textContent='רק רגע…';}
  try{
    if(S.authMode==='signup'){
      let ref=null; try{ref=localStorage.getItem('nr-ref');}catch(_){}
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:Object.assign({full_name:name,terms_accepted:new Date().toISOString(),terms_v:'2026-10-20',lang:LANG},ref?{ref}:{})}});
      if(error)throw error;
      if(!data.session){
        $('#view').innerHTML=`<div class="empty" style="margin-top:48px"><div class="big">כמעט שם ✉️</div>שלחנו קישור אישור אל<br><b dir="ltr">${esc(email)}</b><br>פתח את המייל, לחץ על הקישור — וחזור לכאן להתחבר.</div>`;
        return;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){
    const m=String(e?.message||'');
    if(err)err.textContent=
      /already registered/i.test(m)?'האימייל כבר רשום — נסה להתחבר':
      /invalid login/i.test(m)?'אימייל או סיסמה שגויים':
      /at least 6|too short/i.test(m)?'הסיסמה צריכה להיות באורך 6 תווים לפחות':
      /not confirmed/i.test(m)?'צריך לאשר קודם את המייל — בדוק את תיבת הדואר':
      /valid email/i.test(m)?'כתובת האימייל לא תקינה':
      'שגיאה: '+m;
  }finally{
    const b2=$('#authgo'); if(b2){b2.disabled=false;b2.textContent=S.authMode==='signup'?'הרשמה':'התחברות';}
  }
}

function firstName(){
  return String(S.user?.user_metadata?.full_name||'').trim().split(/\s+/)[0]||'';
}
function nextTpl(){
  const ts=[...S.templates].sort((a,b)=>(a.order||0)-(b.order||0));
  if(!ts.length)return null;
  const lastT=[...S.workouts].sort((a,b)=>b.start-a.start).find(w=>w.tid);
  if(!lastT)return ts[0];
  const i=ts.findIndex(t=>t.id===lastT.tid);
  return ts[(i+1)%ts.length]||ts[0];
}
function tplMinutes(t){
  let m=0;
  for(const e of t.ex||[]){ if(e.t==='c'){m+=15;continue;} const n=+e.s||3; m+=n*((+e.rest||90)+45)/60; }
  return Math.max(10,Math.round(m/5)*5);
}
function weekDots(){
  /* השבוע הקלנדרי הנוכחי: ראשון מימין (RTL), כמו לוח עברי */
  const trained=new Set(S.workouts.map(w=>new Date(w.start).toDateString()));
  const today=new Date(); today.setHours(0,0,0,0);
  const sun=new Date(today); sun.setDate(today.getDate()-today.getDay());
  let out='';
  for(let d=0;d<7;d++){
    const dt=new Date(sun); dt.setDate(sun.getDate()+d);
    const on=trained.has(dt.toDateString());
    const isToday=dt.getTime()===today.getTime();
    const hasSched=!!schedOf(d);
    const sched=!on&&hasSched&&dt>=today;
    const missed=!on&&hasSched&&dt<today;
    out+=`<div class="day ${on?'on':''} ${sched?'sched':''} ${missed?'miss':''} ${isToday?'today':''} ${isToday&&on&&Date.now()-(S._justTrained||0)<6000?'pop':''}"><span>${DAY_LETTERS[d]}</span><b class="dt num">${dt.getDate()}</b><i></i></div>`;
  }
  return out;
}
function weekStreak(){
  let streak=0;
  const ws=S.workouts.map(w=>w.start);
  for(let k=0;;k++){
    const end=new Date(); end.setHours(23,59,59,999); end.setDate(end.getDate()-end.getDay()-7*k+6);
    const start=new Date(end); start.setDate(end.getDate()-6); start.setHours(0,0,0,0);
    const has=ws.some(t=>t>=+start&&t<=+end);
    if(has)streak++;
    else{ if(k===0)continue; break; } // השבוע הנוכחי עוד לא נספר נגד הרצף
    if(k>260)break;
  }
  return streak;
}

function nextWorkoutInfo(){

}

  let kcal=tdee*(1+adj); const floor=t.sex==='f'?1300:1600; kcal=Math.max(kcal,Math.min(floor,tdee*0.9));
  kcal=Math.round(kcal/50)*50;

  const prot=Math.round(leanW*(t.goal==='cut'?2.0:t.goal==='bulk'?1.8:1.7)/5)*5;
  const {fat,carbs}=macroSplit(kcal,prot,leanW);

function menuBalance(meals,kT,pT){

function shrinkImage(file,MAXPX=1280,Q=0.85){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const MAX=MAXPX, sc=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',Q).split(',')[1]);
    }catch(e){rej(e);} };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

/* target reps "8-12" / "10" → {lo,hi}; null for timed ranges (plank seconds) or none */
function repRange(r){ const n=String(r||'').match(/\d+/g); if(!n)return null; const lo=+n[0], hi=+n[n.length-1]; if(!hi||hi>30)return null; return {lo:Math.min(lo,hi),hi:Math.max(lo,hi)}; }
function repCls(e,s){ const rr=repRange(e.reps), r=+s.r||0; if(!rr||!r)return ''; return r>rr.hi?'r-over':r<rr.lo?'r-under':'r-in'; }
/* double progression: top of the range on every set last time → add weight; otherwise one more rep than the weakest set */
function repTip(e){
  const up=coachTip(e.n,e.reps,e.sets.length); if(up)return {kind:'up',w:up.w,from:up.from};
  const rr=repRange(e.reps), last=lastSetsOf(e.n); if(!rr||!last||!last.length)return null;
  const rs=last.map(x=>+x.r||0).filter(Boolean), w=Math.max(...last.map(x=>+x.w||0)); if(!rs.length||w<=0)return null;
  const low=Math.min(...rs); if(low<rr.lo-2)return null; // last time was far off: no nudge
  return {kind:'reps',r:Math.min(rr.hi,Math.max(rr.lo,low+1)),w};
}

const HIST={q:'',tpl:'all',open:{}};
function histPRs(ws){ // אימונים שבהם נשבר שיא משקל בתרגיל
  const best={}, pr={};
  for(const w of [...ws].sort((a,b)=>a.start-b.start)){
    let n=0;
    for(const e of w.ex||[])if(e.t==='s'){ const top=Math.max(0,...(e.sets||[]).filter(x=>+x.r>0).map(x=>+x.w||0));
      if(top>0){ if(best[e.n]!=null&&top>best[e.n])n++; if(best[e.n]==null||top>best[e.n])best[e.n]=top; } }
    if(n)pr[w.id]=n;
  }
  return pr;
}
function histHeatmap(ws){
  const W=16, d0=new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate()-d0.getDay()-(W-1)*7);
  const vol={}; for(const w of ws){ const k=ymd(new Date(w.start)); vol[k]=(vol[k]||0)+Math.max(1,workoutVol(w)); }
  const vals=Object.values(vol).sort((a,b)=>a-b), q=p=>vals.length?vals[Math.floor((vals.length-1)*p)]:0;
  const lvl=v=>!v?0:v<=q(.33)?1:v<=q(.66)?2:3;
  const today=ymd(); let cols='', n=0;
  for(let c=0;c<W;c++){ let cells='';
    for(let r=0;r<7;r++){ const d=new Date(d0); d.setDate(d0.getDate()+c*7+r); const k=ymd(d); const v=vol[k]; if(v)n++;
      cells+=k>today?'<i class="hm f"></i>':`<i class="hm l${lvl(v)}${k===today?' t':''}" title="${k}"></i>`; }
    cols+=`<span class="hmc">${cells}</span>`; }
  return {html:`<div class="hmgrid">${cols}</div>`,days:n};
}
function vHistory(){

    <div class="card" style="padding:14px;margin-top:10px">

      <div class="wkbars">${weeks.map((x,i)=>`<div class="wkb ${i===7?'cur':''}"><span class="num">${x.n||''}</span><i style="height:${Math.round(x.n/wmax*100)}%"></i><small>${i===7?'השבוע':x.a.getDate()+'.'+(x.a.getMonth()+1)}</small></div>`).join('')}</div>

      return `<button class="hmonth" data-act="hist-month" data-k="${g.k}" aria-expanded="${open}">

function exerciseOptions(){
  const m=new Map();
  for(const w of S.workouts)for(const e of w.ex||[])if(e.t==='s'&&(e.sets||[]).some(s=>+s.r>0)){
    const o=m.get(e.n)||{c:0,last:0,seen:null}; if(o.seen!==w){ o.c++; o.seen=w; } o.last=Math.max(o.last,+w.start||0); m.set(e.n,o); }
  exerciseOptions.cnt=m;
  return [...m.entries()].sort((a,b)=>b[1].c-a[1].c||b[1].last-a[1].last).map(x=>x[0]);
}

function progDelta(){
  const n=S.progressEx; if(!n)return '';
  const pts=[]; for(const w of [...S.workouts].sort((a,b)=>a.start-b.start)){ const e=(w.ex||[]).find(e=>e.n===n&&e.t==='s'); if(!e)continue;
    const top=Math.max(0,...(e.sets||[]).filter(x=>+x.r>0).map(x=>+x.w||0)); if(top)pts.push({t:w.start,v:top}); }
  if(pts.length<2)return '';
  const first=pts[0], last=pts[pts.length-1], d=Math.round((last.v-first.v)*10)/10, wk=Math.max(1,Math.round((last.t-first.t)/(7*864e5)));
  return d>0?`+${d} ק״ג ב-${wk} שבועות`:d<0?`${d} ק״ג ב-${wk} שבועות`:`יציב ${wk} שבועות`;
}

/* ----- תצוגת גוף: משקל, יעדים ותזונה שבועית ----- */
function bwChange(days){
  const ws=S.weights||[]; if(ws.length<2)return null;
  const last=ws[ws.length-1];
  const cutoff=new Date(last.d); cutoff.setDate(cutoff.getDate()-days);
  const cs=ymd(cutoff);
  let base=null; for(const p of ws){ if(p.d<=cs)base=p; }
  if(!base)base=ws[0]; if(base===last)return null;
  return Math.round((last.kg-base.kg)*10)/10;
}

/* weekly calorie bank: Sunday → yesterday, only days that have meals logged (an empty day isn't a 0-kcal day).

function kcalBank(){
  const kT=+S.settings.kcalT||0; if(!kT)return null;
  const now=new Date(), dow=now.getDay(); let past=0, n=0;
  for(let i=dow;i>=1;i--){ const x=new Date(now); x.setDate(now.getDate()-i); const ds=ymd(x); if(!mealsOf(ds).length)continue; past+=kT-dayTotals(ds).kcal; n++; }
  const tk=mealsOf(ymd()).length?dayTotals(ymd()).kcal:0, todayOver=Math.max(0,tk-kT);
  if(!n&&!todayOver)return null;
  return {bank:Math.round(past-todayOver),past:Math.round(past),n:n+(todayOver?1:0),kT,tk:Math.round(tk),todayOver:Math.round(todayOver)};
}

function bwChartHTML(goal,compact){
  const ws=(S.weights||[]).slice(-90);
  if(ws.length<2)return `<div class="empty" style="margin-top:12px"><div class="big">הגרף יופיע אחרי שתי שקילות</div>מומלץ להישקל בבוקר, אחרי שירותים ולפני אוכל — כך הנתון הכי עקבי.</div>`;
  const W=520,H=compact?120:170,L=40,R=14,Tp=14,B=24;
  const xs=ws.map(p=>+new Date(p.d)), ys=ws.map(p=>p.kg).concat(goal?[goal]:[]);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const lo=Math.floor(Math.min(...ys)-1), hi=Math.ceil(Math.max(...ys)+1);
  const X=t=>L+(W-L-R)*((t-x0)/Math.max(1,(x1-x0)));
  const Y=v=>Tp+(H-Tp-B)*(1-(v-lo)/Math.max(1,hi-lo));
  const path=ws.map((p,i)=>`${i?'L':'M'}${X(+new Date(p.d)).toFixed(1)},${Y(p.kg).toFixed(1)}`).join('');
  const area=`${path} L${X(x1).toFixed(1)},${H-B} L${X(x0).toFixed(1)},${H-B} Z`;
  const mid=Math.round((lo+hi)/2);
  return `<div class="${compact?'':'card'}" style="${compact?'':'margin-top:12px'}">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף משקל גוף" style="direction:ltr;display:block">
      ${[lo,mid,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`).join('')}
      ${goal?`<line x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-R}" y="${Y(goal)-5}" font-size="11" text-anchor="end" fill="var(--gold)">יעד ${goal}</text>`:''}
      <path d="${area}" fill="var(--accent)" opacity="0.1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${ws.map((p,i)=>`<circle cx="${X(+new Date(p.d)).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="${i===ws.length-1?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
      <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtDate(x0)}</text>
      <text x="${W-R}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtDate(x1)}</text>
    </svg>
  </div>`;
}

function photoKey(){
  if(!PHK.p)PHK.p=(async()=>{ const {data,error}=await sb.rpc('my_photo_key'); if(error||!data)throw error||new Error('key');

  return new Blob([pt],{type:'image/jpeg'});
}
async function fetchPhoto(path){
  const {data,error}=await sb.storage.from('progress').download(path); if(error||!data)throw error||new Error('dl');
  return URL.createObjectURL(await decPhoto(await data.arrayBuffer()));
}
async function loadPhotos(force){
  if(!S.user||PH.loading||(PH.loaded&&!force))return;
  PH.loading=true;
  try{
    const {data,error}=await sb.storage.from('progress').list(S.user.id,{limit:1000,sortBy:{column:'name',order:'desc'}});
    if(error)throw error;
    const by={};
    for(const f of data||[]){ const m=/^(\d{4}-\d{2}-\d{2})_(front|back|side)\.(jpg|enc)$/.exec(f.name); if(!m)continue;
      (by[m[1]]=by[m[1]]||{d:m[1]})[m[2]]=`${S.user.id}/${f.name}`; }
    PH.sets=Object.values(by).sort((a,b)=>a.d<b.d?1:-1);
    PH.loaded=true;
    await ensurePhotos(PH.sets.slice(0,PH.show).flatMap(setPaths));
  }catch(e){ console.error(e); }

}
function shrinkBlob(file,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82); // ציור מחדש על canvas מוחק EXIF (כולל מיקום GPS)
    }catch(e){rej(e);} };
    img.onerror=rej; img.src=URL.createObjectURL(file);
  });
}
async function uploadPhoto(file,date,angle){
  if(!navigator.onLine){toast('העלאת תמונות דורשת חיבור לרשת');return;}
  PH.busy=angle; openPhotoSet(date);
  try{
    const blob=await shrinkBlob(file);
    const enc=await encPhoto(blob);
    const path=`${S.user.id}/${date}_${angle}.enc`;
    const set0=PH.sets.find(x=>x.d===date), old=set0&&set0[angle];
    const {error}=await sb.storage.from('progress').upload(path,enc,{upsert:true,contentType:'application/octet-stream',cacheControl:'0'});
    if(error)throw error;
    if(old&&old!==path)sb.storage.from('progress').remove([old]).catch(()=>{});
    PH.urls[path]=URL.createObjectURL(blob);
    let set=PH.sets.find(x=>x.d===date); if(!set){set={d:date};PH.sets.unshift(set);PH.sets.sort((a,b)=>a.d<b.d?1:-1);}
    set[angle]=path;

  }catch(e){ console.error(e); toast('ההעלאה נכשלה — נסה שוב'); }
  PH.busy=null; PH.sel=null; openPhotoSet(date);
}

}

function centerRack(smooth){
  const rack=$('#rack'); if(!rack)return;
  NP._lock=Date.now()+1100; // programmatic scroll, not the user's pick

  for(const it of items){ const d=Math.abs(+it.dataset.rackv-(NP.val||10)); if(d<bd){bd=d;best=it;} }
  items.forEach(it=>it.classList.toggle('sel',+it.dataset.rackv===NP.val||it===best&&bd===0));
  const left=best.offsetLeft-(rack.clientWidth-best.offsetWidth)/2;
  rack.scrollTo({left,behavior:smooth?'smooth':'instant'});
}
function rackPick(){
  if(Date.now()<(NP._lock||0))return;
  const rack=$('#rack'); if(!rack)return;
  const mid=rack.scrollLeft+rack.clientWidth/2;
  const items=[...rack.querySelectorAll('.dbitem')];
  let best=null,bd=1e9;
  for(const it of items){ const c=it.offsetLeft+it.offsetWidth/2, d=Math.abs(c-mid); if(d<bd){bd=d;best=it;} }
  if(!best)return;

  if(v!==NP.val){ NP.val=v; vibrate(8); const el=$('#npval'); if(el)el.textContent=npFmt(v); }

function openSetPad(ei,si,kind,chain){

/* כשחלונית פתוחה: גלילה על אזור שלא נגלל (כותרת, רקע) לא מזיזה את המסך שמאחור */
(function(){ let y0=0,x0=0;
  document.addEventListener('touchstart',e=>{ const t=e.touches[0]; y0=t.clientY; x0=t.clientX; },{passive:true});
  document.addEventListener('touchmove',e=>{
    const sh=document.getElementById('sheet'); if(!sh||sh.hidden||e.touches.length>1)return;
    const t=e.touches[0], dy=t.clientY-y0, dx=t.clientX-x0; y0=t.clientY; x0=t.clientX;
    if(Math.abs(dx)>Math.abs(dy))return;
    let el=e.target; if(!sh.contains(el)){ if(e.cancelable)e.preventDefault(); return; }
    // מטפסים מהאלמנט שנגעו בו עד החלונית: אם יש אזור שיכול לגלול בכיוון הזה — נותנים לו. אחרת חוסמים, כדי שהמסך מאחור לא יזוז
    for(;el&&el!==document.body;el=el.parentElement){
      if(el.scrollHeight>el.clientHeight+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowY)){
        const canUp=el.scrollTop>0, canDown=el.scrollTop+el.clientHeight<el.scrollHeight-1;
        if((dy>0&&canUp)||(dy<0&&canDown)||dy===0)return; }
      if(el===sh)break; }
    if(e.cancelable)e.preventDefault();
  },{passive:false});
})();

/* מצב סידור מחדש: שורות קומפקטיות — גרירה בכל השורה + חיצים ▲▼ */
function renderTplReorder(){
  const t=_tplDraft;
  openSheet(`
    <h3>סדר התרגילים</h3>
    <div class="small muted" style="margin-bottom:10px">החזק שורה וגרור למקום החדש, או השתמש בחיצים.</div>
    <div id="tpl-rlist" class="rlist">
      ${t.ex.map((e,i)=>`<div class="rrow" data-i="${i}">
        <span class="drag-h" aria-hidden="true">⠿</span>
        ${EXDB[e.n]?`<img class="libthumb" ${exImg(EXDB[e.n],0)} alt="" loading="lazy">`:''}
        <span class="rname"><b class="num">${i+1}.</b> ${esc(e.n)}</span>
        <button class="rarrow" data-act="tpl-move" data-i="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="הזז למעלה">▲</button>
        <button class="rarrow" data-act="tpl-move" data-i="${i}" data-dir="1" ${i===t.ex.length-1?'disabled':''} aria-label="הזז למטה">▼</button>
      </div>`).join('')}
    </div>
    <button class="btn primary big" style="margin-top:14px" data-act="tpl-reorder-done">סיום ✓</button>
  `);
  loadSortable().then(()=>{
    const el=document.getElementById('tpl-rlist'); if(!el||!window.Sortable)return;
    Sortable.create(el,{
      draggable:'.rrow', filter:'.rarrow', preventOnFilter:false,
      forceFallback:true, fallbackOnBody:true, fallbackTolerance:4,
      animation:200, easing:'cubic-bezier(.2,.8,.3,1)',
      ghostClass:'drag-ghost', chosenClass:'drag-chosen', dragClass:'drag-drag',
      scroll:document.getElementById('sheet'), scrollSensitivity:80, scrollSpeed:14, bubbleScroll:true,
      onChoose(){ vibrate(8); },
      onEnd(ev){ if(ev.oldIndex===ev.newIndex||!_tplDraft)return;
        const [m]=_tplDraft.ex.splice(ev.oldIndex,1); _tplDraft.ex.splice(ev.newIndex,0,m); vibrate(12);
        requestAnimationFrame(renderTplReorder); }
    });
  }).catch(()=>{});
}

function agoHe(d){
  if(!d)return '—';
  const days=Math.round((new Date(ymd())-new Date(ymd(new Date(d))))/864e5);
  return days<=0?'היום':days===1?'אתמול':days<7?`לפני ${days} ימים`:days<30?`לפני ${Math.round(days/7)} שב׳`:`לפני ${Math.round(days/30)} חוד׳`;
}
const money=u=>{u=+u||0;const ils=u*USD_ILS;return ils<1?`${(ils*100).toFixed(ils*100<1?2:1)} אג׳`:`₪${ils.toFixed(2)}`;};
const dShort=d=>d?new Date(d).toLocaleDateString(LOC,{day:'numeric',month:'numeric',year:'2-digit'}):'—';
function userState(u){
  if(u.access==='admin')return ['אדמין','var(--ink)'];
  if(u.access==='pending')return ['ממתין','#D97706'];
  if(u.access==='rejected')return ['חסום','#DC2626'];
  const until=u.until?new Date(u.until):null, paid=u.access_until&&new Date(u.access_until)>new Date();
  if(!until||until<=new Date())return ['חינמי','var(--muted)'];

  ['🤝 50 אימונים לכל הקבוצה','workouts',50,30,'team'],['🏗️ 20 טון בחודש','volume',20000,30,'goal'],['🏃 120 דקות קרדיו בשבוע','cardio',120,7,'goal'],
  ['💪 300 שכיבות סמיכה בשבוע','ex_reps',300,7,'goal','שכיבות סמיכה'],['🏆 מי ירים הכי כבד בסקוואט','ex_max',1,14,'race','סקוואט']];
const chVal=(m,v)=>m==='volume'?fmtVol(v):`${Math.round((+v||0)*10)/10}`;
const chUnit=m=>m==='volume'?'':' '+CHM[m][2];
function vSocChall(){
  const C=SOC.chall;
  const btn=`<button class="btn primary" style="width:100%;margin:4px 0 10px" data-act="soc-chall-new">🏆 אתגר חדש</button>`;
  if(!C)return btn+`<div class="empty"><div class="big">טוען…</div></div>`;
  if(!C.length)return btn+`<div class="card stack" style="text-align:center;padding:20px;gap:8px"><div style="font-size:38px">🏆</div><b>עוד אין אתגרים</b><div class="muted">פתחו אתגר אישי, תחרות או יעד קבוצתי, ותראו מי מגיע ראשון</div></div>`;
  const today=ymd(), me=S.user?.id;
  return btn+`<div class="stack" style="gap:12px">${C.map(c=>{
    const M=CHM[c.metric]||CHM.workouts, mode=c.mode||'goal', md=CH_MODES[mode];
    const ended=c.end_d<today, total=Math.round((new Date(c.end_d)-new Date(c.start_d))/864e5)+1, left=Math.round((new Date(c.end_d)-new Date(today))/864e5)+1;
    const rows=[...(c.board||[])].map(r=>({...r,v:+(r.value??r[c.metric])||0})).sort((a,b)=>b.v-a.v);
    const tgt=+c.target||1, lead=Math.max(1,rows[0]?.v||0), sum=rows.reduce((a,r)=>a+r.v,0);
    const myI=rows.findIndex(r=>r.user_id===me), mine=rows[myI];
    const exN=c.ex?` · ${esc(c.ex)}`:'';
    const desc=mode==='race'?`תחרות: מי מוביל ב${M[1]}${exN}`:mode==='team'?`יעד קבוצתי: ${chVal(c.metric,tgt)}${chUnit(c.metric)}${exN}`:`יעד: ${chVal(c.metric,tgt)}${chUnit(c.metric)} לכל אחד${exN}`;
    const elapsed=Math.min(100,Math.round((total-Math.max(0,left-1))/total*100));
    let you='';
    if(mine&&!ended){
      if(mode==='goal')you=mine.v>=tgt?`✅ השלמת את האתגר!`:`חסרים לך ${chVal(c.metric,tgt-mine.v)}${chUnit(c.metric)}`;
      else if(mode==='race')you=myI===0&&mine.v>0?`👑 אתה מוביל!`:`אתה במקום ${myI+1} מתוך ${rows.length}${rows[0]?.v>0?` · ${chVal(c.metric,rows[0].v-mine.v)}${chUnit(c.metric)} מהמקום הראשון`:''}`;
      else you=`תרמת ${chVal(c.metric,mine.v)}${chUnit(c.metric)} (${sum?Math.round(mine.v/sum*100):0}%)`;
    }
    const medal=i=>['🥇','🥈','🥉'][i]||`<span class="num muted" style="display:inline-block;width:18px;text-align:center">${i+1}</span>`;
    const rowHTML=(r,i)=>{ const done=mode==='goal'&&r.v>=tgt; const pct=mode==='goal'?Math.min(100,r.v/tgt*100):mode==='race'?r.v/lead*100:(sum?r.v/sum*100:0);
      return `<div class="ch-mem ${r.user_id===me?'me':''}"><span>${r.v>0||mode==='goal'?medal(i):medal(i)} <span data-notr>${esc(r.user_id===me?tt('אתה'):r.name)}</span></span><span class="small num" style="${done?'color:var(--accent);font-weight:700':''}">${done?'✅ ':''}${chVal(c.metric,r.v)}${chUnit(c.metric)}</span>
        <div class="ch-bar"><i style="width:${Math.round(pct)}%"></i></div></div>`; };
    let res='';
    if(ended){
      const top=rows.filter(r=>r.v>0).slice(0,3);
      const doneN=rows.filter(r=>r.v>=tgt).length;
      const iWon=mode==='race'?(myI===0&&mine?.v>0):mode==='team'?sum>=tgt:(mine&&mine.v>=tgt);
      res=`<div class="ch-res">${top.length?`<div class="ch-podium">${top.map((r,i)=>`<div class="p${i}"><span class="m">${['🥇','🥈','🥉'][i]}</span><b data-notr>${esc(r.user_id===me?tt('אתה'):r.name)}</b><span class="small num">${chVal(c.metric,r.v)}${chUnit(c.metric)}</span></div>`).join('')}</div>`:''}
        <div class="small muted" style="text-align:center">${mode==='goal'?`${doneN} מתוך ${rows.length} השלימו את היעד`:mode==='team'?(sum>=tgt?`🎉 הקבוצה הגיעה ליעד!`:`הקבוצה הגיעה ל-${Math.round(sum/tgt*100)}% מהיעד`):''}</div>
        ${iWon?`<button class="btn primary" data-act="soc-chall-share" data-id="${c.id}">📤 שתף את ההישג</button>`:''}</div>`;
    }
    return `<div class="ch-card ${ended?'ended':''}">
      <div class="spread" style="align-items:flex-start"><div style="display:flex;gap:10px;align-items:center"><span class="ch-emo">${M[0]}</span><div><b style="font-size:17px" data-notr>${esc(c.title)}</b><div class="small muted">${desc}</div></div></div>
        <span class="pill" style="white-space:nowrap;${!ended&&left<=1?'background:var(--gold-soft);color:var(--gold);border-color:transparent':''}">${ended?'🏁 הסתיים':left===1?'יום אחרון!':`עוד ${left} ימים`}</span></div>
      <div class="row small muted" style="gap:6px;align-items:center"><span>${md[0]} ${md[1]}</span><div class="ch-bar" style="flex:1;height:4px"><i style="width:${elapsed}%;background:var(--muted);opacity:.5"></i></div></div>
      ${you?`<div class="ch-you">${you}</div>`:''}
      ${mode==='team'&&!ended?`<div><div class="spread small"><b>הקבוצה</b><span class="num">${chVal(c.metric,sum)} מתוך ${chVal(c.metric,tgt)}${chUnit(c.metric)}</span></div><div class="ch-bar" style="height:12px;margin-top:4px"><i style="width:${Math.min(100,Math.round(sum/tgt*100))}%"></i></div></div>`:''}
      ${res}
      ${ended?'':rows.map(rowHTML).join('')}
      ${c.created_by===me?`<button class="linkbtn" data-act="soc-chall-del" data-id="${c.id}" style="align-self:flex-start;color:var(--muted);font-size:13px">מחיקת האתגר</button>`:''}
    </div>`;}).join('')}</div>`;
}

          ${me?'':`<button class="mutebtn ${off?'off':''}" data-act="soc-mute" data-u="${m.user_id}" aria-label="${off?'בטל השתקה':'השתק התראות'}">${off?'🔕 מושתק':'🔔'}</button>`}</div>`;}).join('')}</div>
      <div class="small muted" style="margin-top:6px">🔕 השתקה עוצרת רק את ההתראות. ההודעות עדיין יופיעו בצ׳אט.</div>`; })()}
    <button class="btn danger" style="width:100%;margin-top:14px" data-act="soc-leave">יציאה מהקבוצה</button>

function socReadForm(){ const f=SOC.cf; if(!f)return; const t=$('#cf-title'), g=$('#cf-target'), e=$('#cf-ex'); if(t)f.title=t.value; if(e)f.ex=e.value; if(g){const v=parseFloat(g.value)||0; f.target=f.metric==='volume'?v*1000:v;} }
async function socSend(){
  const ta=$('#chat-in'); const body=(ta?.value||'').trim(); if(!body||!SOC.gid)return;
  ta.value=''; SOC.draft=''; ta.style.height='';
  const {error}=await sb.from('group_messages').insert({group_id:SOC.gid,user_id:S.user.id,kind:'text',body});
  if(error){toast('ההודעה לא נשלחה');ta.value=body;SOC.draft=body;}
}
function socAct(act,b){
  switch(act){
    case 'soc-open': socOpen(b.dataset.id); return true;
    case 'soc-back': SOC.gid=null; render(); socLoad(); window.scrollTo(0,0); return true;
    case 'soc-view': SOC.view=b.dataset.v; render(); window.scrollTo(0,0);
      if(SOC.view==='board')socLoadBoard(); else if(SOC.view==='chall')socLoadChall(); else {SOC.toBottom=true;render();} return true;
    case 'soc-range': SOC.boardRange=b.dataset.r; socLoadBoard(); return true;
    case 'soc-new': socNewSheet(); return true;

    case 'soc-create': { const name=($('#sg-name')?.value||'').trim(); if(!name){toast('תן שם לקבוצה');return true;} b.disabled=true;
      sb.rpc('create_group',{p_name:name,p_emoji:SOC.newEmo||'💪'}).then(async({data,error})=>{
        if(error){b.disabled=false;toast(/too_many/.test(error.message)?'הגעת למקסימום 10 קבוצות':'יצירת הקבוצה נכשלה');return;}

    case 'soc-join-go': { const code=($('#sg-code')?.value||'').trim().toUpperCase(); if(code.length!==6){toast('הקוד צריך להיות 6 תווים');return true;} b.disabled=true;

        if(error){toast(/not_found/.test(error.message)?'לא נמצאה קבוצה עם הקוד הזה':/group_full/.test(error.message)?'הקבוצה מלאה (30 חברים)':'ההצטרפות נכשלה');return;}

      else{ mu.add(u); sb.from('group_mutes').insert({group_id:gid,muted_id:u==='*'?null:u}).then(({error})=>{ if(error&&!/duplicate/.test(error.message)){mu.delete(u);toast('לא הצלחנו לעדכן');socInviteSheet();} }); toast(u==='*'?'הקבוצה הושתקה 🔕':'לא תקבל התראות מההודעות שלו 🔕'); }
      socInviteSheet(); return true; }

      const text=`בוא להתאמן איתי ב-NextRep 💪 נעקוב אחד אחרי השני, נפרגן ונתחרה באתגרים. קוד הקבוצה: ${code}`;

    case 'soc-send': socSend(); return true;

    case 'soc-cdays': socReadForm(); SOC.cf.days=+b.dataset.d; socChallSheet(); return true;
    case 'soc-chall-go': { socReadForm(); const f=SOC.cf; if(f.mode==='race')f.target=1;

/* --- barcode scanner --- */
const SCAN={stream:null,timer:null,reader:null,busy:false,zx:null};
function stopScan(){ clearInterval(SCAN.timer); SCAN.timer=null; try{SCAN.reader?.reset?.();}catch(_){} SCAN.reader=null; SCAN.stream?.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
function loadZXing(){ return window.ZXing?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function zxReader(){
  if(SCAN.zx)return SCAN.zx;
  const hints=new Map(), F=ZXing.BarcodeFormat;
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const r=new ZXing.MultiFormatReader(); r.setHints(hints); SCAN.zx=r; return r;
}
// פענוח מתוך canvas. מנסה גם בניגודיות רגילה וגם הפוכה
function zxDecodeCanvas(c){
  try{ const res=zxReader().decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))); return res&&res.getText(); }catch(_){ return null; }
}
async function openScanner(){
  SCAN.busy=false;
  openSheet(`<h3>סריקת ברקוד</h3>
    <div class="scanwrap"><video id="scanv" playsinline muted autoplay></video><div class="frame"></div></div>
    <div class="small muted" id="scanmsg" style="text-align:center;margin:8px 0">כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ</div>
    <div class="row" style="flex-wrap:nowrap"><input id="scan-code" type="text" inputmode="numeric" dir="ltr" placeholder="או הקלד את המספר" style="flex:1;text-align:center">
      <button class="btn primary" data-act="scan-go">חפש</button></div>
    <button class="btn big" style="margin-top:10px" data-act="scan-close">סגור</button>`);
  const msg=t=>{const m=$('#scanmsg'); if(m)m.textContent=t;};
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$('#scanv'); if(!v){stopScan();return;}
    v.setAttribute('playsinline',''); v.muted=true; v.srcObject=SCAN.stream; await v.play().catch(()=>{});
    try{ const tr=SCAN.stream.getVideoTracks()[0], cap=tr.getCapabilities?.(); if(cap?.focusMode?.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(_){}
    let native=null;
    if('BarcodeDetector' in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('ean_13'))native=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>f.includes(x))}); }catch(_){} }
    if(!native){ msg('טוען סורק…'); try{ await loadZXing(); }catch(_){ msg('הסורק לא נטען (אין רשת?). אפשר להקליד את המספר שמתחת לברקוד.'); return; } msg('כוון את הברקוד למסגרת, במרחק של כ-15 ס״מ'); }
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    let tick=0;
    SCAN.timer=setInterval(async()=>{
      if(SCAN.busy||!v.videoWidth)return; tick++;
      if(native){ try{ const r=await native.detect(v); if(r[0]?.rawValue)onBarcode(r[0].rawValue); }catch(_){} return; }
      // חותכים את אזור המסגרת ומקטינים לרוחב סביר — מהיר ומדויק יותר בטלפון
      const vw=v.videoWidth, vh=v.videoHeight, cw=Math.round(vw*(tick%2?0.8:0.6)), ch=Math.round(vh*0.5), sx=(vw-cw)/2, sy=(vh-ch)/2;
      const sc=Math.min(1,1000/cw); c.width=Math.round(cw*sc); c.height=Math.round(ch*sc);
      ctx.drawImage(v,sx,sy,cw,ch,0,0,c.width,c.height);
      const t=zxDecodeCanvas(c); if(t)onBarcode(t);
      if(tick===40)msg('לא מזהה? נסה עם יותר אור, או הקלד את המספר שמתחת לברקוד');
    },180);
  }catch(e){ msg('אין גישה למצלמה. אפשר להקליד את המספר שמתחת לברקוד, או לאשר מצלמה בהגדרות.'); }
}
async function onBarcode(code){
  code=String(code||'').replace(/\D/g,''); if(code.length<6||SCAN.busy)return;
  SCAN.busy=true; SCAN.prod=null; try{navigator.vibrate?.(40);}catch(_){}
  const m=$('#scanmsg'); if(m)m.textContent=`מחפש ${code}…`;
  stopScan();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SUPABASE_URL}/functions/v1/food-barcode?code=${code}`,{headers:{Authorization:'Bearer '+session.access_token,apikey:SUPABASE_KEY}});
    if(r.status===404){ openLabelPrompt(code); return; }
    const j=await r.json(); if(!j.product)throw new Error('x');
    openProduct(j.product);
  }catch(e){ toast('החיפוש נכשל, נסה שוב'); closeSheet(); }
}

function maybeStartTour(){

  const created=new Date(S.user?.created_at||0).getTime(); if(Date.now()-created>14*864e5)return; // new users only

function startTour(tab){ TOUR.on=true; TOUR.i=0; TOUR.grp=tab||S.tab||'home'; tourShow(); }

function tourShow(){
  const steps=tourSteps(), st=steps[TOUR.i]; if(!st)return tourEnd();
  closeSheet(); if(st.pre){st.pre(); render();} if(TOUR.i===0)window.scrollTo(0,0);
  let el=$('#tour'); if(!el){el=document.createElement('div'); el.id='tour'; document.body.appendChild(el);}

    <div class="tour-dots"${steps.length<2?' hidden':''}>${steps.map((_,i)=>`<i class="${i===TOUR.i?'on':''}"></i>`).join('')}</div>
    ${st.img?`<img class="tour-img" src="${st.img}" alt="">`:''}<h3>${st.title}</h3><p>${st.text}</p>
    <div class="row" style="gap:8px;margin-top:12px">
      ${st.kind==='notif'?`<button class="btn" style="flex:1" data-act="tour-next">אחר כך</button><button class="btn primary" style="flex:1.6" data-act="tour-notif">🔔 הפעל התראות</button>`
        :`${TOUR.i===0?`<button class="btn" style="flex:1" data-act="tour-skip">דלג</button>`:`<button class="btn" style="flex:1" data-act="tour-back">חזרה</button>`}

    </div></div>`;
