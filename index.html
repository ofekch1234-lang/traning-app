/* Layout: app-shell — sticky header, scrolling content, fixed bottom tab bar + rest-timer bar; everything derives from the tokens below. */
:root{
  /* dark only — near-black surfaces, neon lime brand (#BFFF2F) with black text on it */
  --bg:#0A0B0A;
  --surface:#141715;
  --surface2:#1E2220;
  --ink:#F2F5F1;
  --muted:#9AA39C;
  --line:#272C29;
  --accent:#BFFF2F;
  --accent-soft:#222C11;
  --accent-ink:#0A0B0A;
  --gold:#F5B53A;
  --gold-soft:#3A2A0E66;
  --danger:#FF6B5E;
  --kbig:#AEB7B0;
  --shadow:none;
  --overlay-shadow:0 -8px 30px rgba(0,0,0,.55);
  --disp:'Heebo',system-ui,-apple-system,sans-serif;--brand:'Inter Tight',system-ui,-apple-system,sans-serif;
  --body:'Heebo',system-ui,-apple-system,sans-serif;

}

:root[data-accent="rose"]{--accent:#FF4FA3;--accent-soft:#3A1428;--accent-ink:#0A0B0A}
:root[data-accent="violet"]{--accent:#A78BFA;--accent-soft:#2A1F47;--accent-ink:#0A0B0A}
:root[data-accent="blue"]{--accent:#60A5FA;--accent-soft:#16294A;--accent-ink:#0A0B0A}

/* live Rafi (meet screen) */
.lr{position:relative;width:184px;height:200px;padding:0;border:0;background:none;display:block;margin:0 auto;-webkit-tap-highlight-color:transparent}
.lr svg{display:block}.lr svg *{transform-box:fill-box;transform-origin:center}
.lr-float,.lr-tilt{display:block}
.lr-tilt{transition:transform .25s ease-out;transform:rotate(var(--lt,0deg))}
.lr-look{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .16s ease-out}
.lr-happy{opacity:0}.lr.joy .lr-happy{opacity:1}.lr.joy .lr-pills{opacity:0}
.lr-shadow{position:absolute;left:50%;bottom:4px;width:116px;height:12px;margin-left:-58px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(6px)}
.lr-bub{position:absolute;top:-6px;left:-26px;padding:8px 13px;border-radius:16px 16px 16px 4px;font-size:15px;font-weight:800;opacity:0;pointer-events:none;z-index:2}
@media (prefers-reduced-motion:no-preference){
  .lr-eye{opacity:0;animation:lrIgnite .5s .05s ease-out forwards,lrBlink 4.6s 1.3s infinite}
  .lr-r{animation:lrIgnite .5s .18s ease-out forwards,lrWink .5s 1.75s ease-in-out,lrBlink 4.6s 5.9s infinite}
  .lr-body{opacity:0;transform:scale(.9);animation:lrIn .7s .55s cubic-bezier(.2,.9,.25,1.15) forwards}
  .lr-smile{opacity:0;animation:lrFade .3s 1.8s forwards}
  .lr-shadow{opacity:0;animation:lrFade .5s 1s forwards,lrShadow 3.6s 2.4s ease-in-out infinite}
  .lr-float{animation:lrFloat 3.6s 2.4s ease-in-out infinite}
  .lr-glance{animation:lrGlance 7s 3.6s ease-in-out infinite}.lr.trk .lr-glance{animation:none}
  .lr-ant{transform-box:view-box!important;transform-origin:120px 54px!important;animation:lrAnt 2.2s 1.2s ease-in-out infinite}
  .lr-led{animation:lrLed 2.4s 1.2s ease-in-out infinite}
  .lr-bub{transform:scale(.6);transform-origin:bottom left;animation:lrBub 2.6s 1.85s cubic-bezier(.3,1.5,.5,1) forwards}
  .lr.joy .lr-float{animation:lrJoy .7s cubic-bezier(.3,1.6,.5,1)}
  .obs-meet .ob-kick,.obs-meet .ob-name,.obs-meet .ob-lead,.obs-meet .ob-row,.obs-meet .ob-foot{opacity:0;transform:translateY(14px);animation:lrUp .55s cubic-bezier(.2,.8,.2,1) forwards}
  .obs-meet .ob-kick{animation-delay:2s}.obs-meet .ob-name{animation-delay:2.12s}.obs-meet .ob-lead{animation-delay:2.26s}
  .obs-meet .ob-row:nth-child(1){animation-delay:2.45s}.obs-meet .ob-row:nth-child(2){animation-delay:2.57s}.obs-meet .ob-row:nth-child(3){animation-delay:2.69s}.obs-meet .ob-foot{animation-delay:2.85s}
  .obs-meet .ob-glow{opacity:0;animation:lrHalo 1.4s .05s ease-out forwards}
}
@keyframes lrIgnite{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes lrIn{to{opacity:1;transform:scale(1)}}
@keyframes lrFade{to{opacity:1}}
@keyframes lrUp{to{opacity:1;transform:none}}
@keyframes lrHalo{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lrBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes lrWink{0%,100%{transform:scaleY(1)}35%,65%{transform:scaleY(.08)}}
@keyframes lrLed{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes lrFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes lrShadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.7}}
@keyframes lrGlance{0%,70%,100%{transform:translateX(0)}76%{transform:translateX(-7px)}84%{transform:translateX(7px)}90%{transform:translateX(0)}}
@keyframes lrAnt{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}
@keyframes lrBub{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes lrJoy{0%{transform:none}30%{transform:translateY(-16px) rotate(-6deg)}60%{transform:rotate(4deg)}100%{transform:none}}

/* tab bar */
/* סרגל לשוניות צף: אי זכוכית מעוגל מעל התחתית, קפסולה שמחליקה ללשונית הפעילה */
:root{--tbb:max(10px,calc(env(safe-area-inset-bottom,0px) - 12px))}
nav.tabs{
  position:fixed;left:0;right:0;margin-inline:auto;width:calc(100% - 28px);max-width:520px;bottom:var(--tbb);z-index:30;
  background:color-mix(in srgb,var(--surface) 74%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:30px;
  box-shadow:0 10px 30px -6px rgba(10,20,14,.22),0 1px 2px rgba(10,20,14,.06);
  padding:6px;display:flex;justify-content:space-around;
}
nav.tabs .tb-pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:24px;background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none;opacity:0;transition:transform .32s cubic-bezier(.3,1.25,.5,1),width .32s cubic-bezier(.3,1.25,.5,1),opacity .2s}
nav.tabs .tb-pill.ready{opacity:1}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;color:var(--muted);font-size:11.5px;border-radius:24px;position:relative;z-index:1;transition:color .2s}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on .ic{color:var(--accent);stroke-width:2.3}
nav.tabs svg{width:23px;height:23px}
nav.tabs button.fab{color:var(--ink);font-weight:700;overflow:visible}
nav.tabs button.fab .fabc{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:4px solid var(--bg);box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 65%,transparent);box-sizing:border-box}
nav.tabs button.fab svg{width:27px;height:27px}
nav.tabs button.fab .ic{stroke-width:2.2}
nav.tabs button.fab.on{color:var(--accent)}
nav.tabs button.fab.on::before{display:none}
nav.tabs button.fab:active .fabc{transform:scale(.94)}
/* in a chat (group / Repi) the workout button lies flat so it never covers the message box */
body.chatting nav.tabs button.fab{color:var(--muted);font-weight:400}
body.chatting nav.tabs button.fab .fabc{width:auto;height:auto;margin-top:0;background:none;color:inherit;border:0;box-shadow:none}
body.chatting nav.tabs button.fab svg{width:23px;height:23px}
body.chatting nav.tabs button.fab .ic{stroke-width:1.9}

nav.tabs .ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.sruler{display:flex;overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}.sruler::-webkit-scrollbar{display:none}
.sr-sp{flex:none;display:block}.sr-svg{flex:none;display:block}
.sr-svg line{stroke:#4A524C;stroke-width:1.5;stroke-linecap:round}.sr-svg line.hf{stroke:#7A847D}.sr-svg line.mj{stroke:var(--ink);stroke-width:2.5}
.sr-svg text{fill:var(--muted);font-size:14px;font-weight:600;text-anchor:middle;font-family:inherit}.sr-svg .rf{fill:var(--muted)}
.sr-ptr{position:absolute;left:50%;top:0;width:4px;height:52px;margin-left:-2px;border-radius:2px;background:var(--accent);pointer-events:none}
.sr-ptr::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--accent)}
.rackhint{text-align:center;color:var(--muted);font-size:11.5px;margin-bottom:2px}
/* מגדל מכונה: מסגרת, מוטות מנחים, הלוחות הנבחרים מורמים והפין נעוץ */
.mstack{position:relative;width:236px;margin:8px auto 2px;padding:0 20px;direction:ltr}
.mstack .rod{position:absolute;top:-12px;bottom:-2px;width:6px;border-radius:3px;background:linear-gradient(90deg,#6c737b,#f2f4f6 45%,#8a9199)}
.mstack .rod.l{left:4px}.mstack .rod.r{right:4px}
.mstack .cab{position:absolute;left:50%;top:-12px;height:12px;width:3px;transform:translateX(-50%) translateY(-6px);background:#9aa1a9}
.mstack .up{transform:translateY(-6px)}
.mstack .gap{height:6px;display:flex;justify-content:center}.mstack .gap i{width:3px;height:100%;background:linear-gradient(#cfd4d9,#7c838b);margin-top:-6px}
.splate{position:relative;display:flex;width:100%;height:14px;margin-bottom:2px;border-radius:4px;border:none;padding:0 10px;align-items:center;justify-content:space-between;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),linear-gradient(180deg,#2a2f2c,#1c201e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent}
.splate span{font-size:9.5px;line-height:1;font-weight:800;color:#59635e;font-variant-numeric:tabular-nums}
.splate i{font-style:normal;font-size:7px;letter-spacing:1.3px;color:#3f4844}
.splate.on{background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(180deg,#4a5059 0%,#2c3036 55%,#1d2024 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.5)}
.splate.on span{color:#f1f4f6}.splate.on i{color:#9aa3ab}
.splate .pin{position:absolute;left:100%;top:50%;transform:translateY(-50%);display:flex;align-items:center;margin-left:-2px;pointer-events:none}
.splate .pin s{width:30px;height:4px;border-radius:2px;background:linear-gradient(#fafbfc,#8a929a)}
.splate .pin u{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5b6168,#1a1c1f 60%,#000);box-shadow:0 0 0 2px #e2b01c,0 3px 8px rgba(0,0,0,.6)}
.splate .pin em{font-style:normal;margin-left:7px;font-size:12px;font-weight:800;color:#e2b01c}
.npact{display:flex;gap:8px;margin-top:10px}
input[data-np]{caret-color:transparent;cursor:pointer}
/* nutrition composer & meal rows */
.acttile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px 6px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.acttile svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actmain{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700}
#food-text{padding:13px 12px;font-size:16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-family:var(--body);box-sizing:border-box}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mavatar{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.mkcal{text-align:center;flex-shrink:0;min-width:46px}
.mkcal b{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.12;display:block}
.mkcal span{font-size:10px;color:var(--muted)}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}

/* exercise demo (licensed animation clip) */
.demo{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#eceae6;border:1px solid var(--line);margin-bottom:12px}
.demo img,.demo video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo .fb{opacity:0}
.demo .tag{position:absolute;top:8px;inset-inline-start:8px;background:rgba(10,20,14,.7);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
@media (prefers-reduced-motion:no-preference){ .demo .fb{animation:demoflip 2.4s ease-in-out infinite} }
@keyframes demoflip{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
.libthumb{width:42px;height:32px;border-radius:6px;object-fit:cover;background:#fff;border:1px solid var(--line);flex-shrink:0}
/* food database search */
.fsugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.fs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;border-bottom:1px solid var(--line);border-radius:0;text-align:var(--start)}
.fs-name{flex:1;min-width:0;font-size:14.5px}
.fs-val{flex-shrink:0;font-weight:600;font-size:14px}
.fs-val small{font-weight:400;color:var(--muted);font-size:10.5px}
.fs-foot{padding:8px 12px;background:var(--surface2)}
.basket{border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--accent-soft)}
.bitem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.bitem>span:first-child{flex:1;min-width:0}
/* reorder mode */
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.rrow .rname{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rarrow{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--ink);flex-shrink:0}
.rarrow:disabled{opacity:.3}
.drag-drag{opacity:.95!important;box-shadow:0 14px 34px rgba(10,20,14,.28);transform:scale(1.02)}
/* drag to reorder */
.drag-h{cursor:grab;touch-action:none;padding:6px 8px;color:var(--muted);font-size:18px;line-height:1;user-select:none;-webkit-user-select:none}
.drag-ghost{opacity:.35}
.drag-chosen{box-shadow:0 8px 24px rgba(10,20,14,.22)}
/* weight calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:var(--dir)}
.calhd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.calday{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;min-height:44px;padding:4px 0;
  border-radius:8px;background:var(--surface2);border:1px solid transparent}
.calday i{font-style:normal;font-size:10.5px;color:var(--muted);line-height:1.2}
.calday b{font-family:var(--disp);font-weight:800;font-size:14px;line-height:1.1;color:var(--ink)}
.calday.has{background:var(--accent-soft)}
.calday.tdy{border-color:var(--accent)}
.calday.tdy i{color:var(--ink);font-weight:700}
/* progress photos */
.phslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phslot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;cursor:pointer;font-size:12.5px;color:var(--muted)}
.phslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phslot.has{border-style:solid;border-color:var(--accent)}
.ph-hit{position:absolute;inset:0;background:none;border:0;cursor:pointer}
.ph-acts{position:absolute;inset:0;background:rgba(10,14,12,.62);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px}
.ph-acts button,.ph-acts label{background:#fff;color:#141a16;border:0;border-radius:10px;padding:8px 4px;font:inherit;font-size:12.5px;font-weight:700;text-align:center;cursor:pointer}
.ph-acts .del{background:rgba(255,255,255,.18);color:#fff}
.ph-pd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface2);margin-bottom:12px}
.ph-pd>span{font-size:26px}.ph-pd b{display:block}.ph-pd div span{font-size:12.5px;color:var(--muted)}
.ph-pd.now{background:var(--accent);color:var(--accent-ink)}.ph-pd.now div span{color:inherit;opacity:.85}
.ph-pd.now{animation:pdPulse 1.6s ease 2}@keyframes pdPulse{50%{transform:scale(1.02)}}
.ph-wt{width:100%;text-align:var(--start);padding:12px 14px;margin:0}
#phview{position:fixed;inset:0;z-index:120;background:#000;display:flex;align-items:center;justify-content:center}
#phview[hidden]{display:none}
#phview>img{max-width:100%;max-height:100%;object-fit:contain}
#phview .pv-top{position:absolute;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;color:#fff;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#phview .pv-top button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:18px}
#phview .pv-tabs{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:8px}
#phview .pv-tabs button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit}
#phview .pv-tabs button.on{background:#fff;color:#000}
.phslot .lbl{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:3px 0}
.phrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:var(--start)}
.phrow:last-child{border-bottom:none}
.phthumbs{display:flex;gap:4px;flex-shrink:0;direction:ltr}
.phthumbs span{width:38px;height:50px;border-radius:6px;background:var(--surface2);overflow:hidden;display:block}
.phthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmpgrid figure{margin:0}
.cmpgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;background:var(--surface2)}
.cmpgrid figcaption{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.cmpgrid label select{margin-top:3px;padding:7px 8px;font-size:14px}
.cmpph{width:100%;aspect-ratio:3/4;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);font-size:13px}
.phmon{font-weight:700;font-size:13px;padding:10px 0 4px;border-bottom:1px solid var(--line);margin-top:4px}

/* settings switches */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:none}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex-shrink:0;cursor:pointer;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(-19px)}
:root[dir="ltr"] .sw:checked::after{transform:translateX(19px)}

/* toast */
#toast{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;justify-content:center;z-index:50;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}

/* home dashboard */
.greet-wrap{margin:4px 0 2px}
.greet{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.12}
.planpill{margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-size:13px;font-weight:600;border:0}
.planpill.paid{background:var(--accent-soft);color:var(--accent)}
.planpill.free{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(236,72,153,.12));color:#9333EA}
.aiq-free{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.aiq-free .linkbtn{font-size:13px;font-weight:600;color:var(--accent)}
.co-lockcard{position:relative;margin-top:4px}
.co-lockcard .co-blur{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}
.co-lockcard .co-lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:0 10px}
.pw-prem{background:linear-gradient(135deg,rgba(124,58,237,.10),rgba(236,72,153,.08) 60%,rgba(34,197,94,.08));border-radius:16px;padding:14px}
.pw-prem .pr{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.pw-prem .pr i{font-style:normal;flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}
.pw-prem .pr b{display:block;font-size:15px}.pw-prem .pr span{font-size:13px;color:var(--muted)}
.dots{display:flex;justify-content:space-between;margin-top:10px;padding:0 2px;direction:var(--dir)}
.day.miss i{background:transparent;border:2px dashed var(--line)}
.day{text-align:center;font-size:11.5px;color:var(--muted)}
.day i{display:block;width:13px;height:13px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);margin:5px auto 0}
.day.on i{background:var(--accent);border-color:var(--accent)}
.day.today span{color:var(--ink);font-weight:700}
.linkbtn.small{font-size:12.5px;padding:2px}
/* weekly schedule grid */
.schedgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;direction:var(--dir)}
.schedday{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.schedday .dl{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.12;color:var(--muted)}
.schedday .dn{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schedday.has{background:var(--accent-soft);border-color:var(--accent)}
.schedday.has .dl,.schedday.has .dn{color:var(--ink)}
.schedday .dd{font-size:9.5px;color:var(--muted);line-height:1}
.schedday.tdy{outline:2px solid var(--accent);outline-offset:-2px}
.day .dt{display:block;font-size:10px;color:var(--muted);font-weight:400;line-height:1;margin-top:1px}
.day.today .dt{color:var(--ink);font-weight:700}
.day.sched i{background:transparent;border:2px solid var(--accent)}

/* empty states */
.empty{border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--ink);margin-bottom:4px}

.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.fin-ex{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}

/* splash — מסך כניסה ממותג */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:#0A0B0A;
  transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash{--s-tile:118px}
:root.s-native #splash{--s-tile:inherit}
#splash{--s-acc:#BFFF2F}:root[data-g="f"] #splash{--s-acc:#FF4FA3}
#splash .s-tile{width:var(--s-tile);height:var(--s-tile);border-radius:calc(var(--s-tile)*.232);background:var(--s-acc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px color-mix(in srgb,var(--s-acc) 18%,transparent)}
#splash .s-tile svg{width:100%;height:100%;fill:#0B0C0B}
#splash .s-tile svg *{transform-box:fill-box;transform-origin:center}
:root.s-native #splash{justify-content:center}:root.s-native #splash .s-tile{box-shadow:none}
:root.s-native #splash .sb{position:absolute;top:calc(50% + var(--s-tile)/2 + 22px)}
:root.s-native #splash .st{position:absolute;top:calc(50% + var(--s-tile)/2 + 66px)}
#splash .sb{font-family:var(--brand);font-weight:800;font-size:28px;color:#fff;letter-spacing:-.045em}
#splash .sb b{font-weight:inherit;color:#BFFF2F}
#splash .st{color:rgba(255,255,255,.75);font-size:13.5px}
:root[data-g="f"] #splash .sb b{color:#FF4FA3}
.auth-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-g button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:16px;background:var(--surface2);border:2px solid transparent;color:inherit;font:inherit}
.auth-g button span{font-size:30px}.auth-g button b{font-size:15px}
.auth-g button[data-v="f"]{border-color:#F9A8D4}.auth-g button[data-v="m"]{border-color:#BFFF2F}

@media (prefers-reduced-motion:no-preference){
  .card,.ex-card,.h-card{transition:border-color .15s}
  .btn,.chip,.done-btn,.plate,nav.tabs button{transition:transform .12s ease}
  .btn:active,.chip:active,.done-btn:active,nav.tabs button:active{transform:scale(.95)}
  #sheet{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  #np{animation:up .22s cubic-bezier(.2,.8,.3,1)}
  #np-bg,#sheet-bg{animation:fadein .2s ease-out}
  #restbar .inner{animation:up .25s cubic-bezier(.2,.8,.3,1)}
  #toast span{animation:rise .25s ease-out}
  .set-done .done-btn{animation:pop .34s cubic-bezier(.3,1.6,.4,1)}
  .dbitem.sel .pl{transition:background .15s}
  /* חיות: מעבר בין לשוניות לפי כיוון, לחיצות, רצף, היום */
  #view.anim.tab-l>*{animation-name:slideL}
  #view.anim.tab-r>*{animation-name:slideR}
  .card[data-act],.inv-card,.tile,.mn-g,.mn-ic,.pr-row,.acttile,.pbtn,.mn-meal{transition:scale .14s ease}
  button:active:not(:disabled),.card[data-act]:active,.inv-card:active,.acttile:active{scale:.97}
  .pill.streak{animation:glowP 2.6s ease-in-out infinite}
  .day.today:not(.on) i{animation:todayP 2.2s ease-in-out infinite}
  .day.pop i{animation:pop .55s cubic-bezier(.3,1.6,.4,1) .3s both}
  /* כניסת תוכן במעבר לשונית */
  #view.anim>*{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
  #view.anim>*:nth-child(2){animation-delay:.05s}
  #view.anim>*:nth-child(3){animation-delay:.09s}
  #view.anim>*:nth-child(4){animation-delay:.13s}
  #view.anim>*:nth-child(5){animation-delay:.16s}
  #view.anim>*:nth-child(n+6){animation-delay:.19s}
  /* ספלאש */
  /* splash: the bar is loaded (bar, plates one by one, the N drops in and lands) */
  #splash .s-tile{animation:sTile .35s cubic-bezier(.2,.9,.3,1.2) both}
  :root.s-native #splash .s-tile{animation:sFill .3s .02s ease-out both}
  @keyframes sFill{from{background:#1A1D1B}to{background:var(--s-acc)}}
  #splash .s-bar{animation:sBar .3s .1s cubic-bezier(.2,.8,.2,1) both}
  #splash .s-p1l{animation:sPl .28s .38s cubic-bezier(.3,1.5,.5,1) both}#splash .s-p1r{animation:sPr .28s .38s cubic-bezier(.3,1.5,.5,1) both}
  #splash .s-p2l{animation:sPl .28s .58s cubic-bezier(.3,1.5,.5,1) both}#splash .s-p2r{animation:sPr .28s .58s cubic-bezier(.3,1.5,.5,1) both}
  #splash .s-n{animation:sN .3s .82s cubic-bezier(.5,0,.75,0) both}

const INFO_MORE={"לחיצה בשיפוע במוט": "ספסל בשיפוע של כ־30°, אחיזה מעט רחבה מהכתפיים. הורד את המוט לחזה העליון ודחוף מעלה בקו ישר — מדגיש את החזה העליון.", "לחיצת חזה בשיפוע שלילי": "ספסל בשיפוע שלילי, רגליים נעולות. הורד את המוט לחזה התחתון ודחוף מעלה — מדגיש את החזה התחתון.", "לחיצת חזה בסמית׳": "כמו לחיצת חזה במוט, אבל המוט נע במסילה קבועה — יציב יותר ומאפשר לעבוד קרוב לכשל בבטחה.", "פרפר במשקולות": "שכיבה על ספסל, מרפקים כפופים מעט וקבועים. פתח ידיים בקשת רחבה עד מתיחה בחזה וסגור מעל החזה כמו חיבוק.", "פרפר בשיפוע": "כמו פרפר במשקולות על ספסל בשיפוע של כ־30° — מדגיש את החזה העליון.", "מקבילים לחזה": "גוף נטוי מעט קדימה ומרפקים פתוחים. רד עד מתיחה בחזה ודחוף מעלה — ככל שנוטים יותר, החזה עובד יותר.", "פולאובר במשקולת": "שכיבה רוחבית על ספסל, משקולת מעל החזה בידיים כמעט ישרות. הורד בקשת מאחורי הראש עד מתיחה וחזור.", "פולי צר": "אחיזה צרה, חזה מורם. משוך לחזה העליון תוך הצמדת המרפקים לגוף — עבודה עמוקה על הרחב הגבי.", "מתח באחיזה הפוכה": "אחיזה הפוכה ברוחב כתפיים. משוך עד שהסנטר מעל המוט — שילוב של גב ויד קדמית.", "חתירת T": "רגליים משני צדי המוט, גו נטוי וגב ישר. משוך את הידית לבטן והצמד שכמות בסוף התנועה.", "חתירה הפוכה (משקל גוף)": "שכיבה מתחת למוט נמוך, גוף ישר. משוך את החזה למוט והורד בשליטה — חתירה במשקל גוף.", "דדליפט סומו": "עמידה רחבה, כפות רגליים פתוחות ואחיזה בין הרגליים. דחוף את הרצפה ויישר ירכיים — פחות עומס על הגב התחתון.", "פייס פול": "חבל בגובה הפנים. משוך לכיוון המצח תוך פתיחת הידיים לצדדים — מעולה לכתף אחורית ויציבה.", "שראגים": "משקולות לצד הגוף, ידיים ישרות. הרם כתפיים ישר למעלה לכיוון האוזניים, עצור שנייה והורד לאט.", "פשיטת גב (היפראקסטנשן)": "אגן על הכרית, רגליים נעולות. רד בגב ישר ועלה עד קו ישר עם הרגליים — בלי לקשת מעבר לזה.", "סקוואט קדמי": "המוט על הכתפיים מלפנים, מרפקים גבוהים. רד עמוק עם גו זקוף — מדגיש את הארבע ראשי.", "סקוואט גביע": "משקולת אחת צמודה לחזה. רד עמוק בין הברכיים עם גב זקוף — מצוין ללימוד טכניקת סקוואט.", "סקוואט בסמית׳": "סקוואט עם מוט במסילה קבועה. רגליים מעט קדימה מהמוט, רד עד מקביל ועלה.", "האק סקוואט": "גב צמוד למשענת, כתפיים מתחת לכריות. רד עמוק ודחוף דרך כל כף הרגל.", "סקוואט בולגרי": "רגל אחורית על ספסל, משקולות בידיים. רד עד שהברך האחורית כמעט נוגעת ברצפה ודחוף דרך העקב הקדמי.", "לאנג׳ים בהליכה": "צעד גדול קדימה, רד עד 90° בשתי הברכיים, והמשך ישר לצעד הבא עם הרגל השנייה.", "עליות על ספסל": "עלה על ספסל או ארגז ברגל אחת, דחוף דרך העקב עד עמידה מלאה ורד בשליטה.", "כפיפת ברכיים בישיבה": "כרית מעל הברכיים, השנייה מעל העקב. כופף מטה עד הסוף וחזור לאט — מתיחה טובה יותר של הירך האחורית.", "היפ תראסט": "גב עליון על ספסל, מוט על האגן. דחוף אגן מעלה עד קו ישר, כווץ ישבן בחוזקה למעלה ורד.", "גשר ישבן": "שכיבה על הגב, מוט על האגן. הרם אגן מהרצפה עד קו ישר עם הירכיים וכווץ ישבן.", "מכונת מקרבים": "ישיבה במכונה, כריות בצד הפנימי של הברכיים. קרב רגליים יחד ופתח לאט.", "מכונת מרחיקים": "ישיבה במכונה, כריות בצד החיצוני. פתח רגליים החוצה וחזור לאט — לישבן הבינוני.", "הרמות עקבים בישיבה": "ישיבה עם כרית על הברכיים. הרם עקבים גבוה, עצור שנייה ורד עד מתיחה — מדגיש את הסוליה.", "לחיצת כתפיים במכונה": "גב צמוד למשענת, ידיות בגובה הכתפיים. דחוף מעלה עד כמעט נעילה וחזור בשליטה.", "לחיצת ארנולד": "התחל עם משקולות מול הפנים וכפות ידיים אליך. סובב כלפי חוץ תוך כדי דחיפה מעלה — כל שלושת ראשי הכתף.", "פוש פרס": "כפיפה קלה בברכיים ודחיפה מהרגליים שמעבירה תנופה למוט מעל הראש — מאפשר משקל כבד יותר.", "הרחקות צד בכבל": "כבל נמוך, אחיזה ביד הרחוקה. הרם הצידה עד גובה הכתף — מתח רציף לאורך כל התנועה.", "הרמות קדמיות": "משקולות מול הירכיים. הרם קדימה עד גובה העיניים בידיים כמעט ישרות והורד לאט.", "פטישים בכבל (חבל)": "חבל בכבל תחתון, אחיזה ניטרלית. כופף מעלה עם מרפקים צמודים — מתח רציף לברכיאליס.", "כפיפה בשיפוע": "ישיבה על ספסל בשיפוע, ידיים תלויות מאחור. כופף מעלה — מתיחה מקסימלית לראש הארוך.", "כפיפה בריכוז": "ישיבה, מרפק נשען על הירך הפנימית. כופף לאט עד למעלה וכווץ — בידוד מלא.", "כפיפת מרפקים בכבל": "מוט בכבל תחתון, מרפקים צמודים. כופף מעלה וחזור לאט — מתח רציף לאורך כל התנועה.", "כפיפה הפוכה במוט": "אחיזה עליונה (כפות למטה). כופף מעלה — עובד על האמה והברכיאליס.", "פשיטה בחבל בכבל": "חבל בכבל עליון, מרפקים צמודים. דחוף מטה ופתח את החבל לצדדים בסוף התנועה.", "לחיצת חזה צרה": "אחיזה ברוחב כתפיים, מרפקים צמודים לגוף. הורד לחזה התחתון ודחוף — תרגיל המסה של היד האחורית.", "מקבילים על ספסל": "ידיים על ספסל מאחוריך, רגליים קדימה. כופף מרפקים עד 90° ודחוף מעלה.", "קיקבק במשקולת": "גו נטוי, מרפק צמוד לגוף ומקביל לרצפה. יישר את היד אחורה עד הסוף וחזור לאט.", "כפיפות בטן בכבל": "כריעה מול כבל עליון, חבל ליד הראש. כופף את הגו מטה בעזרת הבטן — לא הידיים.", "הרמות רגליים בשכיבה": "שכיבה על ספסל, ידיים מאחורי הראש. הרם רגליים ישרות עד 90° והורד לאט בלי לגעת.", "אופניים (בטן)": "שכיבה, ידיים מאחורי הראש. קרב מרפק לברך הנגדית לסירוגין בתנועת דיווש.", "מטפס הרים": "עמידת שכיבת סמיכה. הבא ברכיים לחזה לסירוגין בקצב מהיר עם אגן יציב.", "דד באג": "שכיבה על הגב, ידיים ורגליים למעלה. הורד יד ורגל נגדיות לאט עם גב תחתון צמוד לרצפה.", "פאלוף פרס": "עמידה בצד לכבל, ידית מול החזה. דחוף קדימה והתנגד לסיבוב — ליבה אנטי־רוטציה.", "סופרמן": "שכיבה על הבטן. הרם ידיים ורגליים יחד מהרצפה, עצור שנייה והורד — לגב התחתון.", "סווינג קטלבל": "ציר בירכיים, גב ישר. הנע את הקטלבל בין הרגליים ודחוף אגן קדימה בחדות — הכוח מהישבן, לא מהידיים.", "הליכת חקלאי": "משקולות כבדות בשתי הידיים, גו זקוף. הלך צעדים קצרים ויציבים — אחיזה, כתפיים וליבה.", "קפיצה לארגז": "עמידה מול ארגז, נדנוד ידיים וקפיצה עם נחיתה רכה על שתי הרגליים. רד בצעד — לא בקפיצה.", "ריצה בהליכון": "ריצה בקצב קבוע עם גו זקוף וצעדים קצרים. לאינטרוולים: דקה מהירה, דקה הליכה.", "קפיצה בחבל": "קפיצות נמוכות על כריות כפות הרגליים, סיבוב החבל מפרקי הידיים — לא מהכתפיים.", "שכיבות סמיכה על הברכיים": "ברכיים על הרצפה, ידיים מעט רחבות מהכתפיים וגוף בקו ישר מהברכיים לראש. הורד את החזה לרצפה ודחוף חזרה.", "שכיבות סמיכה בקשת (ארצ׳ר)": "ידיים רחבות מאוד. רד לכיוון יד אחת בזמן שהיד השנייה נשארת ישרה לצד, דחוף חזרה והחלף צד.", "שכיבות סמיכה עם מחיאת כף": "רד לשכיבת סמיכה ודחוף בפיצוץ כך שהידיים עוזבות את הרצפה, מחא כף ונחת רך עם מרפקים כפופים.", "לחיצת סוונד": "לחץ צלחת משקל בין כפות הידיים מול החזה. דחוף אותה קדימה עד יישור ידיים תוך כדי לחיצה חזקה, וחזור לחזה.", "חתירת פנדליי": "גב מקביל לרצפה, המוט על הרצפה מתחת לכתפיים. משוך בפיצוץ לבטן העליונה והחזר את המוט לרצפה בכל חזרה.", "חתירת גורילה בקטלבל": "עמידה רחבה, שני קטלבלים על הרצפה בין הרגליים וגב ישר. משוך קטלבל אחד למותן, הורד והחלף יד.", "חתירת רנגייד": "פלאנק גבוה על שתי משקולות, רגליים מעט פתוחות. משוך משקולת אחת למותן בלי לסובב את האגן, הורד והחלף צד.", "דדליפט במוט משושה": "עמוד במרכז המוט, אחוז בידיות, גב ישר וחזה פתוח. דחוף את הרצפה ועמוד זקוף, הורד בשליטה.", "מתח באחיזה רחבה": "אחיזה רחבה מהכתפיים, כפות ידיים קדימה. משוך עד שהסנטר מעל המוט, ירידה איטית עד יישור ידיים.", "מתח בעזרה": "השתמש במכונת מתח עם משקל נגדי או בגומייה. משוך עד שהסנטר מעל המוט וירד לאט. ככל שמתחזקים, מפחיתים את העזרה.", "מתח שלילי": "קפוץ או עלה על ספסל למצב סנטר מעל המוט, ורד לאט ככל האפשר, 3 עד 5 שניות, עד יישור ידיים.", "חתירה בכבל באחיזה רחבה": "ישיבה זקופה, ידית רחבה. משוך לחזה התחתון עם מרפקים פתוחים לצדדים, קרב שכמות וחזור בשליטה.", "חתירה בכבל בעמידה": "עמידה מול הכבל, ברכיים כפופות מעט וגב ישר. משוך את הידית לבטן, קרב שכמות וחזור לאט.", "פולי עליון בגומייה": "קבע גומייה גבוה מעליך. משוך אותה מטה לכיוון החזה העליון עם מרפקים לכיוון הצלעות, וחזור לאט.", "חתירה בגומייה": "ישיבה עם רגליים ישרות, גומייה סביב כפות הרגליים. משוך לבטן, קרב שכמות וחזור בשליטה.", "פשיטת גב בשכיבה על הבטן": "שכיבה על הבטן, ידיים ליד הראש. הרם את החזה מהרצפה בעזרת שרירי הגב, החזק רגע והורד לאט.", "דדליפט בלנדמיין": "עמוד מעל קצה המוט, אחוז בו בשתי ידיים. דחוף ירכיים אחורה עם גב ישר, ועמוד זקוף תוך כיווץ הישבן.", "סקוואט קוזאק": "עמידה רחבה מאוד. רד לצד אחד עם ברך כפופה בזמן שהרגל השנייה ישרה ובהונות למעלה, חזור למרכז והחלף צד.", "לאנג׳ צולב (קרטסי)": "צעד ברגל אחת אחורה ובאלכסון מאחורי הרגל השנייה ורד עד שהברך האחורית קרובה לרצפה. דחוף חזרה והחלף צד.", "סקוואט פיסטול": "עמידה על רגל אחת, הרגל השנייה ישרה קדימה. רד לאט לסקוואט מלא על רגל אחת ועלה חזרה בלי לגעת ברצפה.", "סקוואט פיסטול בעזרה": "כמו סקוואט פיסטול, אבל אחוז בעמוד, ב־TRX או ברצועה כדי לעזור בירידה ובעלייה.", "סקוואט זרצ׳ר": "החזק את המוט בקפל המרפקים מול הבטן, חזה פתוח. רד לסקוואט עמוק ועלה תוך שמירה על גב זקוף.", "סקוואט מטוטלת": "כתפיים מתחת לרפידות וגב צמוד. רד עמוק בשליטה ודחוף דרך כל כף הרגל חזרה למעלה.", "האק סקוואט הפוך": "פנים אל המכונה, חזה צמוד לרפידה. רד בהטיית ירכיים אחורה ודחוף חזרה למעלה תוך כיווץ הישבן.", "סקוואט עם עקבים מוגבהים": "עקבים על צלחת או משטח משופע, רגליים צמודות יחסית. רד עמוק עם גו זקוף והברכיים קדימה, ועלה. מדגיש את הארבע ראשי.", "ישיבה על הקיר": "גב צמוד לקיר, רד עד שהירכיים מקבילות לרצפה והברכיים בזווית 90°. החזק את המצב לאורך הזמן שנקבע.", "גשר צפרדע": "שכיבה על הגב, כפות הרגליים צמודות זו לזו וברכיים פתוחות לצדדים. דחוף את האגן למעלה בכיווץ ישבן והורד, בקצב.", "גשר ישבן עם צעידה": "החזק גשר ישבן עם אגן גבוה. הרם ברך אחת לכיוון החזה, הורד והחלף, בלי שהאגן ייפול או יסתובב.", "הרחקת ירך על שש (פייר הידרנט)": "על ידיים וברכיים, גב ישר. הרם ברך כפופה לצד עד גובה האגן, החזק רגע והורד. החלף צד.", "הרחקת ירך בכבל": "רצועה על הקרסול הרחוק מהכבל, עמידה זקופה ואחיזה לתמיכה. הרחק את הרגל לצד בשליטה וחזור לאט.", "היפ תראסט במכונה": "גב עליון על הספסל ורפידה על האגן. דחוף את האגן למעלה עד קו ישר מהכתפיים לברכיים, כווץ ישבן והורד בשליטה.", "היפ תראסט בעמידת B": "כמו היפ תראסט, אבל רגל אחת עובדת ונטועה בכל כף הרגל והשנייה מעט קדימה על העקב לתמיכה. משקולת על האגן.", "דדליפט רומני בעמידת B": "רוב המשקל על רגל אחת, הרגל השנייה מעט אחורה על הבהונות. הורד את המשקולות בהטיית ירכיים אחורה עם גב ישר ועלה.", "לחיצת רגליים ברגל אחת": "רגל אחת במרכז הפלטפורמה. הורד עד ברך בזווית 90° בערך ודחוף חזרה בלי לנעול את הברך. החלף רגל.", "לחיצת רגליים בעמידה רחבה": "רגליים רחבות וגבוהות על הפלטפורמה, בהונות מעט החוצה. הורד עמוק ודחוף דרך העקבים. מדגיש ישבן ומקרבים.", "דדליפט רומני ברגל אחת במשקולת": "עמידה על רגל אחת עם משקולת. הטה את הגו קדימה בזמן שהרגל החופשית עולה אחורה, גב ישר, וחזור לעמידה.", "דדליפט סומו במשקולת": "עמידה רחבה, בהונות החוצה, משקולת אחת בין הרגליים. רד עם גב ישר ועמוד זקוף בכיווץ ישבן.", "לאנג׳ים לאחור במוט": "מוט על הגב העליון. צעד ברגל אחת אחורה ורד עד שהברך האחורית קרובה לרצפה, דחוף חזרה מהרגל הקדמית.", "סקוואט בולגרי במוט": "מוט על הגב העליון, כף הרגל האחורית על ספסל. רד עד שהירך הקדמית כמעט מקבילה לרצפה ועלה.", "לאנג׳ צידי": "צעד רחב לצד, רד על הרגל הצועדת עם אגן אחורה, והרגל השנייה נשארת ישרה. דחוף חזרה למרכז.", "כפיפת ברכיים במשקולת": "שכיבה על הבטן על ספסל, משקולת אחוזה בין כפות הרגליים. כופף ברכיים להביא אותה לכיוון הישבן והורד לאט.", "לחיצת לנדמיין ביד אחת": "החזק את קצה המוט ליד הכתף. דחוף אותו למעלה וקדימה עד יישור היד, וחזור לכתף בשליטה.", "הרחקות צד במכונה": "ישיבה זקופה, רפידות על צד הזרועות. הרם את הזרועות לצדדים עד גובה הכתפיים והורד לאט.", "הרחקות אחוריות על ספסל משופע": "שכיבה על הבטן על ספסל משופע עם משקולות. הרם את הזרועות לצדדים עם מרפקים כפופים מעט, וירד לאט.", "הרמה קדמית בצלחת": "אחוז בצלחת משקל בשתי ידיים. הרם אותה קדימה עד גובה העיניים עם ידיים כמעט ישרות והורד לאט.", "לחיצת ארנולד בעמידה": "עמידה זקופה, משקולות מול הכתפיים וכפות ידיים אליך. סובב את כפות הידיים החוצה תוך לחיצה למעלה, וחזור באותה תנועה.", "לחיצת כתפיים בקטלבל": "קטלבל במנוחה על צד האמה ליד הכתף. לחץ ישר מעל הראש עד יישור היד והורד לכתף בשליטה.", "לחיצת כתפיים בגומייה": "עמוד על הגומייה וקצותיה בגובה הכתפיים. לחץ למעלה עד יישור ידיים והורד לאט.", "הרחקה לצד ולפנים במשקולות": "הרם את המשקולות לצדדים עד גובה הכתפיים והורד, ואז הרם אותן קדימה והורד. זוהי חזרה אחת.", "הרמות W בגומייה": "גומייה בשתי ידיים, מרפקים כפופים צמודים לגוף. משוך את הידיים לצדדים ולאחור ליצירת צורת W וקרב שכמות.", "שכיבות סמיכה בפייק": "אגן גבוה וגוף בצורת V הפוכה. כופף מרפקים להוריד את הראש לכיוון הרצפה בין הידיים, ודחוף חזרה.", "כפיפה בריכוז בכבל בעמידה": "ידית ביד אחת מכבל נמוך, הגו נוטה מעט קדימה והמרפק קבוע. כופף עד הכתף, כווץ והורד לאט.", "כפיפת מלצר": "אחוז משקולת אחת בקצה העליון בשתי כפות ידיים פתוחות, כמו מגש. כופף מרפקים להביא אותה לכתפיים והורד לאט.", "כפיפת מרפקים במוט באחיזה צרה": "אחיזה צרה מרוחב הכתפיים, מרפקים צמודים לגוף. כופף עד החזה בלי להניף את הגו והורד בשליטה.", "כפיפת מרפקים בגומייה": "עמוד על אמצע הגומייה ואחוז בקצוות. כופף מרפקים עד הכתפיים עם מרפקים צמודים לגוף, ו 'לחיצת רגליים':'כפות רגליים ברוחב כתפיים על המשטח. הורד עד כ־90° בברכיים ודחוף — בלי לנעול ברכיים בסוף.',
'פשיטת ברכיים':'כוון את הכרית מעט מעל הקרסול. יישר רגליים, עצור שנייה למעלה, והורד באיטיות.',
'כפיפת ברכיים':'כופף עקבים לכיוון הישבן בשליטה וחזור באיטיות — בלי לקשת את הגב התחתון.',
'לאנג׳ים':'צעד גדול קדימה, רד עד ששתי הברכיים בכ־90°, ברך קדמית מעל כף הרגל, ודחוף חזרה.',
'דדליפט רומני':'ברכיים רכות וקבועות. דחוף ישבן אחורה והורד את המוט צמוד לרגליים עד מתיחה בירך האחורית. גב ישר כל הדרך.',
'הרמות עקבים':'עלה על קצות האצבעות גבוה ככל האפשר, עצור למעלה, ורד לאט עד מתיחה מלאה.',
'לחיצת כתפיים במשקולות':'ישיבה עם גב נתמך, משקולות בגובה האוזניים. דחוף מעלה עד כמעט נעילה והורד בשליטה.',
'לחיצת כתפיים במוט':'עמידה עם ליבה נעולה. דחוף את המוט מהחזה העליון מעל הראש בקו ישר, בלי לקשת גב תחתון.',
'הרחקות צד':'מרפקים כפופים מעט. הרם את המשקולות לצדדים עד גובה הכתפיים בהובלת המרפקים, והורד לאט.',
'הרחקות אחוריות':'גו נטוי קדימה, גב ישר. פתח ידיים לצדדים והצמד שכמות בסוף התנועה.',
'חתירה אנכית':'אחיזה ברוחב כתפיים. משוך לאורך הגוף עד גובה החזה, מרפקים מובילים מעלה.',
'כפיפת מרפקים במוט':'מרפקים צמודים לגוף וקבועים. כופף מעלה בלי נדנוד והורד באיטיות מלאה.',
'כפיפת מרפקים במשקולות':'כופף עם סיבוב כף היד כלפי מעלה (סופינציה), והורד עד כמעט יישור מלא.',
'פטישים':'אחיזה ניטרלית (אגודלים למעלה). כופף מעלה בלי לסובב את כף היד.',
'כפיפה בספסל כומר':'הזרועות צמודות לכרית. כופף מעלה והורד לאט עד כמעט יישור — בלי להרים את המרפקים.',
'פשיטת מרפקים בכבל':'מרפקים נעולים לצד הגוף. דחוף את הידית מטה עד יישור מלא וחזור בשליטה עד 90°.',
'לחיצה צרפתית':'שכיבה, מוט מעל המצח. כופף מרפקים להורדת המוט לעבר הראש ויישר חזרה — המרפקים נשארים במקום.',

'פשיטה מעל הראש בכבל':'גב לגלגלת, ידיים מאחורי הראש. יישר מרפקים קדימה ומעלה עד נעילה וחזור לאט.',
'כפיפות בטן':'גלגל את פלג הגוף העליון חוליה־חוליה, סנטר רחוק מהחזה, ורד לאט. בלי למשוך בצוואר.',
'הרמות רגליים בתלייה':'הרם רגליים או ברכיים מעל קו האגן תוך גלגול האגן, והורד בלי נדנוד.',
'פלאנק':'מרפקים מתחת לכתפיים, גוף בקו ישר. כווץ בטן וישבן והחזק בלי לשקוע באגן. רשום שניות בעמודת החזרות.',
'גלגל בטן':'מהברכיים, גלגל קדימה עד כמעט יישור הגוף עם בטן נעולה, וחזור.',
'רוסיאן טוויסט':'ישיבה נטויה מעט אחורה. סובב את הגו מצד לצד בשליטה, בלי למהר.',
'הליכון':'חימום: 5 דק׳ הליכה. לעבודה אירובית: הליכה מהירה בשיפוע 8–12% בלי להיאחז בידיות.',
'אופניים':'גובה מושב כך שהברך כמעט ישרה בתחתית הדיווש. שמור על קצב (סל״ד) קבוע.',

'מדרגות':'צעד מלא על כל מדרגה, בלי להישען על המעקה.',
'חתירה (ארגומטר)':'סדר התנועה: רגליים ← גו ← ידיים, ובחזרה הפוך. גב ישר לאורך כל המשיכה.',
'לחיצת חזה בשיפוע שלילי במשקולות':'ספסל בשיפוע שלילי קל. הורד את המשקולות לחזה התחתון ודחוף מעלה בשליטה.',
'לחיצת חזה באחיזה ניטרלית':'כפות ידיים פונות זו לזו, מרפקים קרובים לגוף. ידידותי לכתפיים.',
'לחיצה בשיפוע באחיזה ניטרלית':'ספסל בשיפוע של כ־30°, כפות ידיים פונות פנימה. דחוף מעלה והורד לחזה העליון.',
'לחיצת חזה בכבל':'עמידה בצעד קדימה בין הגלגלות. דחוף את הידיות קדימה עד יישור כמעט מלא וחזור לאט.',
'לחיצה בשיפוע בכבל':'ספסל משופע בין הגלגלות. דחוף את הידיות מעלה ופנימה מעל החזה העליון.',
'פרפר בכבל על ספסל':'שכיבה על ספסל בין הגלגלות, מרפקים כפופים מעט. סגור בקשת רחבה מעל החזה.',
'פרפר בכבל בשיפוע':'ספסל בשיפוע בין הגלגלות. פתח עד מתיחה בחזה העליון וסגור בקשת.',
'כבלים מוצלבים מלמטה':'ידיות בגובה נמוך. משוך מעלה ופנימה עד גובה הסנטר, מדגיש את החזה העליון.',
'כבל מוצלב ביד אחת':'יד אחת בכל פעם, גוף יציב. משוך בקשת עד מעבר לקו האמצע של הגוף.',
'פרפר בשיפוע שלילי':'ספסל בשיפוע שלילי, מרפקים כפופים מעט. פתח עד מתיחה וסגור מעל החזה התחתון.',
'לחיצת חזה במכונת מנופים':'גב צמוד למשענת, ידיות בגובה אמצע החזה. דחוף קדימה וחזור באיטיות.',
'לחיצה בשיפוע במכונת מנופים':'מכונה משופעת, שכמות צמודות לאחור. דחוף מעלה ושלוט בירידה.',
'לחיצה בשיפוע בסמית׳':'ספסל בשיפוע מתחת למוט. הורד לחזה העליון ודחוף מעלה בקו ישר.',
'לחיצת חזה במוט באחיזה רחבה':'אחיזה רחבה מרוחב הכתפיים. הורד לאמצע החזה, מדגיש את החזה יותר מהיד האחורית.',
'שכיבות סמיכה בשיפוע':'ידיים על ספסל, גוף ישר מהראש עד העקבים. גרסה קלה יותר לשכיבות סמיכה.',
'שכיבות סמיכה עם רגליים מוגבהות':'רגליים על ספסל, גוף ישר. קשה יותר ומדגיש את החזה העליון.',
'שכיבות סמיכה רחבות':'ידיים רחבות מהכתפיים. הורד את החזה עד קרוב לרצפה ודחוף חזרה.',
'פולאובר במשקולת בזרועות כפופות':'שכיבה רוחבית על ספסל, מרפקים כפופים. הורד את המשקולת מאחורי הראש והחזר מעל החזה.',
'חתירה בשתי משקולות':'גב ישר בהטיה קדימה. משוך את שתי המשקולות לכיוון המותניים וקרב שכמות.',
'חתירה על ספסל משופע':'חזה נשען על ספסל משופע. משוך את המשקולות לאחור בלי להתנדנד.',
'חתירה במוט באחיזה הפוכה':'כפות ידיים פונות מעלה, גב ישר. משוך את המוט לבטן התחתונה.',
'חתירה בכבל ביד אחת':'ישיבה זקופה, יד אחת על הידית. משוך לאחור עד המותן וסובב מעט את הגוף.',
'פולי עליון ביד אחת':'יד אחת על הידית. משוך מטה לצד הגוף ומרפק לכיוון הירך.',
'פולי עליון בידית V':'ידית V, כפות ידיים פונות זו לזו. משוך לחזה העליון בהטיה קלה לאחור.',
'פולי עליון באחיזה הפוכה':'כפות ידיים פונות אליך, ברוחב הכתפיים. משוך לחזה, מערב גם יד קדמית.',
'פולאובר בכבל עם חבל':'זרועות כמעט ישרות, חבל בכבל עליון. משוך מטה בקשת עד הירכיים.',
'חתירה גבוהה במכונה':'ידיות מלמעלה, חזה צמוד למשענת. משוך מטה ולאחור והורד שכמות.',
'חתירה במכונה':'חזה צמוד למשענת. משוך את הידיות לאחור וקרב שכמות בסוף התנועה.',
'חתירת T בשכיבה':'חזה נשען על הכרית. משוך את הידיות לבטן העליונה בלי להרים את החזה.',
'חתירה במוט לנדמיין':'מוט מקובע בפינה, גב ישר בהטיה. משוך את קצה המוט לבטן.',
'חתירה ביד אחת במוט לנדמיין':'יד אחת על קצה המוט, יד שנייה על הברך. משוך למותן.',
'שראגים במוט':'מוט מול הירכיים, זרועות ישרות. הרם כתפיים לאוזניים והחזק רגע.',
'שראגים בכבל':'מוט בכבל תחתון. הרם כתפיים ישר למעלה, בלי לגלגל.',
'רק פול':'מוט על המתקן בגובה הברכיים. גב ישר, דחוף את האגן קדימה עד עמידה מלאה.',
'דדליפט מהגבהה':'עמידה על משטח מוגבה מעט. אותה טכניקה כמו דדליפט, טווח תנועה ארוך יותר.',
'חתירה בסמית׳':'גב ישר בהטיה, מוט הסמית׳ מתחת לכתפיים. משוך לבטן התחתונה.',
'מתח בידית V':'ידית V על המוט, כפות ידיים פונות זו לזו. משוך את החזה לידית.',
'חתירה בשני קטלבלים':'גב ישר בהטיה. משוך את שני הקטלבלים למותניים וקרב שכמות.',
'חתירה מפולי עליון ביד אחת':'כריעה מול כבל עליון. משוך את הידית למותן ומרפק לאחור.',
'סקוואט לארגז':'שב לאחור עד מגע קל בארגז, בלי להתיישב לגמרי, ודחוף מעלה.',
'סקוואט רחב במוט':'עמידה רחבה, אצבעות החוצה. ברכיים בכיוון האצבעות, מדגיש ישבן ומקרבים.',
'סקוואט במשקולות':'משקולת בכל יד לצד הגוף. רד עד שהירכיים מקבילות לרצפה ועלה.',
'סקוואט סומו במשקולת':'עמידה רחבה, משקולת אחת בין הרגליים. רד ישר למטה עם גב זקוף.',
'סקוואט משקל גוף':'ידיים קדימה, משקל על העקבים. רד כמה שנוח ועלה בשליטה.',
'סקוואט קדמי בשני קטלבלים':'שני קטלבלים בגובה הכתפיים, מרפקים צמודים. רד עם גב זקוף ועלה.',
'לאנג׳ים במוט':'מוט על הגב העליון. צעד קדימה, רד עד ששתי הברכיים ב־90° וחזור.',
'לאנג׳ים בהליכה במוט':'מוט על הגב. צעד קדימה בכל חזרה, גב זקוף וברך אחורית קרוב לרצפה.',
'לאנג׳ים לאחור במשקולות':'משקולת בכל יד. צעד לאחור ורד, הברך הקדמית מעל הקרסול.',
'לאנג׳ אחורי מהגבהה':'עמידה על משטח מוגבה מעט. צעד לאחור ורד עמוק יותר מלאנג׳ רגיל.',
'לאנג׳ צידי במוט':'עמידה רחבה, מוט על הגב. העבר משקל לרגל אחת וכופף אותה, השנייה ישרה.',
'עליות על ספסל במשקולות':'משקולת בכל יד. עלה על הספסל בדחיפה מהרגל העליונה, לא מהתחתונה.',
'עליות על ספסל במוט':'מוט על הגב. עלה על ספסל בגובה הברך ורד בשליטה.',
'סקוואט בולגרי בסמית׳':'רגל אחורית על ספסל, מוט הסמית׳ על הגב. רד ישר למטה.',
'האק סקוואט במוט':'מוט מאחורי הרגליים. רד ועלה כשהמוט צמוד לגוף, כמו דדליפט הפוך.',
'לחיצת רגליים בעמידה צרה':'כפות רגליים צמודות יחסית במרכז הפלטה. מדגיש את הירך הקדמית.',
'פשיטת ברכיים ברגל אחת':'רגל אחת בכל פעם. יישר עד הסוף, החזק רגע והורד לאט.',
'כפיפת ברכיים בעמידה':'רגל אחת במכונה. כופף את הברך עד הסוף בלי להזיז את הירך.',
'גלוט האם רייז':'ברכיים על הכרית, עקבים נעולים. רד קדימה בשליטה ומשוך חזרה בעזרת הירך האחורית.',
'כפיפת ברכיים נורדית':'כריעה, עקבים מקובעים. רד קדימה הכי לאט שאפשר ונעזר בידיים בתחתית.',
'דדליפט ברגליים ישרות':'ברכיים כמעט ישרות, גב ישר. הורד את המוט עד מתיחה בירך האחורית ועלה.',

'דדליפט ברגל אחת בקטלבל':'עמידה על רגל אחת, השנייה נמתחת לאחור. הורד את הקטלבל עם גב ישר.',
'גוד מורנינג':'מוט על הגב, ברכיים כפופות מעט. כופף קדימה מהאגן עם גב ישר וחזור.',
'פול-ת׳רו בכבל':'גב לכבל תחתון, חבל בין הרגליים. דחוף אגן קדימה וכווץ ישבן.',
'גשר ישבן ברגל אחת':'שכיבה על הגב, רגל אחת באוויר. הרם אגן עד קו ישר וכווץ ישבן.',

'קיקבק ישבן על הברכיים':'על ארבע, ברך כפופה. דחוף את העקב לתקרה וכווץ ישבן.',
'קיקבק ישבן בכבל':'רצועה על הקרסול בכבל תחתון. דחוף את הרגל לאחור בלי להקשית גב.',
'היפראקסטנשן הפוך':'בטן על ספסל, רגליים באוויר. הרם רגליים ישרות עד קו הגוף והורד לאט.',
'הליכת מפלצת עם גומייה':'גומייה מעל הברכיים, ברכיים כפופות. צעדים קטנים הצידה בלי לקרב רגליים.',

/* best historical weight per exercise (finished workouts only) */
function bestMap(){
  const m={};
  for(const w of S.workouts)for(const e of w.ex||[]){if(e.t!=='s')continue;
    for(const s of e.sets||[]){const wt=+s.w||0,r=+s.r||0;if(r>0&&wt>(m[e.n]?.w||0))m[e.n]={w:wt,r,ts:w.start};}}
  return m;
}
/* last performance per exercise */
function lastPerf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name);
    if(e){ if(e.t==='c') return e.c?`קודם: ${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`:null;
      const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
      return 'קודם: '+ss.map(wLs).join(' · ');}}
  return null;
}
function lastSetsOf(name){
  const ws=[...S.workouts].sort((a,b)=>b.start-a.start);
  for(const w of ws){const e=(w.ex||[]).find(e=>e.n===name&&e.t==='s');
    if(e&&(e.sets||[]).some(s=>+s.r>0))return e.sets.filter(s=>+s.r>0);}

}
/* מאמן חכם: אם בפעם הקודמת כל הסטים סגרו את קצה הטווח — הצעה לעלות משקל */
const e1rm=(w,r)=>r>0?w*(1+r/30):0;
/* the next weight up without the coach: a small fixed step (smaller for light weights) */
function freeNext(maxW){ if(uL()==='lb'){ const lb=wL(maxW); return fromU(Math.round((lb+(lb>=30?5:2.5))/2.5)*2.5,'lb'); }
  const inc=maxW>=40?2.5:(maxW>=15?2:1); return Math.round((maxW+inc)*10)/10; }
function coachTip(name,repsRange,nSets){
  const last=lastSetsOf(name); if(!last||!last.length)return null;
  const nums=String(repsRange||'').match(/\d+/g); if(!nums)return null;
  const top=+nums[nums.length-1]; if(!top||top>30)return null; // טווחי שניות (פלאנק) לא רלוונטיים
  const maxW=Math.max(...last.map(s=>+s.w||0)); if(maxW<=0)return null;
  const enough=last.length>=(nSets||last.length); // every planned set, not just some of them
  const nw=freeNext(maxW), need=(nw-maxW)/maxW>0.10?top+3:top; // a jump of more than 10%: stretch the range by 3 reps first
  const allTop=last.every(s=>(+s.r||0)>=need);
  if(allTop&&enough)return {w:nw, from:maxW};
  return null;
}
/* היסטוריית ביצועים לתרגיל */
function historyOf(name){
  const out=[];
  for(const w of [...S.workouts].sort((a,b)=>b.start-a.start)){
    const e=(w.ex||[]).find(e=>e.n===name); if(!e)continue;
    if(e.t==='c'){ if(e.c&&(e.c.min||e.c.km))out.push({ts:w.start,txt:`${e.c.min||0} דק׳${e.c.km?` · ${e.c.km} ק״מ`:''}`}); continue; }
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const best=Math.max(...ss.map(s=>e1rm(+s.w||0,+s.r||0)));
    out.push({ts:w.start,txt:ss.map(wLs).join(' · '),e1:Math.round(wL(best))});
  }
  return out;
}

function armServerRest(label,tries=0){
  if(!S.user||S.settings.notif?.rest===false)return;
  if(IS_NATIVE){ // האפליקציה המותקנת מתזמנת התראה מקומית במכשיר: מדויקת ועובדת גם בלי קליטה

    if(NAT.perm==='granted')natNotify(tt('המנוחה נגמרה 💪'),tt(label?`הבא: ${label}`:'הסט הבא מחכה לך'),new Date(T.end),NAT.rest);

  T.armed=true; T.armOk=false; T.fireAt=new Date(T.end).toISOString(); saveRestState();
  const row={user_id:S.user.id,fire_at:T.fireAt,title:tt('המנוחה נגמרה 💪'),body:tt(label?`הבא: ${label}`:'הסט הבא מחכה לך')}, at=T.fireAt;
  T.row=row;

    if(tries<3&&T.int&&T.end-Date.now()>4000)setTimeout(()=>{ if(T.int&&T.fireAt===at)armServerRest(label,tries+1); },2000*(tries+1));

  },()=>{ if(T.fireAt===at&&tries<3&&T.int)setTimeout(()=>{ if(T.int&&T.fireAt===at)armServerRest(label,tries+1); },2000*(tries+1)); });
}

    fetch(SUPABASE_URL+'/rest/v1/rest_timers',{method:'POST',keepalive:true,
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+window._tok,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(T.row)}).then(r=>{ if(r.ok)T.armOk=true; }).catch(()=>{});
  }catch(e){}
}

  // delete only THIS timer: a late delete must never wipe a newer rest that was armed right after it
  let q=sb.from('rest_timers').delete().eq('user_id',S.user.id);

function hoArmClip(){

  let res,rej; const pr=new Promise((a,b)=>{res=a;rej=b;}); HO.clip={res,rej};
  setTimeout(()=>{ if(HO.clip){ HO.clip.rej(new Error('timeout')); HO.clip=null; } },30000);
  try{ navigator.clipboard.write([new ClipboardItem({'text/plain':pr.then(c=>new Blob([c],{type:'text/plain'}))})])
    .then(()=>{ HO.ok=true; logEv('ho_clip',{ok:1}); const el=$('#ig-code'); if(el)hoMarkCopied(el); },()=>{ logEv('ho_clip',{ok:0}); }); }catch(_){}

function hoFetch(){
  if(HO.p)return HO.p;
  HO.p=(async()=>{
    try{ const o=JSON.parse(sessionStorage.getItem('nr-ho')||'null'); if(o&&Date.now()-o.t<12*60000)return o.c; }catch(_){}
    const {data}=await sb.functions.invoke('handoff',{body:{action:'create'}});
    if(!data?.code)throw new Error('no_code');
    try{ sessionStorage.setItem('nr-ho',JSON.stringify({c:data.code,t:Date.now()})); }catch(_){}

function landFx(){
  try{ startLandTimer._io?.disconnect(); startLandTimer._hs?.disconnect(); }catch(_){}
  const rm=matchMedia('(prefers-reduced-motion: reduce)').matches, els=[...document.querySelectorAll('.lx .rv')];
  if(rm||!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); }
  else { const io=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting)return; const el=en.target; el.classList.add('in'); io.unobserve(el);
      el.querySelectorAll('[data-cnt]').forEach(b=>{ const to=+b.dataset.cnt, t0=performance.now(); const f=now=>{ const k=Math.min(1,(now-t0)/1100); b.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1)requestAnimationFrame(f); }; requestAnimationFrame(f); }); }),{rootMargin:'0px 0px -8% 0px',threshold:.12});
    els.forEach(e=>io.observe(e)); startLandTimer._io=io; }
  // the sticky CTA lives on <body>: an ancestor with a transform (page transition) would pin it to the page instead of the screen
  document.querySelectorAll('body>#lx-sticky').forEach(o=>o.remove());
  const hero=$('#lx-hero'), st=$('#lx-sticky'); if(st)document.body.appendChild(st);
  if(hero&&st&&'IntersectionObserver' in window){ const hs=new IntersectionObserver(([en])=>{ const end=document.querySelector('.lx-end'); const endIn=end&&end.getBoundingClientRect().top<innerHeight; st.classList.toggle('on',!en.isIntersecting&&!endIn); },{threshold:0}); hs.observe(hero); startLandTimer._hs=hs;
    if(!landFx._sc){ landFx._sc=1; addEventListener('scroll',()=>{ const s2=$('#lx-sticky'), e2=document.querySelector('.lx-end'), h2=$('#lx-hero'); if(!s2||!e2||!h2)return; const r=h2.getBoundingClientRect(); s2.classList.toggle('on',r.bottom<0&&e2.getBoundingClientRect().top>innerHeight*.9); },{passive:true}); } }
}
function startLandTimer(){
  requestAnimationFrame(landFx);
  clearInterval(startLandTimer._i); let left=63; const total=90, c=2*Math.PI*20;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  startLandTimer._i=setInterval(()=>{
    const t=$('#ld-t'), r=$('#ld-ring'); if(!t){clearInterval(startLandTimer._i);return;}
    left=left<=0?total:left-1;
    t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    r.setAttribute('stroke-dashoffset',(c*(1-left/total)).toFixed(1));
  },1000);
}

async function doAuth(){
  const email=($('#au-email')?.value||'').trim(), pass=$('#au-pass')?.value||'';
  const name=($('#au-name')?.value||'').trim(); S.authName=name;
  const err=$('#autherr'); if(err)err.textContent='';
  if(!email||!pass){if(err)err.textContent='מלא אימייל וסיסמה';return;}
  if(S.authMode==='signup'&&!name){if(err)err.textContent='מלא שם — ככה נדע איך לקרוא לך';return;}
  if(S.authMode==='signup'&&!$('#au-terms')?.checked){if(err)err.textContent='כדי להירשם יש לאשר את התקנון ומדיניות הפרטיות';return;}
  const btn=$('#authgo'); if(btn){btn.disabled=true;btn.textContent='רק רגע…';}
  try{
    if(S.authMode==='signup'){
      let ref=null; try{ref=localStorage.getItem('nr-ref');}catch(_){}
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:Object.assign({full_name:name,terms_accepted:new Date().toISOString(),terms_v:'2026-10-20',lang:LANG},ref?{ref}:{})}});
      if(error)throw error;
      if(!data.session){
        $('#view').innerHTML=`<div class="empty" style="margin-top:48px"><div class="big">כמעט שם ✉️</div>שלחנו קישור אישור אל<br><b dir="ltr">${esc(email)}</b><br>פתח את המייל, לחץ על הקישור — וחזור לכאן להתחבר.</div>`;
        return;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
  }catch(e){
    const m=String(e?.message||'');
    if(err)err.textContent=
      /already registered/i.test(m)?'האימייל כבר רשום — נסה להתחבר':
      /invalid login/i.test(m)?'אימייל או סיסמה שגויים':
      /at least 6|too short/i.test(m)?'הסיסמה צריכה להיות באורך 6 תווים לפחות':
      /not confirmed/i.test(m)?'צריך לאשר קודם את המייל — בדוק את תיבת הדואר':
      /valid email/i.test(m)?'כתובת האימייל לא תקינה':
      'שגיאה: '+m;
  }finally{
    const b2=$('#authgo'); if(b2){b2.disabled=false;b2.textContent=S.authMode==='signup'?'הרשמה':'התחברות';}
  }
}

function nextTpl(){
  const ts=[...S.templates].sort((a,b)=>(a.order||0)-(b.order||0));
  if(!ts.length)return null;
  const lastT=[...S.workouts].sort((a,b)=>b.start-a.start).find(w=>w.tid);
  if(!lastT)return ts[0];
  const i=ts.findIndex(t=>t.id===lastT.tid);
  return ts[(i+1)%ts.length]||ts[0];
}
function tplMinutes(t){
  let m=0;
  for(const e of t.ex||[]){ if(e.t==='c'){m+=15;continue;} const n=+e.s||3; m+=n*((+e.rest||90)+45)/60; }
  return Math.max(10,Math.round(m/5)*5);
}
function weekDots(){
  /* השבוע הקלנדרי הנוכחי: ראשון מימין (RTL), כמו לוח עברי */
  const trained=new Set(S.workouts.map(w=>new Date(w.start).toDateString()));
  const today=new Date(); today.setHours(0,0,0,0);
  const sun=new Date(today); sun.setDate(today.getDate()-today.getDay());
  let out='';
  for(let d=0;d<7;d++){
    const dt=new Date(sun); dt.setDate(sun.getDate()+d);
    const on=trained.has(dt.toDateString());
    const isToday=dt.getTime()===today.getTime();
    const hasSched=!!schedOf(d);
    const sched=!on&&hasSched&&dt>=today;
    const missed=!on&&hasSched&&dt<today;
    out+=`<div class="day ${on?'on':''} ${sched?'sched':''} ${missed?'miss':''} ${isToday?'today':''} ${isToday&&on&&Date.now()-(S._justTrained||0)<6000?'pop':''}"><span>${DAY_LETTERS[d]}</span><b class="dt num">${dt.getDate()}</b><i></i></div>`;
  }
  return out;
}
function weekStreak(){
  let streak=0;
  const ws=S.workouts.map(w=>w.start);
  for(let k=0;;k++){
    const end=new Date(); end.setHours(23,59,59,999); end.setDate(end.getDate()-end.getDay()-7*k+6);
    const start=new Date(end); start.setDate(end.getDate()-6); start.setHours(0,0,0,0);
    const has=ws.some(t=>t>=+start&&t<=+end);
    if(has)streak++;
    else{ if(k===0)continue; break; } // השבוע הנוכחי עוד לא נספר נגד הרצף
    if(k>260)break;
  }
  return streak;
}

}

function mfAllowed(f,p){

  if((st==='veg'||st==='vegan')&&(f.t==='m'||f.t==='f'))return false;
  if(st==='pesc'&&f.t==='m')return false;
  if(st==='vegan'&&(f.t==='d'||f.t==='e'))return false;
  for(const a of ['g','l','n','s'])if(av.includes(a)&&f.x.includes(a))return false;
  if(av.includes('e')&&f.t==='e')return false;
  if(av.includes('f')&&f.t==='f')return false;
  if(p.cook==='none'&&f.ck>0)return false;

  if(menuS().no.includes(f.id))return false;
  return true;

  const a=bf?(n<=3?['b','l','d']:n===4?['b','l','s','d']:['b','s','l','s','d'])
            :(n<=3?['l','s','d']:n===4?['l','s','d','s']:['s','l','s','d','s']);
  let pw=-1;
  if(p.train==='am')pw=a.findIndex(k=>k==='b'||k==='l');
  else if(p.train==='noon')pw=a.indexOf('l');
  else if(p.train==='pm')pw=a.lastIndexOf('d');
  const base={b:24,l:35,d:26,s:11};
  const w=a.map((k,i)=>base[k]+(i===pw?8:0)), sum=w.reduce((x,y)=>x+y,0);

function menuBalance(meals,kT,pT){

function mwAct(act,b){
  const t=MW; if(!t)return true;
  if(act==='mw-back'){ t.step=Math.max(0,t.step-1); return mwRender(),true; }
  if(act==='mw-next'){ t.step++; if(t.step>=MW_STEPS.length)return mwFinish(),true; return mwRender(),true; }
  if(act==='mw-tog'){ const k=b.dataset.k, v=b.dataset.v, a=t.p[k]; const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v); b.classList.toggle('on',i<0);
    if(k==='avoid'){ const nb=document.querySelector('[data-act="mw-next"]'); if(nb)nb.textContent=tt(a.length?'המשך':'אין, אני אוכל הכל'); } return true; }
  if(act==='mw-pick'){ const k=b.dataset.k; t.p[k]=k==='meals'||k==='free'?+b.dataset.v:b.dataset.v;
    document.querySelectorAll('[data-act="mw-pick"]').forEach(x=>x.classList.toggle('on',x===b));
    if(k==='style'){ if(t.p.style==='vegan')t.p.avoid=t.p.avoid.filter(x=>!'efl'.includes(x)); if(t.p.style==='veg')t.p.avoid=t.p.avoid.filter(x=>x!=='f'); }
    setTimeout(()=>{ t.step++; if(t.step>=MW_STEPS.length)mwFinish(); else mwRender(); },220); return true; }
  return false;
}
function mwFinish(){
  const M=menuS(), first=!M.p; M.p={...MW.p}; MW=null;
  M.p.likes=M.p.likes.filter(id=>{ const f=MFI(id); return f&&mfAllowed(f,{...M.p,cook:'any'}); });
  closeSheet(); logEv('menu_prefs');
  if(first||!M.day||M.day.auto)menuGenerate(); else persistSettings();
  S.tab='food'; S.menuOpen=true; render(); window.scrollTo(0,0);
  toast(first?'התפריט שלך מוכן 🍽️':'ההעדפות עודכנו ✓');
}

async function foodAI(payload){
  if(S.ai.busy)return;
  if(aiFreeLeft()===0){ aiUpsell(); return; }
  try{ if($('#sheet .fa-sheet'))closeSheet(); }catch(_){}
  S.ai.busy=true; S.ai.q=payload.text||''; S.ai.img=payload.image?'data:image/jpeg;base64,'+payload.image:null; render(); aiTicker(true);
  try{
    const {data,error}=await Promise.race([sb.functions.invoke('nutrition',{body:{...payload,lang:LANG}}),
      new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{slow:true})),125000))]);
    if(error)throw error;
    if(!data||!Array.isArray(data.items)||!data.items.length)throw new Error('empty');
    if(data._left&&data._left.kind==='photo'){AIQ.photo=data._left.n; AIQ.loaded=Date.now();}
    if(data._free){ AIQ.free=+data._free.left||0; AIQ.freeDay=new Date().toDateString(); AIQ.loaded=Date.now(); }
    S.ai.keep=false; openMealConfirm(data);
  }catch(e){
    console.error(e);
    S.ai.keep=true; const st=e?.context?.status;
    let qd=null; if(st===429){ try{qd=await e.context.json();}catch(_){} if(payload.image&&qd?.period==='month')AIQ.photo=0; }
    if(st===429&&qd?.free){ AIQ.free=0; AIQ.freeDay=new Date().toDateString(); setTimeout(aiUpsell,0); }
    else toast(st===429?(qd?.period==='day'?'הגעת לתקרה היומית. נמשיך מחר 💪':payload.image?'ניצלת את ניתוחי התמונה לחודש הזה. אפשר להקליד מה אכלת או לחפש במאגר':'הגעת למכסת ניתוחי ה-AI החודשית. אפשר לחפש במאגר או להוסיף ידנית')
      :(e?.slow||st===502||st===503||st===504)?'הניתוח לקח יותר מדי זמן. נסה שוב, או כתוב בקצרה מה בצלחת'
      :e?.message==='empty'?'לא זיהינו אוכל או שתייה. נסה לפרט, למשל "2 פרוסות לחם עם גבינה"'
      :navigator.onLine?'הניתוח נכשל — נסה לנסח אחרת או הוסף ידנית':'אין רשת — ניתוח AI דורש חיבור');
  }
  S.ai.busy=false; S.ai.img=null; aiTicker(false); render();
  if(S.ai.keep){ const t=$('#food-text'); if(t){t.value=S.ai.q; t.closest('.fsearch')?.classList.add('has'); t.style.height=Math.min(132,t.scrollHeight+2)+'px';} }
}

function aiTicker(on){
  clearInterval(aiTicker._i); if(!on)return; let i=0, t0=Date.now();
  aiTicker._i=setInterval(()=>{ const el=$('#ai-step'), bar=$('#ai-bar'); if(!el)return;
    i=Math.min(AI_STEPS.length-1,Math.floor((Date.now()-t0)/(i<3?1800:6000))); el.textContent=AI_STEPS[i];
    if(bar)bar.style.width=Math.min(92,8+(Date.now()-t0)/90)+'%'; },300);
}

function mcCalc(n){ const it=_mealDraft.items[n], b=MC.base[n]; if(!it||!b)return;

function mcAct(act,b){
  const n=+b.dataset.mi, it=_mealDraft?.items[n], base=MC.base[n]; if(!it)return;
  if(act==='mc-del'){ _mealDraft.items.splice(n,1); MC.base.splice(n,1); MC.sugg={}; mcRender(); return; }
  if(act==='mc-half'||act==='mc-dbl'){ const k=act==='mc-half'?.5:2;
    if(base.noG)it._f=Math.max(.25,Math.round(it._f*k*4)/4); else it.g=Math.max(1,Math.min(3000,Math.round(it.g*k))); mcRender(); return; }
  if(act==='mc-cm'||act==='mc-cp'){ if(!base.cnt)return; const c=Math.max(1,Math.min(30,Math.round(it.cnt||base.cnt)+(act==='mc-cp'?1:-1))), f=c/base.cnt;
    if(base.noG)it._f=f; else it.g=Math.max(1,Math.round(base.g*f)); it.ask=false; mcRender(); return; }
  if(act==='mc-pick'){ const f=(MC.sugg[n]||[])[+b.dataset.j]; if(!f)return;
    it.name=f.name; it.cnt=0; it.ask=false; MC.base[n]={g:100,kcal:+f.kcal||0,protein:+f.protein||0,carbs:+f.carbs||0,fat:+f.fat||0,noG:false};
    if(base.noG){ it.g=100; } MC.sugg[n]=[]; mcRender(); return; }
}

const LIQ_RX=/(^|[\s,(])(חלב|משקה|מיץ|נקטר|שוקו|קפיר|לבן|רוויון|אייס|קפה|תה|סודה|מים|קולה|בירה|יין|שייק|סמוטי|לימונדה|אשכוליות|milk|drink|juice|shake|smoothie|soda|water|cola|beer|wine|coffee|tea|kefir)/i;
const LIQ_NOT=/שוקולד|אבק|גבינ|חמאה|גלידה|מעדן|ממרח|עוגי|עוגה|ופל|פודינג|chocolate|powder|cheese|butter|ice cream/i;
const isLiquid=f=>!!f&&(f.liq===true||LIQ_RX.test(String(f.name||''))&&!LIQ_NOT.test(String(f.name||'')));

const FSRC={};
function foodSrcText(f){
  if(!f||f.bc||!Number.isInteger(f.code))return '';
  if(f.code<10000)return tt('מקור: מאגר צמרת, משרד הבריאות');
  if(f.code>=600000&&f.code<900000)return tt('מקור: USDA FoodData Central');
  const r=FSRC[f.code]; if(!r)return '';
  return r.kind==='estimate'?tt('ערך משוער: אין לפריט הזה מקור תזונתי מתועד'):tt('מקור')+': '+r.src.replace(/^same values as /,'');
}
async function loadFoodSrc(f){
  if(!f||!(f.code>=900000)||FSRC[f.code])return;
  try{ const {data}=await sb.from('food_src').select('kind,src').eq('code',f.code).maybeSingle();
    FSRC[f.code]=data||{kind:'estimate',src:''}; const el=$('#portion-src'); if(el&&_portion&&_portion.f===f)el.textContent=foodSrcText(f); }catch(_){}
}
function openPortion(f){
  const liq=isLiquid(f);
  const units=(f.units||[]).map(u=>({u:u.u,g:+u.g,d:!!u.d})).filter(u=>u.g>0);
  if(liq&&!units.some(u=>/כוס|ספל|שוט|בקבוק|פחית|קרטון|shot|cup|mug|كوب|شوت/i.test(u.u)))units.push({u:'כוס',g:200,d:!units.some(u=>u.d)});
  const pref=['יחידה בינונית','מנה בינונית','יחידה','מנה','פרוסה בינונית','פרוסה','גביע','כוס','ספל','כף'];
  const def=units.find(u=>u.d)||pref.map(n=>units.find(u=>u.u===n)).find(Boolean)||units.find(u=>u.g>=20)||units[0]||null;
  _portion={f,units,unit:def,qty:def?1:100,liq};
  renderPortion(); loadFoodSrc(f);

/* target reps "8-12" / "10" → {lo,hi}; null for timed ranges (plank seconds) or none */
function repRange(r){ const n=String(r||'').match(/\d+/g); if(!n)return null; const lo=+n[0], hi=+n[n.length-1]; if(!hi||hi>30)return null; return {lo:Math.min(lo,hi),hi:Math.max(lo,hi)}; }
function repCls(e,s){ const rr=repRange(e.reps), r=+s.r||0; if(!rr||!r)return ''; return r>rr.hi?'r-over':r<rr.lo?'r-under':'r-in'; }
/* double progression: top of the range on every set last time → add weight; otherwise one more rep than the weakest set */
function repTip(e){
  const up=coachTip(e.n,e.reps,e.sets.length); if(up)return {kind:'up',w:up.w,from:up.from};
  const rr=repRange(e.reps), last=lastSetsOf(e.n); if(!rr||!last||!last.length)return null;
  const rs=last.map(x=>+x.r||0).filter(Boolean), w=Math.max(...last.map(x=>+x.w||0)); if(!rs.length||w<=0)return null;
  const low=Math.min(...rs); if(low<rr.lo-2)return null; // last time was far off: no nudge
  const cap=(freeNext(w)-w)/w>0.10?rr.hi+3:rr.hi;
  return {kind:'reps',r:Math.min(cap,Math.max(rr.lo,low+1)),w};
}

   Rule-based, no AI: double progression per exercise, 6-week blocks (5 build weeks + 1 light week),

const COACH_DEF={mode:'assist',rir:true,weeks:6,incBb:2.5,incDb:2};
function coachCfg(){ const c=S.settings.coach||(S.settings.coach={}); for(const k in COACH_DEF)if(c[k]===undefined)c[k]=COACH_DEF[k]; if(!c.lock)c.lock={}; return c; }
const coachOn=()=>isPrem()&&coachCfg().mode!=='off';
function exGroup(n){ for(const g in LIB)if(LIB[g].includes(n))return g; return null; }
const COMPOUND=/לחיצ|סקוואט|דדליפט|חתירה|מתח|מקבילים|לאנג|ת׳ראסט|גובלט|פולי עליון|רומני|פרס|פוש|דיפ|היפ/;
const isCompound=n=>COMPOUND.test(n);
function wStep(n){ const c=coachCfg(), db=/משקולות|משקולת|קטלבל|גובלט/.test(n); if(uL()==='lb')return (db?(+c.incDbLb||5):(+c.incBbLb||5))/LB; return db?(+c.incDb||2):(+c.incBb||2.5); }

/* how much weight to add: about 2.5% of the working weight (up to 5% after an easy session), never less than one plate step; careful pace stays at 2% */

const HIST={q:'',tpl:'all',open:{}};
function histPRs(ws){ // אימונים שבהם נשבר שיא משקל בתרגיל
  const best={}, pr={};
  for(const w of [...ws].sort((a,b)=>a.start-b.start)){
    let n=0;
    for(const e of w.ex||[])if(e.t==='s'){ const top=Math.max(0,...(e.sets||[]).filter(x=>+x.r>0).map(x=>+x.w||0));
      if(top>0){ if(best[e.n]!=null&&top>best[e.n])n++; if(best[e.n]==null||top>best[e.n])best[e.n]=top; } }
    if(n)pr[w.id]=n;
  }
  return pr;
}
function histHeatmap(ws){
  const W=16, d0=new Date(); d0.setHours(0,0,0,0); d0.setDate(d0.getDate()-d0.getDay()-(W-1)*7);
  const vol={}; for(const w of ws){ const k=ymd(new Date(w.start)); vol[k]=(vol[k]||0)+Math.max(1,workoutVol(w)); }
  const vals=Object.values(vol).sort((a,b)=>a-b), q=p=>vals.length?vals[Math.floor((vals.length-1)*p)]:0;
  const lvl=v=>!v?0:v<=q(.33)?1:v<=q(.66)?2:3;
  const today=ymd(); let cols='', n=0;
  for(let c=0;c<W;c++){ let cells='';
    for(let r=0;r<7;r++){ const d=new Date(d0); d.setDate(d0.getDate()+c*7+r); const k=ymd(d); const v=vol[k]; if(v)n++;
      cells+=k>today?'<i class="hm f"></i>':`<i class="hm l${lvl(v)}${k===today?' t':''}" title="${k}"></i>`; }
    cols+=`<span class="hmc">${cells}</span>`; }
  return {html:`<div class="hmgrid">${cols}</div>`,days:n};
}

    ${!ws.length?`<div class="empty" style="margin-top:12px">לא נמצאו אימונים${q?` עם ״${esc(q)}״`:''}</div>`:''}

function exerciseOptions(){

}

function progDelta(){

function bwChange(days){
  const ws=S.weights||[]; if(ws.length<2)return null;
  const last=ws[ws.length-1];
  const cutoff=new Date(last.d); cutoff.setDate(cutoff.getDate()-days);
  const cs=ymd(cutoff);
  let base=null; for(const p of ws){ if(p.d<=cs)base=p; }
  if(!base)base=ws[0]; if(base===last)return null;
  return Math.round((wB(last.kg)-wB(base.kg))*10)/10;
}

/* weekly calorie bank: Sunday → yesterday, only days that have meals logged (an empty day isn't a 0-kcal day).
   Today counts only once it goes over the target (the overage comes off the bank right away); kcal not yet eaten today
   aren't "saved" because the day isn't over. Positive = kcal still available, negative = over the target. */
function kcalBank(){
  const kT=+S.settings.kcalT||0; if(!kT)return null;
  const now=new Date(), dow=now.getDay(); let past=0, n=0;
  for(let i=dow;i>=1;i--){ const x=new Date(now); x.setDate(now.getDate()-i); const ds=ymd(x); if(!mealsOf(ds).length)continue; past+=kcalFor(ds)-dayTotals(ds).kcal; n++; }
  const tk=mealsOf(ymd()).length?dayTotals(ymd()).kcal:0, todayOver=Math.max(0,tk-kcalFor(ymd()));
  if(!n&&!todayOver)return null;
  return {bank:Math.round(past-todayOver),past:Math.round(past),n:n+(todayOver?1:0),kT,tk:Math.round(tk),todayOver:Math.round(todayOver)};
}

async function ensurePhotos(paths){

/* תמונות התקדמות: מוקטנות (1600px, בלי מטא-דאטה/מיקום) ומוצפנות במכשיר (AES-256-GCM) לפני ההעלאה.
   בשרת נשמר רק קובץ מוצפן בתיקייה פרטית של המשתמש; המפתח האישי נשמר בטבלה סגורה ומוחזר רק לבעליו. */
const PHK={p:null};
function photoKey(){
  if(!PHK.p)PHK.p=(async()=>{ const {data,error}=await sb.rpc('my_photo_key'); if(error||!data)throw error||new Error('key');
    const raw=Uint8Array.from(atob(data),c=>c.charCodeAt(0)); return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']); })().catch(e=>{PHK.p=null;throw e;});

const PH_MAGIC=[78,82,69,49]; // "NRE1"
async function encPhoto(blob){

  const out=new Uint8Array(4+12+ct.length); out.set(PH_MAGIC,0); out.set(iv,4); out.set(ct,16);

async function decPhoto(buf){

async function fetchPhoto(path){

}
async function loadPhotos(force){

    const {data,error}=await sb.storage.from('progress').list(S.user.id,{limit:1000,sortBy:{column:'name',order:'desc'}});

function shrinkBlob(file,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
      c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',0.82); // ציור מחדש על canvas מוחק EXIF (כולל מיקום GPS)
    }catch(e){rej(e);} };
    img.onerror=rej; img.src=URL.createObjectURL(file);
  });
}

async function deleteBodyweight(d){

}
async function saveBodyweight(val,date){
  const v=val!=null?+val:+wBk(parseFloat(($('#bw-input')?.value||'').replace(',','.')));
  if(!v||v<25||v>400){toast('הקלד משקל תקין');return;}
  const d=date||ymd();
  const prevW=(S.weights||[]).filter(x=>x.d<d).slice(-1)[0], gk=+S.settings.goalKg||0;
  S.weights=(S.weights||[]).filter(x=>x.d!==d); S.weights.push({d,kg:v}); S.weights.sort((a,b)=>a.d<b.d?-1:1);
  saveSnapshot(); render();
  if(prevW&&gk&&d===ymd()){ const df=Math.round((wB(v)-wB(prevW.kg))*10)/10; if(df&&((gk<prevW.kg&&df<0)||(gk>prevW.kg&&df>0))){ setTimeout(()=>{ cheer('💚','בכיוון הנכון!',`${df<0?'▼':'▲'} ${Math.abs(df)} ${BU()}`); vibrate(15); },350); } }
  const row={user_id:S.user.id,d,kg:v};

  catch(e){ qPush('bodyweight',row); toast('נשמר מקומית — יסונכרן כשתחזור רשת'); }
}
function chartData(){
  const pts=[];
  for(const w of [...S.workouts].sort((a,b)=>a.start-b.start)){
    const e=(w.ex||[]).find(e=>e.n===S.progressEx&&e.t==='s'); if(!e)continue;
    const ss=(e.sets||[]).filter(s=>+s.r>0); if(!ss.length)continue;
    const top=Math.max(...ss.map(s=>+s.w||0));
    const vol=ss.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);
    pts.push({ts:w.start, v:wL(S.progressMetric==='top'?top:vol)});
  }
  return pts;
}
function niceTicks(max){
  if(max<=0)return [0,5,10];
  const raw=max/3, pow=Math.pow(10,Math.floor(Math.log10(raw)));
  let step=pow; for(const m of [1,2,2.5,5,10]){if(raw<=m*pow){step=m*pow;break;}}
  const top=Math.ceil(max/step)*step, t=[];
  for(let v=0;v<=top+1e-9;v+=step)t.push(Math.round(v*100)/100);
  return t;
}
function chartSVG(){
  const pts=chartData();

  const W=520,H=230,L=44,R=14,Tp=16,B=30;
  const xs=pts.map(p=>p.ts), ys=pts.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const ticks=niceTicks(Math.max(...ys)); const y1=ticks[ticks.length-1]||1;
  const X=t=>L+(W-L-R)*((t-x0)/Math.max(1,(x1-x0)));
  const Y=v=>Tp+(H-Tp-B)*(1-v/y1);
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.ts).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area=`${path} L${X(x1).toFixed(1)},${Y(0)} L${X(x0).toFixed(1)},${Y(0)} Z`;
  const iMax=ys.indexOf(Math.max(...ys));
  const lbl=(i)=>`<text x="${X(pts[i].ts)}" y="${Y(pts[i].v)-9}" font-size="11.5" text-anchor="middle" fill="var(--ink)" font-weight="600">${fmtNum(pts[i].v)}</text>`;
  const labelIdx=new Set([0,pts.length-1,iMax]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="גרף התקדמות" style="direction:ltr;display:block">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L-7}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtNum(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle data-pt="${i}" cx="${X(p.ts).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===iMax?5.5:4}" fill="${i===iMax?'var(--gold)':'var(--accent)'}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`).join('')}
    ${[...labelIdx].map(lbl).join('')}
    <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="start">${fmtDate(x0)}</text>
    <text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function wireChart(){
  const wrap=$('#chartwrap'); if(!wrap)return;
  wrap.addEventListener('click',ev=>{
    const c=ev.target.closest('[data-pt]');
    let tip=$('#tip'); if(tip)tip.remove();
    if(!c)return;
    const i=+c.dataset.pt, pts=chartData(), p=pts[i]; if(!p)return;
    tip=document.createElement('div');tip.id='tip';
    tip.textContent=`${fmtDate(p.ts)} · ${fmtNum(p.v)} ${LU()}`;
    wrap.appendChild(tip);
    const cr=c.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
    tip.style.left=(cr.left-wr.left+cr.width/2)+'px';
    tip.style.top=(cr.top-wr.top)+'px';
    setTimeout(()=>tip&&tip.remove(),2600);
  });
}

(function(){ let y0=0,x0=0;
  document.addEventListener('touchstart',e=>{ const t=e.touches[0]; y0=t.clientY; x0=t.clientX; },{passive:true});
  document.addEventListener('touchmove',e=>{
    const sh=document.getElementById('sheet'); if(!sh||sh.hidden||e.touches.length>1)return;
    const t=e.touches[0], dy=t.clientY-y0, dx=t.clientX-x0; y0=t.clientY; x0=t.clientX;
    if(Math.abs(dx)>Math.abs(dy))return;
    let el=e.target; if(!sh.contains(el)){ if(e.cancelable)e.preventDefault(); return; }
    // מטפסים מהאלמנט שנגעו בו עד החלונית: אם יש אזור שיכול לגלול בכיוון הזה — נותנים לו. אחרת חוסמים, כדי שהמסך מאחור לא יזוז
    for(;el&&el!==document.body;el=el.parentElement){
      if(el.scrollHeight>el.clientHeight+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowY)){
        const canUp=el.scrollTop>0, canDown=el.scrollTop+el.clientHeight<el.scrollHeight-1;
        if((dy>0&&canUp)||(dy<0&&canDown)||dy===0)return; }
      if(el===sh)break; }

function agoHe(d){
  if(!d)return '—';

  return days<=0?'היום':days===1?'אתמול':days<7?`לפני ${days} ימים`:days<30?`לפני ${Math.round(days/7)} שב׳`:`לפני ${Math.round(days/30)} חוד׳`;
}
