<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 224 224" class="max strain"><style>.max .body{transform-origin:100px 112px;animation:float 4.2s ease-in-out infinite}
.max .core{transform-origin:100px 100px;animation:pulse 3.2s ease-in-out infinite}
.max .ring{transform-origin:100px 100px;opacity:0;transition:opacity .4s}
.max .eyes{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.max .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.max .eye.r{animation-delay:.04s}
.max .arc{opacity:0;transition:opacity .2s}
.max .pill{transition:opacity .2s}
.max .sparks{opacity:0}
.max .dots{opacity:0;transition:opacity .3s}
.max .shadow{transform-origin:100px 186px;animation:shadow 4.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.86);opacity:.22}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes look{0%,30%{transform:translate(0,0)}36%,52%{transform:translate(-7px,1px)}58%,74%{transform:translate(6px,0)}80%,100%{transform:translate(0,0)}}
.max.idle .eyes{animation:look 9s ease-in-out infinite}
.max.happy .pill,.max.cheer .pill{opacity:0}
.max.happy .arc,.max.cheer .arc{opacity:1}
.max.happy .eye,.max.cheer .eye{animation:none}
.max.wink .eye.l .pill{opacity:0}.max.wink .eye.l .arc{opacity:1}
.max.wink .eye.l{animation:none}
.max.think .eyes{transform:translate(8px,-9px)}
.max.think .eye{animation:none;transform:scaleY(.62)}
.max.think .ring{opacity:1;animation:spin 2.2s linear infinite}
.max.think .dots{opacity:1}
.max.think .dots circle{animation:dot 1.2s ease-in-out infinite}
.max.think .dots circle:nth-child(2){animation-delay:.2s}.max.think .dots circle:nth-child(3){animation-delay:.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.max.talk .core{animation:talk .42s ease-in-out infinite}
.max.talk .body{animation:talkb .42s ease-in-out infinite}
.max.talk .eye{animation:none}
@keyframes talk{0%,100%{transform:scale(.94);opacity:.8}50%{transform:scale(1.16);opacity:1}}
@keyframes talkb{0%,100%{transform:scale(1)}50%{transform:scale(1.025,.985)}}
.max.cheer .body{animation:jump 1.1s cubic-bezier(.3,.6,.4,1) infinite}
.max.cheer .shadow{animation:jshadow 1.1s cubic-bezier(.3,.6,.4,1) infinite}
.max.cheer .core{animation:pulse .55s ease-in-out infinite}
.max.cheer .sparks{opacity:1}
.max.cheer .sparks line{animation:spark 1.1s ease-out infinite;transform-origin:100px 100px}
@keyframes jump{0%{transform:translateY(0) scale(1.08,.9)}18%{transform:translateY(-4px) scale(.94,1.08)}45%{transform:translateY(-30px) scale(1,1)}72%{transform:translateY(0) scale(1.06,.93)}86%,100%{transform:translateY(0) scale(1,1)}}
@keyframes jshadow{0%,72%,100%{transform:scaleX(1);opacity:.35}45%{transform:scaleX(.6);opacity:.12}}
@keyframes spark{0%,30%{opacity:0;stroke-dashoffset:18}45%{opacity:1}100%{opacity:0;stroke-dashoffset:-22}}
.max .shade{opacity:0}
.max .o,.max .chev,.max .zz,.max .wave{opacity:0;transition:opacity .2s}
.max .wave{transform-origin:100px 100px}
.max.sleepy .eye{animation:none;transform:scaleY(.28) translateY(28px)}
.max.sleepy .core{animation:pulse 6s ease-in-out infinite;opacity:.35}
.max.sleepy .body{animation:float 7s ease-in-out infinite}
.max.sleepy .zz{opacity:1}.max.sleepy .zz text{animation:zz 3s ease-in-out infinite}.max.sleepy .zz text+text{animation-delay:1s}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.max.strain .pill{opacity:0}.max.strain .chev{opacity:1}.max.strain .eye{animation:none}
.max.strain .core{animation:pulse .5s ease-in-out infinite}
.max.strain .body{animation:shake .18s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.2px,.6px)}75%{transform:translate(1.2px,-.6px)}}
.max.proud .pill{opacity:0}.max.proud .arc{opacity:1}.max.proud .eye{animation:none}
.max.proud .halo{opacity:.7!important}
.max.proud .core{animation:pulse 1.6s ease-in-out infinite}
.max.proud .body{animation:nod 2.4s ease-in-out infinite}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
.max.surprised .pill{opacity:0}.max.surprised .o{opacity:1}.max.surprised .eye{animation:none}
.max.surprised .body{animation:surprise 2.2s ease-in-out infinite}
@keyframes surprise{0%,100%{transform:translateY(0) scale(1)}10%{transform:translateY(-10px) scale(1.04)}25%{transform:translateY(0) scale(1)}}
.max.listen .wave{opacity:1;animation:wave 1.6s ease-out infinite}
.max.listen .eye{animation:none;transform:scaleY(.85)}
@keyframes wave{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@keyframes tap{0%{transform:scale(.88,1.08)}45%{transform:scale(1.08,.92) translateY(-8px)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.max *{animation:none!important}}
.max.cheerx .sparks{opacity:1}.max.cheerx .sparks line{animation:spark 1.6s ease-out infinite;transform-origin:100px 100px}
</style><defs><radialGradient id="gBody" gradientUnits="userSpaceOnUse" cx="76" cy="62" r="120"><stop offset="0" stop-color="#3A3D33"/><stop offset=".5" stop-color="#17190F"/><stop offset="1" stop-color="#070805"/></radialGradient><radialGradient id="gBody2" cx="50%" cy="50%" r="50%"><stop offset=".86" stop-color="#0B0C08"/><stop offset="1" stop-color="#0B0C08"/></radialGradient><radialGradient id="gCore" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#FF8AC4" stop-opacity=".95"/><stop offset=".45" stop-color="#FF8AC4" stop-opacity=".35"/><stop offset="1" stop-color="#FF8AC4" stop-opacity="0"/></radialGradient><radialGradient id="gHalo" cx="50%" cy="50%" r="50%"><stop offset=".6" stop-color="#FF8AC4" stop-opacity=".0"/><stop offset=".78" stop-color="#FF8AC4" stop-opacity=".28"/><stop offset="1" stop-color="#FF8AC4" stop-opacity="0"/></radialGradient><radialGradient id="gShade" gradientUnits="userSpaceOnUse" cx="78" cy="64" r="130"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient><linearGradient id="gGloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8AC4" stop-opacity="0"/><stop offset=".5" stop-color="#FF8AC4" stop-opacity=".9"/><stop offset="1" stop-color="#FF8AC4" stop-opacity="0"/></linearGradient><filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="fSoft"><feGaussianBlur stdDeviation="6"/></filter><filter id="fHalo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter><clipPath id="cOrb"><circle cx="100" cy="100" r="74"/></clipPath></defs><ellipse class="shadow" cx="100" cy="186" rx="48" ry="7" fill="#000" opacity=".35" filter="url(#fSoft)"/><g class="body"><circle cx="100" cy="100" r="74" class="halo" fill="#FF8AC4" opacity=".4" filter="url(#fHalo)"/><circle cx="100" cy="100" r="74" class="base" fill="#0B0C08"/><g clip-path="url(#cOrb)"><circle class="core" cx="100" cy="112" r="70" fill="url(#gCore)" filter="url(#fSoft)"/><rect class="bodyg" x="0" y="0" width="200" height="200" fill="url(#gBody)"/><rect class="shade" x="0" y="0" width="200" height="200" fill="url(#gShade)"/><ellipse class="bglow" cx="100" cy="196" rx="70" ry="38" fill="#FF8AC4" opacity=".22" filter="url(#fSoft)"/><ellipse cx="84" cy="54" rx="40" ry="17" fill="url(#gGloss)" transform="rotate(-16 84 54)"/><circle cx="62" cy="74" r="3.2" fill="#fff" opacity=".7"/></g><circle class="ring" cx="100" cy="100" r="82" fill="none" stroke="url(#gRing)" stroke-width="3" stroke-linecap="round" stroke-dasharray="120 400"/><circle cx="100" cy="100" r="74" class="rim" fill="none" stroke="#FF8AC4" stroke-opacity=".35" stroke-width="1.2"/><g class="eyes" filter="url(#fGlow)"><g class="eye l"><rect class="pill" x="69" y="86" width="16" height="30" rx="8" fill="#FF8AC4"/><circle class="o" cx="77" cy="100" r="11" fill="none" stroke="#FF8AC4" stroke-width="6"/><path class="chev" d="M70 92 L84 101 L70 110" fill="none" stroke="#FF8AC4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="arc" d="M68 104 Q77 92 86 104" fill="none" stroke="#FF8AC4" stroke-width="7" stroke-linecap="round"/></g><g class="eye r"><rect class="pill" x="115" y="86" width="16" height="30" rx="8" fill="#FF8AC4"/><circle class="o" cx="123" cy="100" r="11" fill="none" stroke="#FF8AC4" stroke-width="6"/><path class="chev" d="M130 92 L116 101 L130 110" fill="none" stroke="#FF8AC4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="arc" d="M114 104 Q123 92 132 104" fill="none" stroke="#FF8AC4" stroke-width="7" stroke-linecap="round"/></g></g><g class="zz" fill="#FF8AC4" font-family="Heebo,sans-serif" font-weight="800"><text x="150" y="52" font-size="18">z</text><text x="166" y="34" font-size="24">z</text></g><circle class="wave" cx="100" cy="100" r="80" fill="none" stroke="#FF8AC4" stroke-width="2.5"/><g class="dots" fill="#FF8AC4"><circle cx="150" cy="40" r="4"/><circle cx="163" cy="30" r="5"/><circle cx="178" cy="18" r="6"/></g></g><g class="sparks" stroke="#FF8AC4" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 40"><line x1="100" y1="16" x2="100" y2="-8"/><line x1="160" y1="40" x2="178" y2="22"/><line x1="40" y1="40" x2="22" y2="22"/><line x1="182" y1="100" x2="200" y2="100"/><line x1="18" y1="100" x2="0" y2="100"/></g></svg>